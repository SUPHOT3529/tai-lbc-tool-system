<!--
  Central shared database (Supabase) + Realtime. Shared data lives in one
  Postgres table that every device reads/writes, and a Realtime subscription
  pushes an update event to every open tab the instant any device changes
  data -- no manual refresh needed. Only the personal login "remember me"
  session stays in localStorage per-device. When the network drops, writes
  are queued in this browser's localStorage and replayed automatically once
  connectivity returns (see the offline-queue logic in the app source).
-->
<script>
  var SUPABASE_URL = 'https://sxawqvbuquqkdcoybsin.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_zQoQlznqD410Y579IQUf0Q_yPbNkgGm';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  window.storage = {
    async get(key, shared) {
      if (!shared) {
        const raw = localStorage.getItem('tai_lbc_' + key);
        return raw === null ? null : { key, value: raw };
      }
      const { data, error } = await sb.from('kv_store').select('value').eq('key', key).maybeSingle();
      if (error) { console.error('supabase get failed', error); throw error; }
      return data ? { key, value: data.value } : null;
    },
    async set(key, value, shared) {
      if (!shared) {
        localStorage.setItem('tai_lbc_' + key, value);
        return { key, value };
      }
      const { error } = await sb.from('kv_store').upsert({ key, value, updated_at: new Date().toISOString() });
      if (error) { console.error('supabase set failed', error); throw error; }
      return { key, value };
    },
    async delete(key, shared) {
      if (!shared) {
        localStorage.removeItem('tai_lbc_' + key);
        return { key, deleted: true };
      }
      const { error } = await sb.from('kv_store').delete().eq('key', key);
      if (error) console.error('supabase delete failed', error);
      return { key, deleted: true };
    },
    async list(prefix, shared) {
      if (!shared) {
        const p = 'tai_lbc_' + (prefix || '');
        const keys = Object.keys(localStorage).filter(k => k.startsWith(p)).map(k => k.slice('tai_lbc_'.length));
        return { keys, prefix };
      }
      const { data, error } = await sb.from('kv_store').select('key').like('key', (prefix || '') + '%');
      if (error) { console.error('supabase list failed', error); return { keys: [], prefix }; }
      return { keys: (data || []).map(r => r.key), prefix };
    }
  };

  // Filtered to only the handful of keys the app actually reacts to (see
  // handleRemoteUpdate below) — without this filter, Supabase would broadcast
  // the FULL row (including the base64 image data) for every photo write to
  // every connected device, which gets expensive fast once there are
  // thousands of tool photos plus ongoing borrow/return evidence photos.
  sb.channel('kv_store_live')
    .on('postgres_changes', {
      event: '*', schema: 'public', table: 'kv_store',
      filter: 'key=in.(toolcrib-tools-v1,toolcrib-staff-v1,toolcrib-tx-v1,toolcrib-users-v1,toolcrib-settings-v1,toolcrib-audit-v1,toolcrib-warehouses-v1,toolcrib-shelves-v1)'
    }, function (payload) {
      var row = payload.new || payload.old;
      if (!row) return;
      window.dispatchEvent(new CustomEvent('tai-lbc-remote-update', {
        detail: { key: row.key, value: row.value, eventType: payload.eventType }
      }));
    })
    .subscribe();
</script>

// Sorts tool codes the way a person reading them would expect — by the
// number embedded in the code, not plain string order (which would put
// "AM4A12" before "AM4A2" since '1' < '2' as characters). Splits each code
// into alternating letter/number chunks and compares numeric chunks as
// numbers, letter chunks as text — regardless of what numbering scheme was
// typed in, the display order always follows the code's own sequence.
function naturalCompareCode(a, b) {
  const chunks = (s) => String(s || '').match(/(\d+)|(\D+)/g) || [];
  const ax = chunks(a), bx = chunks(b);
  const len = Math.max(ax.length, bx.length);
  for (let i = 0; i < len; i++) {
    const av = ax[i] || '', bv = bx[i] || '';
    const an = /^\d+$/.test(av), bn = /^\d+$/.test(bv);
    if (an && bn) {
      const diff = Number(av) - Number(bv);
      if (diff !== 0) return diff;
    } else {
      const cmp = av.localeCompare(bv);
      if (cmp !== 0) return cmp;
    }
  }
  return 0;
}

let jsQRLoadPromise = null;
function ensureJsQR() {
  if (typeof window !== 'undefined' && window.jsQR) return Promise.resolve();
  if (jsQRLoadPromise) return jsQRLoadPromise;
  jsQRLoadPromise = new Promise((resolve, reject) => {
    const existing = document.querySelector(`script[src="${JSQR_SRC}"]`);
    if (existing) existing.remove(); // drop any earlier failed attempt so this is a real retry
    const s = document.createElement('script');
    s.src = JSQR_SRC; s.async = true;
    s.onload = resolve;
    s.onerror = () => { s.remove(); reject(new Error('jsQR script failed to load')); };
    document.head.appendChild(s);
  });
  jsQRLoadPromise.catch(() => { jsQRLoadPromise = null; }); // allow a future retry after failure
  return jsQRLoadPromise;
}

// All "YYYY-MM-DD" values in this app (dueDate, calibDate, the date inputs)
// mean a LOCAL calendar day, so they must be produced and read back in local
// time. Using toISOString() here would return the UTC day, which in Thailand
// (UTC+7) is the PREVIOUS day between 00:00 and 07:00 local — that silently
// made due dates land a day early and marked items overdue a day too soon
// during early-morning shifts.
function localISODate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function todayISO() { return localISODate(new Date()); }
function addDays(dateStr, days) {
  const d = parseDateValue(dateStr) || new Date();
  d.setDate(d.getDate() + days);
  return localISODate(d);
}
// A bare "YYYY-MM-DD" is parsed by `new Date()` as UTC midnight, which renders
// as the previous day in any timezone behind UTC. Parse date-only strings as
// local midnight instead; full timestamps still parse normally.
function parseDateValue(value) {
  if (!value) return null;
  if (typeof value === 'string') {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value.trim());
    if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  }
  const d = new Date(value);
  return isNaN(d.getTime()) ? null : d;
}
function fmtThaiDate(iso) {

  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear() + 543}`;
}
function fmtThaiDateTime(iso) {
  const d = parseDateValue(iso);

  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');

async function storageGet(key, shared = true) {
  try { const r = await window.storage.get(key, shared); return r ? r.value : null; }
  catch (e) { return null; }
}
// Unlike storageGet, this does NOT swallow errors into null — a thrown error here
// means "we genuinely could not reach storage" (e.g. Supabase network/RLS issue),
// which callers must NOT treat the same as "key legitimately doesn't exist yet".
// Conflating those two cases is what causes a transient read failure to look like
// an empty database and silently reseed/overwrite real data with defaults.
async function storageGetStrict(key, shared = true) {
  const r = await window.storage.get(key, shared);
  return r ? r.value : null;
}

// ---- Offline support: a lightweight local queue for shared writes ----
// When the shared backend is unreachable, writes get parked here (in this
// browser's own localStorage — always available, never depends on the
// network) instead of being lost or blocking the UI. They're replayed
// automatically the moment connectivity returns.
const OFFLINE_QUEUE_PREFIX = 'tai_lbc_offline_queue:';
const OFFLINE_QUEUE_INDEX_KEY = 'tai_lbc_offline_queue_index';
function queueOfflineWrite(storageKey, jsonValue) {
  try {
    localStorage.setItem(OFFLINE_QUEUE_PREFIX + storageKey, jsonValue);
    const idx = readOfflineQueueIndex();
    if (!idx.includes(storageKey)) { idx.push(storageKey); localStorage.setItem(OFFLINE_QUEUE_INDEX_KEY, JSON.stringify(idx)); }
  } catch (e) { console.error('failed to queue offline write', e); }
}
function readOfflineQueueIndex() {
  try { return JSON.parse(localStorage.getItem(OFFLINE_QUEUE_INDEX_KEY) || '[]'); } catch (e) { return []; }
}
function removeFromOfflineQueue(storageKey) {
  try {
    localStorage.removeItem(OFFLINE_QUEUE_PREFIX + storageKey);
    localStorage.setItem(OFFLINE_QUEUE_INDEX_KEY, JSON.stringify(readOfflineQueueIndex().filter(k => k !== storageKey)));
  } catch (e) { /* ignore */ }
}
// Distinguishes "internet/backend unreachable" (safe to queue and retry
// later) from a genuine backend error like a bad RLS policy or schema
// mismatch (must surface immediately — queuing that forever would silently
// and permanently lose the write while looking like it "will sync later").
function isNetworkError(err) {
  if (typeof navigator !== 'undefined' && navigator.onLine === false) return true;
  const msg = String((err && err.message) || err || '').toLowerCase();
  return msg.includes('fetch') || msg.includes('network') || msg.includes('timeout') || msg.includes('internet') || msg.includes('load failed');
}

// IMPORTANT: this must NOT swallow errors. A failed write silently treated as
// success is exactly what causes "I added it but it's gone after I log back
// in" — the UI shows success while the database was never actually updated.
// Callers are expected to catch this and show a real error instead.
async function storageSet(key, value, shared = true) {
  await window.storage.set(key, value, shared);
}
async function storageDelete(key, shared = true) {
  try { await window.storage.delete(key, shared); } catch (e) { /* key may not exist */ }
}

// NOTE: This runs entirely in the browser with no real backend server, so this
// hashing is obfuscation for a working prototype, not production-grade security.
// A real deployment needs server-side authentication.
async function hashPassword(pw) {
  try {
    const enc = new TextEncoder().encode('toolcrib::' + pw);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 0;
    for (let i = 0; i < pw.length; i++) h = (h * 31 + pw.charCodeAt(i)) | 0;
    return 'fallback-' + h;
  }
}

// name containing <, >, or & would break the printed table's markup.
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function buildToolReportRows(tools, warehouses, toolStatusFn, shelves) {
  const STATUS_LABEL = { available: 'พร้อมใช้งาน', borrowed: 'ถูกยืม', overdue: 'เกินกำหนดคืน', damaged: 'ชำรุด/ส่งซ่อม', calibration: 'ส่ง Calibration' };
  // Shelves are created in order and keep an explicit "order" field for this
  // exact reason — sort report rows the same way they're organized on the
  // Shadow Board (DRAWER 1, DRAWER 2, ...) rather than raw array order, which
  // just reflected whatever sequence tools happened to be added/loaded in.
  const shelfOrder = new Map((shelves || []).map((s, i) => [s.id, s.order ?? i]));
  const sortedTools = [...tools].sort((a, b) => {
    const whA = warehouses.find(w => w.id === a.warehouseId)?.name || '';
    const whB = warehouses.find(w => w.id === b.warehouseId)?.name || '';
    if (whA !== whB) return whA.localeCompare(whB);
    // Tools not on any shelf sort after every shelf, grouped together at the end.
    const shelfA = shelfOrder.has(a.shelfId) ? shelfOrder.get(a.shelfId) : Infinity;
    const shelfB = shelfOrder.has(b.shelfId) ? shelfOrder.get(b.shelfId) : Infinity;
    if (shelfA !== shelfB) return shelfA - shelfB;
    return naturalCompareCode(a.code, b.code);
  });
  return sortedTools.map(t => ({
    รหัสเครื่องมือ: t.code,
    ชื่อเครื่องมือ: t.name,
    หมวดหมู่: catMap[t.category]?.label || t.category,
    คลังเครื่องมือ: warehouses.find(w => w.id === t.warehouseId)?.name || 'ไม่ระบุคลัง',
    ชั้นวาง: (shelves || []).find(s => s.id === t.shelfId)?.name || 'ยังไม่จัดชั้น',
    สถานะ: STATUS_LABEL[toolStatusFn(t.id)] || '-',
    'ต้องออกใบยืม-คืน (LBC-FM-034)': t.requiresLoanForm ? 'ต้องออกใบ' : 'ไม่ต้องออกใบ',
    'P/N': t.partNo || '',
    'S/N': t.serialNo || '',
    'Calibration Date': t.calibDate ? fmtThaiDate(t.calibDate) : '',
    'Calibration Due': t.calibDue ? fmtThaiDate(t.calibDue) : '',
    'วันที่ส่ง Calibration': t.calibSentAt ? fmtThaiDate(t.calibSentAt) : '',
    'วันที่รับเข้าจาก Calibration': t.calibReceivedAt ? fmtThaiDate(t.calibReceivedAt) : ''
  }));
}

function exportToolsExcel(tools, warehouses, toolStatusFn, fileLabel, shelves) {
  const rows = buildToolReportRows(tools, warehouses, toolStatusFn, shelves);
  const wb = XLSX.utils.book_new();
  wb.SheetNames.push('รายการเครื่องมือ');
  wb.Sheets['รายการเครื่องมือ'] = XLSX.utils.json_to_sheet(rows);
  XLSX.writeFile(wb, `คลังเครื่องมือ-${fileLabel}-${todayISO()}.xlsx`);
}

// Same 3 columns the staff import expects (รหัสพนักงาน / ชื่อ-สกุล / สังกัด) — so this
// file round-trips cleanly back through "นำเข้ารายชื่อพนักงาน" if someone edits it.

// ---- PDF report layout (A4 portrait, Sarabun Thai) ----------------------
// Single source of truth for the report's page setup and columns. Adding a
// new column here is all that's needed — the renderer, header, and row-based
// pagination all read from this, so nothing else has to change.
const PDF_REPORT = {
  // A4 at 96dpi minus margins, in px, for the offscreen render surface.
  pageWidthPx: 794,
  marginPx: 32,
  rowsPerPage: 22,      // conservative default that fits A4 with the header block
  headerFontPx: 17,
  metaFontPx: 11,
  thFontPx: 11,
  tdFontPx: 11.5,
  rowPadPx: 7,
  columns: [
    { key: 'รหัสเครื่องมือ', label: 'รหัส', width: '13%', mono: true, nowrap: true },
    { key: 'ชื่อเครื่องมือ', label: 'ชื่อเครื่องมือ', width: '37%' },
    { key: 'หมวดหมู่', label: 'หมวดหมู่', width: '16%', nowrap: true },
    { key: 'ชั้นวาง', label: 'ชั้นวาง', width: '19%', nowrap: true },
    { key: 'สถานะ', label: 'สถานะ', width: '15%', nowrap: true },
  ],
};

function chunkArray(arr, size) {
  const out = [];
  for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}

async function exportToolsPDF(tools, warehouses, toolStatusFn, fileLabel, warehouseTitle, shelves) {
  await Promise.all([ensureHtml2Canvas(), ensureJsPDF()]);
  // html2canvas rasterizes whatever is painted at that instant — if Sarabun
  // hasn't finished loading yet, the first export would bake in fallback
  // glyphs with different metrics.
  if (document.fonts?.ready) { try { await document.fonts.ready; } catch (e) { /* non-fatal */ } }
  const rows = buildToolReportRows(tools, warehouses, toolStatusFn, shelves);
  const C = PDF_REPORT;
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'pt', 'a4');
  const pageWidthPt = pdf.internal.pageSize.getWidth();
  const pageHeightPt = pdf.internal.pageSize.getHeight();

  // Paginate by ROWS, not by slicing one tall image — slicing is what used to
  // cut a row in half wherever the page boundary happened to land.
  const pages = rows.length ? chunkArray(rows, C.rowsPerPage) : [[]];
  const printedAt = fmtThaiDateTime(new Date().toISOString());

  const headCells = C.columns.map(c =>
    `<th style="text-align:left; padding:${C.rowPadPx}px 10px; border-bottom:2px solid #1F2A37; font-size:${C.thFontPx}px; width:${c.width};">${escapeHtml(c.label)}</th>`
  ).join('');

  for (let p = 0; p < pages.length; p++) {
    const pageRows = pages[p];
    const bodyHtml = pageRows.length
      ? pageRows.map(r => `<tr>${C.columns.map(c => {
          const style = [
            `padding:${C.rowPadPx}px 10px`,
            'border-bottom:1px solid #E9EEF0',
            `font-size:${C.tdFontPx}px`,
            'vertical-align:top',
            c.mono ? 'font-family:monospace' : '',
            c.nowrap ? 'white-space:nowrap' : '',
          ].filter(Boolean).join('; ');
          return `<td style="${style};">${escapeHtml(r[c.key])}</td>`;
        }).join('')}</tr>`).join('')
      : `<tr><td colspan="${C.columns.length}" style="padding:14px; text-align:center; color:#9AA3B2; font-size:${C.tdFontPx}px;">ไม่มีเครื่องมือในคลังนี้</td></tr>`;

    const container = document.createElement('div');
    container.style.cssText = `position:fixed; left:-99999px; top:0; width:${C.pageWidthPx}px; background:#ffffff; padding:${C.marginPx}px; box-sizing:border-box; font-family:"Sarabun","Noto Sans Thai","Leelawadee UI",sans-serif; color:#1F2A37;`;
    container.innerHTML = `
      <h1 style="font-size:${C.headerFontPx}px; margin:0 0 2px;">รายงานคลังเครื่องมือ${warehouseTitle ? ' — ' + escapeHtml(warehouseTitle) : ''}</h1>
      <p style="font-size:${C.metaFontPx}px; color:#6B7280; margin:0 0 14px;">พิมพ์เมื่อ ${printedAt} · ทั้งหมด ${rows.length} รายการ · เรียงตามชั้นวาง · หน้า ${p + 1}/${pages.length}</p>
      <table style="width:100%; border-collapse:collapse; table-layout:fixed;">
        <thead><tr>${headCells}</tr></thead>
        <tbody>${bodyHtml}</tbody>
      </table>`;
    document.body.appendChild(container);

    try {
      const canvas = await window.html2canvas(container, { scale: 2, backgroundColor: '#ffffff' });
      document.body.removeChild(container);
      const imgData = canvas.toDataURL('image/png');
      // Scale this page's image to fit inside A4 without ever exceeding the
      // page height — so a page is never clipped or spilled onto the next one.
      const scale = Math.min(pageWidthPt / canvas.width, pageHeightPt / canvas.height);
      const imgW = canvas.width * scale;
      const imgH = canvas.height * scale;
      if (p > 0) pdf.addPage();
      pdf.addImage(imgData, 'PNG', (pageWidthPt - imgW) / 2, 0, imgW, imgH);
    } catch (e) {
      if (container.parentNode) document.body.removeChild(container);
      throw e;
    }
  }

  pdf.save(`คลังเครื่องมือ-${fileLabel}-${todayISO()}.pdf`);
}

function App() {
  const [ready, setReady] = useState(false);
  const [page, setPage] = useState('dashboard');
  const [tools, setTools] = useState([]);
  const [staff, setStaff] = useState([]);
  const [tx, setTx] = useState([]);
  const [warehouses, setWarehouses] = useState([]);
  const [shelves, setShelves] = useState([]);
  const [toast, setToast] = useState(null);
  const [saving, setSaving] = useState(false);

  const [authReady, setAuthReady] = useState(false);
  const [authError, setAuthError] = useState(null);
  const [authRetryCount, setAuthRetryCount] = useState(0);
  const [isOnline, setIsOnline] = useState(typeof navigator === 'undefined' || navigator.onLine !== false);
  const [pendingSyncKeys, setPendingSyncKeys] = useState(() => readOfflineQueueIndex());
  const [syncing, setSyncing] = useState(false);
  const [users, setUsers] = useState([]);
  const [session, setSession] = useState(null); // { username, role, staffId }
  const [changePwOpen, setChangePwOpen] = useState(false);
  const [settings, setSettingsState] = useState({ maxBorrowPerStaff: 3, defaultDueDays: 7, backupReminderDays: 7, lastBackupAt: null, lastPhotoCleanupAt: null });
  const [auditLog, setAuditLog] = useState([]);

  useEffect(() => {
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = FONTS_LINK;
    document.head.appendChild(link);
    return () => { try { document.head.removeChild(link); } catch (e) {} };
  }, []);

  // Load user accounts (shared, org-wide) + this browser's remembered session (personal).
  useEffect(() => {
    (async () => {
      try {
        const [u, sess] = await Promise.all([
          storageGetStrict(STORAGE_KEYS.USERS, true),
          storageGetStrict(STORAGE_KEYS.SESSION, false),
        ]);
        let usersData = u ? JSON.parse(u) : null;
        // Only seed the default Admin account if the read genuinely succeeded and
        // came back empty (first-ever run) — NOT if the read failed. See
        // storageGetStrict comment: a failed read must never look like "no users yet".
        if (!usersData || !usersData.length) {
          const adminHash = await hashPassword('1234');
          usersData = [{ id: uid('U'), username: 'Admin', passwordHash: adminHash, role: 'admin', staffId: null, signature: 'Admin' }];
          await storageSet(STORAGE_KEYS.USERS, JSON.stringify(usersData), true);
        }
        setUsers(usersData);
        if (sess) {
          try {
            const parsed = JSON.parse(sess);
            // re-validate the remembered session still matches a real account
            if (usersData.some(x => x.username === parsed.username && x.role === parsed.role)) {
              setSession(parsed);
            } else {
              await storageDelete(STORAGE_KEYS.SESSION, false);
            }
          } catch (e) { /* ignore corrupt session */ }
        }
        setAuthReady(true);
      } catch (err) {
        console.error('failed to load user accounts', err);
        setAuthError('ไม่สามารถเชื่อมต่อฐานข้อมูลผู้ใช้งานได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
      }
    })();
  }, [authRetryCount]);

  // Central helper behind every persistX function below: write to the shared
  // backend first (so local state is never optimistic-ahead of a write that
  // might fail for a real reason), but if the backend is genuinely
  // unreachable (offline / connectivity drop), don't block the user or lose
  // their change — park it locally and update state immediately, then let
  // the offline-queue flusher (see below) sync it the moment the network is
  // back. A real backend error (not a connectivity issue) still throws, so
  // callers keep showing a proper error instead of silently "succeeding."
  const persistCollection = useCallback(async (storageKey, next, setState, shared = true) => {
    const json = JSON.stringify(next);
    if (typeof navigator === 'undefined' || navigator.onLine !== false) {
      try {
        await storageSet(storageKey, json, shared);
        setState(next);
        return;
      } catch (err) {
        if (!isNetworkError(err)) throw err;
      }
    }
    queueOfflineWrite(storageKey, json);
    setState(next);
    setPendingSyncKeys(readOfflineQueueIndex());
  }, []);

  const persistUsers = useCallback((next) => persistCollection(STORAGE_KEYS.USERS, next, setUsers, true), [persistCollection]);

  async function login(username, password, remember) {
    const uname = username.trim();
    const match = users.find(u => u.username.trim().toLowerCase() === uname.toLowerCase());
    if (!match) return { ok: false, error: 'ไม่พบชื่อผู้ใช้งานนี้ในระบบ' };
    if (match.lockedUntil && match.lockedUntil > Date.now()) {
      const mins = Math.max(1, Math.ceil((match.lockedUntil - Date.now()) / 60000));
      return { ok: false, error: `บัญชีนี้ถูกล็อกชั่วคราวจากการใส่รหัสผ่านผิดหลายครั้ง กรุณาลองใหม่ในอีก ${mins} นาที` };
    }
    const hash = await hashPassword(password);
    if (hash !== match.passwordHash) {
      const attempts = (match.failedAttempts || 0) + 1;
      const lock = attempts >= 5;
      try {
        await persistUsers(users.map(u => u.id === match.id
          ? { ...u, failedAttempts: lock ? 0 : attempts, lockedUntil: lock ? Date.now() + 15 * 60000 : null }
          : u));
      } catch (err) { console.error('failed to record failed login attempt', err); }
      return { ok: false, error: lock ? 'ใส่รหัสผ่านผิดครบ 5 ครั้ง บัญชีถูกล็อกชั่วคราว 15 นาที' : `รหัสผ่านไม่ถูกต้อง (ผิด ${attempts}/5 ครั้ง)` };
    }
    if (match.failedAttempts || match.lockedUntil) {
      try {
        await persistUsers(users.map(u => u.id === match.id ? { ...u, failedAttempts: 0, lockedUntil: null } : u));
      } catch (err) { console.error('failed to clear lockout state', err); }
    }
    const sess = { username: match.username, role: match.role, staffId: match.staffId };
    setSession(sess);
    if (remember) await storageSet(STORAGE_KEYS.SESSION, JSON.stringify(sess), false);
    else await storageDelete(STORAGE_KEYS.SESSION, false);
    return { ok: true };
  }

  async function logout() {
    setSession(null);
    await storageDelete(STORAGE_KEYS.SESSION, false);
    setPage('dashboard');
  }

  async function changeOwnPassword(currentPassword, newPassword) {
    const match = users.find(u => u.username === session?.username);
    if (!match) return { ok: false, error: 'ไม่พบบัญชีผู้ใช้งาน' };
    const curHash = await hashPassword(currentPassword);
    if (curHash !== match.passwordHash) return { ok: false, error: 'รหัสผ่านปัจจุบันไม่ถูกต้อง' };
    const newHash = await hashPassword(newPassword);
    try {
      await persistUsers(users.map(u => u.id === match.id ? { ...u, passwordHash: newHash } : u));
    } catch (err) {
      console.error('failed to change password', err);
      return { ok: false, error: 'บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่' };
    }
    return { ok: true };
  }

  // The signature saved here is what auto-fills "Issue by (Tool Room)" on the
  // LBC-FM-034 form whenever THIS logged-in account is the one operating the
  // scan station — separate from the password change flow since it isn't a
  // security-sensitive field and doesn't need the current-password check.
  async function updateOwnSignature(signature) {
    const match = users.find(u => u.username === session?.username);
    if (!match) return { ok: false, error: 'ไม่พบบัญชีผู้ใช้งาน' };
    try {
      await persistUsers(users.map(u => u.id === match.id ? { ...u, signature: signature.trim() } : u));
    } catch (err) {
      console.error('failed to update signature', err);
      return { ok: false, error: 'บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่' };
    }
    return { ok: true };
  }

  // Only load the working data (tools/staff/tx/settings/audit/warehouses) once someone is logged in.
  useEffect(() => {
    if (!session) return;
    (async () => {
      try {
        const [t, s, x, cfg, log, wh, sh] = await Promise.all([
          storageGetStrict(STORAGE_KEYS.TOOLS), storageGetStrict(STORAGE_KEYS.STAFF), storageGetStrict(STORAGE_KEYS.TX),
          storageGetStrict(STORAGE_KEYS.SETTINGS), storageGetStrict(STORAGE_KEYS.AUDIT), storageGetStrict(STORAGE_KEYS.WAREHOUSES),
          storageGetStrict(STORAGE_KEYS.SHELVES)
        ]);
        const warehousesData = wh ? JSON.parse(wh) : SEED_WAREHOUSES;
        const shelvesData = sh ? JSON.parse(sh) : [];
        const toolsDataRaw = t ? JSON.parse(t) : SEED_TOOLS;
        // Backfill: tools saved before warehouses existed default to the first warehouse.
        const toolsData = toolsDataRaw.map(tl => tl.warehouseId ? tl : { ...tl, warehouseId: warehousesData[0]?.id || null });
        const staffData = s ? JSON.parse(s) : SEED_STAFF;
        const txData = x ? JSON.parse(x) : seedTx(toolsData, staffData);
        const settingsData = cfg
          ? { maxBorrowPerStaff: 3, defaultDueDays: 7, backupReminderDays: 7, lastBackupAt: null, lastPhotoCleanupAt: null, ...JSON.parse(cfg) }
          : { maxBorrowPerStaff: 3, defaultDueDays: 7, backupReminderDays: 7, lastBackupAt: null, lastPhotoCleanupAt: null };
        const auditData = log ? JSON.parse(log) : [];
        // Only seed (and write back) collections that genuinely came back empty on a
        // successful read — never as a reaction to a failed/thrown read (see the
        // try/catch below and the storageGetStrict comment).
        if (!wh) await storageSet(STORAGE_KEYS.WAREHOUSES, JSON.stringify(warehousesData));
        if (!sh) await storageSet(STORAGE_KEYS.SHELVES, JSON.stringify(shelvesData));
        if (!t) await storageSet(STORAGE_KEYS.TOOLS, JSON.stringify(toolsData));
        if (!s) await storageSet(STORAGE_KEYS.STAFF, JSON.stringify(staffData));
        if (!x) await storageSet(STORAGE_KEYS.TX, JSON.stringify(txData));
        if (!cfg) await storageSet(STORAGE_KEYS.SETTINGS, JSON.stringify(settingsData));
        setWarehouses(warehousesData);
        setShelves(shelvesData);
        setTools(toolsData); setStaff(staffData); setTx(txData);
        setSettingsState(settingsData); setAuditLog(auditData);
        setReady(true);
      } catch (err) {
        console.error('failed to load main data', err);
        setAuthError('ไม่สามารถโหลดข้อมูลจากฐานข้อมูลกลางได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
      }
    })();
  }, [session, authRetryCount]);

  const persistSettings = useCallback((next) => persistCollection(STORAGE_KEYS.SETTINGS, next, setSettingsState, true), [persistCollection]);

  const addAudit = useCallback((action, detail) => {
    const entry = { id: uid('AL'), at: new Date().toISOString(), actor: session?.username || 'system', action, detail: detail || '' };
    setAuditLog(prev => {
      const next = [entry, ...prev].slice(0, 500);
      storageSet(STORAGE_KEYS.AUDIT, JSON.stringify(next)).catch(err => console.error('failed to save audit log', err));
      return next;
    });
  }, [session]);

  async function viewEvidencePhoto(txId, kind, label) {
    const value = await storageGet(`toolcrib-photo:${txId}:${kind}`, true);
    addAudit('photo_view', `ดูรูปหลักฐาน${kind === 'borrow' ? 'การยืม' : 'การคืน'}: ${label || txId}`);
    return value;
  }

  async function setToolCondition(toolId, condition, note) {
    const tool = tools.find(t => t.id === toolId);
    if (!tool) return;
    const next = tools.map(t => t.id === toolId ? { ...t, condition, conditionNote: note || '', conditionAt: new Date().toISOString() } : t);
    try {
      await persistTools(next);
    } catch (err) {
      console.error('failed to save tool condition', err);
      return showToast('บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    addAudit(condition === 'damaged' ? 'tool_damage_set' : 'tool_damage_clear',
      `${tool.code} — ${tool.name}${note ? ` (${note})` : ''}`);
    showToast(condition === 'damaged' ? `แจ้งเครื่องมือ "${tool.name}" ชำรุด/ส่งซ่อมแล้ว` : `เครื่องมือ "${tool.name}" กลับมาพร้อมใช้งานแล้ว`, 'success');
  }

  // Calibration send/receive. Mirrors the damage flow (the tool is held out of
  // circulation while it's away), but the receive step additionally REQUIRES the
  // new calibration Date/Due — a tool must never come back into service with a
  // stale or empty calibration window, so the modal blocks saving until both are
  // filled in and they're written straight onto the tool record here.
  async function setToolCalibration(toolId, action, payload) {
    const tool = tools.find(t => t.id === toolId);
    if (!tool) return;
    const now = new Date().toISOString();
    let patch;
    if (action === 'send') {
      patch = {
        condition: 'calibration', conditionAt: now,
        calibSentAt: payload.sentAt || todayISO(), calibSentNote: payload.note || '', calibReceivedAt: null
      };
    } else {
      if (!payload.calibDate || !payload.calibDue) {
        return showToast('กรุณาระบุ Calibration Date และ Calibration Due ก่อนบันทึกรับเข้า', 'error');
      }
      patch = {
        condition: 'normal', conditionAt: now,
        calibReceivedAt: payload.receivedAt || todayISO(),
        calibDate: payload.calibDate, calibDue: payload.calibDue
      };
    }
    try {
      await persistTools(tools.map(t => t.id === toolId ? { ...t, ...patch } : t));
    } catch (err) {
      console.error('failed to save tool calibration', err);
      return showToast('บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    if (action === 'send') {
      addAudit('tool_calib_send', `${tool.code} — ${tool.name}: ส่ง Calibration วันที่ ${fmtThaiDate(patch.calibSentAt)}${payload.note ? ` (${payload.note})` : ''}`);
      showToast(`ส่ง "${tool.name}" ไป Calibration แล้ว`, 'success');
    } else {
      addAudit('tool_calib_receive', `${tool.code} — ${tool.name}: รับเข้าวันที่ ${fmtThaiDate(patch.calibReceivedAt)} · Calibration ${fmtThaiDate(patch.calibDate)} ถึง ${fmtThaiDate(patch.calibDue)}`);
      showToast(`รับ "${tool.name}" กลับเข้าคลังและอัปเดตวัน Calibration เรียบร้อย`, 'success');
    }
  }

  function seedTx(toolsData, staffData) {
    const t = todayISO();
    const dt = (daysOffset, hh, mm) => {
      const d = new Date(`${addDays(t, daysOffset)}T00:00:00`);
      d.setHours(hh, mm, 0, 0);
      return d.toISOString();
    };
    return [
      { id: uid('TX'), toolId: toolsData[4].id, staffId: staffData[0].id, borrowDate: dt(-10, 8, 15), dueDate: addDays(t, -3), returnDate: null, returnedBy: null, hasBorrowPhoto: false, hasReturnPhoto: false },
      { id: uid('TX'), toolId: toolsData[1].id, staffId: staffData[1].id, borrowDate: dt(-2, 13, 40), dueDate: addDays(t, 3), returnDate: null, returnedBy: null, hasBorrowPhoto: false, hasReturnPhoto: false },
      { id: uid('TX'), toolId: toolsData[8].id, staffId: staffData[2].id, borrowDate: dt(-6, 9, 5), dueDate: addDays(t, -1), returnDate: null, returnedBy: null, hasBorrowPhoto: false, hasReturnPhoto: false },
    ];
  }

  const persistTools = useCallback((next) => persistCollection(STORAGE_KEYS.TOOLS, next, setTools, true), [persistCollection]);
  const persistStaff = useCallback((next) => persistCollection(STORAGE_KEYS.STAFF, next, setStaff, true), [persistCollection]);
  const persistTx = useCallback((next) => persistCollection(STORAGE_KEYS.TX, next, setTx, true), [persistCollection]);
  const persistWarehouses = useCallback((next) => persistCollection(STORAGE_KEYS.WAREHOUSES, next, setWarehouses, true), [persistCollection]);
  const persistShelves = useCallback((next) => persistCollection(STORAGE_KEYS.SHELVES, next, setShelves, true), [persistCollection]);

  // Evidence photos (borrow/return condition shots) are the single biggest
  // consumer of database space in this system. Deliberately NOT automatic —
  // the admin decides when and what to clear, after they've downloaded their
  // own copy via the backup ZIP. `olderThanDays` (optional) lets them clear
  // just the old stuff and keep recent cycles' photos on hand; omitting it
  // clears everything currently stored. The transaction HISTORY itself is
  // never touched here; only the photo files are removed, and any tx that
  // had one gets `photosPurged: true` so the UI can say "this had a photo,
  // it's just been cleared" instead of silently looking like one was never
  // taken.
  async function purgeEvidencePhotos(olderThanDays) {
    const cutoff = olderThanDays ? addDays(todayISO(), -Number(olderThanDays)) : null;
    let purgedCount = 0;
    const purgedTxIds = new Set();
    try {
      const list = await window.storage.list('toolcrib-photo:', true);
      for (const key of (list?.keys || [])) {
        // key shape: toolcrib-photo:{txId}:borrow|return
        const m = /^toolcrib-photo:([^:]+):(borrow|return)$/.exec(key);
        const relatedTx = m ? tx.find(t => t.id === m[1]) : null;
        if (cutoff && relatedTx) {
          // Anchor the cutoff on whichever date the photo was actually taken.
          const photoDate = m[2] === 'borrow' ? relatedTx.borrowDate : (relatedTx.returnDate || relatedTx.borrowDate);
          if (photoDate && localISODate(parseDateValue(photoDate)) >= cutoff) continue; // newer than cutoff — keep it
        }
        await storageDelete(key, true);
        purgedCount++;
        if (m) purgedTxIds.add(m[1]);
      }
    } catch (err) {
      console.error('failed to list/delete evidence photos', err);
    }
    if (purgedTxIds.size > 0) {
      try {
        await persistTx(tx.map(t => purgedTxIds.has(t.id) ? { ...t, photosPurged: true } : t));
      } catch (err) {
        console.error('failed to flag purged photos on tx history', err);
      }
    }
    if (purgedCount > 0) {
      try { await persistSettings({ ...settings, lastPhotoCleanupAt: new Date().toISOString() }); }
      catch (err) { console.error('failed to record photo cleanup time', err); }
      addAudit?.('photo_purge', `ลบรูปหลักฐานยืม-คืน ${purgedCount} รูป (แอดมินสั่งลบเอง${cutoff ? ` — เฉพาะที่เก่ากว่า ${olderThanDays} วัน` : ''})`);
    }
    return purgedCount;
  }

  // Replays anything saved locally while offline back to the shared backend.
  // Stops at the first item that still fails (still offline, or backend
  // still unreachable) and just waits for the next trigger — this function
  // is safe to call repeatedly (on reconnect, on a timer, and on mount).
  const flushOfflineQueue = useCallback(async () => {
    const keys = readOfflineQueueIndex();
    if (!keys.length) return;
    setSyncing(true);
    let succeeded = 0;
    for (const key of keys) {
      try {
        const json = localStorage.getItem(OFFLINE_QUEUE_PREFIX + key);
        if (json === null) { removeFromOfflineQueue(key); continue; }
        await storageSet(key, json, true);
        removeFromOfflineQueue(key);
        succeeded++;
      } catch (err) {
        break; // still can't reach the backend — leave the rest queued, try again later
      }
    }
    setPendingSyncKeys(readOfflineQueueIndex());
    setSyncing(false);
    if (succeeded > 0) showToast(`ซิงค์ข้อมูลที่บันทึกไว้ตอนออฟไลน์ขึ้นฐานข้อมูลกลางสำเร็จ (${succeeded} รายการ)`, 'success');
  }, []);

  useEffect(() => {
    function goOnline() { setIsOnline(true); flushOfflineQueue(); }
    function goOffline() { setIsOnline(false); }
    window.addEventListener('online', goOnline);
    window.addEventListener('offline', goOffline);
    // 'online'/'offline' events are unreliable on some mobile browsers, so
    // also poll periodically — this is what actually guarantees a queued
    // change never gets stuck forever.
    const interval = setInterval(() => {
      if (typeof navigator === 'undefined' || navigator.onLine !== false) flushOfflineQueue();
    }, 20000);
    if (typeof navigator === 'undefined' || navigator.onLine !== false) flushOfflineQueue();
    return () => {
      window.removeEventListener('online', goOnline);
      window.removeEventListener('offline', goOffline);
      clearInterval(interval);
    };
  }, [flushOfflineQueue]);

  // Live updates: the storage shim (when backed by a real shared database, e.g.
  // Supabase Realtime) dispatches this event whenever ANY device changes shared
  // data, so every open tab/device reflects it immediately without a manual
  // refresh. On a shim that doesn't support realtime (e.g. plain localStorage),
  // this event simply never fires and the app behaves exactly as before.
  useEffect(() => {
    if (!session) return;
    function handleRemoteUpdate(e) {
      const { key, value } = (e && e.detail) || {};
      if (!key || value === undefined) return;
      try {
        if (key === STORAGE_KEYS.TOOLS) setTools(JSON.parse(value));
        else if (key === STORAGE_KEYS.STAFF) setStaff(JSON.parse(value));
        else if (key === STORAGE_KEYS.TX) setTx(JSON.parse(value));
        else if (key === STORAGE_KEYS.USERS) setUsers(JSON.parse(value));
        else if (key === STORAGE_KEYS.WAREHOUSES) setWarehouses(JSON.parse(value));
        else if (key === STORAGE_KEYS.SHELVES) setShelves(JSON.parse(value));
        else if (key === STORAGE_KEYS.SETTINGS) setSettingsState(JSON.parse(value));
        else if (key === STORAGE_KEYS.AUDIT) setAuditLog(JSON.parse(value));
      } catch (err) { console.error('failed to apply remote update', err); }
    }
    window.addEventListener('tai-lbc-remote-update', handleRemoteUpdate);
    return () => window.removeEventListener('tai-lbc-remote-update', handleRemoteUpdate);
  }, [session]);

  function showToast(text, kind = 'success') {
    setToast({ text, kind });
    setTimeout(() => setToast(null), 3200);
  }

  // active borrow map: toolId -> open transaction
  const activeByTool = useMemo(() => {
    const m = new Map();
    for (const t of tx) if (!t.returnDate) m.set(t.toolId, t);
    return m;
  }, [tx]);

  function toolStatus(toolId) {
    const tool = tools.find(t => t.id === toolId);
    if (tool && tool.condition === 'damaged') return 'damaged';
    if (tool && tool.condition === 'calibration') return 'calibration';
    const open = activeByTool.get(toolId);
    if (!open) return 'available';
    return open.dueDate < todayISO() ? 'overdue' : 'borrowed';
  }

  // The seeded "Admin" account (username hardcoded at signup, never renamable
  // through the UI) is the ONE account that can create other admins and set
  // their warehouse scope — every other admin is a "secondary admin" that the
  // main admin explicitly grants access to.
  const currentUserRecord = users.find(u => u.username === session?.username) || null;
  // The linked staff record holds the profile bits (photo, full name, code);
  // the built-in "Admin" account has no staff record, so this stays null there
  // and the topbar falls back to the username.
  const currentStaffRecord = currentUserRecord?.staffId ? (staff.find(s => s.id === currentUserRecord.staffId) || null) : null;
  const isMainAdmin = session?.username === 'Admin';
  // undefined/missing warehouseScope means unrestricted (matches every admin's
  // behavior before this feature existed, and is always true for the main
  // admin) — only an explicit array actually restricts what a secondary admin
  // can see/manage. NOTE: deliberately NOT pre-filtering `tools`/`warehouses`
  // here — pages like ToolsPage/WarehousePage rebuild their full collection
  // from their `tools`/`warehouses` prop before every save (e.g.
  // `tools.map(...)` then `setTools(...)`), so handing them a pre-filtered
  // subset would silently delete every tool/warehouse outside scope on the
  // next edit. Instead every consumer gets the FULL collections plus this id
  // list, and filters for DISPLAY only.
  const scopedWarehouseIds = (isMainAdmin || session?.role !== 'admin' || !currentUserRecord?.warehouseScope) ? null : currentUserRecord.warehouseScope;

  // Scoped so a restricted secondary admin's dashboard reflects only the
  // warehouse(s) they actually manage, rather than showing org-wide totals
  // that don't match what they can act on below.
  const scopedWarehouseIdSetForKpis = scopedWarehouseIds ? new Set(scopedWarehouseIds) : null;
  const kpiTools = scopedWarehouseIdSetForKpis ? tools.filter(t => scopedWarehouseIdSetForKpis.has(t.warehouseId)) : tools;
  const kpis = useMemo(() => {
    let available = 0, borrowed = 0, overdue = 0, damaged = 0, calibration = 0;
    for (const t of kpiTools) {
      const s = toolStatus(t.id);
      if (s === 'available') available++;
      else if (s === 'overdue') overdue++;
      else if (s === 'damaged') damaged++;
      else if (s === 'calibration') calibration++;
      else borrowed++;
    }
    return { total: kpiTools.length, available, borrowed, overdue, damaged, calibration };
  }, [kpiTools, activeByTool]);

  const overdueList = useMemo(() => {
    const list = [];
    for (const t of tx) {
      if (t.returnDate) continue;
      if (t.dueDate >= todayISO()) continue;
      const tool = tools.find(x => x.id === t.toolId);
      const st = staff.find(x => x.id === t.staffId);
      const days = Math.max(1, Math.round((parseDateValue(todayISO()) - parseDateValue(t.dueDate)) / 86400000));
      list.push({ tx: t, tool, staff: st, daysLate: days });
    }
    return list.sort((a, b) => b.daysLate - a.daysLate);
  }, [tx, tools, staff]);

  async function handleBorrow(staffId, toolId, dueDate, photoDataUrl, docForm) {
    const tool = tools.find(t => t.id === toolId || t.code === toolId);
    const st = staff.find(s => s.id === staffId || s.code === staffId);
    if (!tool) return showToast('ไม่พบรหัสเครื่องมือนี้ในระบบ', 'error');
    if (!st) return showToast('ไม่พบรหัสพนักงานนี้ในระบบ', 'error');
    if (activeByTool.has(tool.id)) return showToast(`${tool.name} ถูกยืมอยู่แล้ว`, 'error');
    if (tool.condition === 'damaged') return showToast(`${tool.name} อยู่ระหว่างชำรุด/ส่งซ่อม ไม่สามารถยืมได้`, 'error');
    if (tool.condition === 'calibration') return showToast(`${tool.name} อยู่ระหว่างส่ง Calibration ไม่สามารถยืมได้`, 'error');
    const openForStaff = tx.filter(t => t.staffId === st.id && !t.returnDate).length;
    if (openForStaff >= (settings.maxBorrowPerStaff || 3)) {
      return showToast(`${st.name} ยืมเครื่องมือค้างอยู่ครบจำนวนสูงสุดแล้ว (${settings.maxBorrowPerStaff} ชิ้น) กรุณาคืนก่อนยืมเพิ่ม`, 'error');
    }
    const record = {
      id: uid('TX'), toolId: tool.id, staffId: st.id, borrowDate: new Date().toISOString(),
      dueDate: dueDate || addDays(todayISO(), 7), returnDate: null, returnedBy: null,
      hasBorrowPhoto: !!photoDataUrl, hasReturnPhoto: false,
      // Mirrors the paper "LOAN AND RETURN OF SPECIAL TOOL" (LBC-FM-034) slip —
      // kept on the transaction itself so admin can look it up and print it
      // later, once returned.
      docForm: docForm || null
    };
    // Condition photos are stored under their own key (not inside the tx list itself)
    // so the shared record list stays small — the photo is never read back into the UI.
    // Photos aren't part of the offline queue (they're too large for a local
    // fallback), so if the network is down, skip the photo rather than
    // blocking the whole borrow — the crib still needs to keep moving.
    let photoOk = true;
    if (photoDataUrl) {
      try { await storageSet(`toolcrib-photo:${record.id}:borrow`, photoDataUrl); }
      catch (err) { console.error('failed to save borrow photo', err); photoOk = false; record.hasBorrowPhoto = false; }
    }
    try {
      await persistTx([record, ...tx]);
    } catch (err) {
      console.error('failed to save borrow', err);
      return showToast('บันทึกการยืมไม่สำเร็จ กรุณาลองใหม่', 'error');
    }
    addAudit('borrow', `${st.name} ยืม ${tool.code} — ${tool.name}`);
    if (photoDataUrl && !photoOk) showToast(`บันทึกการยืม "${tool.name}" สำเร็จ แต่รูปหลักฐานอัปโหลดไม่สำเร็จ (ออฟไลน์) กรุณาถ่ายใหม่ตอนกลับมาออนไลน์`, 'warning');
    else showToast(`บันทึกการยืม "${tool.name}" โดย ${st.name} เรียบร้อย`, 'success');
  }

  async function handleReturn(toolId, returnedByStaffId, photoDataUrl, returnDocFields) {
    const tool = tools.find(t => t.id === toolId || t.code === toolId);
    if (!tool) return showToast('ไม่พบรหัสเครื่องมือนี้ในระบบ', 'error');
    const open = activeByTool.get(tool.id);
    if (!open) return showToast(`${tool.name} ไม่มีรายการค้างยืมอยู่`, 'error');
    let photoOk = true;
    if (photoDataUrl) {
      try { await storageSet(`toolcrib-photo:${open.id}:return`, photoDataUrl); }
      catch (err) { console.error('failed to save return photo', err); photoOk = false; }
    }
    const next = tx.map(t => t.id === open.id ? {
      ...t, returnDate: new Date().toISOString(), returnedBy: returnedByStaffId || null, hasReturnPhoto: !!photoDataUrl && photoOk,
      docForm: { ...(t.docForm || {}), ...(returnDocFields || {}) }
    } : t);
    try {
      await persistTx(next);
    } catch (err) {
      console.error('failed to save return', err);
      return showToast('บันทึกการคืนไม่สำเร็จ กรุณาลองใหม่', 'error');
    }
    const byStaff = returnedByStaffId ? staff.find(s => s.id === returnedByStaffId) : null;
    addAudit('return', `${byStaff ? byStaff.name : 'ไม่ระบุ'} คืน ${tool.code} — ${tool.name}`);
    if (photoDataUrl && !photoOk) showToast(`บันทึกการคืน "${tool.name}" สำเร็จ แต่รูปหลักฐานอัปโหลดไม่สำเร็จ (ออฟไลน์)`, 'warning');
    else showToast(`บันทึกการคืน "${tool.name}" เรียบร้อย`, 'success');
  }

  // Admin override: directly fix a transaction's due date, or force it
  // returned / reopen it, without going through the scan+confirm flow.
  async function handleEditTx(txId, updates) {
    const record = tx.find(t => t.id === txId);
    if (!record) return showToast('ไม่พบรายการนี้ในระบบ', 'error');
    const tool = tools.find(t => t.id === record.toolId);
    const st = staff.find(s => s.id === record.staffId);
    const next = tx.map(t => t.id === txId ? { ...t, ...updates } : t);
    try {
      await persistTx(next);
    } catch (err) {
      console.error('failed to save tx edit', err);
      return showToast('บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    const statusNote = updates.docForm ? 'แก้ไขข้อมูลใบยืม-คืนเครื่องมือ'
      : updates.returnDate === null ? 'เปิดรายการใหม่ (ยังไม่คืน)'
      : updates.returnDate ? `บันทึกว่าคืนแล้วเมื่อ ${fmtThaiDateTime(updates.returnDate)}`
      : `แก้กำหนดคืนเป็น ${fmtThaiDate(updates.dueDate)}`;
    addAudit('tx_edit', `${tool?.code || '-'} — ${st?.name || '-'}: ${statusNote}`);
    showToast('แก้ไขสถานะรายการเรียบร้อย', 'success');
  }

  function exportExcel() {
    const wb = XLSX.utils.book_new();
    const toolRows = tools.map(t => ({
      รหัสเครื่องมือ: t.code, ชื่อเครื่องมือ: t.name, หมวดหมู่: catMap[t.category]?.label || t.category,
      คลังเครื่องมือ: warehouses.find(w => w.id === t.warehouseId)?.name || 'ไม่ระบุคลัง',
      สถานะ: { available: 'พร้อมใช้งาน', borrowed: 'ถูกยืม', overdue: 'เกินกำหนดคืน', damaged: 'ชำรุด/ส่งซ่อม', calibration: 'ส่ง Calibration' }[toolStatus(t.id)]
    }));
    const txRows = tx.map(t => {
      const tool = tools.find(x => x.id === t.toolId); const st = staff.find(x => x.id === t.staffId);
      const returnedBy = t.returnedBy ? staff.find(x => x.id === t.returnedBy) : null;
      return {
        รหัสเครื่องมือ: tool?.code || '-', รายการ: tool?.name || '-', ผู้ยืม: st?.name || '-', สังกัด: st?.dept || '-',
        'วันเวลาที่ยืม': fmtThaiDateTime(t.borrowDate), กำหนดคืน: fmtThaiDate(t.dueDate),
        'วันเวลาที่คืน': t.returnDate ? fmtThaiDateTime(t.returnDate) : 'ยังไม่คืน',
        ผู้บันทึกการคืน: returnedBy ? returnedBy.name : '-',
        สถานะ: t.returnDate ? 'คืนแล้ว' : (t.dueDate < todayISO() ? 'เกินกำหนดคืน' : 'อยู่ระหว่างยืม')
      };
    });
    wb.SheetNames.push('รายการเครื่องมือ'); wb.Sheets['รายการเครื่องมือ'] = XLSX.utils.json_to_sheet(toolRows);
    wb.SheetNames.push('ประวัติยืม-คืน'); wb.Sheets['ประวัติยืม-คืน'] = XLSX.utils.json_to_sheet(txRows);
    XLSX.writeFile(wb, `รายงานเครื่องมือช่าง-${todayISO()}.xlsx`);
    showToast('Export Excel เรียบร้อยแล้ว', 'success');
  }

  const isAdmin = session?.role === 'admin';

  const FULL_NAV = [
    { id: 'dashboard', label: 'ภาพรวม', icon: LayoutDashboard, roles: ['admin', 'staff'] },
    { id: 'scan', label: 'ยืม-คืน (สแกน)', icon: ScanLine, roles: ['admin', 'staff'] },
    { id: 'qrtool', label: 'QR TOOL', icon: QrCode, roles: ['admin', 'staff'] },
    { id: 'warehouse', label: 'คลังเครื่องมือ', icon: Building2, roles: ['admin'] },
    { id: 'staff', label: 'ผู้ใช้งาน/ช่าง', icon: Users, roles: ['admin'] },
    { id: 'audit', label: 'ประวัติกิจกรรม', icon: History, roles: ['admin'] },
    { id: 'settings', label: 'ตั้งค่า', icon: SettingsIcon, roles: ['admin'] },
  ];
  const NAV = FULL_NAV.filter(n => !session || n.roles.includes(session.role));

  // Safety net: if a staff-role session somehow ends up on an admin-only page, bounce back.
  useEffect(() => {
    if (session && session.role !== 'admin' && page !== 'dashboard' && page !== 'scan' && page !== 'qrtool') setPage('dashboard');
  }, [session, page]);

  function retryLoad() { setAuthError(null); setAuthRetryCount(c => c + 1); }

  if (authError) {
    return (
      <div className="app-root auth-loading-root">
        <style>{CSS}</style>
        <div className="loading-state" style={{ flexDirection: 'column', gap: 14, textAlign: 'center', padding: '0 24px' }}>
          <TriangleAlert size={28} color="var(--danger)" />
          <div style={{ maxWidth: 380 }}>{authError}</div>
          <button className="btn btn-primary" onClick={retryLoad}>ลองใหม่</button>
        </div>
        <AppFooter />
      </div>
    );
  }

  if (!authReady) {
    return (
      <div className="app-root auth-loading-root">
        <style>{CSS}</style>
        <div className="loading-state"><Loader2 className="spin" size={22} /> กำลังโหลด…</div>
        <AppFooter />
      </div>
    );
  }

  if (!session) {
    return (
      <div className="app-root">
        <style>{CSS}</style>
        <LoginScreen onLogin={login} />
        <AppFooter />
      </div>
    );
  }

  return (
    <div className="app-root">
      <style>{CSS}</style>

      <div className="app-body">
      <aside className="sidebar">
        <div className="brand">
          <div className="brand-mark"><img src={LOGO_SRC} alt="TAI" /></div>

/* ---------------------------- Login Screen ---------------------------- */
function LoginScreen({ onLogin }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [remember, setRemember] = useState(false);
  const [showPw, setShowPw] = useState(false);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const [forgotOpen, setForgotOpen] = useState(false);

  async function submit(e) {
    e.preventDefault();
    if (!username.trim() || !password) { setError('กรุณากรอกชื่อผู้ใช้งานและรหัสผ่าน'); return; }
    setBusy(true); setError('');
    const res = await onLogin(username, password, remember);
    setBusy(false);
    if (!res.ok) setError(res.error || 'เข้าสู่ระบบไม่สำเร็จ');
  }

  return (
    <div className="login-shell">
      <div className="login-card">
        <div className="login-brand">
          <div className="brand-mark login-brand-mark"><img src={LOGO_SRC} alt="TAI" /></div>
          <div className="login-brand-title">TAI LBC TOOL SYSTEM</div>
          <div className="login-brand-sub">ระบบยืม-คืนเครื่องมือช่าง</div>
        </div>

        <form onSubmit={submit} className="login-form">
          <div className="form-group">
            <label>ชื่อผู้ใช้งาน</label>
            <input autoFocus value={username} onChange={e => setUsername(e.target.value)} placeholder="Username" />
          </div>
          <div className="form-group">
            <label>รหัสผ่าน</label>
            <div className="scan-input-row">
              <input type={showPw ? 'text' : 'password'} value={password} onChange={e => setPassword(e.target.value)} placeholder="Password" />
              <button type="button" className="scan-icon-btn" onClick={() => setShowPw(v => !v)} title={showPw ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน'}>
                {showPw ? <EyeOff size={16} /> : <Eye size={16} />}
              </button>
            </div>
          </div>

          <div className="login-row-between">
            <label className="remember-check">
              <input type="checkbox" checked={remember} onChange={e => setRemember(e.target.checked)} />
              <span>คงอยู่ในระบบ</span>
            </label>
            <button type="button" className="link-btn" onClick={() => setForgotOpen(true)}>ลืมรหัสผ่าน?</button>
          </div>

          {error && <div className="login-error"><TriangleAlert size={14} /> {error}</div>}

          <button type="submit" className="btn btn-primary login-submit" disabled={busy}>
            {busy ? <Loader2 className="spin" size={16} /> : <Lock size={15} />} เข้าใช้งาน
          </button>
        </form>

        <p className="login-footnote">ต้องการบัญชีผู้ใช้งานใหม่ กรุณาติดต่อแอดมินของระบบ</p>
      </div>

      {forgotOpen && <ForgotPasswordModal onClose={() => setForgotOpen(false)} />}
    </div>
  );
}

// SECURITY: this used to let anyone set a brand-new password for ANY
// username with zero identity verification (no OTP, no old password, no
// admin approval) — since usernames are just employee codes printed on
// badges/QR tags, that was a straightforward account-takeover path for
// every account in the system, including admins. There's no email/SMS
// channel in this app to verify identity through, so self-service reset
// isn't safe to offer at all: password resets now go through the main
// admin (Staff page → edit → set new password), which already requires
// being logged in as an admin.
function ForgotPasswordModal({ onClose }) {

function ChangePasswordModal({ onChange, onClose, showToast, currentSignature, onChangeSignature }) {
  const [current, setCurrent] = useState('');
  const [next1, setNext1] = useState('');
  const [next2, setNext2] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const [signature, setSignature] = useState(currentSignature || '');
  const [sigBusy, setSigBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    if (!current) { setError('กรุณากรอกรหัสผ่านปัจจุบัน'); return; }
    if (!next1 || next1.length < 4) { setError('รหัสผ่านใหม่ต้องมีอย่างน้อย 4 ตัวอักษร'); return; }
    if (next1 !== next2) { setError('รหัสผ่านยืนยันไม่ตรงกัน'); return; }
    setBusy(true); setError('');
    const res = await onChange(current, next1);
    setBusy(false);
    if (!res.ok) { setError(res.error || 'เปลี่ยนรหัสผ่านไม่สำเร็จ'); return; }
    showToast?.('เปลี่ยนรหัสผ่านเรียบร้อยแล้ว', 'success');
    onClose();
  }

  async function submitSignature() {
    setSigBusy(true);
    const res = await onChangeSignature(signature);
    setSigBusy(false);
    if (!res.ok) { showToast?.(res.error || 'บันทึกลายเซ็นไม่สำเร็จ', 'error'); return; }
    showToast?.('บันทึกลายเซ็นเรียบร้อยแล้ว', 'success');
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h3><KeyRound size={17} /> เปลี่ยนรหัสผ่าน</h3>
          <button className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>

        {/* Independent of the password form below — this is what auto-fills
            "Issue by (Tool Room)" on the LBC-FM-034 form whenever this account
            is the one running the scan station. */}
        <div className="form-group">
          <label>ลายเซ็นของฉัน (สำหรับใบยืม-คืน LBC-FM-034)</label>
          <div style={{ display: 'flex', gap: 8 }}>
            <input value={signature} onChange={e => setSignature(e.target.value)} placeholder="เช่น Admin" style={{ flex: 1 }} />
            <button type="button" className="btn btn-secondary" disabled={sigBusy} onClick={submitSignature}>
              {sigBusy ? <Loader2 className="spin" size={15} /> : 'บันทึก'}
            </button>
          </div>
        </div>
        <div style={{ borderTop: '1px solid var(--line)', margin: '4px 0 14px' }} />

        <form onSubmit={submit} className="modal-form">
          <div className="form-group">
            <label>รหัสผ่านปัจจุบัน</label>
            <input type="password" value={current} onChange={e => setCurrent(e.target.value)} />
          </div>
          <div className="form-group">
            <label>รหัสผ่านใหม่</label>
            <input type="password" value={next1} onChange={e => setNext1(e.target.value)} placeholder="อย่างน้อย 4 ตัวอักษร" />
          </div>
          <div className="form-group">
            <label>ยืนยันรหัสผ่านใหม่</label>
            <input type="password" value={next2} onChange={e => setNext2(e.target.value)} />
          </div>
          {error && <div className="login-error"><TriangleAlert size={14} /> {error}</div>}
          <div className="form-actions">
            <button type="button" className="btn btn-secondary" onClick={onClose}>ยกเลิก</button>
            <button type="submit" className="btn btn-primary" disabled={busy}>{busy ? <Loader2 className="spin" size={15} /> : 'บันทึกรหัสผ่านใหม่'}</button>
          </div>
        </form>
      </div>
    </div>
  );
}

/* ---------------------------- Notification Bell ---------------------------- */
// Ticks once a second on the local (Thai) clock. Uses the same local-time
// getters as the rest of the app rather than any UTC-based formatting, so the
// displayed time always matches what date the system records a borrow under.
function LiveClock() {
  const [now, setNow] = useState(() => new Date());
  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);
  const pad = (n) => String(n).padStart(2, '0');
  const time = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  return (
    <div className="live-clock" title="เวลาปัจจุบัน">
      <Clock size={16} />
      <div className="live-clock-body">
        <div className="live-clock-time mono">{time}</div>
        <div className="live-clock-date">{fmtThaiDate(localISODate(now))}</div>
      </div>
    </div>
  );
}

function ConnectionStatusPill({ isOnline, pendingCount, syncing }) {
  if (isOnline && !pendingCount && !syncing) {
    return <div className="conn-pill conn-ok" title="เชื่อมต่อฐานข้อมูลกลางอยู่"><Wifi size={13} /></div>;
  }
  if (!isOnline) {
    return (
      <div className="conn-pill conn-offline" title="ไม่มีอินเทอร์เน็ต — ยังใช้งานได้ตามปกติ ข้อมูลจะบันทึกไว้ในเครื่องนี้ก่อนแล้วซิงค์อัตโนมัติเมื่อกลับมาออนไลน์">
        <WifiOff size={13} /> ออฟไลน์{pendingCount > 0 ? ` · รอซิงค์ ${pendingCount}` : ''}
      </div>
    );
  }
  return (
    <div className="conn-pill conn-syncing" title="กำลังซิงค์ข้อมูลที่ค้างไว้ขึ้นฐานข้อมูลกลาง">
      <Loader2 size={13} className="spin" /> กำลังซิงค์{pendingCount > 0 ? ` (${pendingCount})` : ''}
    </div>
  );
}
