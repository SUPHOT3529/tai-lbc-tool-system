<!--
  Central shared database (Supabase) + Realtime. Shared data lives in one
  Postgres table that every device reads/writes, and a Realtime subscription
  pushes an update event to every open tab the instant any device changes
  data -- no manual refresh needed. Only the personal login "remember me"
  session stays in localStorage per-device. When the network drops, writes
  are queued in this browser's localStorage and replayed automatically once
  connectivity returns (see the offline-queue logic in the app source).
-->
<script>
  var SUPABASE_URL = 'https://sxawqvbuquqkdcoybsin.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_zQoQlznqD410Y579IQUf0Q_yPbNkgGm';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  window.storage = {
    async get(key, shared) {
      if (!shared) {
        const raw = localStorage.getItem('tai_lbc_' + key);
        return raw === null ? null : { key, value: raw };
      }
      const { data, error } = await sb.from('kv_store').select('value').eq('key', key).maybeSingle();
      if (error) { console.error('supabase get failed', error); throw error; }
      return data ? { key, value: data.value } : null;
    },
    async set(key, value, shared) {
      if (!shared) {
        localStorage.setItem('tai_lbc_' + key, value);
        return { key, value };
      }
      const { error } = await sb.from('kv_store').upsert({ key, value, updated_at: new Date().toISOString() });
      if (error) { console.error('supabase set failed', error); throw error; }
      return { key, value };
    },
    async delete(key, shared) {
      if (!shared) {
        localStorage.removeItem('tai_lbc_' + key);
        return { key, deleted: true };
      }
      const { error } = await sb.from('kv_store').delete().eq('key', key);
      if (error) console.error('supabase delete failed', error);
      return { key, deleted: true };
    },
    async list(prefix, shared) {
      if (!shared) {
        const p = 'tai_lbc_' + (prefix || '');
        const keys = Object.keys(localStorage).filter(k => k.startsWith(p)).map(k => k.slice('tai_lbc_'.length));
        return { keys, prefix };
      }
      // Supabase/PostgREST caps a query at ~1000 rows by default unless a
      // range is given — with no range set here, any prefix matching more
      // than ~1000 keys (very plausible for "toolcrib-photo:" once there are
      // thousands of tools/photos) would silently come back truncated, with
      // no error at all. Paginate through every page instead of just the first.
      const PAGE_SIZE = 1000;
      let allKeys = [];
      let from = 0;
      while (true) {
        const { data, error } = await sb.from('kv_store').select('key').like('key', (prefix || '') + '%').range(from, from + PAGE_SIZE - 1);
        if (error) { console.error('supabase list failed', error); break; }
        allKeys = allKeys.concat((data || []).map(r => r.key));
        if (!data || data.length < PAGE_SIZE) break;
        from += PAGE_SIZE;
      }
      return { keys: allKeys, prefix };
    }
  };

  // Filtered to only the handful of keys the app actually reacts to (see
  // handleRemoteUpdate below) — without this filter, Supabase would broadcast
  // the FULL row (including the base64 image data) for every photo write to
  // every connected device, which gets expensive fast once there are
  // thousands of tool photos plus ongoing borrow/return evidence photos.
  sb.channel('kv_store_live')
    .on('postgres_changes', {
      event: '*', schema: 'public', table: 'kv_store',
      filter: 'key=in.(toolcrib-tools-v1,toolcrib-staff-v1,toolcrib-tx-v1,toolcrib-users-v1,toolcrib-settings-v1,toolcrib-audit-v1,toolcrib-warehouses-v1,toolcrib-shelves-v1)'
    }, function (payload) {
      var row = payload.new || payload.old;
      if (!row) return;
      window.dispatchEvent(new CustomEvent('tai-lbc-remote-update', {
        detail: { key: row.key, value: row.value, eventType: payload.eventType }
      }));
    })
    .subscribe();
</script>

  });

// Sorts tool codes the way a person reading them would expect — by the
// number embedded in the code, not plain string order (which would put
// "AM4A12" before "AM4A2" since '1' < '2' as characters). Splits each code
// into alternating letter/number chunks and compares numeric chunks as
// numbers, letter chunks as text — regardless of what numbering scheme was
// typed in, the display order always follows the code's own sequence.
function naturalCompareCode(a, b) {
  const chunks = (s) => String(s || '').match(/(\d+)|(\D+)/g) || [];
  const ax = chunks(a), bx = chunks(b);
  const len = Math.max(ax.length, bx.length);
  for (let i = 0; i < len; i++) {
    const av = ax[i] || '', bv = bx[i] || '';
    const an = /^\d+$/.test(av), bn = /^\d+$/.test(bv);
    if (an && bn) {
      const diff = Number(av) - Number(bv);
      if (diff !== 0) return diff;
    } else {
      const cmp = av.localeCompare(bv);
      if (cmp !== 0) return cmp;
    }
  }
  return 0;
}

// Strips accent marks from letters typed into a tool code (e.g. "À" typed
// by mistake on a keyboard instead of plain "A") — these look almost
// identical on screen but are a completely different character to the
// computer, which silently breaks natural-sort order without any visible
// sign why. Codes are meant to be plain alphanumeric, so this runs live as
// the admin types rather than waiting to catch it after the fact.
function normalizeCode(s) {
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

// ---- One shared standard for every photo the app stores -------------------
// Tool registration photos, shelf photos, borrow/return evidence photos, and
// staff photos had each picked their own resize numbers independently over
// time (480px/0.70, 640px/0.72, 480px/0.62, 320px/0.75) — noticeably
// different sharpness and file size depending on which screen took the
// photo. This is the one place that gets tuned from now on; every photo
// path below calls into it instead of keeping its own copy.
const PHOTO_MAX_DIMENSION = 640; // longest side, in px — enough detail to see an item's actual condition, small enough to stay lean in storage
const PHOTO_JPEG_QUALITY = 0.75;

// Resizes an already-decoded <img> (or anything drawable, like a <video>
// frame) onto a canvas capped at PHOTO_MAX_DIMENSION on its longest side,
// and returns a JPEG data URL at the standard quality. Used directly for
// live camera captures (already decoded — no format-detection step needed).
function resizeDrawableToStandardPhoto(source, sourceWidth, sourceHeight) {
  const w = sourceWidth || PHOTO_MAX_DIMENSION;
  const h = sourceHeight || PHOTO_MAX_DIMENSION;
  const scale = Math.min(1, PHOTO_MAX_DIMENSION / Math.max(w, h));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);
  canvas.getContext('2d').drawImage(source, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', PHOTO_JPEG_QUALITY);
}

// Resizes an uploaded/picked image FILE to the same standard. Uses a blob URL
// (not a hand-built data URL) for the decode step — the browser's normal
// image decoder handles far more real-world formats reliably that way,
// including some HEIC photos straight off an iPhone/iPad camera roll that
// fail to decode from a manually-constructed data URL.
function resizeImageFileToStandardPhoto(file, cb, onError) {
  const objectUrl = URL.createObjectURL(file);
  const img = new Image();
  img.onerror = () => {
    URL.revokeObjectURL(objectUrl);
    console.error('failed to decode photo file — likely an unsupported format for this browser');
    if (onError) onError();
  };
  img.onload = () => {
    try {
      cb(resizeDrawableToStandardPhoto(img, img.width, img.height));
    } catch (err) {
      console.error('failed to resize photo', err);
      if (onError) onError();
    } finally {
      URL.revokeObjectURL(objectUrl);
    }
  };
  img.src = objectUrl;
}

const JSQR_SRC = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
let jsQRLoadPromise = null;
function ensureJsQR() {
  if (typeof window !== 'undefined' && window.jsQR) return Promise.resolve();
  if (jsQRLoadPromise) return jsQRLoadPromise;
  jsQRLoadPromise = new Promise((resolve, reject) => {
    const existing = document.querySelector(`script[src="${JSQR_SRC}"]`);
    if (existing) existing.remove(); // drop any earlier failed attempt so this is a real retry
    const s = document.createElement('script');
    s.src = JSQR_SRC; s.async = true;
    s.onload = resolve;
    s.onerror = () => { s.remove(); reject(new Error('jsQR script failed to load')); };
    document.head.appendChild(s);
  });
  jsQRLoadPromise.catch(() => { jsQRLoadPromise = null; }); // allow a future retry after failure
  return jsQRLoadPromise;
}

function uid(prefix) {

// All "YYYY-MM-DD" values in this app (dueDate, calibDate, the date inputs)
// mean a LOCAL calendar day, so they must be produced and read back in local
// time. Using toISOString() here would return the UTC day, which in Thailand
// (UTC+7) is the PREVIOUS day between 00:00 and 07:00 local — that silently
// made due dates land a day early and marked items overdue a day too soon
// during early-morning shifts.
// Sorts a list by its explicit "order" field, treating a missing order as 0
// so records saved before this field existed keep their original relative
// position (stable sort) instead of jumping around.
function sortByOrder(list) {
  return [...list].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
}

function localISODate(d) {
  const y = d.getFullYear();

  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;

// Used only for evidence-photo filenames in the backup ZIP (e.g. "03092026")
// — day-month-year with no separators, per how those files need to sort/read
// when someone's looking through the folder directly rather than in Excel.
function ddmmyyyyTag(d) {
  const day = String(d.getDate()).padStart(2, '0');
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const y = d.getFullYear();
  return `${day}${m}${y}`;

  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear() + 543} ${hh}:${mm} น.`;
}
// Used only on the printed LOAN AND RETURN OF SPECIAL TOOL form, which is an
// English-language document — every date on it should read e.g. "31 Aug 2026",
// not the Thai-language / Buddhist-era format used elsewhere in the app.
function fmtEnDate(iso) {
  const d = parseDateValue(iso);
  if (!d) return '-';
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

async function storageGet(key, shared = true) {
  try { const r = await window.storage.get(key, shared); return r ? r.value : null; }
  catch (e) { return null; }
}
// Unlike storageGet, this does NOT swallow errors into null — a thrown error here
// means "we genuinely could not reach storage" (e.g. Supabase network/RLS issue),
// which callers must NOT treat the same as "key legitimately doesn't exist yet".
// Conflating those two cases is what causes a transient read failure to look like
// an empty database and silently reseed/overwrite real data with defaults.
async function storageGetStrict(key, shared = true) {
  const r = await window.storage.get(key, shared);
  return r ? r.value : null;
}

// ---- Offline support: a lightweight local queue for shared writes ----
// When the shared backend is unreachable, writes get parked here (in this
// browser's own localStorage — always available, never depends on the
// network) instead of being lost or blocking the UI. They're replayed
// automatically the moment connectivity returns.
const OFFLINE_QUEUE_PREFIX = 'tai_lbc_offline_queue:';
const OFFLINE_QUEUE_INDEX_KEY = 'tai_lbc_offline_queue_index';
function queueOfflineWrite(storageKey, jsonValue) {
  try {
    localStorage.setItem(OFFLINE_QUEUE_PREFIX + storageKey, jsonValue);
    const idx = readOfflineQueueIndex();
    if (!idx.includes(storageKey)) { idx.push(storageKey); localStorage.setItem(OFFLINE_QUEUE_INDEX_KEY, JSON.stringify(idx)); }
  } catch (e) { console.error('failed to queue offline write', e); }
}
function readOfflineQueueIndex() {
  try { return JSON.parse(localStorage.getItem(OFFLINE_QUEUE_INDEX_KEY) || '[]'); } catch (e) { return []; }
}
function removeFromOfflineQueue(storageKey) {
  try {
    localStorage.removeItem(OFFLINE_QUEUE_PREFIX + storageKey);
    localStorage.setItem(OFFLINE_QUEUE_INDEX_KEY, JSON.stringify(readOfflineQueueIndex().filter(k => k !== storageKey)));
  } catch (e) { /* ignore */ }
}
// Distinguishes "internet/backend unreachable" (safe to queue and retry
// later) from a genuine backend error like a bad RLS policy or schema
// mismatch (must surface immediately — queuing that forever would silently
// and permanently lose the write while looking like it "will sync later").
function isNetworkError(err) {
  if (typeof navigator !== 'undefined' && navigator.onLine === false) return true;
  const msg = String((err && err.message) || err || '').toLowerCase();
  return msg.includes('fetch') || msg.includes('network') || msg.includes('timeout') || msg.includes('internet') || msg.includes('load failed');
}

// IMPORTANT: this must NOT swallow errors. A failed write silently treated as
// success is exactly what causes "I added it but it's gone after I log back
// in" — the UI shows success while the database was never actually updated.
// Callers are expected to catch this and show a real error instead.
async function storageSet(key, value, shared = true) {
  await window.storage.set(key, value, shared);
}
async function storageDelete(key, shared = true) {
  try { await window.storage.delete(key, shared); } catch (e) { /* key may not exist */ }
}

// NOTE: This runs entirely in the browser with no real backend server, so this
// hashing is obfuscation for a working prototype, not production-grade security.
// A real deployment needs server-side authentication.
// Shared everywhere a password gets set (new account, self password change,
// admin resetting someone's password) so the rule is enforced consistently
// rather than each place having its own (weaker) check.
function passwordComplexityError(pw) {
  if (!pw || pw.length < 6) return 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
  if (!/[a-z]/.test(pw)) return 'รหัสผ่านต้องมีตัวอักษรพิมพ์เล็กอย่างน้อย 1 ตัว';
  if (!/[A-Z]/.test(pw)) return 'รหัสผ่านต้องมีตัวอักษรพิมพ์ใหญ่อย่างน้อย 1 ตัว';
  if (!/[0-9]/.test(pw)) return 'รหัสผ่านต้องมีตัวเลขอย่างน้อย 1 ตัว';
  if (!/[^a-zA-Z0-9]/.test(pw)) return 'รหัสผ่านต้องมีอักขระพิเศษอย่างน้อย 1 ตัว (เช่น ! @ # $ %)';
  return null;
}

async function hashPassword(pw) {
  try {
    const enc = new TextEncoder().encode('toolcrib::' + pw);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 0;
    for (let i = 0; i < pw.length; i++) h = (h * 31 + pw.charCodeAt(i)) | 0;
    return 'fallback-' + h;
  }
}

// Tool/warehouse names are free text the admin types in, and get interpolated
// straight into an HTML string for the PDF export below — without this, a
// name containing <, >, or & would break the printed table's markup.
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function buildToolReportRows(tools, warehouses, toolStatusFn, shelves) {
  const STATUS_LABEL = { available: 'พร้อมใช้งาน', borrowed: 'ถูกยืม', overdue: 'เกินกำหนดคืน', damaged: 'ชำรุด/ส่งซ่อม', calibration: 'ส่ง Calibration' };
  // Shelves are created in order and keep an explicit "order" field for this
  // exact reason — sort report rows the same way they're organized on the
  // Shadow Board (DRAWER 1, DRAWER 2, ...) rather than raw array order, which
  // just reflected whatever sequence tools happened to be added/loaded in.
  const shelfOrder = new Map((shelves || []).map((s, i) => [s.id, s.order ?? i]));
  const sortedTools = [...tools].sort((a, b) => {
    const whA = warehouses.find(w => w.id === a.warehouseId)?.name || '';
    const whB = warehouses.find(w => w.id === b.warehouseId)?.name || '';
    if (whA !== whB) return whA.localeCompare(whB);
    // Tools not on any shelf sort after every shelf, grouped together at the end.
    const shelfA = shelfOrder.has(a.shelfId) ? shelfOrder.get(a.shelfId) : Infinity;
    const shelfB = shelfOrder.has(b.shelfId) ? shelfOrder.get(b.shelfId) : Infinity;
    if (shelfA !== shelfB) return shelfA - shelfB;
    return naturalCompareCode(a.code, b.code);
  });
  return sortedTools.map(t => ({
    รหัสเครื่องมือ: t.code,
    ชื่อเครื่องมือ: t.name,
    หมวดหมู่: catMap[t.category]?.label || t.category,
    คลังเครื่องมือ: warehouses.find(w => w.id === t.warehouseId)?.name || 'ไม่ระบุคลัง',
    ชั้นวาง: (shelves || []).find(s => s.id === t.shelfId)?.name || 'ยังไม่จัดชั้น',
    สถานะ: STATUS_LABEL[toolStatusFn(t.id)] || '-',
    'ต้องออกใบยืม-คืน (LBC-FM-034)': t.requiresLoanForm ? 'ต้องออกใบ' : 'ไม่ต้องออกใบ',
    'P/N': t.partNo || '',
    'S/N': t.serialNo || '',
    'Calibration Date': t.calibDate ? fmtThaiDate(t.calibDate) : '',
    'Calibration Due': t.calibDue ? fmtThaiDate(t.calibDue) : '',
    'วันที่ส่ง Calibration': t.calibSentAt ? fmtThaiDate(t.calibSentAt) : '',
    'วันที่รับเข้าจาก Calibration': t.calibReceivedAt ? fmtThaiDate(t.calibReceivedAt) : ''
  }));
}

// ---- PDF report layout (A4 portrait, Sarabun Thai) ----------------------
// Single source of truth for the report's page setup and columns. Adding a
// new column here is all that's needed — the renderer, header, and row-based
// pagination all read from this, so nothing else has to change.
const PDF_REPORT = {
  // A4 at 96dpi minus margins, in px, for the offscreen render surface.
  pageWidthPx: 794,
  marginPx: 32,
  rowsPerPage: 22,      // conservative default that fits A4 with the header block
  headerFontPx: 17,
  metaFontPx: 11,
  thFontPx: 11,
  tdFontPx: 11.5,
  rowPadPx: 7,
  columns: [
    { key: 'รหัสเครื่องมือ', label: 'รหัส', width: '13%', mono: true, nowrap: true },
    { key: 'ชื่อเครื่องมือ', label: 'ชื่อเครื่องมือ', width: '37%' },
    { key: 'หมวดหมู่', label: 'หมวดหมู่', width: '16%', nowrap: true },
    { key: 'ชั้นวาง', label: 'ชั้นวาง', width: '19%', nowrap: true },
    { key: 'สถานะ', label: 'สถานะ', width: '15%', nowrap: true },
  ],
};

function chunkArray(arr, size) {
  const out = [];
  for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}

// Runs an async fn over every item with up to `limit` in flight at once,
// instead of either doing them one-at-a-time (slow — each Supabase round
// trip pays its own latency in full) or all-at-once (risks overwhelming the
// connection with hundreds of simultaneous requests). Order of results
// matches the input order.
async function mapWithConcurrency(items, limit, fn) {
  const results = new Array(items.length);
  let next = 0;
  async function worker() {
    while (next < items.length) {
      const i = next++;
      results[i] = await fn(items[i], i);
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  return results;
}

// Renders one QR code off-screen (never visible, never touches layout) and
// hands back a PNG data URL — the same qrcodejs library QrCodeModal uses,
// just pointed at a detached node instead of one the user can see.
async function generateQrDataUrl(value) {
  await ensureQRCodeLib();
  return new Promise((resolve, reject) => {
    const holder = document.createElement('div');
    holder.style.cssText = 'position:fixed; left:-9999px; top:-9999px;';
    document.body.appendChild(holder);
    try {
      new window.QRCode(holder, {
        text: String(value), width: 300, height: 300,
        colorDark: '#000000', colorLight: '#FFFFFF',
        correctLevel: window.QRCode.CorrectLevel.M,
      });
      // qrcodejs paints synchronously in every browser this app targets, but
      // a short delay costs nothing and removes any doubt.
      setTimeout(() => {
        const canvas = holder.querySelector('canvas');
        const img = holder.querySelector('img');
        const dataUrl = canvas ? canvas.toDataURL('image/png') : (img ? img.src : null);
        document.body.removeChild(holder);
        if (dataUrl) resolve(dataUrl); else reject(new Error('QR generation produced no image'));
      }, 30);
    } catch (err) {
      document.body.removeChild(holder);
      reject(err);
    }
  });
}

// A printable sheet of QR + label cards, 3x4 per A4 page, meant to be cut
// apart and stuck onto the actual tool or shelf location. Goes through
// html2canvas (same as the other PDF reports in this app) rather than
// jsPDF's own text drawing, because jsPDF's built-in fonts don't have Thai
// glyphs — html2canvas rasterizes real styled HTML using the page's own
// Sarabun web font instead, so Thai names/labels render correctly.
async function generateQrLabelsPDF(items, fileName) {
  // items: [{ id, title, subtitle }] — id is both the QR payload and the
  // mono code shown under it, matching the on-screen QrCodeModal convention.
  await Promise.all([ensureQRCodeLib(), ensureHtml2Canvas(), ensureJsPDF()]);
  if (document.fonts?.ready) { try { await document.fonts.ready; } catch (e) { /* non-fatal */ } }

  // Generate every QR code up front. Each one carries a small built-in delay
  // (see generateQrDataUrl) that adds up fast once a warehouse has a couple
  // hundred tools — running several in parallel (each uses its own isolated,
  // self-cleaning DOM node, so this is safe) cuts that wait roughly in half.
  const withQrResults = await mapWithConcurrency(items, 6, async (item) => {
    try {
      return { ...item, qrDataUrl: await generateQrDataUrl(item.id) };
    } catch (err) {
      console.error('failed to generate QR for label', item.id, err);
      return null;
    }
  });
  const withQr = withQrResults.filter(Boolean);

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'pt', 'a4');
  const pageWidthPt = pdf.internal.pageSize.getWidth();
  const pageHeightPt = pdf.internal.pageSize.getHeight();

  // 2x3 rather than the denser 3x4 tried earlier — a label meant to be cut
  // out and stuck onto a physical tool or shelf needs to stay easy to scan
  // and read at arm's length, which a cramped grid works against.
  const COLS = 2, ROWS = 3;
  const PER_PAGE = COLS * ROWS;
  const PAGE_WIDTH_PX = 794; // matches PDF_REPORT's convention elsewhere in this file
  const MARGIN_PX = 28;
  const CELL_W_PX = Math.floor((PAGE_WIDTH_PX - MARGIN_PX * 2) / COLS);
  const CELL_H_PX = 330;
  const QR_SIZE_PX = 190;

  const pages = chunkArray(withQr, PER_PAGE);
  for (let p = 0; p < pages.length; p++) {
    const cellsHtml = pages[p].map(it => `
      <div style="width:${CELL_W_PX}px; height:${CELL_H_PX}px; box-sizing:border-box; border:1px dashed #B4BCC8; padding:20px 18px;">
        <div style="display:flex; align-items:center; gap:7px; margin-bottom:12px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1F2A37" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20h.01"/></svg>
          <span style="font-size:14px; font-weight:700; color:#1F2A37; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(it.title || '')}</span>
        </div>
        <div style="background:#F7FAF9; border:1px solid #E9EEF0; border-radius:14px; padding:14px; display:flex; align-items:center; justify-content:center;">
          ${it.qrDataUrl
            ? `<img src="${it.qrDataUrl}" style="width:${QR_SIZE_PX}px; height:${QR_SIZE_PX}px;" />`
            : `<div style="width:${QR_SIZE_PX}px;height:${QR_SIZE_PX}px;display:flex;align-items:center;justify-content:center;color:#999;font-size:11px;">สร้าง QR ไม่สำเร็จ</div>`}
        </div>
        ${it.subtitle ? `<div style="font-size:12.5px; color:#718096; margin-top:10px; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(it.subtitle)}</div>` : ''}
        <div style="font-size:11.5px; color:#8A94A6; margin-top:4px; text-align:center; font-family:monospace; letter-spacing:0.02em;">${escapeHtml(it.id)}</div>
      </div>
    `).join('');
    const container = document.createElement('div');
    container.style.cssText = `position:fixed; left:-9999px; top:0; width:${PAGE_WIDTH_PX}px; padding:${MARGIN_PX}px; box-sizing:border-box; display:flex; flex-wrap:wrap; background:#fff; font-family:'Sarabun','IBM Plex Sans Thai',sans-serif;`;
    container.innerHTML = cellsHtml;
    document.body.appendChild(container);
    try {
      const canvas = await window.html2canvas(container, { scale: 2, backgroundColor: '#ffffff' });
      const imgData = canvas.toDataURL('image/png');
      if (p > 0) pdf.addPage();
      const imgWidthPt = pageWidthPt;
      const imgHeightPt = (canvas.height / canvas.width) * imgWidthPt;
      pdf.addImage(imgData, 'PNG', 0, 0, imgWidthPt, Math.min(imgHeightPt, pageHeightPt));
    } finally {
      document.body.removeChild(container);
    }
  }

  pdf.save(fileName);
}

// Renders one table section (title + header row + paginated body rows) into
// an already-open jsPDF document, starting on a fresh page. Shared by the
// combined backup-summary PDF below so three different tables (tools, staff,
// history) don't each need their own copy of the same pagination logic.
async function renderPdfTableSection(pdf, { title, columns, rows, rowsPerPage, emptyLabel, printedAt }) {
  const pageWidthPt = pdf.internal.pageSize.getWidth();
  const pageHeightPt = pdf.internal.pageSize.getHeight();
  const pages = rows.length ? chunkArray(rows, rowsPerPage) : [[]];
  const headCells = columns.map(c =>
    `<th style="text-align:left; padding:7px 10px; border-bottom:2px solid #1F2A37; font-size:11px; width:${c.width || 'auto'};">${escapeHtml(c.label)}</th>`
  ).join('');

  for (let p = 0; p < pages.length; p++) {
    const pageRows = pages[p];
    const bodyHtml = pageRows.length
      ? pageRows.map(r => `<tr>${columns.map(c => {
          const style = [
            'padding:7px 10px', 'border-bottom:1px solid #E9EEF0', 'font-size:11.5px', 'vertical-align:top',
            c.mono ? 'font-family:monospace' : '', c.nowrap ? 'white-space:nowrap' : '',
          ].filter(Boolean).join('; ');
          return `<td style="${style};">${escapeHtml(r[c.key] ?? '-')}</td>`;
        }).join('')}</tr>`).join('')
      : `<tr><td colspan="${columns.length}" style="padding:14px; text-align:center; color:#9AA3B2; font-size:11.5px;">${escapeHtml(emptyLabel || 'ไม่มีข้อมูล')}</td></tr>`;

    const container = document.createElement('div');
    container.style.cssText = 'position:fixed; left:-9999px; top:0; width:794px; box-sizing:border-box; padding:32px; background:#fff; font-family:\'Sarabun\',\'IBM Plex Sans Thai\',sans-serif;';
    container.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;">
        <div style="font-size:17px; font-weight:700; color:#1F2A37;">${escapeHtml(title)}${pages.length > 1 ? ` (หน้า ${p + 1}/${pages.length})` : ''}</div>
        <div style="font-size:11px; color:#8A94A6;">พิมพ์เมื่อ ${escapeHtml(printedAt)}</div>
      </div>
      <table style="width:100%; border-collapse:collapse; margin-top:10px;">
        <thead><tr>${headCells}</tr></thead>
        <tbody>${bodyHtml}</tbody>
      </table>`;
    document.body.appendChild(container);
    try {
      const canvas = await window.html2canvas(container, { scale: 2, backgroundColor: '#ffffff' });
      const imgData = canvas.toDataURL('image/png');
      pdf.addPage();
      const imgWidthPt = pageWidthPt;
      const imgHeightPt = (canvas.height / canvas.width) * imgWidthPt;
      pdf.addImage(imgData, 'PNG', 0, 0, imgWidthPt, Math.min(imgHeightPt, pageHeightPt));
    } finally {
      document.body.removeChild(container);
    }
  }
}
