function ToolChipBoard({ warehouses, tools, tx, staff, toolStatus, searchable, showOutstanding }) {
  const [openStaffId, setOpenStaffId] = useState(null);
  const [openOutstanding, setOpenOutstanding] = useState(false);
  const [query, setQuery] = useState('');
  // Tapping a tool chip opens that tool's registered photo. A code alone tells
  // you nothing about which of six near-identical wrenches is missing; the
  // picture does, which is the point of the chip carrying the code at all.
  const [photoTool, setPhotoTool] = useState(null);

  const board = useMemo(() => {
    const whIds = new Set(warehouses.map(w => w.id));
    const whNameById = new Map(warehouses.map(w => [w.id, w.name]));
    const toolById = new Map(tools.map(t => [t.id, t]));
    const byStaff = new Map();
    for (const t of tx) {
      if (t.returnDate) continue;
      const tool = toolById.get(t.toolId);
      if (!tool || !whIds.has(tool.warehouseId)) continue;
      if (!byStaff.has(t.staffId)) byStaff.set(t.staffId, []);
      byStaff.get(t.staffId).push({
        txId: t.id, id: tool.id, code: tool.code, name: tool.name, dueDate: t.dueDate,
        warehouseName: whNameById.get(tool.warehouseId) || '-',
      });
    }
    const today = todayISO();
    return [...byStaff.entries()].map(([staffId, chips]) => {
      const st = staff.find(x => x.id === staffId);
      return {
        staffId,
        staffCode: st?.code || '-',
        staffName: st?.signature || st?.name || '-',
        chips: chips.sort((a, b) => naturalCompareCode(a.code, b.code)),
        overdue: chips.some(c => c.dueDate < today),
      };
    }).sort((a, b) => a.staffCode.localeCompare(b.staffCode));
  }, [warehouses, tools, tx, staff]);

  // Tools that are out of the crib with nobody holding them — away for repair
  // or calibration. They have no borrower, so they can't hang on a person's
  // hook; they get one shared chip of their own instead. Still outstanding
  // stock, so they read red like anything else that isn't back on the shelf.
  const outstanding = useMemo(() => {
    if (!toolStatus || !showOutstanding) return [];
    const whNameById = new Map(warehouses.map(w => [w.id, w.name]));
    return tools
      .map(t => ({ tool: t, status: toolStatus(t.id) }))
      .filter(x => x.status === 'damaged' || x.status === 'calibration')
      .map(x => ({
        id: x.tool.id, code: x.tool.code, name: x.tool.name,
        statusLabel: x.status === 'damaged' ? 'ชำรุด/ส่งซ่อม' : 'ส่ง Calibration',
        warehouseName: whNameById.get(x.tool.warehouseId) || '-',
      }))
      .sort((a, b) => naturalCompareCode(a.code, b.code));
  }, [tools, toolStatus, warehouses, showOutstanding]);

  // One search box over both levels: type a person (code, name, signature) or a
  // tool (code or name) and the board narrows to the person chips that match.
  // A tool match keeps the holder's chip on the board, which is the answer to
  // "who has this?" — the question people actually walk up and ask.
  const visibleBoard = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return board;
    return board.filter(row =>
      row.staffCode.toLowerCase().includes(q) ||
      row.staffName.toLowerCase().includes(q) ||
      row.chips.some(c =>
        c.code.toLowerCase().includes(q) ||
        c.name.toLowerCase().includes(q) ||
        c.warehouseName.toLowerCase().includes(q)));
  }, [board, query]);

  // Read from the freshly computed board rather than holding the row itself in
  // state: a return posted from another device shrinks this person's chips
  // while the panel is open, and stale state would keep showing a tool that has
  // already come back.
  const openRow = openStaffId ? board.find(r => r.staffId === openStaffId) : null;
  useEffect(() => {
    if (openStaffId && !openRow) setOpenStaffId(null);
    if (openOutstanding && !outstanding.length) setOpenOutstanding(false);
  }, [openStaffId, openRow, openOutstanding, outstanding.length]);

  const empty = !board.length && !outstanding.length;
  const noMatch = !empty && !visibleBoard.length && !outstanding.length;

  return (
    <div className="chip-board">
      <div className="chip-board-head"><Layers size={16} /> กระดานชิปยืมเครื่องมือ</div>
      {searchable && !empty && (
        <input className="input chip-board-search" value={query} onChange={e => setQuery(e.target.value)}
          placeholder="ค้นหา: ชื่อ, รหัสพนักงาน, ลายเซ็น, รหัส/ชื่อเครื่องมือ, คลัง" />
      )}
      {/* The board keeps the height of the block it sits in and scrolls inside
          it. Letting it grow with the number of borrowers would push the rest
          of the dashboard down on a busy day. */}
      <div className="chip-board-scroll">
        {empty ? (
          <div className="chip-board-empty">เครื่องมือทุกชิ้นอยู่ครบในคลัง</div>
        ) : noMatch ? (
          <div className="chip-board-empty">ไม่พบชิปที่ตรงกับคำค้นหา</div>
        ) : (
          <div className="chip-grid">
            {visibleBoard.map(row => (
              <button key={row.staffId} type="button"
                className={`tool-chip chip-person ${row.overdue ? 'overdue' : ''}`}
                title={`${row.staffCode} · ${row.staffName} — ถือเครื่องมืออยู่ ${row.chips.length} ชิ้น`}
                onClick={() => setOpenStaffId(row.staffId)}>
                <TaiChipMark />
                <span className="tool-chip-code">{row.staffCode}</span>
                <span className="tool-chip-sub">{row.staffName}</span>
                <span className="chip-person-count">{row.chips.length}</span>
              </button>
            ))}
            {outstanding.length > 0 && (
              <button type="button" className="tool-chip chip-person overdue"
                title={`ซ่อม/สอบเทียบ — ${outstanding.length} ชิ้น`}
                onClick={() => setOpenOutstanding(true)}>
                <TaiChipMark />
                <span className="tool-chip-code chip-label-sm">ซ่อม/สอบเทียบ</span>
                <span className="tool-chip-sub">ไม่อยู่ในคลัง</span>
                <span className="chip-person-count">{outstanding.length}</span>
              </button>
            )}
          </div>
        )}
      </div>

      {openRow && (
        <Modal title={`ชิปที่วางไว้: ${openRow.staffCode} · ${openRow.staffName}`} onClose={() => setOpenStaffId(null)}>
          <div className="chip-grid">
            {openRow.chips.map(c => (
              <button key={c.txId} type="button"
                className={`tool-chip tool-chip-lg chip-tappable ${c.dueDate < todayISO() ? 'overdue' : ''}`}
                title={`${c.code} — ${c.name} (กดเพื่อดูรูปเครื่องมือ)`}
                onClick={() => setPhotoTool({ id: c.id, code: c.code, name: c.name })}>
                <TaiChipMark />
                <span className="tool-chip-code">{c.code}</span>
                <span className="tool-chip-sub">{openRow.staffCode}</span>
                <span className="tool-chip-sub">{openRow.staffName}</span>
                <span className="tool-chip-wh">{c.warehouseName}</span>
              </button>
            ))}
          </div>
        </Modal>
      )}

      {photoTool && <ToolPhotoViewModal tool={photoTool} onClose={() => setPhotoTool(null)} />}

      {openOutstanding && (
        <Modal title={`ไม่อยู่ในคลัง: ซ่อม/สอบเทียบ (${outstanding.length} ชิ้น)`} onClose={() => setOpenOutstanding(false)}>
          <div className="chip-grid">
            {outstanding.map(c => (
              <button key={c.id} type="button" className="tool-chip tool-chip-lg overdue chip-tappable"
                title={`${c.code} — ${c.name} (กดเพื่อดูรูปเครื่องมือ)`}
                onClick={() => setPhotoTool({ id: c.id, code: c.code, name: c.name })}>
                <TaiChipMark />
                <span className="tool-chip-code">{c.code}</span>
                <span className="tool-chip-sub">{c.statusLabel}</span>
                <span className="tool-chip-wh">{c.warehouseName}</span>
              </button>
            ))}
          </div>
        </Modal>
      )}
    </div>
  );
}

function WarehousePage({ warehouses, setWarehouses, tools, toolStatus, showToast, addAudit, isMainAdmin, scopedWarehouseIds, isAdmin, shelves, setShelves, setTools, onSetCondition, onSetCalibration, tx, staff, canManageWarehouse = () => isAdmin }) {
  const [modal, setModal] = useState(null); // {mode:'add'|'edit', data}
  const [deleteConfirmWh, setDeleteConfirmWh] = useState(null);
  const [exportingId, setExportingId] = useState(null);
  // Photo of the physical storage area for one warehouse — the room or corner
  // the tools actually live in, so someone sent to fetch something knows where
  // they're going. Stored under its own key namespace
  // (toolcrib-photo:warehouse:*) so it never collides with shelf or tool
  // photos, and flagged on the warehouse record with hasPhoto so the card
  // knows whether to attempt a load at all.
  const [photoEditWh, setPhotoEditWh] = useState(null);
  const [pendingWhPhoto, setPendingWhPhoto] = useState(null);
  const [showWhCamera, setShowWhCamera] = useState(false);
  const whFileInputRef = React.useRef(null);

  function handleWhFilePick(e) {
    const file = e.target.files?.[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => setPendingWhPhoto(String(reader.result));
    reader.onerror = () => showToast('อ่านไฟล์รูปไม่สำเร็จ', 'error');
    reader.readAsDataURL(file);
  }

  async function saveWarehousePhoto() {
    if (!photoEditWh || !pendingWhPhoto) return;
    try {
      await storageSet(`toolcrib-photo:warehouse:${photoEditWh.id}`, pendingWhPhoto, true);
      await setWarehouses(warehouses.map(w => w.id === photoEditWh.id ? { ...w, hasPhoto: true, photoUpdatedAt: Date.now() } : w));
      addAudit?.('warehouse_edit', `อัปเดตรูปบริเวณจัดเก็บ คลัง ${photoEditWh.name}`);
      showToast('บันทึกรูปบริเวณจัดเก็บเรียบร้อย', 'success');
      setPhotoEditWh(null); setPendingWhPhoto(null);
    } catch (err) {
      console.error('failed to save warehouse photo', err);
      showToast('บันทึกรูปไม่สำเร็จ กรุณาลองใหม่', 'error');
    }
  }

  async function removeWarehousePhoto() {
    if (!photoEditWh) return;
    try {
      await storageDelete(`toolcrib-photo:warehouse:${photoEditWh.id}`, true);
      await setWarehouses(warehouses.map(w => w.id === photoEditWh.id ? { ...w, hasPhoto: false, photoUpdatedAt: Date.now() } : w));
      addAudit?.('warehouse_edit', `ลบรูปบริเวณจัดเก็บ คลัง ${photoEditWh.name}`);
      setPhotoEditWh(null); setPendingWhPhoto(null);
    } catch (err) {
      console.error('failed to remove warehouse photo', err);
      showToast('ลบรูปไม่สำเร็จ กรุณาลองใหม่', 'error');
    }
  }
  // Quick "register a new tool" shortcut, mirroring the Tools page's add flow,
  // so admins don't have to leave warehouse management just to register a
  // tool while they're already here setting up a shelf.
  const [addToolModal, setAddToolModal] = useState(false);
  const [newToolQr, setNewToolQr] = useState(null);
  // "เพิ่มเครื่องมือใหม่" now offers two tabs: fill in one tool by hand (the
  // existing ToolForm), or upload an Excel file of many at once. Bulk-added
  // tools always land unassigned in the chosen warehouse — shelf placement is
  // a deliberate follow-up step via each shelf's own "+ เพิ่มเครื่องมือ" picker,
  // not something this quick-add path decides on its own.
  const [addToolTab, setAddToolTab] = useState('form'); // 'form' | 'excel'
  const [bulkAddWarehouseId, setBulkAddWarehouseId] = useState('');
  const [bulkAddBusy, setBulkAddBusy] = useState(false);
  const [bulkSyncPreview, setBulkSyncPreview] = useState(null);
  const bulkAddFileRef = React.useRef(null);

  // Creating/deleting warehouses is a main-admin-only action (it's the thing
  // that defines what a secondary admin's scope even refers to) — a secondary
  // admin can still rename/annotate the warehouse(s) they were granted, but
  // never see or touch ones outside their scope.
  const visibleWarehouses = scopedWarehouseIds ? warehouses.filter(w => scopedWarehouseIds.includes(w.id)) : warehouses;

  function openAdd() { setModal({ mode: 'add', data: { name: '', note: '' } }); }
  function openEdit(w) { setModal({ mode: 'edit', data: { ...w } }); }

  // Same validation/uniqueness/photo rules as the Tools page's add flow —
  // kept as its own copy here (rather than sharing code across pages) so
  // this shortcut can't accidentally break tool editing if either one changes.
  async function saveNewTool(data) {
    const { _newPhoto, ...formData } = data;
    const code = normalizeCode(formData.code.trim());
    const name = formData.name.trim();
    if (!code || !name) return showToast('กรุณากรอกรหัสและชื่อเครื่องมือ', 'error');
    if (!formData.warehouseId) return showToast('กรุณาเลือกคลังเครื่องมือ', 'error');
    if (tools.some(t => t.code.trim().toLowerCase() === code.toLowerCase())) return showToast('รหัสนี้มีอยู่แล้ว', 'error');
    // Re-check shelf capacity against the current data (not just what the
    // dropdown showed when it was opened) — someone else could have filled,
    // or even deleted, the shelf in the meantime since this is shared,
    // real-time data. A shelfId pointing at a shelf that no longer exists
    // falls back to unassigned rather than being saved as a dangling
    // reference nothing could ever pick up again.
    let shelfId = formData.shelfId || null;
    let chosenShelf = shelfId ? shelves.find(s => s.id === shelfId) : null;
    if (shelfId && !chosenShelf) {
      shelfId = null;
      showToast('ชั้นที่เลือกไว้ถูกลบไปแล้ว — บันทึกเป็นเครื่องมือที่ยังไม่จัดชั้นแทน', 'error');
    } else if (chosenShelf) {
      const currentCount = tools.filter(t => t.shelfId === shelfId).length;
      if (currentCount >= SHELF_CAPACITY) {
        return showToast(`ชั้น "${chosenShelf.name}" เต็มแล้ว (${SHELF_CAPACITY}/${SHELF_CAPACITY}) กรุณาเลือกชั้นอื่น`, 'error');
      }
    }
    const newTool = { ...formData, code, name, shelfId, id: uid('T'), condition: 'normal', requiresLoanForm: !!formData.requiresLoanForm, hasPhoto: !!_newPhoto, photoUpdatedAt: _newPhoto ? Date.now() : undefined };
    try {
      if (_newPhoto) await storageSet(`toolcrib-photo:master:${newTool.id}`, _newPhoto, true);
      await setTools([newTool, ...tools]);
    } catch (err) {
      console.error('failed to save tool', err);
      return showToast('บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    const whName = warehouses.find(w => w.id === newTool.warehouseId)?.name || '-';
    const shelfNote = chosenShelf ? ` / ชั้น: ${chosenShelf.name}` : '';
    addAudit?.('tool_add', `${newTool.code} — ${newTool.name} (คลัง: ${whName}${shelfNote})`);
    showToast('เพิ่มเครื่องมือและสร้าง QR เรียบร้อย', 'success');
    setAddToolModal(false);
    setNewToolQr(newTool);
  }

  // Bulk sibling of saveNewTool for the "อัปโหลดไฟล์ Excel" tab — same
  // code-normalization and global-uniqueness rules, but every row always
  // lands unassigned (shelfId: null) in whichever warehouse was picked above
  // the upload button; placing them onto a shelf is a separate, deliberate
  // step afterward via that shelf's own picker, never decided by this file.
  // Parses the file and builds a preview (add/update/delete) — nothing is
  // saved yet. The uploaded file is treated as the full, authoritative list
  // for the chosen warehouse: any existing tool in that warehouse whose code
  // does NOT appear in the file is slated for deletion, unless it's currently
  // borrowed or overdue (deleting a tool mid-loan would corrupt that loan's
  // history, so those are protected and reported instead of silently gone).
  async function handleBulkAddExcel(e) {
    const file = e.target.files && e.target.files[0];
    if (bulkAddFileRef.current) bulkAddFileRef.current.value = '';
    if (!file) return;
    if (!bulkAddWarehouseId) { showToast('กรุณาเลือกคลังเครื่องมือก่อน', 'error'); return; }
    setBulkAddBusy(true);
    try {
      const buf = await file.arrayBuffer();
      const wbFile = XLSX.read(buf, { type: 'array' });
      const sheetName = wbFile.SheetNames.includes('รายการเครื่องมือ') ? 'รายการเครื่องมือ' : wbFile.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wbFile.Sheets[sheetName], { defval: '' });
      const seenInFile = new Set();
      const toAdd = [], toUpdate = [];
      const matchedExistingIds = new Set();
      let skipped = 0;
      rows.forEach(r => {
        const code = normalizeCode(String(r['รหัสเครื่องมือ'] || '').trim());
        const name = String(r['ชื่อเครื่องมือ'] || '').trim();
        if (!code || !name) { skipped++; return; }
        const key = code.toLowerCase();
        if (seenInFile.has(key)) { skipped++; return; }
        seenInFile.add(key);
        const catLabel = String(r['หมวดหมู่'] || '').trim();
        const matchedCat = CATEGORIES.find(c => c.label === catLabel);
        const existing = tools.find(t => t.code.toLowerCase() === key);
        // A code already used by a tool in a DIFFERENT warehouse is skipped
        // rather than silently relocated — moving warehouses needs to be a
        // deliberate edit, not a side-effect of this file.
        if (existing && existing.warehouseId !== bulkAddWarehouseId) { skipped++; return; }
        if (existing) {
          matchedExistingIds.add(existing.id);
          toUpdate.push({ id: existing.id, code, name, category: matchedCat?.id || existing.category });
        } else {
          toAdd.push({ code, name, category: matchedCat?.id || 'other' });
        }
      });
      const currentInWarehouse = tools.filter(t => t.warehouseId === bulkAddWarehouseId);
      const notInFile = currentInWarehouse.filter(t => !matchedExistingIds.has(t.id));
      const toDelete = [], protectedTools = [];
      notInFile.forEach(t => {
        const status = toolStatus(t.id);
        if (status === 'borrowed' || status === 'overdue') protectedTools.push(t);
        else toDelete.push(t);
      });
      if (!toAdd.length && !toUpdate.length && !toDelete.length) {
        setBulkAddBusy(false);
        return showToast('ไม่พบข้อมูลที่ใช้ได้ในไฟล์ — ตรวจสอบว่ามีคอลัมน์ "รหัสเครื่องมือ" และ "ชื่อเครื่องมือ"', 'error');
      }
      setBulkSyncPreview({ warehouseId: bulkAddWarehouseId, toAdd, toUpdate, toDelete, protectedTools, skipped });
    } catch (err) {
      console.error('failed to read excel for warehouse sync', err);
      showToast('อ่านไฟล์ไม่สำเร็จ กรุณาตรวจสอบว่าเป็นไฟล์ Excel ที่ถูกต้อง', 'error');
    }
    setBulkAddBusy(false);
  }

  // Commits the previewed sync — the one place tools actually get deleted by
  // this feature, and only after the admin has seen exactly what will happen
  // and pressed confirm.
  async function confirmBulkSync() {
    if (!bulkSyncPreview) return;
    const { warehouseId, toAdd, toUpdate, toDelete } = bulkSyncPreview;
    const updateMap = new Map(toUpdate.map(u => [u.id, u]));
    const deleteIds = new Set(toDelete.map(t => t.id));
    const nextTools = [
      ...tools.filter(t => !deleteIds.has(t.id)).map(t => updateMap.has(t.id)
        ? { ...t, code: updateMap.get(t.id).code, name: updateMap.get(t.id).name, category: updateMap.get(t.id).category }
        : t),
      ...toAdd.map(a => ({ id: uid('T'), code: a.code, name: a.name, category: a.category, warehouseId, shelfId: null, condition: 'normal', requiresLoanForm: false })),
    ];
    setBulkAddBusy(true);
    try {
      await setTools(nextTools);
      for (const t of toDelete) {
        if (t.hasPhoto) { try { await storageDelete(`toolcrib-photo:master:${t.id}`, true); } catch (err) { console.error('failed to clean up deleted tool photo', err); } }
      }
    } catch (err) {
      console.error('failed to sync warehouse tools from excel', err);
      setBulkAddBusy(false);
      return showToast('บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    setBulkAddBusy(false);
    const whName = warehouses.find(w => w.id === warehouseId)?.name || '-';
    const protectedNote = bulkSyncPreview.protectedTools.length ? `, ป้องกันไว้ ${bulkSyncPreview.protectedTools.length} (กำลังถูกยืมอยู่ ไม่ลบ)` : '';
    addAudit?.('warehouse_import', `${whName}: แทนที่ข้อมูลด้วยไฟล์ Excel — เพิ่ม ${toAdd.length}, อัปเดต ${toUpdate.length}, ลบ ${toDelete.length}${protectedNote}`);
    showToast(`แทนที่ข้อมูลคลัง "${whName}" เรียบร้อย (เพิ่ม ${toAdd.length}, อัปเดต ${toUpdate.length}, ลบ ${toDelete.length})`, 'success');
    setBulkSyncPreview(null);
    setAddToolModal(false);
  }

  async function save(data) {
    if (!data.name.trim()) return showToast('กรุณากรอกชื่อคลังเครื่องมือ', 'error');
    if (modal.mode === 'add' && !isMainAdmin) return showToast('มีแต่แอดมินหลักเท่านั้นที่เพิ่มคลังใหม่ได้', 'error');
    try {
      if (modal.mode === 'add') {
        const cleanName = data.name.trim();
        if (warehouses.some(w => w.name.trim().toLowerCase() === cleanName.toLowerCase())) return showToast('มีชื่อคลังนี้อยู่แล้ว', 'error');
        // A new warehouse always lands at the end of the order — predictable
        // placement rather than jumping to the front of the list.
        const nextOrder = warehouses.length ? Math.max(...warehouses.map(w => w.order ?? 0)) + 1 : 0;
        const newWh = { id: uid('WH'), name: cleanName, note: (data.note || '').trim(), order: nextOrder };
        await setWarehouses([...warehouses, newWh]);
        addAudit?.('warehouse_add', newWh.name);
        showToast('เพิ่มคลังเครื่องมือเรียบร้อย', 'success');
      } else {
        const cleanName = data.name.trim();
        if (warehouses.some(w => w.id !== data.id && w.name.trim().toLowerCase() === cleanName.toLowerCase())) {
          return showToast('มีชื่อคลังนี้อยู่แล้ว', 'error');
        }
        await setWarehouses(warehouses.map(w => w.id === data.id ? { ...w, name: cleanName, note: (data.note || '').trim() } : w));
        addAudit?.('warehouse_edit', cleanName);
        showToast('บันทึกการแก้ไขเรียบร้อย', 'success');
      }
    } catch (err) {
      console.error('failed to save warehouse', err);
      return showToast('บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    setModal(null);
  }

  // Main-admin-only reordering — swaps this warehouse's position with its
  // neighbor in the currently visible (already-sorted) list. Only the display
  // order changes; each warehouse's shelves and tools are untouched.
  async function moveWarehouse(w, direction) {
    if (!isMainAdmin) return;
    const idx = visibleWarehouses.findIndex(x => x.id === w.id);
    const swapIdx = idx + direction;
    if (idx === -1 || swapIdx < 0 || swapIdx >= visibleWarehouses.length) return;
    const neighbor = visibleWarehouses[swapIdx];
    const myOrder = w.order ?? idx;
    const neighborOrder = neighbor.order ?? swapIdx;
    try {
      await setWarehouses(warehouses.map(x => {
        if (x.id === w.id) return { ...x, order: neighborOrder };
        if (x.id === neighbor.id) return { ...x, order: myOrder };
        return x;
      }));
    } catch (err) {
      console.error('failed to reorder warehouses', err);
      showToast('ย้ายลำดับไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
  }

  async function remove(w) {
    if (!isMainAdmin) return showToast('มีแต่แอดมินหลักเท่านั้นที่ลบคลังได้', 'error');
    if (tools.some(t => t.warehouseId === w.id)) return showToast('ยังมีเครื่องมืออยู่ในคลังนี้ ย้ายออกก่อนจึงจะลบได้', 'error');
    // A warehouse can have zero tools but still have shelves left in it (e.g.
    // empty shelves someone set up, possibly with a photo already attached) —
    // without cleaning those up too, they'd become permanently orphaned:
    // still in storage, but unreachable from the UI since their warehouse tab
    // is gone, so nothing could ever surface them for cleanup again.
    const orphanedShelves = shelves.filter(s => s.warehouseId === w.id);
    try {
      await setWarehouses(warehouses.filter(x => x.id !== w.id));
    } catch (err) {
      console.error('failed to delete warehouse', err);
      return showToast('ลบไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    // The warehouse's own area photo goes with it, same as its shelves' —
    // otherwise it is orphaned in storage with nothing left pointing at it.
    // Outside the shelves branch below on purpose: a warehouse can have an
    // area photo and no shelves at all.
    if (w.hasPhoto) {
      try { await storageDelete(`toolcrib-photo:warehouse:${w.id}`, true); }
      catch (err) { console.error('failed to delete warehouse photo', err); }
    }
    if (orphanedShelves.length) {
      try {
        await setShelves(shelves.filter(s => s.warehouseId !== w.id));
        for (const s of orphanedShelves) {
          if (s.hasPhoto) await storageDelete(`toolcrib-photo:shelf:${s.id}`, true);
        }
      } catch (err) {
        console.error('failed to clean up deleted warehouse\'s shelves', err);
      }
    }
    addAudit?.('warehouse_delete', w.name);
    showToast('ลบคลังเครื่องมือเรียบร้อย', 'success');
  }

  async function doExportPDF(w, list) {
    setExportingId(w.id + ':pdf');
    try {
      await exportToolsPDF(list, warehouses, toolStatus, w.name, w.name, shelves);
      addAudit?.('warehouse_export', `ส่งออก PDF คลัง ${w.name} (${list.length} รายการ)`);
      showToast(`ส่งออก PDF คลัง "${w.name}" เรียบร้อย`, 'success');
    } catch (e) {
      showToast('ส่งออก PDF ไม่สำเร็จ กรุณาลองใหม่', 'error');
    }
    setExportingId(null);
  }

  async function doExportQrLabels(w, list) {
    if (!list.length) return showToast('คลังนี้ยังไม่มีเครื่องมือ', 'error');
    setExportingId(w.id + ':qr');
    try {
      const items = list
        .slice()
        .sort((a, b) => naturalCompareCode(a.code, b.code))
        .map(t => ({ id: t.id, title: `QR เครื่องมือ: ${t.code}`, subtitle: t.name }));
      await generateQrLabelsPDF(items, `QR-เครื่องมือ-${w.name}-${todayISO()}.pdf`);
      addAudit?.('warehouse_export', `พิมพ์ QR เครื่องมือ คลัง ${w.name} (${items.length} รายการ)`);
      showToast(`สร้างไฟล์ QR สำหรับพิมพ์ (${items.length} ชิ้น) เรียบร้อย`, 'success');
    } catch (e) {
      console.error('failed to generate QR label sheet', e);
      showToast('สร้างไฟล์ QR ไม่สำเร็จ กรุณาลองใหม่', 'error');
    }
    setExportingId(null);
  }

  function doExportExcel(w, list) {
    exportToolsExcel(list, warehouses, toolStatus, w.name, shelves);
    addAudit?.('warehouse_export', `ส่งออก Excel คลัง ${w.name} (${list.length} รายการ)`);
    showToast(`ส่งออก Excel คลัง "${w.name}" เรียบร้อย`, 'success');
  }

  return (
    <div className="page-stack">
      <section className="panel">
        <div className="toolbar">
          <div className="panel-head" style={{ margin: 0, flex: 1 }}>
            <h2><Building2 size={16} /> คลังเครื่องมือ</h2>
            {/* Both of these speak to someone who owns the whole warehouse
                layout. A warehouse head manages one warehouse and cannot create
                another, so the blurb describes work that isn't theirs and the
                button is one they can never press — showing it disabled just
                invites the question of why. */}
            {isMainAdmin && <p>กำหนดคลัง/ห้องเก็บเครื่องมือ เพื่อแยกการจัดการและส่งออกข้อมูลเป็นรายคลัง</p>}
          </div>
          {isMainAdmin && <button className="btn btn-primary" onClick={openAdd}><Plus size={16} /> เพิ่มคลัง</button>}
        </div>

        <div className="warehouse-split">
        <div className="warehouse-grid">
          {visibleWarehouses.map((w, whIdx) => {
            const list = tools.filter(t => t.warehouseId === w.id);
            const available = list.filter(t => toolStatus(t.id) === 'available').length;
            return (
              <div key={w.id} className="warehouse-card">
                <div className="warehouse-card-head">
                  <div className="warehouse-card-icon"><Building2 size={18} /></div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div className="warehouse-card-name">{w.name}</div>
                    {w.note && <div className="muted" style={{ fontSize: 12 }}>{w.note}</div>}
                  </div>
                </div>
                <div className="warehouse-card-toolbar">
                  {isMainAdmin && (
                    <div className="warehouse-card-reorder">
                      <button className="icon-btn" title="ย้ายไปทางซ้าย" disabled={whIdx === 0} onClick={() => moveWarehouse(w, -1)}><ChevronLeft size={15} /></button>
                      <button className="icon-btn" title="ย้ายไปทางขวา" disabled={whIdx === visibleWarehouses.length - 1} onClick={() => moveWarehouse(w, 1)}><ChevronRight size={15} /></button>
                    </div>
                  )}
                  <div className="row-actions" style={{ marginLeft: 'auto' }}>
                    <button className="icon-btn" onClick={() => openEdit(w)}><Pencil size={15} /></button>
                    {isMainAdmin && <button className="icon-btn danger" onClick={() => setDeleteConfirmWh(w)}><Trash2 size={15} /></button>}
                  </div>
                </div>
                <button type="button" className="warehouse-card-photo"
                  title={canManageWarehouse(w.id) ? 'กดเพื่อเพิ่ม/เปลี่ยนรูปบริเวณจัดเก็บ' : 'รูปบริเวณจัดเก็บ'}
                  onClick={() => { if (canManageWarehouse(w.id)) { setPendingWhPhoto(null); setPhotoEditWh(w); } }}
                  disabled={!canManageWarehouse(w.id) && !w.hasPhoto}>
                  <ShelfPhotoThumb shelfId={w.id} hasPhoto={!!w.hasPhoto} version={w.photoUpdatedAt} keyPrefix="warehouse" />
                  {canManageWarehouse(w.id) && <span className="warehouse-card-photo-edit"><Camera size={14} /></span>}
                </button>
                <div className="warehouse-card-stats">
                  <span><b>{list.length}</b> รายการทั้งหมด</span>
                  <span><b>{available}</b> พร้อมใช้งาน</span>
                </div>
                <div className="warehouse-card-actions">
                  <button className="btn btn-secondary" onClick={() => doExportExcel(w, list)}>
                    <FileSpreadsheet size={14} /> Excel
                  </button>
                  <button className="btn btn-secondary" disabled={exportingId === w.id + ':pdf'} onClick={() => doExportPDF(w, list)}>
                    {exportingId === w.id + ':pdf' ? <Loader2 className="spin" size={14} /> : <Download size={14} />} PDF
                  </button>
                  <button className="btn btn-secondary" disabled={exportingId === w.id + ':qr'} title="สร้างไฟล์ PDF QR สำหรับพิมพ์ติดเครื่องมือ/ชั้นวาง" onClick={() => doExportQrLabels(w, list)}>
                    {exportingId === w.id + ':qr' ? <Loader2 className="spin" size={14} /> : <QrCode size={14} />} พิมพ์ QR
                  </button>
                </div>
              </div>
            );
          })}
          {!visibleWarehouses.length && (

            </div>

        </div>
        {/* Same board as the dashboard's, scoped to the warehouses this person

        onAddTool={() => { setAddToolTab('form'); setBulkAddWarehouseId(''); setBulkSyncPreview(null); setAddToolModal(true); }}
        onSetCondition={onSetCondition} onSetCalibration={onSetCalibration} tx={tx} staff={staff}

      {modal && (

          </div>

              data={{ code: '', name: '', category: 'hand', warehouseId: visibleWarehouses[0]?.id || '', shelfId: '' }}

          ) : (
            <div className="modal-form">
              <div className="form-group">
                <label>คลังเครื่องมือ <span className="required-dot">*</span></label>
                {visibleWarehouses.length ? (
                  <select value={bulkAddWarehouseId || visibleWarehouses[0]?.id || ''} onChange={e => setBulkAddWarehouseId(e.target.value)}>

          <div className="confirm-summary">
            <div className="confirm-row"><span className="confirm-label">คลัง</span><span className="confirm-value">{warehouses.find(w => w.id === bulkSyncPreview.warehouseId)?.name || '-'}</span></div>
            <div className="confirm-row"><span className="confirm-label">รายการใหม่ที่จะเพิ่ม</span><span className="confirm-value">{bulkSyncPreview.toAdd.length}</span></div>

            {bulkSyncPreview.protectedTools.length > 0 && (

              {bulkSyncPreview.toDelete.slice(0, 15).map(t => (
                <div key={t.id} className="import-error-row">{t.code} — {t.name}</div>

              {bulkSyncPreview.toDelete.length > 15 && <div className="muted" style={{ fontSize: 11 }}>และอีก {bulkSyncPreview.toDelete.length - 15} รายการ…</div>}
            </div>

          {bulkSyncPreview.protectedTools.length > 0 && (
            <p className="scanner-hint" style={{ marginTop: 8 }}>
              {bulkSyncPreview.protectedTools.length} รายการที่ไม่มีในไฟล์แต่กำลังถูกยืมอยู่ — ระบบจะไม่ลบให้อัตโนมัติ ต้องรอให้คืนก่อนแล้วค่อยลบเองทีหลังถ้ายังต้องการ
            </p>
          )}
          <div className="form-actions" style={{ marginTop: 10 }}>
            <button type="button" className="btn btn-secondary" disabled={bulkAddBusy} onClick={() => setBulkSyncPreview(null)}>ย้อนกลับ</button>
            <button type="button" className="btn btn-danger" style={{ flex: 1, justifyContent: 'center' }} disabled={bulkAddBusy} onClick={confirmBulkSync}>
              {bulkAddBusy ? <Loader2 size={15} className="spin" /> : null} ยืนยันแทนที่ข้อมูล
            </button>
          </div>
        </Modal>
      )}

      {newToolQr && (
        <QrCodeModal value={newToolQr.id} title={`QR เครื่องมือ: ${newToolQr.code}`} subtitle={newToolQr.name} fileName={`QR-${newToolQr.code}`} onClose={() => setNewToolQr(null)} />
      )}

      {photoEditWh && (
        <Modal title={`รูปบริเวณจัดเก็บ: ${photoEditWh.name}`} onClose={() => { setPhotoEditWh(null); setPendingWhPhoto(null); }}>
          <div className="modal-form">
            <div className="shelf-photo-edit-preview">
              {pendingWhPhoto ? (
                <img src={pendingWhPhoto} alt="" className="shelf-photo-edit-img" />
              ) : photoEditWh.hasPhoto ? (
                <ShelfPhotoThumb shelfId={photoEditWh.id} hasPhoto={true} size="full" version={photoEditWh.photoUpdatedAt} keyPrefix="warehouse" />
              ) : (
                <div className="shelf-card-photo-empty" style={{ height: 160 }}><ImageIcon size={28} /><span>ยังไม่มีรูป</span></div>
              )}
            </div>
            <div className="tool-photo-btn-row">
              <button type="button" className="btn btn-secondary" onClick={() => setShowWhCamera(true)}><Camera size={14} /> ถ่ายรูป</button>
              <button type="button" className="btn btn-secondary" onClick={() => whFileInputRef.current?.click()}><ImageIcon size={14} /> เลือกรูป</button>
              <input ref={whFileInputRef} type="file" accept="image/*" style={{ display: 'none' }} onChange={handleWhFilePick} />
            </div>
            <div className="form-actions">
              {pendingWhPhoto ? (
                <button type="button" className="btn btn-secondary" onClick={() => setPendingWhPhoto(null)}>ล้างรูปที่เพิ่งเลือก</button>

                <button type="button" className="btn btn-secondary" onClick={removeWarehousePhoto}>ลบรูปนี้</button>
              )}
              <button type="button" className="btn btn-primary" style={{ flex: 1, justifyContent: 'center' }} disabled={!pendingWhPhoto} onClick={saveWarehousePhoto}>บันทึกรูป</button>

      {showWhCamera && (
        <PhotoCaptureModal
          title="ถ่ายรูปบริเวณจัดเก็บ"
          hint="ถ่ายให้เห็นบริเวณหรือห้องที่เก็บเครื่องมือของคลังนี้"
          onCapture={(dataUrl) => { setPendingWhPhoto(dataUrl); setShowWhCamera(false); }}
          onClose={() => setShowWhCamera(false)} />
      )}
      {deleteConfirmWh && (
        <Modal title="ยืนยันการลบคลังเครื่องมือ" onClose={() => setDeleteConfirmWh(null)}>
          <p className="scanner-hint" style={{ background: 'var(--danger-tint)', color: 'var(--danger)', padding: '10px 12px', borderRadius: 10 }}>
            ต้องการลบคลัง "{deleteConfirmWh.name}" ใช่หรือไม่? การลบนี้ถาวรและย้อนกลับไม่ได้ — ชั้นวางทั้งหมดในคลังนี้จะถูกลบไปด้วย
          </p>
          <div className="form-actions" style={{ marginTop: 10 }}>
            <button type="button" className="btn btn-secondary" onClick={() => setDeleteConfirmWh(null)}>ยกเลิก</button>
            <button type="button" className="btn btn-primary" style={{ background: 'var(--danger)' }}
              onClick={() => { remove(deleteConfirmWh); setDeleteConfirmWh(null); }}>ยืนยันลบคลัง</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ---------------------------- Staff Page ---------------------------- */
function StaffPage({ staff, setStaff, tx, showToast, users, setUsers, addAudit, warehouses, isMainAdmin }) {
  const [q, setQ] = useState('');
  const [modal, setModal] = useState(null);
  const [qrStaff, setQrStaff] = useState(null);
  const [selectMode, setSelectMode] = useState(false);
  const [selectedIds, setSelectedIds] = useState([]);
  const [qrBatchBusy, setQrBatchBusy] = useState(false);
  const filtered = staff.filter(s => s.name.toLowerCase().includes(q.toLowerCase()) || s.code.toLowerCase().includes(q.toLowerCase()));

  function toggleSelected(id) {
    setSelectedIds(ids => ids.includes(id) ? ids.filter(x => x !== id) : [...ids, id]);
  }
  function toggleSelectAllVisible() {
    const visibleIds = filtered.map(s => s.id);
    const allSelected = visibleIds.length > 0 && visibleIds.every(id => selectedIds.includes(id));
    setSelectedIds(allSelected ? selectedIds.filter(id => !visibleIds.includes(id)) : [...new Set([...selectedIds, ...visibleIds])]);
  }

  async function downloadQrLabels(list, label) {
    if (!list.length) return showToast('ไม่มีรายชื่อที่จะสร้าง QR', 'error');
    setQrBatchBusy(true);
    try {
      const items = list.map(s => ({ id: s.id, title: `QR บัตรพนักงาน: ${s.code}`, subtitle: `${s.name} · ${s.dept}` }));
      await generateQrLabelsPDF(items, `QR-พนักงาน-${label}-${todayISO()}.pdf`);
      addAudit?.('staff_export', `พิมพ์ QR พนักงาน${label ? ` (${label})` : ''} (${items.length} คน)`);
      showToast(`สร้างไฟล์ QR สำหรับพิมพ์ (${items.length} คน) เรียบร้อย`, 'success');
    } catch (e) {
      console.error('failed to generate staff QR label sheet', e);
      showToast('สร้างไฟล์ QR ไม่สำเร็จ กรุณาลองใหม่', 'error');
    }
    setQrBatchBusy(false);
  }

  function openAdd() {
    setModal({ mode: 'add', data: { code: '', name: '', dept: DEPT_OPTIONS[0], password: '', confirmPassword: '', signature: '', role: 'staff', adminLevel: 'L1', warehouseScope: [] } });
  }
  function openEdit(s) {
    const linkedUser = users.find(u => u.staffId === s.id);
    setModal({
      mode: 'edit',
      data: {
        ...s, newPassword: '', confirmNewPassword: '', hasAccount: !!linkedUser,
        signature: s.signature || '',
        role: linkedUser?.role || 'staff',
        warehouseScope: linkedUser?.warehouseScope || [],
        // Accounts created before this tier existed default to L2 (unrestricted)
        // so an existing secondary admin's multi-warehouse access isn't
        // silently cut down to one just by opening the edit form.
        adminLevel: 'L1',
      }
    });
  }

  async function save(data) {
    // This page is already hidden from — and bounced for — anyone but the main
    // admin, so reaching here shouldn't be possible. Check anyway: account
    // administration is the one capability that can undo every other limit
    // (whoever can create logins or reset passwords can hand themselves any
    // role), so it gets a guard at the handler and not just at the route.
    if (!isMainAdmin) return showToast('เฉพาะแอดมินหลักเท่านั้นที่จัดการผู้ใช้งานได้', 'error');
    const { _newPhoto, _removePhoto, ...rest } = data;
    const codeTrimmed = rest.code.trim();
    const nameTrimmed = rest.name.trim();
    if (!codeTrimmed || !nameTrimmed) return showToast('กรุณากรอกรหัสและชื่อ', 'error');
    // Defense in depth: only the main "Admin" account may ever grant the admin
    // role or a warehouse scope, no matter what the submitted form data says —
    // StaffForm already hides these controls from everyone else, but a
    // non-main-admin's submission is forced back to a plain staff account here too.
    const requestedRole = (isMainAdmin && rest.role === 'admin') ? 'admin' : 'staff';
    // There is exactly one secondary tier now: L1, the appointed warehouse
    // head. Any older L2 record still in the database is treated as L1 —
    // visibility is identical between the two since the change above, so the
    // distinction no longer means anything.
    const requestedAdminLevel = requestedRole === 'admin' ? 'L1' : undefined;
    const requestedScope = requestedRole === 'admin' ? (rest.warehouseScope || []) : undefined;
    // Defense in depth, same principle as the role check above: both tiers
    // are capped at one warehouse for management no matter what the
    // submitted form data claims — L2's extra capability is read-only
    // visibility elsewhere, not a bigger management scope.
    if (requestedAdminLevel && requestedScope && requestedScope.length > 1) {
      return showToast('หัวหน้าคลังดูแล/จัดการได้แค่คลังเดียวเท่านั้น กรุณาเลือกคลังเดียว', 'error');
    }
    // One appointed head per warehouse. Two admins over the same warehouse
    // means two people who can each undo the other's work with nobody
    // answerable for it — and the borrow/return records would no longer point
    // at a single person responsible for that stock.
    if (requestedRole === 'admin' && requestedScope && requestedScope.length) {
      const targetWh = requestedScope[0];
      const editingStaffId = modal.mode === 'edit' ? rest.id : null;
      const clash = users.find(u => u.role === 'admin' && u.staffId && u.staffId !== editingStaffId
        && (u.warehouseScope || []).includes(targetWh));
      if (clash) {
        const clashStaff = staff.find(x => x.id === clash.staffId);
        const whName = warehouses.find(w => w.id === targetWh)?.name || 'คลังนี้';
        return showToast(`${whName} มีหัวหน้าคลังอยู่แล้ว (${clashStaff?.name || clash.username}) — 1 คลังแต่งตั้งได้ 1 คนเท่านั้น`, 'error');
      }
    }
    const signatureTrimmed = (rest.signature || '').trim();
    if (modal.mode === 'add') {
      if (staff.some(s => s.code.trim().toLowerCase() === codeTrimmed.toLowerCase())) return showToast('รหัสพนักงานนี้มีอยู่แล้ว', 'error');
      // The employee code becomes the login username, so it has to be unique
      // across ACCOUNTS, not just staff records. The staff check above can't
      // see the main admin (it has no staff record), and it can't see any
      // account whose staff record was deleted while the account lingered.
      if (isReservedUsername(codeTrimmed)) {
        return showToast(`รหัส "${MAIN_ADMIN_USERNAME}" สงวนไว้สำหรับบัญชีแอดมินหลักของระบบ กรุณาใช้รหัสอื่น`, 'error');
      }
      if (users.some(u => u.username.trim().toLowerCase() === codeTrimmed.toLowerCase())) {
        return showToast('รหัสนี้ถูกใช้เป็นชื่อผู้ใช้งานของบัญชีอื่นแล้ว', 'error');
      }
      const passErr = passwordComplexityError(rest.password);
      if (passErr) return showToast(passErr, 'error');
      if (rest.password !== rest.confirmPassword) return showToast('รหัสผ่านยืนยันไม่ตรงกัน', 'error');
      // Same principle as tools: QR is tied to the stable internal id, generated once here.
      const newStaff = {
        id: uid('S'), code: codeTrimmed, name: nameTrimmed, dept: rest.dept, signature: signatureTrimmed,
        hasPhoto: !!_newPhoto, ...( _newPhoto ? { photoUpdatedAt: Date.now() } : {}),
      };
      const newUser = {
        id: uid('U'), username: newStaff.code, passwordHash: await hashPassword(rest.password),
        role: requestedRole, staffId: newStaff.id, signature: signatureTrimmed,
        // The admin only ever sets a temporary starting password here — the
        // account is forced to set its own real one on first login, so the
        // password only the admin knows never becomes the person's permanent one.
        mustChangePassword: true,
        ...(requestedAdminLevel ? { adminLevel: requestedAdminLevel } : {}),
        ...(requestedScope !== undefined ? { warehouseScope: requestedScope } : {}),
      };
      try {
        if (_newPhoto) await storageSet(`toolcrib-photo:staff:${newStaff.id}`, _newPhoto, true);
        await setStaff([newStaff, ...staff]);
        await setUsers([newUser, ...users]);
      } catch (err) {
        console.error('failed to save new staff/account', err);
        return showToast('บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่ (บัญชีเข้าระบบอาจยังไม่ถูกสร้าง)', 'error');
      }
      addAudit?.('staff_add', `${newStaff.code} — ${newStaff.name}${requestedRole === 'admin' ? ` (Admin ${requestedAdminLevel} — ดูแล ${requestedScope.length} คลัง)` : ''}`);
      showToast(`เพิ่มผู้ใช้งาน สร้างบัญชีเข้าระบบ และสร้าง QR บัตรเรียบร้อย${requestedRole === 'admin' ? ` (ตั้งเป็น Admin ${requestedAdminLevel} แล้ว)` : ''}`, 'success');
      setModal(null);
      setQrStaff(newStaff);
      return;
    } else {
      // The staff code doubles as the login username, so a duplicate here would
      // make logins ambiguous (login picks the first matching account).
      if (staff.some(s => s.id !== rest.id && s.code.trim().toLowerCase() === codeTrimmed.toLowerCase())) {
        return showToast('รหัสพนักงานนี้มีอยู่แล้วในบัญชีอื่น', 'error');
      }
      // Renaming is the same escalation as creating: the check just below
      // catches it today only because the main admin sits in `users`. Name it
      // explicitly so the block survives any future change to that record.
      if (isReservedUsername(codeTrimmed)) {
        return showToast(`รหัส "${MAIN_ADMIN_USERNAME}" สงวนไว้สำหรับบัญชีแอดมินหลักของระบบ กรุณาใช้รหัสอื่น`, 'error');
      }
      if (users.some(u => u.staffId !== rest.id && u.username.trim().toLowerCase() === codeTrimmed.toLowerCase())) {
        return showToast('รหัสนี้ถูกใช้เป็นชื่อผู้ใช้งานของบัญชีอื่นแล้ว', 'error');
      }
      const prevStaff = staff.find(s => s.id === rest.id);
      const nextHasPhoto = _newPhoto ? true : (_removePhoto ? false : !!prevStaff?.hasPhoto);
      const cleanStaff = {
        id: rest.id, code: codeTrimmed, name: nameTrimmed, dept: rest.dept, signature: signatureTrimmed,
        hasPhoto: nextHasPhoto,
        photoUpdatedAt: (_newPhoto || _removePhoto) ? Date.now() : prevStaff?.photoUpdatedAt,
      };
      const existingUser = users.find(u => u.staffId === rest.id);
      let nextUsers;
      let passwordChanged = false;
      if (existingUser) {
        // username tracks the employee code, so keep it in sync on the linked account.
        // Only the main admin's edit can change role/warehouseScope — for anyone
        // else's edit these two fields are left exactly as they already were on
        // the account, regardless of what the (hidden, for them) form fields say.
        const roleUpdate = isMainAdmin ? {
          role: requestedRole,
          ...(requestedAdminLevel ? { adminLevel: requestedAdminLevel } : { adminLevel: undefined }),
          ...(requestedScope !== undefined ? { warehouseScope: requestedScope } : { warehouseScope: undefined }),
        } : {};
        nextUsers = users.map(u => u.staffId === rest.id ? { ...u, username: cleanStaff.code, signature: signatureTrimmed, ...roleUpdate } : u);
        if (rest.newPassword) {
          const passErr = passwordComplexityError(rest.newPassword);
          if (passErr) return showToast(passErr, 'error');
          if (rest.newPassword !== rest.confirmNewPassword) return showToast('รหัสผ่านยืนยันไม่ตรงกัน', 'error');
          const newHash = await hashPassword(rest.newPassword);
          // Same reasoning as new-account creation: whoever set this password
          // (here, the admin doing the reset) shouldn't be the only one who
          // ever knows it — force a change on the account's next login.
          nextUsers = nextUsers.map(u => u.staffId === rest.id ? { ...u, passwordHash: newHash, failedAttempts: 0, lockedUntil: null, mustChangePassword: true } : u);
          passwordChanged = true;
        }
      } else {
        // This staff record has no linked login account (e.g. left over from an
        // earlier data issue) — create one now instead of silently doing nothing.
        if (!rest.newPassword) {
          return showToast('บัญชีนี้ยังไม่มีรหัสผ่านเข้าระบบ กรุณาตั้งรหัสผ่านเพื่อสร้างบัญชีให้', 'error');
        }
        const passErr = passwordComplexityError(rest.newPassword);
        if (passErr) return showToast(passErr, 'error');
        if (rest.newPassword !== rest.confirmNewPassword) return showToast('รหัสผ่านยืนยันไม่ตรงกัน', 'error');
        const newHash = await hashPassword(rest.newPassword);
        nextUsers = [...users, {
          id: uid('U'), username: cleanStaff.code, passwordHash: newHash, role: requestedRole, staffId: cleanStaff.id,
          signature: signatureTrimmed, mustChangePassword: true, ...(requestedAdminLevel ? { adminLevel: requestedAdminLevel } : {}),
          ...(requestedScope !== undefined ? { warehouseScope: requestedScope } : {}),
        }];
        passwordChanged = true;
      }
      try {
        if (_newPhoto) await storageSet(`toolcrib-photo:staff:${rest.id}`, _newPhoto, true);
        if (_removePhoto) await storageDelete(`toolcrib-photo:staff:${rest.id}`, true);
        await setStaff(staff.map(s => s.id === rest.id ? cleanStaff : s));
        await setUsers(nextUsers);
      } catch (err) {
        console.error('failed to save staff edit', err);
        return showToast('บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
      }
      addAudit?.('staff_edit', `${cleanStaff.code} — ${cleanStaff.name}${passwordChanged ? (existingUser ? ' (แอดมินตั้งรหัสผ่านใหม่ให้)' : ' (สร้างบัญชีเข้าระบบใหม่)') : ''}`);
      showToast(passwordChanged && !existingUser ? 'บันทึกการแก้ไขและสร้างบัญชีเข้าระบบเรียบร้อยแล้ว' : 'บันทึกการแก้ไขเรียบร้อย (QR เดิมยังใช้งานได้)', 'success');
    }
    setModal(null);
  }

  async function remove(s) {
    if (!isMainAdmin) return showToast('เฉพาะแอดมินหลักเท่านั้นที่จัดการผู้ใช้งานได้', 'error');
    const linkedUser = users.find(u => u.staffId === s.id);
    // The main admin has no staff record, so this branch shouldn't be reachable
    // for it today. Guard anyway: it is the only account that can restore
    // anyone else's access, and deleting it would leave the system with no way
    // back in short of editing the database by hand.
    if (linkedUser && isReservedUsername(linkedUser.username)) {
      return showToast('ไม่สามารถลบบัญชีแอดมินหลักของระบบได้', 'error');
    }
    if (linkedUser?.role === 'admin' && !isMainAdmin) {
      return showToast('มีแต่แอดมินหลักเท่านั้นที่ลบบัญชีแอดมินได้', 'error');
    }
    if (tx.some(t => t.staffId === s.id && !t.returnDate)) return showToast('ไม่สามารถลบผู้ใช้งานที่มีเครื่องมือค้างคืนได้', 'error');
    try {
      await setStaff(staff.filter(x => x.id !== s.id));
      await setUsers(users.filter(u => u.staffId !== s.id));
    } catch (err) {
      console.error('failed to delete staff', err);
      return showToast('ลบไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    // Best-effort cleanup — the staff record is already gone, so a hiccup here
    // shouldn't read as "delete failed".
    if (s.hasPhoto) {
      try { await storageDelete(`toolcrib-photo:staff:${s.id}`, true); }
      catch (err) { console.error('failed to clean up deleted staff photo', err); }
    }
    addAudit?.('staff_delete', `${s.code} — ${s.name}`);
    showToast('ลบผู้ใช้งาน ยกเลิกบัญชีเข้าระบบ และ QR บัตรที่ผูกไว้เรียบร้อย', 'success');
  }

  return (
    <div className="page-stack">
      <section className="panel">
        <div className="toolbar">
          <div className="search-box">
            <Search size={16} />
            <input placeholder="ค้นหาชื่อหรือรหัสพนักงาน…" value={q} onChange={e => setQ(e.target.value)} />
          </div>
          <button className="btn btn-secondary" disabled={qrBatchBusy} onClick={() => downloadQrLabels(staff, 'ทั้งหมด')}>
            {qrBatchBusy && !selectMode ? <Loader2 size={16} className="spin" /> : <QrCode size={16} />} ดาวน์โหลด QR ทั้งหมด
          </button>
          <button className={`btn ${selectMode ? 'btn-primary' : 'btn-secondary'}`} onClick={() => { setSelectMode(m => !m); setSelectedIds([]); }}>
            <CheckCircle2 size={16} /> {selectMode ? 'ยกเลิกเลือก' : 'เลือกหลายคน'}
          </button>
          {selectMode && selectedIds.length > 0 && (
            <button className="btn btn-primary" disabled={qrBatchBusy} onClick={() => downloadQrLabels(staff.filter(s => selectedIds.includes(s.id)), `เลือก-${selectedIds.length}-คน`)}>
              {qrBatchBusy ? <Loader2 size={16} className="spin" /> : <Download size={16} />} ดาวน์โหลด QR ที่เลือก ({selectedIds.length})
            </button>
          )}
          {isMainAdmin && <button className="btn btn-primary" onClick={openAdd}><Plus size={16} /> เพิ่มผู้ใช้งาน</button>}
        </div>
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                {selectMode && <th style={{ width: 36 }}><input type="checkbox" checked={filtered.length > 0 && filtered.every(s => selectedIds.includes(s.id))} onChange={toggleSelectAllVisible} /></th>}
                <th>รหัสพนักงาน</th><th>ชื่อ-สกุล</th><th>สังกัด</th><th>บทบาท</th><th>เครื่องมือค้างคืน</th><th>บัญชีเข้าระบบ</th><th></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(s => {
                const open = tx.filter(t => t.staffId === s.id && !t.returnDate).length;
                const linkedUser = users.find(u => u.staffId === s.id);
                const hasAccount = !!linkedUser;
                return (
                  <tr key={s.id}>
                    {selectMode && <td><input type="checkbox" checked={selectedIds.includes(s.id)} onChange={() => toggleSelected(s.id)} /></td>}
                    <td className="mono">{s.code}</td>
                    <td>{s.name}</td>
                    <td>{s.dept}</td>
                    <td>
                      {linkedUser?.role === 'admin' ? (
                        <span className="badge purple" title={linkedUser.warehouseScope?.length ? `ดูแล: ${linkedUser.warehouseScope.map(id => warehouses.find(w => w.id === id)?.name).filter(Boolean).join(', ')}` : 'ยังไม่ได้กำหนดคลังที่ดูแล'}>
                          หัวหน้าคลัง{linkedUser.warehouseScope?.length ? ` — ${warehouses.find(w => w.id === linkedUser.warehouseScope[0])?.name || 'ไม่พบคลัง'}` : ' (ยังไม่ได้กำหนดคลัง)'}
                        </span>
                      ) : <span className="badge steel-badge">พนักงาน</span>}
                    </td>
                    <td>{open > 0 ? <span className="badge warning">{open} รายการ</span> : <span className="badge success">ไม่มี</span>}</td>
                    <td>{hasAccount ? <span className="badge success">ใช้งานได้</span> : <span className="badge danger">ยังล็อกอินไม่ได้</span>}</td>
                    <td className="row-actions">
                      <button className="icon-btn" title="ดู/พิมพ์ QR บัตร" onClick={() => setQrStaff(s)}><QrCode size={15} /></button>
                      {/* Scoped admins keep the QR badge button — that's the job they
                          need this page for — but not the account controls. */}
                      {isMainAdmin && <button className="icon-btn" title="แก้ไข" onClick={() => openEdit(s)}><Pencil size={15} /></button>}
                      {isMainAdmin && <button className="icon-btn danger" title="ลบ" onClick={() => remove(s)}><Trash2 size={15} /></button>}
                    </td>
                  </tr>
                );
              })}
              {!filtered.length && <tr><td colSpan={selectMode ? 8 : 7} className="empty-state">ไม่พบผู้ใช้งานที่ค้นหา</td></tr>}
            </tbody>
          </table>
        </div>
      </section>

      {modal && (
        <Modal title={modal.mode === 'add' ? 'เพิ่มผู้ใช้งานใหม่' : 'แก้ไขผู้ใช้งาน'} onClose={() => setModal(null)}>
          <StaffForm mode={modal.mode} data={modal.data} onSave={save} onCancel={() => setModal(null)} warehouses={warehouses} isMainAdmin={isMainAdmin} />
        </Modal>
      )}

      {qrStaff && (
        <QrCodeModal
          value={qrStaff.id}
          title={`QR บัตรพนักงาน: ${qrStaff.code}`}
          subtitle={`${qrStaff.name} · ${qrStaff.dept}`}
          fileName={`QR-${qrStaff.code}`}
          onClose={() => setQrStaff(null)}
        />
      )}
    </div>
  );
}

function StaffForm({ mode, data, onSave, onCancel, warehouses, isMainAdmin }) {
  const [form, setForm] = useState(data);
  const isAdminRole = form.role === 'admin';
  // Transient photo state (same pattern as ToolForm) — StaffPage.save() reads
  // these off the submitted object and turns them into the actual storage
  // write plus the hasPhoto flag.
  const [newPhoto, setNewPhoto] = useState(null);
  const [removePhoto, setRemovePhoto] = useState(false);
  const [showCamera, setShowCamera] = useState(false);
  const [photoError, setPhotoError] = useState('');
  const photoFileRef = React.useRef(null);
  const showingExistingPhoto = !newPhoto && !removePhoto && form.hasPhoto;

  function pickStaffPhoto(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setPhotoError('');
    const objectUrl = URL.createObjectURL(file);
    const img = new Image();
    img.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      setPhotoError('เบราว์เซอร์นี้แสดงตัวอย่างไฟล์รูปนี้ไม่ได้ (มักเกิดกับไฟล์ HEIC บางไฟล์) ลองกด "ถ่ายรูป" แทน หรือเลือกรูปที่เป็น JPG/PNG');
    };
    img.onload = () => {
      try {
        // Square crop from the center — this is shown as a small circular
        // avatar, so a square source keeps faces centered instead of squashed.
        // Kept at its own (smaller) size rather than PHOTO_MAX_DIMENSION since
        // an avatar is never displayed large — same JPEG quality as every
        // other photo type in the app, just a different crop/geometry.
        const size = 320;
        const side = Math.min(img.width, img.height);
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        canvas.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
        setNewPhoto(canvas.toDataURL('image/jpeg', PHOTO_JPEG_QUALITY));
        setRemovePhoto(false);
      } catch (err) {
        console.error('failed to process staff photo', err);
        setPhotoError('ประมวลผลรูปนี้ไม่สำเร็จ ลองเลือกรูปอื่น หรือถ่ายรูปใหม่แทน');
      } finally {
        URL.revokeObjectURL(objectUrl);
      }
    };
    img.src = objectUrl;
  }

  function toggleWarehouse(id) {
    setForm(f => {
      const current = f.warehouseScope || [];
      // Both L1 and L2 manage exactly one "home" warehouse — L2's extra
      // capability is read-only visibility into other warehouses (handled
      // separately below, not by widening this list), so picking a new one
      // always swaps it in here rather than adding a second.
      return { ...f, warehouseScope: current.includes(id) ? [] : [id] };
    });
  }
  return (
    <>
    <form onSubmit={e => { e.preventDefault(); onSave({ ...form, _newPhoto: newPhoto, _removePhoto: removePhoto }); }} className="modal-form">
      <div className="form-group">
        <label>รูปพนักงาน</label>
        <div className="tool-photo-row">
          {newPhoto ? (
            <img src={newPhoto} alt="" className="staff-photo-preview" />
          ) : showingExistingPhoto ? (
            <StaffPhotoThumb staffId={form.id} hasPhoto={true} size={64} version={form.photoUpdatedAt} />
          ) : (
            <div className="staff-photo-preview-empty"><UserCircle2 size={26} /></div>
          )}
          <div className="tool-photo-actions">
            <div className="tool-photo-btn-row">
              <button type="button" className="btn btn-secondary" onClick={() => setShowCamera(true)}><Camera size={14} /> ถ่ายรูป</button>
              <button type="button" className="btn btn-secondary" onClick={() => photoFileRef.current?.click()}><ImageIcon size={14} /> เลือกรูป</button>
            </div>
            {(newPhoto || showingExistingPhoto) && (
              newPhoto
                ? <button type="button" className="link-btn" onClick={() => setNewPhoto(null)}>ล้างรูปที่เพิ่งเลือก</button>
                : <button type="button" className="link-btn" onClick={() => setRemovePhoto(true)}>ลบรูปนี้</button>
            )}
            <input ref={photoFileRef} type="file" accept="image/*" style={{ display: 'none' }} onChange={pickStaffPhoto} />
            {photoError && <p className="hint bad" style={{ margin: '2px 0 0' }}>{photoError}</p>}
          </div>
        </div>
        <p className="muted" style={{ fontSize: 11.5, margin: '6px 0 0' }}>
          รูปนี้จะแสดงที่มุมขวาบนของหน้าจอเมื่อผู้ใช้คนนี้เข้าสู่ระบบ
        </p>
      </div>
      <div className="form-group">
        <label>รหัสพนักงาน (ใช้เป็นชื่อผู้ใช้งานเข้าระบบด้วย)</label>
        <input className="mono" value={form.code} onChange={e => setForm({ ...form, code: e.target.value })} placeholder="เช่น EMP-1005" />
      </div>
      <div className="form-group">
        <label>ชื่อ-สกุล</label>
        <input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="เช่น สมหญิง รักงาน" />
      </div>
      <div className="form-group">
        <label>สังกัด</label>
        <select value={form.dept || ''} onChange={e => setForm({ ...form, dept: e.target.value })}>
          <option value="">เลือกสังกัด</option>
          {DEPT_OPTIONS.map(d => <option key={d} value={d}>{d}</option>)}
          {/* Staff saved before this list existed may hold an older short code
              (e.g. "ELE"); keep it selectable so editing them doesn't silently
              wipe their department. */}
          {form.dept && !DEPT_OPTIONS.includes(form.dept) && <option value={form.dept}>{form.dept} (ค่าเดิม)</option>}
        </select>
      </div>
      <div className="form-group">
        <label>ลายเซ็น (สำหรับใบยืม-คืน LBC-FM-034)</label>
        <input value={form.signature || ''} onChange={e => setForm({ ...form, signature: e.target.value })} placeholder="เช่น SUPHOT.B" />
        <p className="muted" style={{ fontSize: 11.5, margin: '4px 0 0' }}>
          จะถูกใช้เติมช่อง "Loan to (Mechanic)" ให้อัตโนมัติทุกครั้งที่คนนี้ยืมเครื่องมือ
        </p>
      </div>

      {isMainAdmin && (
        <>
          <div className="loan-doc-section-title">สิทธิ์การใช้งาน</div>
          <div className="form-group">
            <label>บทบาท</label>
            <div className="wh-switch">
              <button type="button" className={`wh-switch-item ${!isAdminRole ? 'active' : ''}`} onClick={() => setForm({ ...form, role: 'staff' })}>พนักงาน</button>
              <button type="button" className={`wh-switch-item ${isAdminRole ? 'active' : ''}`}
                onClick={() => setForm(f => ({ ...f, role: 'admin', adminLevel: 'L1', warehouseScope: (f.warehouseScope || []).slice(0, 1) }))}>Admin L1 (หัวหน้าคลัง)</button>
            </div>
            <p className="muted" style={{ fontSize: 11.5, margin: '4px 0 0' }}>
              เฉพาะแอดมินหลัก (Admin) เท่านั้นที่แต่งตั้ง <b>หัวหน้าคลัง</b> ได้ — หัวหน้าคลังบริหารจัดการเครื่องมือของคลังตัวเองได้ทุกอย่าง
              ส่วนคลังอื่นเห็นได้แต่จัดการไม่ได้ <b>1 คลังแต่งตั้งได้ 1 คนเท่านั้น</b>
            </p>
          </div>
          {isAdminRole && (
            <div className="form-group">
              <label>คลังที่ดูแล (เลือกได้คลังเดียว)</label>
              {warehouses && warehouses.length ? (
                <div className="shelf-pick-list">
                  {warehouses.map(w => (
                    <label key={w.id} className={`shelf-pick-row ${(form.warehouseScope || []).includes(w.id) ? 'checked' : ''}`}>
                      <input type="radio" checked={(form.warehouseScope || []).includes(w.id)} onChange={() => toggleWarehouse(w.id)} />
                      <span>{w.name}</span>
                    </label>
                  ))}
                </div>
              ) : (
                <div className="hint bad">ยังไม่มีคลังเครื่องมือในระบบ</div>
              )}
              <p className="muted" style={{ fontSize: 11.5, margin: '4px 0 0' }}>
                {(form.warehouseScope || []).length === 0
                  ? '⚠️ ยังไม่ได้เลือกคลังใด — หัวหน้าคลังคนนี้จะยังจัดการคลังไหนไม่ได้เลยจนกว่าจะเลือก'
                  : 'จะจัดการได้เฉพาะคลังนี้ ส่วนคลังอื่นดูรายการ รูปภาพ และ QR ได้ แต่แก้ไขไม่ได้'}
              </p>
            </div>
          )}
        </>
      )}

      {mode === 'add' ? (
        <>
          <div className="form-group">
            <label>ตั้งรหัสผ่านเข้าใช้งาน</label>
            <input type="password" value={form.password} onChange={e => setForm({ ...form, password: e.target.value })} placeholder="อย่างน้อย 4 ตัวอักษร" />
          </div>
          <div className="form-group">
            <label>ยืนยันรหัสผ่าน</label>
            <input type="password" value={form.confirmPassword} onChange={e => setForm({ ...form, confirmPassword: e.target.value })} />
          </div>
        </>
      ) : (
        <div className="reset-pw-block">
          {data.hasAccount === false && (
            <div className="hint bad" style={{ marginBottom: 2 }}>
              ⚠️ บัญชีนี้ยังไม่มีรหัสผ่านเข้าระบบ (ล็อกอินไม่ได้) — กรุณาตั้งรหัสผ่านด้านล่างเพื่อสร้างบัญชีให้
            </div>
          )}
          <div className="reset-pw-title">
            {data.hasAccount === false ? 'ตั้งรหัสผ่านเข้าใช้งาน (จำเป็น)' : 'ตั้งรหัสผ่านใหม่ (เว้นว่างถ้าไม่ต้องการเปลี่ยน)'}
          </div>
          <div className="form-group">
            <input type="password" value={form.newPassword} onChange={e => setForm({ ...form, newPassword: e.target.value })} placeholder="รหัสผ่านใหม่" />
          </div>
          <div className="form-group">
            <input type="password" value={form.confirmNewPassword} onChange={e => setForm({ ...form, confirmNewPassword: e.target.value })} placeholder="ยืนยันรหัสผ่านใหม่" />
          </div>
        </div>
      )}

      <div className="form-actions">
        <button type="button" className="btn btn-secondary" onClick={onCancel}>ยกเลิก</button>
        <button type="submit" className="btn btn-primary">บันทึก</button>
      </div>
    </form>
    {showCamera && (
      <PhotoCaptureModal
        title="ถ่ายรูปพนักงาน"
        hint="จัดให้เห็นใบหน้าชัดเจนกลางกรอบ แล้วกดถ่ายรูป"
        onCapture={(dataUrl) => { setNewPhoto(dataUrl); setRemovePhoto(false); setPhotoError(''); setShowCamera(false); }}
        onClose={() => setShowCamera(false)}
      />
    )}
    </>
  );
}

// Fetches and shows a staff member's registered photo — same fetch-on-demand
// pattern as ToolPhotoThumb/ShelfPhotoThumb, with its own storage-key
// namespace so staff photos never collide with tool or shelf photos.
function StaffPhotoThumb({ staffId, hasPhoto, size, version }) {
  const [src, setSrc] = useState(null);
  const [state, setState] = useState(hasPhoto ? 'loading' : 'empty');
  useEffect(() => {
    let cancelled = false;
    if (!hasPhoto) { setSrc(null); setState('empty'); return; }
    setState('loading');
    (async () => {
      const value = await storageGet(`toolcrib-photo:staff:${staffId}`, true);
      if (cancelled) return;
      if (value) { setSrc(value); setState('ok'); } else setState('empty');
    })();
    return () => { cancelled = true; };
  }, [staffId, hasPhoto, version]);

  const px = size || 40;
  const style = { width: px, height: px };
  if (state === 'ok') return <img src={src} alt="" className="staff-photo-avatar" style={style} />;
  if (state === 'loading') return <div className="staff-photo-avatar-empty" style={style}><Loader2 className="spin" size={Math.round(px * 0.45)} /></div>;
  return <div className="staff-photo-avatar-empty" style={style}><UserCircle2 size={Math.round(px * 0.6)} /></div>;
}

/* ---------------------------- QR Code display / download ---------------------------- */
function QrCodeModal({ value, title, subtitle, fileName, onClose }) {
  const holderRef = React.useRef(null);
  const cardCaptureRef = React.useRef(null);
  const [ready, setReady] = useState(false);
  const [failed, setFailed] = useState(false);

  useEffect(() => {
    let cancelled = false;
    ensureQRCodeLib().then(() => {
      if (cancelled || !holderRef.current || !window.QRCode) return;
      holderRef.current.innerHTML = '';
      try {
        new window.QRCode(holderRef.current, {
          text: value, width: 220, height: 220,
          colorDark: '#1F2A37', colorLight: '#FFFFFF',
          correctLevel: window.QRCode.CorrectLevel.M
        });
        setReady(true);
      } catch (e) { setFailed(true); }
    }).catch(() => { if (!cancelled) setFailed(true); });
    return () => { cancelled = true; };
  }, [value]);

  async function download() {
    const node = cardCaptureRef.current;
    if (!node) return;
    const filename = `${fileName || 'qrcode'}.png`;
    try {
      await ensureHtml2Canvas();
      if (document.fonts?.ready) { try { await document.fonts.ready; } catch (e) { /* non-fatal */ } }
      const canvas = await window.html2canvas(node, { scale: 3, backgroundColor: '#ffffff' });
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      if (!blob) return;
      // Same reliability chain as the full-backup download: the native share
      // sheet (works well for "Save Image" on iOS/iPadOS Safari, where a
      // plain data: URI anchor download is known to be unreliable — the
      // confirmation dialog appears but the file often never actually saves)
      // first, falling back to a Blob URL anchor everywhere else.
      if (navigator.canShare && navigator.canShare({ files: [new File([blob], filename, { type: 'image/png' })] })) {
        try {
          await navigator.share({ files: [new File([blob], filename, { type: 'image/png' })], title: filename });
          return;
        } catch (err) {
          if (err?.name === 'AbortError') return; // person cancelled the share sheet — not an error
          // fall through to the anchor-download path below on any other failure
        }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    } catch (err) {
      console.error('failed to download QR image', err);
    }
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card scanner-card" onClick={e => e.stopPropagation()} style={{ position: 'relative' }}>
        <button className="icon-btn" onClick={onClose} style={{ position: 'absolute', top: 18, right: 18, zIndex: 1 }}><X size={18} /></button>
        <div ref={cardCaptureRef} className="qr-export-card">
          <div className="modal-head" style={{ marginBottom: 14 }}>
            <h3><QrCode size={17} /> {title}</h3>
          </div>

          <div className="qr-display">
            <div ref={holderRef} className="qr-canvas-holder" />
            {!ready && !failed && <div className="qr-loading"><Loader2 className="spin" size={20} /></div>}
            {failed && <div className="qr-loading">ไม่สามารถโหลดตัวสร้าง QR ได้ ลองใหม่อีกครั้ง</div>}
          </div>
          {subtitle && <p className="scanner-hint" style={{ marginBottom: 4 }}>{subtitle}</p>}
          <p className="qr-code-value mono">{value}</p>
        </div>
        <p className="scanner-hint">QR นี้ผูกกับรายการนี้ถาวร แก้ไขข้อมูลภายหลังจะไม่เปลี่ยน QR — จะเปลี่ยนก็ต่อเมื่อมีการลบรายการเท่านั้น</p>
        {ready && navigator.canShare && <p className="scanner-hint">กดดาวน์โหลดแล้วเลือก "บันทึกรูปภาพ" จากเมนูแชร์ที่เปิดขึ้นมา</p>}
        <div className="form-actions" style={{ marginTop: 4 }}>
          <button type="button" className="btn btn-secondary" onClick={onClose}>ปิด</button>
          <button type="button" className="btn btn-primary" onClick={download} disabled={!ready}><Download size={15} /> ดาวน์โหลด PNG</button>
        </div>
      </div>
    </div>
  );
}
