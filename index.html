  // Borrow/return history for THIS warehouse only. Gated on canManageActive
  // rather than left open like the tool list above: a tool list is just stock,
  // but this names who borrowed what and when, so it stays with the person
  // answerable for the warehouse (and with the main admin, who passes the
  // check everywhere).
  function downloadWarehouseHistoryExcel() {
    if (!activeWarehouse) return;
    const whToolIds = new Set(whTools.map(t => t.id));
    const rows = (tx || []).filter(t => whToolIds.has(t.toolId)).map(t => {
      const tool = whTools.find(x => x.id === t.toolId);
      const st = (staff || []).find(x => x.id === t.staffId);
      const returnedBy = t.returnedBy ? (staff || []).find(x => x.id === t.returnedBy) : null;
      return {
        รหัสเครื่องมือ: tool?.code || '-', ชื่อเครื่องมือ: tool?.name || '-',
        ผู้ยืม: st?.name || '-', รหัสพนักงาน: st?.code || '-', สังกัด: st?.dept || '-',
        'วันเวลาที่ยืม': fmtThaiDateTime(t.borrowDate), กำหนดคืน: fmtThaiDate(t.dueDate),
        'วันเวลาที่คืน': t.returnDate ? fmtThaiDateTime(t.returnDate) : 'ยังไม่คืน',
        ผู้บันทึกการคืน: returnedBy ? returnedBy.name : '-',
        สถานะ: t.returnDate ? 'คืนแล้ว' : (t.dueDate < todayISO() ? 'เกินกำหนดคืน' : 'อยู่ระหว่างยืม'),
      };
    });
    if (!rows.length) return showToast('คลังนี้ยังไม่มีประวัติยืม-คืน', 'error');
    const wb = XLSX.utils.book_new();
    wb.SheetNames.push('ประวัติยืม-คืน');
    wb.Sheets['ประวัติยืม-คืน'] = XLSX.utils.json_to_sheet(rows);
    XLSX.writeFile(wb, `ประวัติยืม-คืน-${activeWarehouse.name}-${todayISO()}.xlsx`);
    addAudit?.('tools_export', `ประวัติยืม-คืน คลัง ${activeWarehouse.name} (${rows.length} รายการ)`);
  }

  async function handleUpload(e) {
    const file = e.target.files?.[0];
    if (!file || !activeWarehouse) return;
    setBusy(true);
    try {
      const buf = await file.arrayBuffer();
      const wbFile = XLSX.read(buf, { type: 'array' });
      const sheetName = wbFile.SheetNames.includes('รายการเครื่องมือ') ? 'รายการเครื่องมือ' : wbFile.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wbFile.Sheets[sheetName], { defval: '' });
      const toAdd = [], toUpdate = [];
      let skipped = 0, shelfNotFound = 0, shelfFull = 0;
      // Rows rejected because the tool they'd overwrite is not sitting on the
      // shelf right now. A borrowed / overdue / damaged / calibration tool has
      // live records pointing at it (an open loan, a repair ticket), and a
      // spreadsheet round-trip is exactly where a stale row quietly renames or
      // recategorises it out from under those records. The tool has to be back
      // and available before the file can touch it.
      const lockedRows = [];
      const importStatusLabel = { borrowed: 'ถูกยืมอยู่', overdue: 'เกินกำหนดคืน', damaged: 'ชำรุด/ส่งซ่อม', calibration: 'ส่ง Calibration' };
      // Codes already claimed by an earlier row of THIS file — otherwise a file
      // listing the same code twice would create two tools sharing a code.
      const seenInFile = new Set();
      // "ชั้นวาง" is optional — matched by name (trim + case-insensitive) against
      // this warehouse's existing shelves only; it never creates a new shelf,
      // since a typo would otherwise silently spawn a stray shelf. Running
      // counts start from each shelf's CURRENT occupancy and accumulate across
      // the whole file, so a big batch aimed at one shelf can't blow past its
      // 100-item cap even though nothing has been saved yet to check against.
      const shelfCounts = new Map(whShelves.map(s => [s.id, tools.filter(t => t.shelfId === s.id).length]));
      const shelfByName = new Map(whShelves.map(s => [s.name.trim().toLowerCase(), s]));
      rows.forEach(r => {
        const code = normalizeCode(String(r['รหัสเครื่องมือ'] || '').trim());
        const name = String(r['ชื่อเครื่องมือ'] || '').trim();
        if (!code || !name) { skipped++; return; }
        const key = code.toLowerCase();
        if (seenInFile.has(key)) { skipped++; return; }
        seenInFile.add(key);
        const catLabel = String(r['หมวดหมู่'] || '').trim();
        const matchedCat = CATEGORIES.find(c => c.label === catLabel);
        const existing = tools.find(t => t.code.toLowerCase() === key);
        // A code that already belongs to a tool in a DIFFERENT warehouse is left
        // alone rather than silently relocated here — this importer is scoped to
        // one warehouse, and moving a tool across warehouses needs to be a
        // deliberate action (edit the tool directly), not a side-effect of
        // uploading this warehouse's list.
        if (existing && existing.warehouseId !== activeWh) { skipped++; return; }

        // Bail out on a locked tool BEFORE the shelf block below, not after:
        // that block increments a running per-shelf occupancy count, and a row
        // that gets rejected here must not consume a slot a later, legitimate
        // row needs — otherwise a file with several borrowed items could push
        // valid rows into a false "shelf full".
        if (existing) {
          const st = toolStatus(existing.id);
          if (st !== 'available') {
            lockedRows.push(`${existing.code} — ${existing.name} (${importStatusLabel[st] || st})`);
            return;
          }
        }

        const shelfNameCell = String(r['ชั้นวาง'] || '').trim();
        let shelfId = existing ? existing.shelfId : null;
        if (shelfNameCell && shelfNameCell !== 'ยังไม่จัดชั้น') {
          const shelf = shelfByName.get(shelfNameCell.toLowerCase());
          if (!shelf) { shelfNotFound++; }
          else if ((shelfCounts.get(shelf.id) || 0) >= SHELF_CAPACITY) { shelfFull++; }
          else { shelfId = shelf.id; shelfCounts.set(shelf.id, (shelfCounts.get(shelf.id) || 0) + 1); }
        }

        if (existing) {
          toUpdate.push({ id: existing.id, code, name, category: matchedCat?.id || existing.category, shelfId });
        } else {
          // Brand-new code: nothing in the system to damage, so it goes straight in.
          toAdd.push({ code, name, category: matchedCat?.id || 'other', shelfId });
        }
      });
      const updateMap = new Map(toUpdate.map(e => [e.id, e]));
      const nextTools = [
        ...tools.map(t => updateMap.has(t.id) ? { ...t, code: updateMap.get(t.id).code, name: updateMap.get(t.id).name, category: updateMap.get(t.id).category, shelfId: updateMap.get(t.id).shelfId } : t),
        ...toAdd.map(a => ({ id: uid('T'), code: a.code, name: a.name, category: a.category, warehouseId: activeWh, shelfId: a.shelfId })),
      ];
      await setTools(nextTools);
      const shelfWarnings = shelfNotFound || shelfFull
        ? ` (ไม่พบชั้น ${shelfNotFound} รายการ, ชั้นเต็ม ${shelfFull} รายการ — เข้าเป็นยังไม่จัดชั้นแทน)` : '';
      addAudit?.('warehouse_import', `${activeWarehouse.name}: นำเข้าเพิ่ม ${toAdd.length}, อัปเดต ${toUpdate.length}, ข้าม ${skipped}${lockedRows.length ? `, ไม่อัปเดตเพราะไม่ได้อยู่สถานะพร้อมใช้งาน ${lockedRows.length}` : ''}${shelfWarnings}`);
      showToast(`นำเข้าเรียบร้อย (เพิ่ม ${toAdd.length}, อัปเดต ${toUpdate.length}${skipped ? `, ข้าม ${skipped}` : ''})${shelfWarnings}`, 'success');
      // Reported separately and last so it doesn't get lost inside the success
      // line — these rows are the ones the person will wonder about later.
      if (lockedRows.length) {
        setLockedImportRows(lockedRows);
      }
    } catch (err) {
      console.error('failed to import warehouse tool list', err);
      showToast('อ่านไฟล์ไม่สำเร็จ กรุณาตรวจสอบว่าเป็นไฟล์ Excel ที่ถูกต้อง', 'error');
    }
    setBusy(false);
    if (fileInputRef.current) fileInputRef.current.value = '';
  }

  function resizeShelfPhoto(file, cb, onError) {
    resizeImageFileToStandardPhoto(file, cb, onError);
  }

  function handleShelfFilePick(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    resizeShelfPhoto(file, (dataUrl) => setPendingShelfPhoto(dataUrl), () => showToast('เบราว์เซอร์นี้แสดงตัวอย่างไฟล์รูปนี้ไม่ได้ (มักเกิดกับไฟล์ HEIC บางไฟล์) ลองกด "ถ่ายรูป" แทน หรือเลือกรูปที่เป็น JPG/PNG', 'error'));
  }

  async function saveShelfPhoto() {
    if (!photoEditShelf || !pendingShelfPhoto) return;
    try {
      await storageSet(`toolcrib-photo:shelf:${photoEditShelf.id}`, pendingShelfPhoto, true);
      await setShelves(shelves.map(s => s.id === photoEditShelf.id ? { ...s, hasPhoto: true, photoUpdatedAt: Date.now() } : s));
      showToast('บันทึกรูปชั้นวางแล้ว', 'success');
    } catch (err) {
      console.error('failed to save shelf photo', err);
      showToast('บันทึกรูปไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    setPendingShelfPhoto(null);
    setPhotoEditShelf(null);
  }

  async function removeShelfPhoto() {
    if (!photoEditShelf) return;
    try {
      await storageDelete(`toolcrib-photo:shelf:${photoEditShelf.id}`, true);
      await setShelves(shelves.map(s => s.id === photoEditShelf.id ? { ...s, hasPhoto: false, photoUpdatedAt: Date.now() } : s));
      showToast('ลบรูปชั้นวางแล้ว', 'success');
    } catch (err) {
      console.error('failed to remove shelf photo', err);
      showToast('ลบรูปไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    setPendingShelfPhoto(null);
    setPhotoEditShelf(null);
  }

  return (
    <section className="panel">
      <div className="toolbar" style={{ marginBottom: 12 }}>
        <div className="panel-head" style={{ margin: 0, flex: 1 }}>
          <h2>Shadow Board — ผังเครื่องมือ</h2>
        </div>
        {canManageActive && onAddTool && (
          <button className="btn btn-secondary" onClick={onAddTool} disabled={!visibleWarehouses.length}
            title={visibleWarehouses.length ? '' : 'คุณยังไม่ได้รับสิทธิ์ดูแลคลังใด กรุณาติดต่อแอดมินหลัก'}>
            <Wrench size={16} /> เพิ่มเครื่องมือใหม่
          </button>
        )}
      </div>

      {visibleWarehouses.length > 1 && (
        <div className="wh-switch" style={{ marginBottom: 14 }}>
          {visibleWarehouses.map(w => (
            <button key={w.id} type="button" className={`wh-switch-item ${activeWh === w.id ? 'active' : ''}`} onClick={() => setActiveWh(w.id)}>
              {w.name}
            </button>
          ))}
        </div>
      )}

      {!activeWarehouse ? (
        <div className="empty-state">
          {visibleWarehouses.length ? 'ยังไม่มีคลังเครื่องมือในระบบ' : 'คุณยังไม่ได้รับสิทธิ์ดูแลคลังใด กรุณาติดต่อแอดมินหลัก'}
        </div>
      ) : (
        <>
          {/* Labels are wrapped so the phone stylesheet can drop them and leave
              a row of icon buttons. `title` carries the same wording for anyone
              who long-presses or uses a screen reader, and each icon is
              distinct: sheet = tool list, clock = borrow history, up-arrow =
              upload. "เพิ่มชั้นวาง" keeps its label — it is the only one whose
              icon (a plus) says nothing about what gets added. */}
          <div className="shelfboard-toolbar">
            {canManageActive && (
              <button className="btn btn-secondary" type="button" onClick={addShelf}>
                <Plus size={15} /> <span className="btn-label keep-label">เพิ่มชั้นวาง</span>
              </button>
            )}
            <button className="btn btn-secondary" type="button" title="ดาวน์โหลดรายการเครื่องมือของคลังนี้" onClick={downloadWarehouseExcel}>
              <FileSpreadsheet size={15} /> <span className="btn-label">ดาวน์โหลดรายการ (คลังนี้)</span>
            </button>
            {canManageActive && (
              <button className="btn btn-secondary" type="button" title="ดาวน์โหลดประวัติยืม-คืนของคลังนี้" onClick={downloadWarehouseHistoryExcel}>
                <History size={15} /> <span className="btn-label">ดาวน์โหลดประวัติยืม-คืน (คลังนี้)</span>
              </button>
            )}
            {canManageActive && (
              <>
                <button className="btn btn-secondary" type="button" title="อัปโหลดไฟล์รายการเครื่องมือของคลังนี้" disabled={busy} onClick={() => fileInputRef.current?.click()}>
                  {busy ? <Loader2 size={15} className="spin" /> : <Upload size={15} />} <span className="btn-label">อัปโหลดรายการ (คลังนี้)</span>
                </button>
                <input ref={fileInputRef} type="file" accept=".xlsx,.xls" style={{ display: 'none' }} onChange={handleUpload} />
              </>
            )}
          </div>
          {canManageActive && (
            <p className="muted import-hint" style={{ fontSize: 11.5, margin: '-8px 0 12px' }}>
              คอลัมน์ที่ต้องมี: "รหัสเครื่องมือ", "ชื่อเครื่องมือ" · เพิ่ม "ชั้นวาง" (ชื่อต้องตรงกับชั้นในคลังนี้) เพื่อจัดเข้าชั้นอัตโนมัติ

          )}

          {whShelves.length === 0 ? (
            <div className="empty-state">
              ยังไม่มีชั้นวางในคลังนี้{canManageActive ? ' — กด "เพิ่มชั้นวาง" ด้านบนเพื่อเริ่มจำลองตู้เครื่องมือ' : ''}
            </div>
          ) : (
            <div className="shelf-card-grid">
              {whShelves.map(shelf => {
                const shelfTools = whTools.filter(t => t.shelfId === shelf.id);
                return (
                  <div key={shelf.id} className="shelf-card">
                    <div className="shelf-card-photo" onClick={() => setDetailShelf(shelf)} role="button" tabIndex={0}>
                      {shelf.hasPhoto ? (
                        <ShelfPhotoThumb shelfId={shelf.id} hasPhoto={true} version={shelf.photoUpdatedAt} />
                      ) : (
                        <div className="shelf-card-photo-empty">
                          <ImageIcon size={26} />
                          <span>ยังไม่มีรูป</span>
                        </div>
                      )}
                      {canManageActive && (
                        <button type="button" className="shelf-card-photo-edit-btn" title="เพิ่ม/เปลี่ยนรูปชั้นนี้"
                          onClick={(e) => { e.stopPropagation(); setPhotoEditShelf(shelf); }}>
                          <Camera size={14} />
                        </button>
                      )}
                    </div>
                    <div className="shelf-card-body">
                      {renamingId === shelf.id ? (
                        <input autoFocus className="shelf-rename-input" value={renameValue}
                          onChange={e => setRenameValue(e.target.value)}
                          onBlur={() => saveRename(shelf)}
                          onKeyDown={e => { if (e.key === 'Enter') saveRename(shelf); if (e.key === 'Escape') setRenamingId(null); }} />
                      ) : (
                        <div className="shelf-name" onClick={() => canManageActive && (setRenamingId(shelf.id), setRenameValue(shelf.name))}>
                          <Layers size={15} /> {shelf.name}
                          <span className="muted" style={{ fontWeight: 400, fontSize: 12 }}>({shelfTools.length}/{SHELF_CAPACITY})</span>
                        </div>
                      )}
                      {canManageActive && (
                        <div className="shelf-card-actions">
                          <button className="btn btn-secondary shelf-add-tool-btn" onClick={() => setPickerShelf(shelf)}><Plus size={14} /> เพิ่มเครื่องมือ</button>
                          <button className="icon-btn danger" title="ลบชั้นวางนี้" onClick={() => removeShelf(shelf)}><Trash2 size={15} /></button>
                        </div>
                      )}
                    </div>

// Full-size view of a tool's registered photo (set at registration, distinct
// from per-transaction borrow/return evidence photos) — opened from the
// shelf detail list's "ดูรูป" button.
function ToolPhotoViewModal({ tool, onClose }) {
  const [src, setSrc] = useState(null);
  const [state, setState] = useState('loading'); // loading | ok | empty
  useEffect(() => {
    let cancelled = false;
    (async () => {
      const value = await storageGet(`toolcrib-photo:master:${tool.id}`, true);
      if (cancelled) return;
      if (value) { setSrc(value); setState('ok'); } else setState('empty');
    })();
    return () => { cancelled = true; };
  }, [tool.id]);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card scanner-card" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h3><ImageIcon size={17} /> รูปเครื่องมือ: {tool.code}</h3>
          <button className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="evidence-viewport">
          {state === 'loading' && <div className="scanner-overlay-msg" style={{ position: 'static', color: 'var(--ink-soft)' }}><Loader2 className="spin" size={20} /><span>กำลังโหลดรูป…</span></div>}
          {state === 'empty' && <div className="scanner-overlay-msg" style={{ position: 'static', color: 'var(--ink-soft)' }}><VideoOff size={20} /><span>ไม่พบรูปที่บันทึกไว้</span></div>}
          {state === 'ok' && <img src={src} alt={tool.name} className="evidence-img" />}
        </div>
        <p className="scanner-hint">{tool.name}</p>
      </div>
    </div>
  );
}


// editor above) — same fetch-on-demand pattern as ToolPhotoThumb, just a
// different storage key namespace so shelf photos and tool photos never collide.
// keyPrefix lets the same component serve shelf photos and warehouse-area
// photos — identical loading/placeholder behaviour, separate key namespaces.
function ShelfPhotoThumb({ shelfId, hasPhoto, size, version, keyPrefix = 'shelf' }) {
  const [src, setSrc] = useState(null);
  const [state, setState] = useState(hasPhoto ? 'loading' : 'empty');
  useEffect(() => {
    let cancelled = false;
    if (!hasPhoto) { setSrc(null); setState('empty'); return; }
    setState('loading');
    (async () => {
      const value = await storageGet(`toolcrib-photo:${keyPrefix}:${shelfId}`, true);
      if (cancelled) return;
      if (value) { setSrc(value); setState('ok'); } else setState('empty');
    })();
    return () => { cancelled = true; };
  }, [shelfId, hasPhoto, version, keyPrefix]);

  if (state === 'ok') return <img src={src} alt="" className={size === 'full' ? 'shelf-photo-edit-img' : 'shelf-card-photo-img'} />;
  if (state === 'loading') return <div className="shelf-card-photo-empty"><Loader2 className="spin" size={22} /></div>;
  return <div className="shelf-card-photo-empty"><ImageIcon size={26} /><span>ยังไม่มีรูป</span></div>;
}

// Small inline QR popover anchored to a single shelf slot — opened/closed by
// clicking the same icon again (toggle), and dismissed on an outside click/tap.
function ShelfAssignModal({ shelf, tools, onSave, onClose }) {
  const [query, setQuery] = useState('');
  const [selected, setSelected] = useState([]);
  const currentCount = tools.filter(t => t.shelfId === shelf.id).length;
  const capLeft = SHELF_CAPACITY - currentCount;
  // Only tools not yet on ANY shelf are selectable here — a tool already
  // sitting on a shelf (this one or another) must be removed from its current
  // shelf first before it can be added elsewhere, so there's exactly one
  // place to look for it at any time and no silent cross-shelf move.
  const options = tools.filter(t => !t.shelfId &&
    (t.name.toLowerCase().includes(query.toLowerCase()) || t.code.toLowerCase().includes(query.toLowerCase())))
    .sort((a, b) => naturalCompareCode(a.code, b.code));

  function toggle(id) {
    setSelected(sel => sel.includes(id) ? sel.filter(x => x !== id) : (sel.length >= capLeft ? sel : [...sel, id]));
  }

  // Selects every tool currently shown (respecting the search filter), capped
  // at however many more this shelf can actually hold — if there are more
  // matches than room left, only the first N (in the same order shown) get
  // checked, so the count never silently exceeds capacity.
  const visibleIds = options.map(t => t.id);
  const allVisibleSelected = visibleIds.length > 0 && visibleIds.every(id => selected.includes(id));
  function toggleSelectAll() {
    if (allVisibleSelected) {
      setSelected(sel => sel.filter(id => !visibleIds.includes(id)));
    } else {
      setSelected(sel => {
        const others = sel.filter(id => !visibleIds.includes(id));
        const roomLeft = capLeft - others.length;
        return [...others, ...visibleIds.slice(0, Math.max(0, roomLeft))];
      });
    }
  }

  return (
    <Modal title={`เพิ่มเครื่องมือเข้า ${shelf.name}`} onClose={onClose}>
      <p className="muted" style={{ fontSize: 12.5, marginBottom: 8 }}>
        ชั้นนี้มีอยู่ {currentCount}/{SHELF_CAPACITY} รายการ — เลือกได้อีกสูงสุด {capLeft} รายการ
      </p>
      <div className="form-group">
        <input placeholder="ค้นหาชื่อหรือรหัสเครื่องมือ..." value={query} onChange={e => setQuery(e.target.value)} />
      </div>
      {options.length > 0 && (
        <label className="shelf-pick-row shelf-pick-selectall">
          <input type="checkbox" checked={allVisibleSelected} onChange={toggleSelectAll} />
          <span style={{ fontWeight: 600 }}>{allVisibleSelected ? 'ยกเลิกทั้งหมด' : `เลือกทั้งหมด (${options.length} รายการ)`}</span>
        </label>
      )}
      <div className="shelf-pick-list">
        {options.length === 0 ? (
          <div className="empty-state" style={{ padding: '18px 0' }}>ไม่มีเครื่องมือว่าง (ที่ยังไม่ถูกจัดชั้น) ให้เลือกในคลังนี้แล้ว</div>
        ) : options.map(t => (
          <label key={t.id} className={`shelf-pick-row ${selected.includes(t.id) ? 'checked' : ''}`}>
            <input type="checkbox" checked={selected.includes(t.id)} onChange={() => toggle(t.id)} />
            <span className="mono">{t.code}</span>
            <span>{t.name}</span>
          </label>
        ))}
      </div>
      <div className="form-actions" style={{ marginTop: 10 }}>
        <button type="button" className="btn btn-secondary" onClick={onClose}>ยกเลิก</button>

          เพิ่ม {selected.length ? `(${selected.length})` : ''}
        </button>
      </div>
    </Modal>
  );
}

// Custom tooltip for the warehouse-status stacked bar — an icon next to each
// status line (rather than just a colored square) so it reads at a glance.
function WhStatusTooltip({ active, payload, statusMeta }) {
  if (!active || !payload || !payload.length) return null;
  const row = payload[0]?.payload;
  if (!row) return null;
  return (
    <div className="wh-status-tooltip">
      <div className="wh-status-tooltip-title">{row.name}</div>
      {statusMeta.map(s => {
        const Icon = s.icon;
        return (
          <div key={s.key} className="wh-status-tooltip-row">
            <Icon size={13} style={{ color: s.color, flexShrink: 0 }} />
            <span>{s.label}</span>
            <b style={{ color: s.color }}>{row[s.key] ?? 0}</b>
          </div>
        );
      })}
    </div>
  );
}

// Same icon treatment for the legend below the chart.
function WhStatusLegend({ statusMeta }) {
  return (
    <div className="wh-status-legend">
      {statusMeta.map(s => {
        const Icon = s.icon;
        return (
          <span key={s.key} className="wh-status-legend-item">
            <Icon size={13} style={{ color: s.color }} /> {s.label}
          </span>
        );
      })}
    </div>
  );
}

// Draws "รวม N ชิ้น" above the top of each stacked bar — Recharts' built-in
// LabelList would only show that one segment's own value, so this looks up
// the row's precomputed total instead.
function WhStatusTotalLabel({ x, y, width, index, rows }) {
  const total = rows?.[index]?.total;
  if (!total) return null;
  return (
    <text x={x + width / 2} y={y - 8} textAnchor="middle" fontSize={11} fontWeight={700} fill="var(--ink)">
      รวม {total}
    </text>
  );
}

}

function EditTxModal({ record, tool, staffMember, onSave, onClose }) {
  const isReturned = !!record.returnDate;
  const [returned, setReturned] = useState(isReturned);
  const [dueDate, setDueDate] = useState(record.dueDate);
  const toLocalInputValue = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const [returnAt, setReturnAt] = useState(toLocalInputValue(record.returnDate) || toLocalInputValue(new Date().toISOString()));
  const [saving, setSaving] = useState(false);
  const [photoDataUrl, setPhotoDataUrl] = useState(null);
  const [showCamera, setShowCamera] = useState(false);

  async function save(e) {
    e.preventDefault();
    if (!photoDataUrl) return;
    setSaving(true);
    const updates = { dueDate };
    if (returned) {
      updates.returnDate = new Date(returnAt).toISOString();
    } else {
      updates.returnDate = null;
      updates.returnedBy = null;
      updates.hasReturnPhoto = false;
    }
    try {
      // The photo taken to confirm this admin correction is stored as the
      // record's return-evidence photo, so it shows up in the same "หลังยืม" viewer.
      // Only mark hasReturnPhoto true when the record is actually being set to
      // "returned" — otherwise reopening a transaction (returned=false) would
      // wrongly keep showing a "หลังยืม" photo chip on an item that's still out.
      await storageSet(`toolcrib-photo:${record.id}:return`, photoDataUrl);
      if (returned) updates.hasReturnPhoto = true;
    } catch (err) {
      console.error('failed to save admin-edit confirmation photo', err);
    }
    await onSave(record.id, updates);
    setSaving(false);
    onClose();
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h3><Pencil size={17} /> แก้ไขสถานะรายการยืม-คืน</h3>
          <button className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="verify-block" style={{ background: 'var(--card-soft)' }}>
          <div className="verify-tool-name">{tool?.name}</div>
          <div className="verify-tool-code mono">{tool?.code}</div>
          <div className="muted" style={{ fontSize: 12, marginTop: 4 }}>ผู้ยืม: {staffMember?.name} ({staffMember?.dept})</div>
        </div>
        <form onSubmit={save} className="modal-form">
          <div className="form-group">
            <label>กำหนดคืน</label>
            <input type="date" value={dueDate} onChange={e => setDueDate(e.target.value)} />
          </div>
          <div className="mode-tabs" style={{ width: '100%' }}>
            <button type="button" className={`mode-tab ${!returned ? 'active' : ''}`} style={{ flex: 1 }} onClick={() => setReturned(false)}>อยู่ระหว่างยืม</button>
            <button type="button" className={`mode-tab ${returned ? 'active' : ''}`} style={{ flex: 1 }} onClick={() => setReturned(true)}>คืนแล้ว</button>
          </div>
          {returned && (
            <div className="form-group">
              <label>วันเวลาที่คืน</label>
              <input type="datetime-local" value={returnAt} onChange={e => setReturnAt(e.target.value)} />
            </div>
          )}
          <div className="verify-block" style={{ marginTop: 4 }}>
            <p className="verify-msg" style={{ marginTop: 0 }}>ต้องถ่ายรูปยืนยันสภาพเครื่องมือก่อน จึงจะบันทึกการแก้ไขนี้ได้</p>
            {!photoDataUrl ? (
              <button type="button" className="btn btn-secondary photo-btn" onClick={() => setShowCamera(true)}>
                <Camera size={16} /> ถ่ายรูปเครื่องมือ
              </button>
            ) : (
              <div className="photo-captured-row">
                <span><CheckCircle2 size={16} /> ถ่ายรูปเรียบร้อย</span>
                <button type="button" className="link-btn" onClick={() => setShowCamera(true)}>ถ่ายใหม่</button>
              </div>
            )}
          </div>
          <p className="scanner-hint" style={{ marginBottom: 0 }}>
            การแก้ไขนี้เป็นการแก้ไขโดยตรงจากแอดมิน (ไม่ผ่านการสแกน) จะถูกบันทึกลงประวัติกิจกรรมของระบบ
          </p>
          <div className="form-actions">
            <button type="button" className="btn btn-secondary" onClick={onClose}>ยกเลิก</button>
            <button type="submit" className="btn btn-primary" disabled={saving || !photoDataUrl}>{saving ? <Loader2 className="spin" size={15} /> : 'บันทึกการแก้ไข'}</button>
          </div>
        </form>
      </div>
      {showCamera && (
        <PhotoCaptureModal
          onCapture={(dataUrl) => { setPhotoDataUrl(dataUrl); setShowCamera(false); }}
          onClose={() => setShowCamera(false)}
        />
      )}
    </div>
  );
}

    date: d.date || '', fromAM: d.fromAM || '', aircraftType: d.aircraftType || '', aircraftNum: d.aircraftNum || '', workCardId: d.workCardId || '',

    loanToName: d.loanToName || '', loanToSign: d.loanToSign || '', issueBySign: d.issueBySign || '', returnBySign: d.returnBySign || '', receiveBySign: d.receiveBySign || ''
  });
  const [saving, setSaving] = useState(false);
  const [printing, setPrinting] = useState(false);
  const canPrint = !!record.returnDate; // per policy: printable only once the tool has actually been returned

        {/* Grouped to mirror the paper LBC-FM-034: header block, then the item

// The paper form has one "Aircraft No." line, but we now capture the model
// (Aircraft Type, e.g. "AS350 B2") and the tail number (Aircraft No., e.g.
// "1112") as two separate fields — so join them back into the single printed
// line the form expects: "AS350 B2 No.1112".
function combineAircraftLabel(type, num) {
  const t = (type || '').trim(), n = (num || '').trim();
  if (t && n) return `${t} No.${n}`;
  if (t) return t;
  if (n) return `No.${n}`;
  return '';
}

async function generateLoanFormPdf(record, tool, staffMember, returnedByStaff, d) {
  await Promise.all([ensureHtml2Canvas(), ensureJsPDF()]);
  const field = (label, value) => `
    <div style="margin-bottom:9px;">
      <span style="color:#4B5563;">${label}:</span>
      <span style="border-bottom:1px solid #1F2A37; display:inline-block; min-width:170px; padding:0 4px 1px; font-weight:600;">${escapeHtml(value)}</span>
    </div>`;
  // Matches the paper form exactly: "Loan to : ____ (Mechanic)" on one line,
  // then the signed name in parentheses, then the date, both centered below.
  const signBlock = (label, role, name, dateStr) => `
    <div style="width:47%;">
      <div style="white-space:nowrap;">${label} <span style="border-bottom:1px solid #1F2A37; display:inline-block; width:150px;">&nbsp;</span> (${role})</div>
      <div style="margin-top:20px; text-align:center;">( <span style="border-bottom:1px solid #1F2A37; display:inline-block; min-width:160px; font-weight:600;">${escapeHtml(name)}</span> )</div>
      <div style="margin-top:8px; text-align:center;">${dateStr ? fmtEnDate(dateStr) : '____ / ____ / ____'}</div>
    </div>`;

  const container = document.createElement('div');
  container.style.cssText = 'position:fixed; left:-99999px; top:0; width:760px; background:#ffffff; padding:26px; font-family:"Sarabun","Noto Sans Thai",sans-serif; color:#1F2A37; border:2px solid #1F2A37; font-size:13px;';
  container.innerHTML = `
    <div style="display:flex; align-items:center; border-bottom:2px solid #1F2A37; padding-bottom:12px; margin-bottom:16px; position:relative;">
      <img src="${LOAN_FORM_LOGO_SRC}" style="width:52px; height:52px; object-fit:contain; position:absolute; left:0; top:50%; transform:translateY(-50%);" />
      <h1 style="font-size:20px; margin:0; letter-spacing:0.5px; width:100%; text-align:center;">LOAN AND RETURN OF SPECIAL TOOL</h1>
    </div>
    <div style="display:flex; justify-content:space-between; gap:24px; margin-bottom:16px;">
      <div style="width:48%;">
        ${field('Date', fmtEnDate(d.date || record.borrowDate))}
        ${field('From (Ex. AM)', d.fromAM)}
        ${field('Aircraft No.', combineAircraftLabel(d.aircraftType, d.aircraftNum))}
        ${field('Work Card ID.', d.workCardId)}
      </div>
      <div style="width:48%;">
        ${field('Loan to (Name)', d.loanToName)}
        ${field('Employee ID', d.chipNo)}
        ${field('Tool No.', d.toolNo)}
        ${field('Tool Location', d.toolLocation)}
      </div>
    </div>
    <table style="width:100%; border-collapse:separate; border-spacing:0; border:1px solid #1F2A37; margin-bottom:18px; text-align:center;">

          <th style="border-right:1px solid #1F2A37; border-bottom:1px solid #1F2A37; padding:4px; font-size:11px; text-align:center;"></th>
          <th style="border-right:1px solid #1F2A37; border-bottom:1px solid #1F2A37; padding:4px; font-size:11px; text-align:center;"></th>
          <th style="border-right:1px solid #1F2A37; border-bottom:1px solid #1F2A37; padding:4px; font-size:11px; text-align:center;"></th>
          <th style="border-right:1px solid #1F2A37; border-bottom:1px solid #1F2A37; padding:4px; font-size:11px; text-align:center;"></th>
          <th style="border-right:1px solid #1F2A37; border-bottom:1px solid #1F2A37; padding:4px; font-size:11px; text-align:center;">Date</th>
          <th style="border-bottom:1px solid #1F2A37; padding:4px; font-size:11px; text-align:center;">Due</th>
        </tr>

          <td style="border-right:1px solid #1F2A37; padding:6px; text-align:center;">${escapeHtml(d.pn)}</td>
          <td style="border-right:1px solid #1F2A37; padding:6px; text-align:center;">${escapeHtml(d.sn)}</td>
          <td style="border-right:1px solid #1F2A37; padding:6px; text-align:center;">${d.calibDate ? fmtEnDate(d.calibDate) : ''}</td>
          <td style="padding:6px; text-align:center;">${d.calibDue ? fmtEnDate(d.calibDue) : ''}</td>
        </tr>
      </tbody>
    </table>
    <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
      ${signBlock('Loan to :', 'Mechanic', d.loanToSign, record.borrowDate)}
      ${signBlock('Issue by:', 'Tool Room', d.issueBySign, record.borrowDate)}
    </div>
    <div style="display:flex; justify-content:space-between;">
      ${signBlock('Return by:', 'Mechanic', d.returnBySign, record.returnDate)}
      ${signBlock('Receive by:', 'Tool Room', d.receiveBySign, record.returnDate)}
    </div>
    <div style="margin-top:20px; font-size:10.5px; color:#6B7280; font-style:italic;">LBC-FM-034, Rev.2, Effective Date: 22/11/2021</div>
  `;
  document.body.appendChild(container);

  try {
    const canvas = await window.html2canvas(container, { scale: 2, backgroundColor: '#ffffff' });
    document.body.removeChild(container);
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'pt', 'a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const imgWidth = pageWidth - 40;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;
    pdf.addImage(imgData, 'PNG', 20, 20, imgWidth, imgHeight);
    pdf.save(`ใบยืม-คืน-${tool?.code || record.id}-${todayISO()}.pdf`);
  } catch (e) {
    if (container.parentNode) document.body.removeChild(container);
    throw e;
  }
}

function EvidencePhotoModal({ txId, kind, label, onFetch, onClose }) {
  const [src, setSrc] = useState(null);
  const [state, setState] = useState('loading'); // loading | ok | empty
  useEffect(() => {
    let cancelled = false;
    (async () => {
      const value = await onFetch?.(txId, kind, label);
      if (cancelled) return;
      if (value) { setSrc(value); setState('ok'); } else { setState('empty'); }
    })();
    return () => { cancelled = true; };
  }, [txId, kind]);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card scanner-card" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h3><ImageIcon size={17} /> รูปหลักฐาน — {label}</h3>
          <button className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="evidence-viewport">
          {state === 'loading' && <div className="scanner-overlay-msg" style={{ position: 'static', color: 'var(--ink-soft)' }}><Loader2 className="spin" size={20} /><span>กำลังโหลดรูป…</span></div>}
          {state === 'empty' && <div className="scanner-overlay-msg" style={{ position: 'static', color: 'var(--ink-soft)' }}><VideoOff size={20} /><span>ไม่พบรูปที่บันทึกไว้</span></div>}
          {state === 'ok' && <img src={src} alt="หลักฐาน" className="evidence-img" />}
        </div>
        <p className="scanner-hint">การเปิดดูรูปนี้ถูกบันทึกลงประวัติกิจกรรมของระบบ (เฉพาะแอดมินเข้าถึงได้)</p>
      </div>
    </div>
  );
}

/* ---------------------------- Scan Page ---------------------------- */
// Admin-only borrow/return rules — relocated here from the Settings page so
// whoever's actually running the scan station can adjust them on the spot
// without leaving this screen. Collapsed by default behind a toggle; a
// non-admin never even receives this component (gated at the call site), so
// there's no way for a staff account to see it exists, not just a hidden button.
function AdminQuickSettingsPanel({ settings, setSettings, showToast, addAudit }) {
  const [open, setOpen] = useState(false);
  const [form, setForm] = useState(settings);
  // Same "don't clobber an unsaved edit" guard used elsewhere — only re-syncs
  // from the live settings while nothing here has been typed into yet.
  const [dirty, setDirty] = useState(false);
  useEffect(() => { if (!dirty) setForm(settings); }, [settings, dirty]);

  async function save(e) {
    e.preventDefault();
    const maxBorrow = Number(form.maxBorrowPerStaff);
    const dueDays = Number(form.defaultDueDays);
    const reminderDays = Number(form.backupReminderDays) || 7;
    if (!maxBorrow || maxBorrow < 1) return showToast('จำนวนเครื่องมือสูงสุดต้องอย่างน้อย 1 ชิ้น', 'error');
    if (!dueDays || dueDays < 1) return showToast('จำนวนวันกำหนดคืนต้องอย่างน้อย 1 วัน', 'error');
    const next = { ...settings, maxBorrowPerStaff: maxBorrow, defaultDueDays: dueDays, backupReminderDays: reminderDays };
    try {
      await setSettings(next);
    } catch (err) {
      console.error('failed to save settings', err);
      return showToast('บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    addAudit?.('settings_update', `จำนวนยืมสูงสุดต่อคน: ${maxBorrow}, กำหนดคืนเริ่มต้น: ${dueDays} วัน, เตือนสำรองข้อมูลทุก: ${reminderDays} วัน`);
    setDirty(false);
    showToast('บันทึกการตั้งค่าเรียบร้อย', 'success');
  }

  return (
    <section className="panel scan-settings-panel">
      <button type="button" className="scan-settings-toggle" onClick={() => setOpen(o => !o)}>
        <span><SettingsIcon size={16} /> ตั้งค่าระบบยืม-คืน <span className="muted" style={{ fontWeight: 400, fontSize: 11.5 }}>(เฉพาะแอดมิน)</span></span>
        <ChevronRight size={16} className={`scan-settings-chev ${open ? 'open' : ''}`} />
      </button>
      {open && (
        <form onSubmit={save} className="modal-form scan-settings-form">
          <div className="form-group">
            <label>จำนวนเครื่องมือสูงสุดที่ยืมพร้อมกันได้ต่อคน</label>
            <input type="number" min={1} value={form.maxBorrowPerStaff} onChange={e => { setForm({ ...form, maxBorrowPerStaff: e.target.value }); setDirty(true); }} />
          </div>
          <div className="form-group">
            <label>จำนวนวันกำหนดคืนเริ่มต้น (วัน)</label>
            <input type="number" min={1} value={form.defaultDueDays} onChange={e => { setForm({ ...form, defaultDueDays: e.target.value }); setDirty(true); }} />
          </div>
          <div className="form-group">
            <label>เตือนให้สำรองข้อมูลทุกๆ (วัน)</label>
            <input type="number" min={1} value={form.backupReminderDays ?? 7} onChange={e => { setForm({ ...form, backupReminderDays: e.target.value }); setDirty(true); }} />
            {settings.lastBackupAt && <div className="muted" style={{ fontSize: 12, marginTop: 4 }}>สำรองข้อมูลล่าสุด: {fmtThaiDateTime(settings.lastBackupAt)}</div>}
          </div>
          <div className="form-actions">
            <button type="submit" className="btn btn-primary">บันทึกการตั้งค่า</button>
          </div>
        </form>
      )}
    </section>
  );
}

function ScanPage({ tools, staff, tx, toolStatus, onBorrow, onReturn, activeByTool, showToast, settings, isAdmin, isMainAdmin, onEditTx, warehouses, issuerSignature, setSettings, addAudit }) {
  // Starts unset on purpose. Defaulting to 'borrow' meant a mechanic returning
  // a tool had to notice the wrong tab was already selected and switch it —
  // easy to miss when you are scanning fast, and the mistake only surfaces at
  // the confirm step. Make the choice explicit instead.
  const [mode, setMode] = useState(null); // null | 'borrow' | 'return'
  const [staffCode, setStaffCode] = useState('');
  const [toolCode, setToolCode] = useState('');
  const [dueDate, setDueDate] = useState(addDays(todayISO(), (settings?.defaultDueDays ?? 7)));
  const [scannerFor, setScannerFor] = useState(null); // null | 'staff' | 'tool'
  const [confirming, setConfirming] = useState(false);
  const [photoDataUrl, setPhotoDataUrl] = useState(null);
  const [showCamera, setShowCamera] = useState(false);
  // Mirrors the paper "LOAN AND RETURN OF SPECIAL TOOL" slip — fields we
  // already know (date, names, tool code, location) get auto-filled;
  // everything the system has no way of knowing (aircraft no., work card id,
  // P/N, S/N, calibration) stays a manual field the mechanic fills in here.
  const emptyDocManual = { fromAM: '', aircraftType: '', aircraftNum: '', workCardId: '', loanToSign: '', issueBySign: '' };
  const [docManual, setDocManual] = useState(emptyDocManual);
  const [returnSign, setReturnSign] = useState({ returnBySign: '', receiveBySign: '' });
  const [confirmStep, setConfirmStep] = useState('verify'); // 'verify' | 'doc' — split so the LBC-FM-034 fields are a separate, shorter step
  useEffect(() => { if (confirming) setConfirmStep('verify'); }, [confirming]);
  // Simple running count of how many borrow/return transactions have been
  // completed in this scanning session (resets on page reload, not persisted)
  // — a quick "how many have I gotten through" cue for someone scanning a
  // whole batch of tools back-to-back at the counter.
  const [scanCount, setScanCount] = useState(0);

  function resolveStaff(input) {
    const v = input.trim().toLowerCase();
    return staff.find(s => s.code.toLowerCase() === v || s.id.toLowerCase() === v);
  }
  function resolveTool(input) {
    const v = input.trim().toLowerCase();
    return tools.find(t => t.code.toLowerCase() === v || t.id.toLowerCase() === v);
  }

  const matchedStaff = staffCode ? resolveStaff(staffCode) : null;
  const matchedTool = toolCode ? resolveTool(toolCode) : null;

  // Both signature fields are pre-filled the moment a staff badge is matched —
  // "Loan to (Mechanic)" from that person's own saved signature (set when
  // their account was created/edited), "Issue by (Tool Room)" from whichever
  // admin is currently logged in and running this scan station. Either can
  // still be edited/overridden by hand before confirming; the fill only ever
  // applies to an EMPTY field so it never clobbers a manual edit.
  useEffect(() => {
    if (!matchedStaff) return;
    setDocManual(dm => ({
      ...dm,
      loanToSign: dm.loanToSign || matchedStaff.signature || '',
      issueBySign: dm.issueBySign || issuerSignature || '',
    }));
  }, [matchedStaff?.id, issuerSignature]);

  // Same auto-fill on the return side, using the same two data points —
  // "Return by (Mechanic)" is the same person whose card was just scanned
  // (matching what "Loan to" used on the way out), "Receive by (Tool Room)"
  // is the admin running this station right now.
  useEffect(() => {
    if (!matchedStaff) return;
    setReturnSign(rs => ({
      ...rs,
      returnBySign: rs.returnBySign || matchedStaff.signature || '',
      receiveBySign: rs.receiveBySign || issuerSignature || '',
    }));
  }, [matchedStaff?.id, issuerSignature]);

  // Enforce order: clear the tool code (and any in-progress photo/confirm state)
  // whenever the staff match is lost, so a tool can never be paired until a
  // valid staff card is scanned first.
  useEffect(() => {
    if (!matchedStaff && (toolCode || confirming || photoDataUrl)) {
      setToolCode(''); setConfirming(false); setPhotoDataUrl(null); setShowCamera(false);
    }
  }, [matchedStaff]); // eslint-disable-line

  const maxBorrow = settings?.maxBorrowPerStaff ?? 3;
  const staffOpenCount = matchedStaff ? tx.filter(t => t.staffId === matchedStaff.id && !t.returnDate).length : 0;

  let blockReason = '';
  if (mode === 'borrow' && matchedStaff && staffOpenCount >= maxBorrow) {
    blockReason = `${matchedStaff.name} ยืมเครื่องมือค้างอยู่ครบจำนวนสูงสุดแล้ว (${maxBorrow} ชิ้น)`;
  }
  if (matchedTool && !blockReason) {
    const isOpen = activeByTool.has(matchedTool.id);
    if (mode === 'borrow' && matchedTool.condition === 'damaged') blockReason = `"${matchedTool.name}" อยู่ระหว่างชำรุด/ส่งซ่อม ยืมไม่ได้`;
    else if (mode === 'borrow' && matchedTool.condition === 'calibration') blockReason = `"${matchedTool.name}" อยู่ระหว่างส่ง Calibration ยืมไม่ได้`;
    else if (mode === 'borrow' && isOpen) blockReason = `"${matchedTool.name}" ถูกยืมอยู่แล้ว ไม่สามารถยืมซ้ำได้`;
    else if (mode === 'return' && !isOpen) blockReason = `"${matchedTool.name}" ไม่มีรายการค้างคืนอยู่`;
  }
  const readyToConfirm = !!(matchedStaff && matchedTool && !blockReason);

  // Enter triggers the same action as clicking the confirm button below — a
  // barcode-scanner "gun" for tool/staff codes almost always ends its input
  // with an Enter keystroke, so this lets someone scan through a whole batch
  // without ever touching the mouse.
  useEffect(() => {
    function onKeyDown(e) {
      if (e.key !== 'Enter') return;
      if (!readyToConfirm || confirming || scannerFor) return;
      // Don't hijack Enter while it's being used inside a text field for its
      // normal purpose (e.g. a signature or date field mid-edit elsewhere).
      const tag = document.activeElement?.tagName;
      if (tag === 'TEXTAREA') return;
      setConfirming(true);
    }
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [readyToConfirm, confirming, scannerFor]);

  function resetFields() {
    setStaffCode(''); setToolCode(''); setConfirming(false); setPhotoDataUrl(null); setShowCamera(false);
    setDueDate(addDays(todayISO(), (settings?.defaultDueDays ?? 7)));
    setDocManual(emptyDocManual); setReturnSign({ returnBySign: '', receiveBySign: '' }); setConfirmStep('verify');
  }

  function handleScanResult(text) {
    const value = (text || '').trim();
    if (!value) return;
    if (scannerFor === 'staff') {
      setToolCode(''); setConfirming(false); setPhotoDataUrl(null);
      setStaffCode(value);
      const s = staff.find(x => x.code.toLowerCase() === value.toLowerCase() || x.id.toLowerCase() === value.toLowerCase());
      showToast?.(s ? `สแกนบัตรพนักงานสำเร็จ: ${s.name}` : `สแกนได้รหัส "${value}" แต่ไม่พบในระบบ`, s ? 'success' : 'error');
    } else if (scannerFor === 'tool') {
      setToolCode(value);
      setPhotoDataUrl(null);
      const t = tools.find(x => x.code.toLowerCase() === value.toLowerCase() || x.id.toLowerCase() === value.toLowerCase());
      showToast?.(t ? `สแกน QR เครื่องมือสำเร็จ: ${t.name}` : `สแกนได้รหัส "${value}" แต่ไม่พบในระบบ`, t ? 'success' : 'error');
      if (t) setConfirming(true); // scanning the tool successfully opens the verify + photo step automatically
    }
    setScannerFor(null);
  }

  const needsLoanForm = !!matchedTool?.requiresLoanForm;
  const signatureMissing = needsLoanForm && (mode === 'borrow' ? !docManual.loanToSign.trim() : !returnSign.returnBySign.trim());

  async function confirmAction() {
    if (!readyToConfirm || !photoDataUrl || signatureMissing) return;
    if (mode === 'borrow') {
      let docForm = null;
      if (needsLoanForm) {
        const wh = warehouses?.find(w => w.id === matchedTool.warehouseId);
        docForm = {
          date: todayISO(), fromAM: docManual.fromAM, aircraftType: docManual.aircraftType, aircraftNum: docManual.aircraftNum, workCardId: docManual.workCardId,
          loanToName: docManual.loanToSign || matchedStaff.name, chipNo: matchedStaff.code,
          toolNo: matchedTool.code, toolLocation: wh?.name || '-', itemDesc: matchedTool.name,
          pn: matchedTool.partNo || '', sn: matchedTool.serialNo || '', calibDate: matchedTool.calibDate || '', calibDue: matchedTool.calibDue || '',
          loanToSign: docManual.loanToSign, issueBySign: docManual.issueBySign, returnBySign: '', receiveBySign: '', returnDate: null
        };
      }
      await onBorrow(matchedStaff.id, matchedTool.id, dueDate, photoDataUrl, docForm);
    } else {
      await onReturn(matchedTool.id, matchedStaff.id, photoDataUrl, needsLoanForm ? {
        returnBySign: returnSign.returnBySign, receiveBySign: returnSign.receiveBySign, returnDate: new Date().toISOString()
      } : null);
    }
    resetFields();
    setScanCount(c => c + 1);
  }

  function switchMode(next) { setMode(next); resetFields(); }

  const openList = tx.filter(t => !t.returnDate).sort((a, b) => a.dueDate.localeCompare(b.dueDate));

  return (
    <div className="page-stack">
      {isMainAdmin && (
        <AdminQuickSettingsPanel settings={settings} setSettings={setSettings} showToast={showToast} addAudit={addAudit} />
      )}
      <section className="panel scan-panel">
        <div className="panel-head scan-panel-head">
          <div>
            <h2><ScanLine size={18} /> สแกนยืม-คืน เครื่องมือ</h2>
            <p>{mode ? 'สแกนบัตรพนักงานก่อน แล้วจึงสแกน QR เครื่องมือ' : 'กรุณาเลือก ยืม-คืน เครื่องมือ'}</p>
          </div>
          {mode && <div className="scan-panel-confirm-label">{mode === 'borrow' ? 'ยืนยันการยืมเครื่องมือ' : 'ยืนยันการคืนเครื่องมือ'}</div>}
        </div>

        {/* Before a mode is picked these are the only thing on the screen to
            act on, so they read as two solid choices rather than a pale
            segmented control the eye slides past. Icons carry the direction:
            out of the crib for borrow, back into it for return. */}
        <div className={`mode-tabs ${mode ? '' : 'unset'}`}>
          <button type="button" className={`mode-tab borrow ${mode === 'borrow' ? 'active' : ''}`} onClick={() => switchMode('borrow')}>
            <ArrowLeftRight size={16} /> ยืมเครื่องมือ
          </button>
          <button type="button" className={`mode-tab return ${mode === 'return' ? 'active' : ''}`} onClick={() => switchMode('return')}>
            <CheckCircle2 size={16} /> คืนเครื่องมือ
          </button>
        </div>

        {mode && <>
        <div className="scan-steps">
          <div className={`scan-step ${matchedStaff ? 'done' : 'active'}`}>
            <div className="step-num">{matchedStaff ? <CheckCircle2 size={16} /> : '1'}</div>
            <div className="step-body">
              <label>ขั้นตอนที่ 1 – สแกนบัตรพนักงาน</label>
              <div className="scan-input-row">
                {/* No autoFocus. On a phone or iPad, focusing this field the
                    moment a mode is picked throws up the on-screen keyboard and
                    covers the rest of the form — including the QR buttons the
                    person was probably reaching for. Most transactions here are
                    scanned, not typed, so typing is the exception and should be
                    the one that costs an extra tap. */}
                <input value={staffCode} onChange={e => setStaffCode(e.target.value)} placeholder="เช่น EMP-1001" className="mono" />
                <button type="button" className="scan-icon-btn" onClick={() => setScannerFor('staff')} title="สแกนบัตรพนักงาน">
                  <CreditCard size={16} />
                </button>
              </div>
              {staffCode && <div className={`hint ${matchedStaff ? 'ok' : 'bad'}`}>{matchedStaff ? `✓ ${matchedStaff.name} (${matchedStaff.dept})` : 'ไม่พบรหัสนี้'}</div>}
            </div>
          </div>

          <div className={`scan-step ${!matchedStaff ? 'locked' : matchedTool ? 'done' : 'active'}`}>
            <div className="step-num">{matchedTool ? <CheckCircle2 size={16} /> : '2'}</div>
            <div className="step-body">
              <label>ขั้นตอนที่ 2 – สแกน QR เครื่องมือ</label>
              <div className="scan-input-row">
                <input value={toolCode} onChange={e => { setToolCode(e.target.value); setPhotoDataUrl(null); }} placeholder={matchedStaff ? 'สแกน หรือ พิมพ์รหัสเครื่องมือ' : 'สแกนบัตรพนักงานก่อน'} className="mono" disabled={!matchedStaff} />
                <button type="button" className="scan-icon-btn" onClick={() => setScannerFor('tool')} title="สแกน QR เครื่องมือ" disabled={!matchedStaff}>
                  <QrCode size={16} />
                </button>
              </div>
              {!matchedStaff && <div className="hint locked-hint">กรุณาสแกนบัตรพนักงานให้สำเร็จก่อน จึงจะสแกนเครื่องมือได้</div>}
              {matchedStaff && toolCode && <div className={`hint ${matchedTool && !blockReason ? 'ok' : 'bad'}`}>
                {!matchedTool ? 'ไม่พบรหัสนี้' : blockReason || `✓ ${matchedTool.name}`}
              </div>}
            </div>
          </div>
        </div>

        {mode === 'borrow' && (
          <div className="form-group">

/* ---------------------------- QR Scan Modal (camera) ---------------------------- */
function QrScanModal({ title, onDetect, onClose }) {
  const videoRef = React.useRef(null);
  const canvasRef = React.useRef(null);
  const streamRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const detectedRef = React.useRef(false);
  const [status, setStatus] = useState('requesting'); // requesting | scanning | error
  const [errorMsg, setErrorMsg] = useState('');
  const [manualCode, setManualCode] = useState('');
  const [uploadBusy, setUploadBusy] = useState(false);
  const [uploadError, setUploadError] = useState('');

  useEffect(() => {
    let cancelled = false;

    async function start() {
      setStatus('requesting');
      let stream;
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('unsupported');
        }
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } }, audio: false
        });
      } catch (err) {
        if (cancelled) return;
        setStatus('error');
        if (err && err.name === 'NotAllowedError') setErrorMsg('ไม่ได้รับอนุญาตให้ใช้กล้อง กรุณาอนุญาตการเข้าถึงกล้องแล้วลองใหม่');
        else if (err && err.name === 'NotFoundError') setErrorMsg('ไม่พบกล้องบนอุปกรณ์นี้');
        else if (err && err.message === 'unsupported') setErrorMsg('อุปกรณ์หรือเบราว์เซอร์นี้ไม่รองรับการเปิดกล้อง');
        else setErrorMsg('ไม่สามารถเปิดกล้องได้');
        return;
      }
      if (cancelled) { stream.getTracks().forEach(t => t.stop()); return; }
      streamRef.current = stream;
      if (videoRef.current) {
        videoRef.current.srcObject = stream;
        await videoRef.current.play();
      }
      // Camera is on at this point — anything past here is the QR-reading
      // library, not the camera, so it gets its own error message.
      try {
        try {
          await ensureJsQR();
        } catch (e) {
          await ensureJsQR(); // one retry — this step loads a script from a CDN, which can fail transiently
        }
        if (cancelled) return;
        setStatus('scanning');
        tick();
      } catch (err) {
        if (cancelled) return;
        if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
        setStatus('error');
        setErrorMsg('โหลดตัวอ่าน QR ไม่สำเร็จ (ปัญหาการเชื่อมต่ออินเทอร์เน็ต หรือมีตัวบล็อกสคริปต์อยู่) กรุณาลองใหม่ หรือพิมพ์รหัสเอง');
      }
    }

    function tick() {
      const video = videoRef.current, canvas = canvasRef.current;
      if (detectedRef.current) return;
      if (video && canvas && video.readyState === video.HAVE_ENOUGH_DATA && window.jsQR) {
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        try {
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = window.jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
          if (code && code.data) {
            detectedRef.current = true;
            onDetect(code.data);
            return;
          }
        } catch (e) { /* frame not ready, ignore */ }
      }
      rafRef.current = requestAnimationFrame(tick);
    }

    start();
    return () => {
      cancelled = true;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    };
  }, []);

  function submitManual(e) {
    e.preventDefault();
    if (!manualCode.trim()) return;
    onDetect(manualCode.trim());
  }

  // Reads a QR code out of a picked photo instead of the live camera — handy
  // when the code is on something hard to hold steady under a camera (a
  // printed sheet, a photo already taken earlier, a screenshot, etc).
  async function handleUploadFile(e) {
    const file = e.target.files?.[0];
    e.target.value = '';
    if (!file) return;
    setUploadError('');
    setUploadBusy(true);
    try {
      try { await ensureJsQR(); } catch (err) { await ensureJsQR(); } // one retry, same as the live-camera path
      const objectUrl = URL.createObjectURL(file);
      const img = new Image();
      const decoded = await new Promise((resolve, reject) => {
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = img.width; canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = window.jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'attemptBoth' });
            resolve(code && code.data ? code.data : null);
          } catch (err) { reject(err); }
        };
        img.onerror = () => reject(new Error('decode-failed'));
        img.src = objectUrl;
      });
      URL.revokeObjectURL(objectUrl);
      if (!detectedRef.current) {
        if (decoded) {
          detectedRef.current = true;
          onDetect(decoded);
        } else {
          setUploadError('ไม่พบ QR โค้ดในรูปนี้ ลองถ่ายรูปให้เห็น QR ชัดเจนกว่านี้ หรือลองรูปอื่น');
        }
      }
    } catch (err) {
      console.error('failed to read QR from uploaded photo', err);
      setUploadError('อ่านรูปนี้ไม่สำเร็จ ลองรูปอื่น หรือใช้กล้องสแกนแทน');
    } finally {
      setUploadBusy(false);
    }
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card scanner-card" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h3><Camera size={17} /> {title}</h3>
          <button className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>

        {status !== 'error' && (
          <div className="scanner-viewport">
            <video ref={videoRef} className="scanner-video" muted playsInline />
            <canvas ref={canvasRef} style={{ display: 'none' }} />
            {status === 'scanning' && (
              <div className="scanner-frame">
                <span className="corner tl" /><span className="corner tr" />
                <span className="corner bl" /><span className="corner br" />
                <div className="scanner-line" />
              </div>
            )}
            {status === 'requesting' && (
              <div className="scanner-overlay-msg">
                <Loader2 className="spin" size={22} /><span>กำลังเปิดกล้อง…</span>
              </div>
            )}
          </div>
        )}

        {status === 'error' && (
          <div className="scanner-manual-block">
            <VideoOff size={26} color="var(--danger)" />
            <p className="scanner-manual-msg">{errorMsg}</p>
            <form onSubmit={submitManual} className="scan-input-row" style={{ width: '100%' }}>
              <input autoFocus className="mono" value={manualCode} onChange={e => setManualCode(e.target.value)} placeholder="พิมพ์รหัสที่นี่" />
              <button type="submit" className="scan-icon-btn" title="ยืนยันรหัส" disabled={!manualCode.trim()}><CheckCircle2 size={16} /></button>
            </form>
          </div>
        )}

        {status !== 'error' && <p className="scanner-hint">เล็งกล้องไปที่ QR โค้ด ระบบจะกรอกรหัสให้อัตโนมัติเมื่อสแกนสำเร็จ</p>}

        <label className="btn btn-secondary" style={{ width: '100%', justifyContent: 'center', cursor: 'pointer' }}>
          {uploadBusy ? <Loader2 size={16} className="spin" /> : <ImageIcon size={16} />}
          <input type="file" accept="image/*" style={{ display: 'none' }} onChange={handleUploadFile} disabled={uploadBusy} />
          อัปโหลดรูป QR แทนการสแกนสด
        </label>
        {uploadError && <p className="scanner-hint" style={{ color: 'var(--danger)' }}>{uploadError}</p>}

        <button type="button" className="btn btn-secondary" style={{ width: '100%', justifyContent: 'center' }} onClick={onClose}>ยกเลิก</button>
      </div>
    </div>
  );
}

/* ---------------------------- Photo Capture Modal (camera) ---------------------------- */
function PhotoCaptureModal({ onCapture, onClose, title, hint }) {
  const videoRef = React.useRef(null);
  const streamRef = React.useRef(null);
  const [status, setStatus] = useState('requesting'); // requesting | ready | error
  const [errorMsg, setErrorMsg] = useState('');

  useEffect(() => {
    let cancelled = false;
    async function start() {
      setStatus('requesting');
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('unsupported');
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } }, audio: false
        });
        if (cancelled) { stream.getTracks().forEach(t => t.stop()); return; }
        streamRef.current = stream;
        if (videoRef.current) { videoRef.current.srcObject = stream; await videoRef.current.play(); }
        if (cancelled) return;
        setStatus('ready');
      } catch (err) {
        if (cancelled) return;
        setStatus('error');
        if (err && err.name === 'NotAllowedError') setErrorMsg('ไม่ได้รับอนุญาตให้ใช้กล้อง กรุณาอนุญาตการเข้าถึงกล้องแล้วลองใหม่');
        else if (err && err.name === 'NotFoundError') setErrorMsg('ไม่พบกล้องบนอุปกรณ์นี้');
        else if (err && err.message === 'unsupported') setErrorMsg('อุปกรณ์หรือเบราว์เซอร์นี้ไม่รองรับการเปิดกล้อง');
        else setErrorMsg('ไม่สามารถเปิดกล้องได้ กรุณาลองใหม่');
      }
    }
    start();
    return () => {
      cancelled = true;
      if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    };
  }, []);

  function capture() {
    const video = videoRef.current;
    if (!video || status !== 'ready') return;
    const dataUrl = resizeDrawableToStandardPhoto(video, video.videoWidth, video.videoHeight);
    onCapture(dataUrl);
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card scanner-card" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h3><Camera size={17} /> {title || 'ถ่ายรูปสภาพเครื่องมือ'}</h3>
          <button className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>

        <div className="scanner-viewport">
          <video ref={videoRef} className="scanner-video" muted playsInline />
          {status !== 'ready' && (
            <div className="scanner-overlay-msg">
              {status === 'requesting' && <><Loader2 className="spin" size={22} /><span>กำลังเปิดกล้อง…</span></>}
              {status === 'error' && <><VideoOff size={22} /><span>{errorMsg}</span></>}
            </div>
          )}
        </div>

        <p className="scanner-hint">{hint || 'จัดกรอบให้เห็นสภาพเครื่องมือชัดเจน แล้วกดถ่ายรูป ภาพจะถูกเก็บไว้ในระบบเป็นหลักฐานเท่านั้น ไม่แสดงผลที่ใดในโปรแกรม'}</p>
        <div className="form-actions" style={{ marginTop: 4 }}>
          <button type="button" className="btn btn-secondary" onClick={onClose}>ยกเลิก</button>
          <button type="button" className="btn btn-primary" onClick={capture} disabled={status !== 'ready'}><Camera size={15} /> ถ่ายรูป</button>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------- QR Tool Page ---------------------------- */
// Staff-facing, read-only: pick a warehouse, then search that warehouse's
// tools to pull up a tool's QR code — e.g. to reprint a lost/damaged QR
// sticker, without needing admin access to the full Tools page.
const QRTOOL_STATUS_META = {
  available: { label: 'พร้อมใช้งาน', tone: 'success' },
  borrowed: { label: 'ถูกยืมอยู่', tone: 'warning' },
  overdue: { label: 'เกินกำหนดคืน', tone: 'danger' },
  damaged: { label: 'ชำรุด/ส่งซ่อม', tone: 'purple' },
  calibration: { label: 'ส่ง Calibration', tone: 'purple' },
};
function QrToolPage({ tools, warehouses, shelves, toolStatus }) {
  const [whId, setWhId] = useState(null);
  const [q, setQ] = useState('');
  const [qrTool, setQrTool] = useState(null);
  const [photoTool, setPhotoTool] = useState(null);
  const [detailShelf, setDetailShelf] = useState(null);

  const wh = warehouses.find(w => w.id === whId);
  const whShelves = useMemo(() => (shelves || []).filter(s => s.warehouseId === whId), [shelves, whId]);
  const whShelfIds = useMemo(() => new Set(whShelves.map(s => s.id)), [whShelves]);
  const whTools = useMemo(() => tools.filter(t => t.warehouseId === whId).sort((a, b) => naturalCompareCode(a.code, b.code)), [tools, whId]);
  const unassigned = useMemo(() => whTools.filter(t => !t.shelfId || !whShelfIds.has(t.shelfId)), [whTools, whShelfIds]);
  const filtered = useMemo(() => {
    const query = q.trim().toLowerCase();
    if (!query) return [];
    return whTools.filter(t => t.code.toLowerCase().includes(query) || t.name.toLowerCase().includes(query));
  }, [whTools, q]);

  function qrRow(t) {
    const meta = QRTOOL_STATUS_META[toolStatus(t.id)];
    const CatIcon = catMap[t.category]?.icon || Package;
    return (

// Fetches and shows a tool's registered master photo (set once at
// registration, distinct from the per-transaction "before/after" evidence
// photos). Renders nothing if the tool has none — callers decide whether
// that's worth a placeholder.
function ToolPhotoThumb({ toolId, hasPhoto, size, placeholder, version }) {
  const [src, setSrc] = useState(null);
  const [state, setState] = useState(hasPhoto ? 'loading' : 'empty');
  useEffect(() => {
    let cancelled = false;
    if (!hasPhoto) { setSrc(null); setState('empty'); return; }
    setState('loading');
    (async () => {
      const value = await storageGet(`toolcrib-photo:master:${toolId}`, true);
      if (cancelled) return;
      if (value) { setSrc(value); setState('ok'); } else setState('empty');
    })();
    return () => { cancelled = true; };
  }, [toolId, hasPhoto, version]);

  const px = size || 96;
  if (state === 'ok') return <img src={src} alt="" className="tool-master-photo" style={{ width: px, height: px }} />;
  if (state === 'loading') return <div className="tool-master-photo-placeholder" style={{ width: px, height: px }}><Loader2 className="spin" size={18} /></div>;
  if (placeholder === false) return null;
  return <div className="tool-master-photo-placeholder" style={{ width: px, height: px }}><ImageIcon size={18} /></div>;
}

function ToolForm({ data, onSave, onCancel, warehouses, shelves, tools }) {
  const [form, setForm] = useState(data);
  // Transient, form-local photo state — not part of the saved tool record itself.
  // `newPhoto` holds a freshly captured/uploaded image pending save; `removePhoto`
  // marks the existing photo for deletion. ToolsPage.save() reads these off the
  // submitted object and turns them into the actual storage write + hasPhoto flag.
  const [newPhoto, setNewPhoto] = useState(null);
  const [removePhoto, setRemovePhoto] = useState(false);
  const [showCamera, setShowCamera] = useState(false);
  const fileInputRef = React.useRef(null);

  const [photoError, setPhotoError] = useState('');

  function resizeToDataUrl(file, cb) {
    setPhotoError('');
    resizeImageFileToStandardPhoto(file, cb, () => {
      setPhotoError('เบราว์เซอร์นี้แสดงตัวอย่างไฟล์รูปนี้ไม่ได้ (มักเกิดกับไฟล์ HEIC บางไฟล์) ลองกด "ถ่ายรูป" แทน หรือเลือกรูปที่เป็น JPG/PNG');
    });
  }

  function handleFilePick(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = ''; // allow picking the same file again later
    if (!file) return;
    resizeToDataUrl(file, (dataUrl) => { setNewPhoto(dataUrl); setRemovePhoto(false); });
  }

  const showingExisting = !newPhoto && !removePhoto && form.hasPhoto;

  function submit(e) {
    e.preventDefault();
    onSave({ ...form, code: normalizeCode(form.code), _newPhoto: newPhoto, _removePhoto: removePhoto });
  }

  return (
    <>
    <form onSubmit={submit} className="modal-form">
      <div className="form-group">
        <label>รูปเครื่องมือ</label>
        <div className="tool-photo-row">
          {newPhoto ? (
            <img src={newPhoto} alt="" className="tool-photo-preview" />
          ) : showingExisting ? (
            <ToolPhotoThumb toolId={form.id} hasPhoto={true} size={64} version={form.photoUpdatedAt} />
          ) : (
            <div className="tool-photo-preview-empty"><ImageIcon size={20} /></div>
          )}
          <div className="tool-photo-actions">
            <div className="tool-photo-btn-row">
              <button type="button" className="btn btn-secondary" onClick={() => setShowCamera(true)}><Camera size={14} /> ถ่ายรูป</button>
              <button type="button" className="btn btn-secondary" onClick={() => fileInputRef.current?.click()}><ImageIcon size={14} /> เลือกรูป</button>
            </div>
            {newPhoto ? (
              <button type="button" className="link-btn" onClick={() => setNewPhoto(null)}>ล้างรูปที่เพิ่งเลือก</button>
            ) : showingExisting && (
              <button type="button" className="link-btn" onClick={() => setRemovePhoto(true)}>ลบรูปนี้</button>
            )}
            <input ref={fileInputRef} type="file" accept="image/*" style={{ display: 'none' }} onChange={handleFilePick} />
            {photoError && <p className="hint bad" style={{ margin: '2px 0 0' }}>{photoError}</p>}
          </div>
        </div>
        <p className="scanner-hint" style={{ margin: '6px 0 0' }}>รูปนี้จะแสดงให้เห็นตอนสแกนยืม-คืนเครื่องมือชิ้นนี้ เพื่อช่วยให้ผู้ยืมตรวจสอบว่าหยิบเครื่องมือถูกชิ้น</p>
      </div>
      <div className="form-group">
        <label>รหัสเครื่องมือ</label>
        <input className="mono" value={form.code} onChange={e => setForm({ ...form, code: normalizeCode(e.target.value) })} placeholder="เช่น PWR-005" />
      </div>
      <div className="form-group">
        <label>ชื่อเครื่องมือ</label>
        <input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="เช่น สว่านไฟฟ้า Bosch" />
      </div>
      <div className="form-group">
        <label>หมวดหมู่</label>
        <select value={form.category} onChange={e => setForm({ ...form, category: e.target.value })}>
          {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
        </select>
      </div>
      <div className="form-group">
        <label>คลังเครื่องมือ <span className="required-dot">*</span></label>
        {warehouses && warehouses.length ? (
          <select value={form.warehouseId || ''} onChange={e => setForm({ ...form, warehouseId: e.target.value, shelfId: '' })}>
            <option value="" disabled>เลือกคลังเครื่องมือ</option>
            {warehouses.map(w => <option key={w.id} value={w.id}>{w.name}</option>)}
          </select>
        ) : (
          <div className="hint bad">ยังไม่มีคลังเครื่องมือในระบบ กรุณาไปเพิ่มที่เมนู "คลังเครื่องมือ" ก่อน</div>
        )}
      </div>

      {shelves && (
        <div className="form-group">
          <label>วางที่ชั้น</label>
          {(() => {
            const shelfOptions = shelves.filter(s => s.warehouseId === form.warehouseId);
            if (!form.warehouseId) {
              return <div className="hint">เลือกคลังเครื่องมือก่อนจึงจะเลือกชั้นวางได้</div>;
            }
            if (!shelfOptions.length) {
              return <div className="hint">คลังนี้ยังไม่มีชั้นวาง — จะเพิ่มเครื่องมือแบบยังไม่จัดชั้น (ไปจัดเข้าชั้นทีหลังได้)</div>;

              <select value={form.shelfId || ''} onChange={e => setForm({ ...form, shelfId: e.target.value })}>
                <option value="">ยังไม่จัดชั้น</option>
                {shelfOptions.map(s => {
                  const count = tools ? tools.filter(t => t.shelfId === s.id).length : null;
                  const full = count !== null && count >= SHELF_CAPACITY;
                  return (
                    <option key={s.id} value={s.id} disabled={full}>
                      {s.name}{count !== null ? ` (${count}/${SHELF_CAPACITY}${full ? ' — เต็ม' : ''})` : ''}
                    </option>
                  );
                })}
              </select>
            );
          })()}
        </div>
      )}

      <div className="loan-doc-block" style={{ marginTop: 4 }}>
        <div className="loan-doc-title"><FileSpreadsheet size={14} /> ข้อมูลสำหรับใบยืม-คืน (LBC-FM-034)</div>
        <div className="form-group">
          <label>เครื่องมือชิ้นนี้ต้องออกใบยืม-คืนเครื่องมือ (LBC-FM-034) หรือไม่?</label>
          <div className="wh-switch">
            <button type="button" className={`wh-switch-item ${!form.requiresLoanForm ? 'active' : ''}`} onClick={() => setForm({ ...form, requiresLoanForm: false })}>ไม่ต้องออกใบ</button>
            <button type="button" className={`wh-switch-item ${form.requiresLoanForm ? 'active' : ''}`} onClick={() => setForm({ ...form, requiresLoanForm: true })}>ต้องออกใบ</button>
          </div>
          <p className="scanner-hint" style={{ margin: '6px 0 0' }}>ถ้าไม่ต้องออกใบ ระบบจะข้ามขั้นตอนกรอกใบยืม-คืนไปเลยตอนสแกนยืม-คืนเครื่องมือชิ้นนี้</p>
        </div>
        {form.requiresLoanForm && (
          <>
            <p className="scanner-hint" style={{ margin: '2px 0 8px' }}>กรอกไว้ครั้งเดียวที่นี่ ระบบจะดึงไปกรอกในใบยืม-คืนให้อัตโนมัติทุกครั้งที่มีการยืมเครื่องมือชิ้นนี้ ไม่ต้องพิมพ์ซ้ำ</p>
            <div className="loan-doc-grid">
              <div className="form-group"><label>P/N</label><input value={form.partNo || ''} onChange={e => setForm({ ...form, partNo: e.target.value })} /></div>
              <div className="form-group"><label>S/N</label><input value={form.serialNo || ''} onChange={e => setForm({ ...form, serialNo: e.target.value })} /></div>
              <div className="form-group"><label>Calibration Date</label><input type="date" value={form.calibDate || ''} onChange={e => setForm({ ...form, calibDate: e.target.value })} /></div>
              <div className="form-group"><label>Calibration Due</label><input type="date" value={form.calibDue || ''} onChange={e => setForm({ ...form, calibDue: e.target.value })} /></div>
            </div>
          </>
        )}
      </div>

      <div className="form-actions">
        <button type="button" className="btn btn-secondary" onClick={onCancel}>ยกเลิก</button>
        <button type="submit" className="btn btn-primary" disabled={!warehouses || !warehouses.length}>บันทึก</button>
      </div>
    </form>
    {showCamera && (
      <PhotoCaptureModal
        title="ถ่ายรูปเครื่องมือ"
        hint="ถ่ายให้เห็นตัวเครื่องมือชัดเจน รูปนี้จะใช้เป็นรูปอ้างอิงตอนสแกนยืม-คืนเครื่องมือชิ้นนี้"
        onCapture={(dataUrl) => { setNewPhoto(dataUrl); setRemovePhoto(false); setPhotoError(''); setShowCamera(false); }}
        onClose={() => setShowCamera(false)}
      />

    </>
  );

function CalibrationReceiveForm({ tool, onSave, onCancel }) {
  const [receivedAt, setReceivedAt] = useState(todayISO());
  // Deliberately blank rather than pre-filled with the old dates: the whole
  // point of the receive step is to capture the NEW calibration window, and
  // pre-filling would make it far too easy to save the expired one by accident.
  const [calibDate, setCalibDate] = useState('');
  const [calibDue, setCalibDue] = useState('');
