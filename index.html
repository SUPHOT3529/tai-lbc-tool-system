/* ---------------------------- Settings Page ---------------------------- */
// Shared by the manual "สำรองข้อมูล (ZIP)" button and the automatic Friday
// 20:00 safety-net backup — builds the same Excel+photos ZIP either way.
// `auto: true` skips the interactive save-picker/share-sheet paths, since
// both require a user gesture (a real click) and would just throw when
// invoked from a timer with no click behind it; the plain triggered download
// is the only path that reliably works unattended.
async function runFullBackup({ tools, warehouses, staff, tx, settings, setSettings, addAudit, showToast, toolStatus, auto, shelves, scopeWarehouseId = null }) {
  try {
    // Warehouse-scoped export: narrow the dataset ONCE, right here, so every
    // consumer below — photo bundling, all four Excel sheets, the audit line,
    // the filename — sees only the warehouse being exported. Narrowing per
    // consumer instead is how a scoped export ends up leaking the one
    // collection someone forgot to filter.
    const scopeWarehouse = scopeWarehouseId ? warehouses.find(w => w.id === scopeWarehouseId) : null;
    if (scopeWarehouseId) {
      tools = tools.filter(t => t.warehouseId === scopeWarehouseId);
      const inScope = new Set(tools.map(t => t.id));
      tx = tx.filter(t => inScope.has(t.toolId));
      warehouses = scopeWarehouse ? [scopeWarehouse] : [];
    }
    // Staff stay whole: the roster is organization-wide reference data that
    // every admin can already see in the app, and stripping it would leave the
    // borrow history in the export with no names to read it against.
    const scopedToolIds = new Set(tools.map(t => t.id));
    const scopedTxIds = new Set(tx.map(t => t.id));
    const scopedShelfIds = new Set((shelves || []).filter(sh => !scopeWarehouseId || sh.warehouseId === scopeWarehouseId).map(sh => sh.id));
    await ensureJsZip();
    const zip = new window.JSZip();

    let photoCount = 0;
    // Filename cross-reference per category — used below to add a "which
    // file is this photo" column to the Excel sheets, keyed by the same id
    // the photo's storage key was keyed by (toolId / staffId / txId).
    const photoRefs = { master: {}, staff: {}, borrow: {}, return: {} };
    try {
      const list = await window.storage.list('toolcrib-photo:', true);
      const toolById = new Map(tools.map(t => [t.id, t]));
      const staffById = new Map(staff.map(s => [s.id, s]));
      const txById = new Map(tx.map(t => [t.id, t]));

      const keys = list?.keys || [];

      // The slow part of a backup was always here: with a couple hundred
      // photos, fetching them one at a time (each a full Supabase round
      // trip) could take a minute or more on its own. Fetching up to 8 at
      // once cuts that down to roughly total-time / 8 for this step.
      const fetched = await mapWithConcurrency(keys, 8, async (key) => {
        try { return await storageGet(key, true); } catch (err) { console.error('failed to fetch photo for backup', key, err); return null; }
      });

      for (let i = 0; i < keys.length; i++) {
        const key = keys[i];
        const raw = fetched[i];
        if (!raw) continue;
        const match = /^data:image\/(\w+);base64,(.*)$/.exec(raw);
        if (!match) continue;
        const ext = match[1] === 'jpeg' ? 'jpg' : match[1];
        const data = match[2];

        // toolcrib-photo:master:{toolId} — tool registration photo
        let m = /^toolcrib-photo:master:(.+)$/.exec(key);
        if (m) {
          if (scopeWarehouseId && !scopedToolIds.has(m[1])) continue;
          const tool = toolById.get(m[1]);
          const name = `${tool?.code || m[1]}.${ext}`;
          zip.file(`1_รูปเครื่องมือที่ลงทะเบียน/${name}`, data, { base64: true });
          photoRefs.master[m[1]] = `1_รูปเครื่องมือที่ลงทะเบียน/${name}`;
          photoCount++;
          continue;
        }
        // toolcrib-photo:staff:{staffId} — staff profile photo
        m = /^toolcrib-photo:staff:(.+)$/.exec(key);
        if (m) {
          const s = staffById.get(m[1]);
          const name = `${s?.code || m[1]}.${ext}`;
          zip.file(`2_รูปพนักงานที่ลงทะเบียน/${name}`, data, { base64: true });
          photoRefs.staff[m[1]] = `2_รูปพนักงานที่ลงทะเบียน/${name}`;
          photoCount++;
          continue;
        }
        // toolcrib-photo:{txId}:borrow|return — borrow/return evidence
        m = /^toolcrib-photo:([^:]+):(borrow|return)$/.exec(key);
        if (m) {
          if (scopeWarehouseId && !scopedTxIds.has(m[1])) continue;
          const record = txById.get(m[1]);
          const tool = record ? toolById.get(record.toolId) : null;
          const st = record ? staffById.get(record.staffId) : null;
          const dateSrc = m[2] === 'borrow' ? record?.borrowDate : (record?.returnDate || record?.borrowDate);
          const parsedDate = dateSrc ? parseDateValue(dateSrc) : null;
          const dateTag = parsedDate ? ddmmyyyyTag(parsedDate) : 'unknown';
          const tag = m[2] === 'borrow' ? 'Bef' : 'Aft';
          const folder = m[2] === 'borrow' ? '3_รูปก่อนยืม' : '4_รูปหลังยืม';
          const name = `${tool?.code || 'unknown'}${st?.code || 'unknown'}${tag}${dateTag}.${ext}`;
          zip.file(`${folder}/${name}`, data, { base64: true });
          photoRefs[m[2]][m[1]] = `${folder}/${name}`;
          photoCount++;
          continue;
        }
        // toolcrib-photo:damage:{toolId}:{adminCode}:{timestamp} — sent-for-repair evidence
        m = /^toolcrib-photo:damage:([^:]+):([^:]+):(\d+)$/.exec(key);
        if (m) {
          if (scopeWarehouseId && !scopedToolIds.has(m[1])) continue;
          const tool = toolById.get(m[1]);
          const dateTag = ddmmyyyyTag(new Date(Number(m[3])));
          const name = `Main${tool?.code || 'unknown'}${m[2]}${dateTag}.${ext}`;
          zip.file(`5_รูปเครื่องมือส่งซ่อม/${name}`, data, { base64: true });
          photoCount++;
          continue;
        }
        // toolcrib-photo:calibration:{toolId}:{adminCode}:{timestamp} — sent-for-calibration evidence
        m = /^toolcrib-photo:calibration:([^:]+):([^:]+):(\d+)$/.exec(key);
        if (m) {
          if (scopeWarehouseId && !scopedToolIds.has(m[1])) continue;
          const tool = toolById.get(m[1]);
          const dateTag = ddmmyyyyTag(new Date(Number(m[3])));
          const name = `Cal${tool?.code || 'unknown'}${m[2]}${dateTag}.${ext}`;
          zip.file(`6_รูปเครื่องมือส่งสอบเทียบ/${name}`, data, { base64: true });
          photoCount++;
          continue;
        }
        // Anything else (e.g. shelf photos) — kept in a catch-all folder so
        // nothing silently gets dropped from the backup.
        // Shelf photos carry their warehouse via the shelf record; anything
        // else in here can't be attributed to a warehouse at all, so a scoped
        // export leaves it out rather than guessing.
        if (scopeWarehouseId) {
          const shelfMatch = /^toolcrib-photo:shelf:(.+)$/.exec(key);
          const whMatch = /^toolcrib-photo:warehouse:(.+)$/.exec(key);
          const keepShelf = shelfMatch && scopedShelfIds.has(shelfMatch[1]);
          const keepWarehouse = whMatch && whMatch[1] === scopeWarehouseId;
          if (!keepShelf && !keepWarehouse) continue;
        }
        const safeName = key.replace(/^toolcrib-photo:/, '').replace(/:/g, '_');
        zip.file(`อื่นๆ/${safeName}.${ext}`, data, { base64: true });
        photoCount++;
      }
    } catch (err) { console.error('failed to bundle photos into backup', err); }

    // Reserved even when nothing has been sent for repair/calibration yet
    // (or the photo step was skipped, since it's optional) — keeps the
    // folder structure consistent and visible rather than only appearing
    // once something happens to land in it.
    zip.folder('5_รูปเครื่องมือส่งซ่อม');
    zip.folder('6_รูปเครื่องมือส่งสอบเทียบ');

    const wb = XLSX.utils.book_new();
    wb.SheetNames.push('รายการเครื่องมือ');
    wb.Sheets['รายการเครื่องมือ'] = XLSX.utils.json_to_sheet(
      buildToolReportRows(tools, warehouses, toolStatus).map(row => {
        const tool = tools.find(t => t.code === row.รหัสเครื่องมือ);
        return { ...row, 'ไฟล์รูปเครื่องมือ': (tool && photoRefs.master[tool.id]) || '-' };
      })
    );
    wb.SheetNames.push('คลังเครื่องมือ');
    wb.Sheets['คลังเครื่องมือ'] = XLSX.utils.json_to_sheet(warehouses.map(w => ({ ชื่อคลัง: w.name, หมายเหตุ: w.note || '' })));
    wb.SheetNames.push('พนักงาน');
    wb.Sheets['พนักงาน'] = XLSX.utils.json_to_sheet(staff.map(s => ({
      รหัสพนักงาน: s.code, 'ชื่อ-สกุล': s.name, สังกัด: s.dept,
      'ไฟล์รูปพนักงาน': photoRefs.staff[s.id] || '-',
    })));
    wb.SheetNames.push('ประวัติยืม-คืน');
    wb.Sheets['ประวัติยืม-คืน'] = XLSX.utils.json_to_sheet(tx.map(t => {
      const tool = tools.find(x => x.id === t.toolId); const st = staff.find(x => x.id === t.staffId);
      return {
        รหัสเครื่องมือ: tool?.code || '-', ชื่อเครื่องมือ: tool?.name || '-',
        ผู้ยืม: st?.name || '-', สังกัด: st?.dept || '-',
        'วันเวลาที่ยืม': fmtThaiDateTime(t.borrowDate), กำหนดคืน: fmtThaiDate(t.dueDate),
        'วันเวลาที่คืน': t.returnDate ? fmtThaiDateTime(t.returnDate) : 'ยังไม่คืน',
        'ไฟล์รูปก่อนยืม': t.photosPurged ? 'ลบแล้ว' : (photoRefs.borrow[t.id] || '-'),
        'ไฟล์รูปหลังยืม': t.photosPurged ? 'ลบแล้ว' : (photoRefs.return[t.id] || '-'),
      };
    }));
    const xlsxArrayBuffer = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    zip.file(`ข้อมูลระบบ${scopeWarehouse ? `-${scopeWarehouse.name}` : ''}-${todayISO()}.xlsx`, xlsxArrayBuffer);

    const blob = await zip.generateAsync({ type: 'blob' });
    // Name the scope into the file itself — a folder of ZIPs that all read
    // "สำรองข้อมูลระบบ" is unusable once there is one per warehouse.
    const scopeTag = scopeWarehouse ? scopeWarehouse.name.replace(/[\\/:*?"<>|]/g, '') : 'ทุกคลัง';
    const filename = `สำรองข้อมูล-${scopeTag}-${todayISO()}${auto ? '-อัตโนมัติ' : ''}.zip`;

    let saved = true;
    if (!auto && window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{ description: 'ไฟล์ ZIP', accept: { 'application/zip': ['.zip'] } }],
        });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
      } catch (err) {
        if (err?.name === 'AbortError') { saved = false; } else { throw err; }
      }
    } else if (!auto && navigator.canShare && navigator.canShare({ files: [new File([blob], filename)] })) {
      try {
        await navigator.share({ files: [new File([blob], filename, { type: 'application/zip' })], title: filename });
      } catch (err) {
        if (err?.name === 'AbortError') { saved = false; } else { throw err; }
      }
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }

    if (!saved) return { ok: false, photoCount, cancelled: true };

    const now = new Date().toISOString();
    try { await setSettings({ ...settings, lastBackupAt: now }); } catch (err) { /* the backup file already downloaded either way */ }

    addAudit?.('data_backup', `${scopeWarehouse ? `สำรองข้อมูลคลัง ${scopeWarehouse.name}` : 'สำรองข้อมูลทั้งหมด'} (${tools.length} เครื่องมือ, ${staff.length} พนักงาน, ${tx.length} ประวัติ, ${photoCount} รูปภาพ)${auto ? ' — ระบบสำรองให้อัตโนมัติ (ลืมกดสำรองเอง)' : ''}`);
    if (showToast) showToast(`สำรองข้อมูลเรียบร้อย (รวมรูปหลักฐาน ${photoCount} รูป)${auto ? ' — ระบบสำรองให้อัตโนมัติเพราะยังไม่ได้กดสำรองวันนี้' : ''}`, 'success');
    return { ok: true, photoCount };
  } catch (err) {
    console.error('backup failed', err);
    if (showToast) showToast('สำรองข้อมูลไม่สำเร็จ กรุณาลองใหม่', 'error');
    return { ok: false, error: err };
  }
}

function SettingsPage({ settings, setSettings, showToast, addAudit, tools, setTools, warehouses, staff, setStaff, users, setUsers, tx, setTx, toolStatus, onPurgePhotos, isMainAdmin, shelves }) {
  const [importPreview, setImportPreview] = useState(null); // { toAdd, toUpdate, errors }
  const [importBusy, setImportBusy] = useState(false);
  const [codeCleanupBusy, setCodeCleanupBusy] = useState(false);
  const fileInputRef = React.useRef(null);
  const [staffImportPreview, setStaffImportPreview] = useState(null);
  const [staffImportBusy, setStaffImportBusy] = useState(false);
  const [purgeBusy, setPurgeBusy] = useState(false);
  const [purgeDays, setPurgeDays] = useState('');
  const [purgeConfirmOpen, setPurgeConfirmOpen] = useState(false);
  const [historyDeleteDays, setHistoryDeleteDays] = useState(90);
  const [historyDeleteBusy, setHistoryDeleteBusy] = useState(false);
  const [historyConfirmOpen, setHistoryConfirmOpen] = useState(false);
  const staffFileInputRef = React.useRef(null);
  const [newAccounts, setNewAccounts] = useState(null); // temp-password results shown once after staff import
  const [backupBusy, setBackupBusy] = useState(false);

  // Irreversible and scoped to the main admin only (enforced here too, not
  // just by hiding the control in the UI) — only touches RETURNED items older
  // than the cutoff, so nothing currently borrowed can ever be deleted out
  // from under an active loan.
  async function confirmPurgePhotos() {
    setPurgeConfirmOpen(false);
    setPurgeBusy(true);
    const n = await onPurgePhotos?.(purgeDays ? Number(purgeDays) : undefined);
    setPurgeBusy(false);
    showToast(n > 0 ? `ลบรูปหลักฐาน ${n} รูปเรียบร้อย` : 'ไม่มีรูปหลักฐานให้ลบตามเงื่อนไขนี้', 'success');
  }

  async function deleteOldHistory() {
    if (!isMainAdmin) return showToast('มีแต่แอดมินหลักเท่านั้นที่ลบประวัติได้', 'error');
    const days = Number(historyDeleteDays);
    if (!days || days < 1) return showToast('กรุณาระบุจำนวนวันให้ถูกต้อง', 'error');
    const cutoff = addDays(todayISO(), -days);
    const toDelete = tx.filter(t => t.returnDate && localISODate(parseDateValue(t.returnDate)) < cutoff);
    setHistoryConfirmOpen(false);
    if (!toDelete.length) return showToast('ไม่มีประวัติที่เก่ากว่าที่กำหนดให้ลบ', 'success');
    setHistoryDeleteBusy(true);
    const deleteIds = new Set(toDelete.map(t => t.id));
    try {
      await setTx(tx.filter(t => !deleteIds.has(t.id)));
      // Evidence photos for the deleted transactions (if any survived an
      // earlier purge) are cleaned up alongside the history rows themselves.
      for (const t of toDelete) {
        if (t.hasBorrowPhoto) await storageDelete(`toolcrib-photo:${t.id}:borrow`, true);
        if (t.hasReturnPhoto) await storageDelete(`toolcrib-photo:${t.id}:return`, true);
      }
    } catch (err) {
      console.error('failed to delete old history', err);
      setHistoryDeleteBusy(false);
      return showToast('ลบประวัติไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    setHistoryDeleteBusy(false);
    addAudit?.('history_delete', `ลบประวัติยืม-คืนที่เก่ากว่า ${days} วัน (${toDelete.length} รายการ)`);
    showToast(`ลบประวัติเก่าเรียบร้อย (${toDelete.length} รายการ)`, 'success');
  }

  // '' means every warehouse in one file, which is the original behaviour and
  // stays the default — scoping is an extra the main admin opts into per export.
  const [backupScope, setBackupScope] = useState('');
  async function doFullBackup() {
    setBackupBusy(true);
    await runFullBackup({ tools, warehouses, staff, tx, settings, setSettings, addAudit, showToast, toolStatus, shelves, scopeWarehouseId: backupScope || null });
    setBackupBusy(false);
  }

  const [backupPdfBusy, setBackupPdfBusy] = useState(false);
  async function doExportBackupPDF() {
    setBackupPdfBusy(true);
    try {
      await exportBackupPDF(tools, warehouses, staff, tx, toolStatus, shelves);
      addAudit?.('data_backup', `ส่งออกสรุปข้อมูลเป็น PDF (${tools.length} เครื่องมือ, ${staff.length} พนักงาน, ${tx.length} ประวัติ)`);
      showToast('สร้างไฟล์ PDF สรุปข้อมูลเรียบร้อย', 'success');
    } catch (err) {
      console.error('failed to export backup PDF', err);
      showToast('สร้างไฟล์ PDF ไม่สำเร็จ กรุณาลองใหม่', 'error');
    }
    setBackupPdfBusy(false);
  }

  async function handleFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setImportBusy(true);
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const sheetName = wb.SheetNames.includes('รายการเครื่องมือ') ? 'รายการเครื่องมือ' : wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '' });
      const toAdd = [], toUpdate = [], errors = [];
      // Codes already claimed by an earlier row of THIS file — otherwise a file
      // listing the same code twice would create two tools sharing a code, and
      // scanning that code would become ambiguous.
      const seenInFile = new Set();
      rows.forEach((r, i) => {
        const code = normalizeCode(String(r['รหัสเครื่องมือ'] || '').trim());
        const name = String(r['ชื่อเครื่องมือ'] || '').trim();
        const catLabel = String(r['หมวดหมู่'] || '').trim();
        const whName = String(r['คลังเครื่องมือ'] || '').trim();
        if (!code || !name) { errors.push({ row: i + 2, reason: 'ไม่มีรหัสหรือชื่อเครื่องมือ' }); return; }
        const key = code.toLowerCase();
        if (seenInFile.has(key)) { errors.push({ row: i + 2, reason: `รหัสเครื่องมือ "${code}" ซ้ำกับแถวก่อนหน้าในไฟล์นี้` }); return; }
        seenInFile.add(key);
        const matchedWh = warehouses.find(w => w.name.trim().toLowerCase() === whName.toLowerCase());
        if (!matchedWh) { errors.push({ row: i + 2, reason: `ไม่พบคลัง "${whName || '(ว่าง)'}" ในระบบ` }); return; }
        const matchedCat = CATEGORIES.find(c => c.label === catLabel);
        const existing = tools.find(t => t.code.toLowerCase() === key);
        const entry = { code, name, category: matchedCat?.id || 'other', warehouseId: matchedWh.id };
        if (existing) toUpdate.push({ ...entry, id: existing.id });
        else toAdd.push(entry);
      });
      setImportPreview({ toAdd, toUpdate, errors });
    } catch (err) {
      showToast('อ่านไฟล์ไม่สำเร็จ กรุณาตรวจสอบว่าเป็นไฟล์ Excel ที่ถูกต้อง', 'error');
    }
    setImportBusy(false);
    if (fileInputRef.current) fileInputRef.current.value = '';
  }

  async function confirmImport() {
    if (!importPreview) return;
    const additions = importPreview.toAdd.map(e => ({ ...e, id: uid('T'), condition: 'normal' }));
    const updateMap = new Map(importPreview.toUpdate.map(e => [e.id, e]));
    const nextTools = [
      ...tools.map(t => updateMap.has(t.id) ? { ...t, code: updateMap.get(t.id).code, name: updateMap.get(t.id).name, category: updateMap.get(t.id).category, warehouseId: updateMap.get(t.id).warehouseId } : t),
      ...additions
    ];
    try {
      await setTools(nextTools);
    } catch (err) {
      console.error('failed to import tools', err);
      return showToast('นำเข้าไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    addAudit?.('data_import', `นำเข้าเครื่องมือ: เพิ่ม ${additions.length}, อัปเดต ${importPreview.toUpdate.length}, ข้าม ${importPreview.errors.length}`);
    showToast(`นำเข้าข้อมูลเรียบร้อย (เพิ่ม ${additions.length}, อัปเดต ${importPreview.toUpdate.length})`, 'success');
    setImportPreview(null);
  }

  // The normalizeCode fix in the tool form only cleans a code the next time
  // someone saves THAT tool — it does nothing to codes already sitting in
  // storage from before the fix existed. This scans every existing tool at
  // once and fixes any whose code still has an accent mark or similar
  // lookalike character, without needing to open and re-save each one by hand.
  async function cleanupToolCodes() {
    const fixes = tools
      .map(t => ({ tool: t, clean: normalizeCode(t.code) }))
      .filter(({ tool, clean }) => clean !== tool.code);
    if (!fixes.length) return showToast('รหัสเครื่องมือทั้งหมดปกติดีอยู่แล้ว ไม่พบตัวที่ต้องแก้', 'success');
    // A cleaned code could collide with one that already exists (rare, but
    // possible) — those are skipped and reported rather than silently
    // creating a duplicate code.
    const existingCodes = new Set(tools.map(t => t.code.toLowerCase()));
    const toFix = [], skipped = [];
    fixes.forEach(({ tool, clean }) => {
      if (existingCodes.has(clean.toLowerCase()) && clean.toLowerCase() !== tool.code.toLowerCase()) {
        skipped.push(tool.code);
      } else {
        toFix.push({ id: tool.id, from: tool.code, clean });
      }
    });
    if (!toFix.length) return showToast(`พบรหัสผิดปกติ ${fixes.length} รายการ แต่แก้ไม่ได้เพราะจะซ้ำกับรหัสที่มีอยู่แล้ว — กรุณาแก้เองทีละตัว`, 'error');
    setCodeCleanupBusy(true);
    const fixMap = new Map(toFix.map(f => [f.id, f.clean]));
    try {
      await setTools(tools.map(t => fixMap.has(t.id) ? { ...t, code: fixMap.get(t.id) } : t));
    } catch (err) {
      console.error('failed to clean up tool codes', err);
      setCodeCleanupBusy(false);
      return showToast('แก้ไขรหัสไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    setCodeCleanupBusy(false);
    addAudit?.('data_import', `ล้างอักขระผิดปกติในรหัสเครื่องมือ ${toFix.length} รายการ: ${toFix.map(f => `${f.from}→${f.clean}`).join(', ')}`);
    showToast(`แก้รหัสเครื่องมือเรียบร้อย ${toFix.length} รายการ${skipped.length ? ` (ข้าม ${skipped.length} รายการเพราะซ้ำกับรหัสเดิม)` : ''}`, 'success');
  }

  function genTempPassword() {
    const chars = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789'; // no 0/O/1/l/I to avoid confusion when printed
    let out = '';
    for (let i = 0; i < 8; i++) out += chars[Math.floor(Math.random() * chars.length)];
    return out;
  }

  async function handleStaffFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setStaffImportBusy(true);
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const sheetName = wb.SheetNames.includes('พนักงาน') ? 'พนักงาน' : wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '' });
      const toAdd = [], toUpdate = [], errors = [];
      // Codes already claimed by an earlier row of THIS file. Without this, a
      // file listing the same code twice would create two staff records and two
      // login accounts sharing one username.
      const seenInFile = new Set();
      rows.forEach((r, i) => {
        const code = String(r['รหัสพนักงาน'] || '').trim();
        const name = String(r['ชื่อ-สกุล'] || r['ชื่อ'] || '').trim();
        const dept = String(r['สังกัด'] || '').trim();
        if (!code || !name) { errors.push({ row: i + 2, reason: 'ไม่มีรหัสพนักงานหรือชื่อ' }); return; }
        const key = code.toLowerCase();
        if (seenInFile.has(key)) { errors.push({ row: i + 2, reason: `รหัสพนักงาน "${code}" ซ้ำกับแถวก่อนหน้าในไฟล์นี้` }); return; }
        seenInFile.add(key);
        const existing = staff.find(s => s.code.toLowerCase() === key);
        if (existing) toUpdate.push({ id: existing.id, code, name, dept });
        else toAdd.push({ code, name, dept });
      });
      setStaffImportPreview({ toAdd, toUpdate, errors });
    } catch (err) {
      showToast('อ่านไฟล์ไม่สำเร็จ กรุณาตรวจสอบว่าเป็นไฟล์ Excel ที่ถูกต้อง', 'error');
    }
    setStaffImportBusy(false);
    if (staffFileInputRef.current) staffFileInputRef.current.value = '';
  }

  async function confirmStaffImport() {
    if (!staffImportPreview) return;
    const tempList = []; // { code, name, tempPassword } — shown once, never retrievable again
    const newStaffRecords = [];
    const newUserRecords = [];
    for (const entry of staffImportPreview.toAdd) {
      const newStaffRec = { id: uid('S'), code: entry.code, name: entry.name, dept: entry.dept };
      const tempPassword = genTempPassword();
      const passwordHash = await hashPassword(tempPassword);
      newStaffRecords.push(newStaffRec);
      newUserRecords.push({ id: uid('U'), username: newStaffRec.code, passwordHash, role: 'staff', staffId: newStaffRec.id });
      tempList.push({ code: newStaffRec.code, name: newStaffRec.name, tempPassword });
    }
    const updateMap = new Map(staffImportPreview.toUpdate.map(e => [e.id, e]));
    const nextStaff = [
      ...staff.map(s => updateMap.has(s.id) ? { ...s, code: updateMap.get(s.id).code, name: updateMap.get(s.id).name, dept: updateMap.get(s.id).dept } : s),
      ...newStaffRecords
    ];
    // The employee code doubles as the login username — if the import
    // corrects a code, the linked account's username must follow it,
    // otherwise that person's login would silently stop matching their staff
    // record (same sync rule StaffPage.save() already applies for manual edits).
    const nextUsers = users.map(u => {
      if (!u.staffId || !updateMap.has(u.staffId)) return u;
      return { ...u, username: updateMap.get(u.staffId).code };
    });
    try {
      await setStaff(nextStaff);
      if (newUserRecords.length || updateMap.size) await setUsers([...newUserRecords, ...nextUsers]);
    } catch (err) {
      console.error('failed to import staff', err);
      return showToast('นำเข้าไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่ (บัญชีบางส่วนอาจยังไม่ถูกสร้าง)', 'error');
    }
    addAudit?.('data_import', `นำเข้าพนักงาน: เพิ่ม ${newStaffRecords.length}, อัปเดต ${staffImportPreview.toUpdate.length}, ข้าม ${staffImportPreview.errors.length}`);
    showToast(`นำเข้าข้อมูลพนักงานเรียบร้อย (เพิ่ม ${newStaffRecords.length}, อัปเดต ${staffImportPreview.toUpdate.length})`, 'success');
    setStaffImportPreview(null);
    if (tempList.length) setNewAccounts(tempList);
  }

  function downloadTempPasswordList() {
    if (!newAccounts) return;
    const wb = XLSX.utils.book_new();
    wb.SheetNames.push('รหัสผ่านชั่วคราว');
    wb.Sheets['รหัสผ่านชั่วคราว'] = XLSX.utils.json_to_sheet(
      newAccounts.map(a => ({ 'ชื่อผู้ใช้งาน (รหัสพนักงาน)': a.code, 'ชื่อ-สกุล': a.name, 'รหัสผ่านชั่วคราว': a.tempPassword }))
    );
    XLSX.writeFile(wb, `รหัสผ่านชั่วคราว-${todayISO()}.xlsx`);
  }

  return (
    <div className="page-stack">
      <section className="panel">
        <div className="dm-header">
          <div className="dm-header-icon"><FileSpreadsheet size={24} /></div>
          <div>
            <div className="dm-header-title">จัดการข้อมูลส่วนกลาง</div>
            <div className="dm-header-sub">รวมเครื่องมือสำรองและนำเข้าข้อมูลไว้ในที่เดียว</div>
            <div className="dm-header-desc">
              ข้อมูลของระบบนี้ถูกเก็บและซิงก์แบบส่วนกลางอยู่แล้วโดยอัตโนมัติ ทุกคนที่เข้าลิงก์นี้ไม่ว่าจากมือถือ แท็บเล็ต หรือคอมพิวเตอร์
              จะเห็นข้อมูลชุดเดียวกันแบบเรียลไทม์ — ส่วนนี้เป็นเครื่องมือเสริมสำหรับสำรอง/นำเข้าข้อมูลเป็นไฟล์ Excel เผื่อต้องการเก็บสำเนาไว้ภายนอกระบบ
            </div>
          </div>
        </div>

        <div className="dm-grid">
          {/* การ์ด 1: สำรองข้อมูลทั้งหมด */}
          <div className="dm-card">
            <div className="dm-card-icon tone-green"><Download size={20} /></div>
            <div>
              <div className="dm-card-title tone-green">สำรองข้อมูลทั้งหมด</div>
              <div className="dm-card-desc">ดาวน์โหลดเครื่องมือ, คลัง, พนักงาน, ประวัติยืม-คืน และรูปหลักฐานทั้งหมด เป็นไฟล์ ZIP ชุดเดียว — รูปแยกเป็นโฟลเดอร์ตามประเภท (เครื่องมือ/พนักงาน/ก่อนยืม/หลังยืม) ตั้งชื่อไฟล์ตามรหัสเครื่องมือ-พนักงาน</div>
            </div>
            <div className="dm-card-actions">
              <select className="input" value={backupScope} disabled={backupBusy}
                onChange={e => setBackupScope(e.target.value)}
                style={{ marginBottom: 8 }}>
                <option value="">ทุกคลัง (รวมในไฟล์เดียว)</option>
                {warehouses.map(w => <option key={w.id} value={w.id}>เฉพาะคลัง: {w.name}</option>)}
              </select>
              <button className="dm-card-btn tone-green" onClick={doFullBackup} disabled={backupBusy}>
                {backupBusy ? <Loader2 size={16} className="spin" /> : <Download size={16} />}
                <span className="dm-card-btn-label">สำรองข้อมูล (ZIP)<small>{backupBusy ? 'กำลังสำรองข้อมูล…' : (backupScope ? `เฉพาะคลัง ${warehouses.find(w => w.id === backupScope)?.name || ''}` : 'ดาวน์โหลดไฟล์ ZIP')}</small></span>
              </button>
              <button className="dm-card-btn tone-green" onClick={doExportBackupPDF} disabled={backupPdfBusy}>
                {backupPdfBusy ? <Loader2 size={16} className="spin" /> : <FileSpreadsheet size={16} />}
                <span className="dm-card-btn-label">สรุปข้อมูล (PDF)<small>{backupPdfBusy ? 'กำลังสร้างไฟล์…' : 'จัดหน้า A4 พร้อมพิมพ์'}</small></span>
              </button>
            </div>
            <div className="dm-card-note tone-neutral">
              <Layers size={13} style={{ flexShrink: 0, marginTop: 1 }} />
              <span>
                {window.showSaveFilePicker
                  ? 'กดแล้วเลือกโฟลเดอร์/ไดรฟ์ที่ต้องการบันทึกได้เลย'
                  : (navigator.canShare
                      ? 'กดแล้วเลือก "บันทึกลงใน Files" เพื่อเลือกตำแหน่งบันทึกเอง'
                      : 'ไฟล์จะถูกบันทึกลงโฟลเดอร์ดาวน์โหลดของเบราว์เซอร์')}
              </span>
            </div>
            <div className="dm-card-note tone-green">
              <ShieldCheck size={13} style={{ flexShrink: 0, marginTop: 1 }} />
              <span><b>แนะนำ</b> ควรสำรองข้อมูลเป็นประจำ เพื่อป้องกันข้อมูลสูญหาย</span>
            </div>
          </div>

          {/* การ์ด 2: ล้างอักขระผิดปกติในรหัสเครื่องมือ */}
          <div className="dm-card">
            <div className="dm-card-icon tone-blue"><Lock size={20} /></div>
            <div>
              <div className="dm-card-title tone-blue">ล้างอักขระผิดปกติในรหัสเครื่องมือ</div>
              <div className="dm-card-desc">
                ตรวจทุกรหัสเครื่องมือในระบบ แก้ตัวอักษรที่มีเครื่องหมายเน้นเสียงแฝงอยู่ (เช่น "À" ที่หน้าตาเหมือน "A" แต่เป็นคนละตัวอักษร) ทำให้เรียงลำดับผิดที่ ให้เป็นตัวอักษรปกติทั้งหมดในคลิกเดียว
              </div>
            </div>
            <div className="dm-card-actions">
              <button className="dm-card-btn tone-blue" disabled={codeCleanupBusy} onClick={cleanupToolCodes}>
                {codeCleanupBusy ? <Loader2 size={16} className="spin" /> : <Wrench size={16} />}
                <span className="dm-card-btn-label">ล้างรหัสเครื่องมือทั้งหมด<small>ตรวจและล้างรหัสในคลิกเดียว</small></span>
              </button>
            </div>
          </div>

          {/* การ์ด 3: นำเข้ารายการเครื่องมือ */}
          <div className="dm-card">
            <div className="dm-card-icon tone-green"><FileSpreadsheet size={20} /></div>
            <div>
              <div className="dm-card-title tone-green">นำเข้ารายการเครื่องมือ</div>
              <div className="dm-card-desc">
                อัปโหลดไฟล์ Excel รูปแบบเดียวกับที่ส่งออกจากระบบ (ต้องมีคอลัมน์ รหัสเครื่องมือ, ชื่อเครื่องมือ, คลังเครื่องมือ — ใส่ "หมวดหมู่" เพิ่มได้ ไม่ใส่ก็ได้ จะเข้าเป็น "อื่นๆ")
                — รหัสที่ตรงกับของเดิมจะถูกอัปเดต รหัสใหม่จะถูกเพิ่มเข้าไป
              </div>
            </div>
            <div className="dm-card-actions">
              <button type="button" className="dm-card-btn tone-green" onClick={() => exportToolsExcel(tools, warehouses, toolStatus, 'ทั้งหมด', shelves)} disabled={!tools.length}>
                <Download size={16} />
                <span className="dm-card-btn-label">ส่งออก Excel<small>ดาวน์โหลดเทมเพลต</small></span>
              </button>
              <label className="dm-card-btn tone-green" style={{ cursor: 'pointer' }}>
                {importBusy ? <Loader2 size={16} className="spin" /> : <Upload size={16} />}
                <input ref={fileInputRef} type="file" accept=".xlsx,.xls" style={{ display: 'none' }} onChange={handleFile} disabled={importBusy} />
                <span className="dm-card-btn-label">นำเข้าไฟล์ Excel<small>อัปโหลดไฟล์</small></span>
              </label>
            </div>
          </div>

          {/* การ์ด 4: นำเข้ารายชื่อพนักงาน */}
          <div className="dm-card">
            <div className="dm-card-icon tone-purple"><Users size={20} /></div>
            <div>
              <div className="dm-card-title tone-purple">นำเข้ารายชื่อพนักงาน</div>
              <div className="dm-card-desc">
                อัปโหลดไฟล์ Excel (คอลัมน์ รหัสพนักงาน, ชื่อ-สกุล, สังกัด) — รหัสที่ตรงกับของเดิมจะอัปเดตชื่อ/สังกัด รหัสใหม่จะถูกสร้างบัญชีเข้าระบบให้อัตโนมัติพร้อมรหัสผ่านชั่วคราว
              </div>
            </div>
            <div className="dm-card-actions">
              <button type="button" className="dm-card-btn tone-purple" onClick={() => exportStaffExcel(staff, 'ทั้งหมด')} disabled={!staff.length}>
                <Download size={16} />
                <span className="dm-card-btn-label">ส่งออก Excel<small>ดาวน์โหลดเทมเพลต</small></span>
              </button>
              <label className="dm-card-btn tone-purple" style={{ cursor: 'pointer' }}>
                {staffImportBusy ? <Loader2 size={16} className="spin" /> : <Upload size={16} />}
                <input ref={staffFileInputRef} type="file" accept=".xlsx,.xls" style={{ display: 'none' }} onChange={handleStaffFile} disabled={staffImportBusy} />
                <span className="dm-card-btn-label">นำเข้าไฟล์ Excel<small>อัปโหลดไฟล์</small></span>
              </label>
            </div>
          </div>
        </div>

        <div className="dm-tips-bar">
          <div className="dm-tips-label"><span className="dm-tips-label-icon"><Lightbulb size={15} /></span> เคล็ดลับการใช้งาน</div>
          <div className="dm-tip"><Calendar size={16} /><span><b>แนะนำสำรองรายสัปดาห์</b>ช่วยลดความเสี่ยงข้อมูลสูญหาย</span></div>
          <div className="dm-tip"><ShieldCheck size={16} /><span><b>เก็บไฟล์ในที่ปลอดภัย</b>เช่น Cloud, External Drive</span></div>
          <div className="dm-tip"><RefreshCw size={16} /><span><b>ตรวจสอบข้อมูลเสมอ</b>หลังจากนำเข้าหรือล้างข้อมูล</span></div>
        </div>
      </section>

      <section className="panel">
        <div className="panel-head">
          <h2><ImageIcon size={16} /> รูปหลักฐานยืม-คืน & ประวัติการใช้งาน</h2>
        </div>
        <div className="data-mgmt-block">
          <div>
            <div className="data-mgmt-title">สถานะการเก็บรูปหลักฐาน</div>
            <div className="muted" style={{ fontSize: 12 }}>
              สำรองข้อมูลล่าสุด: {settings.lastBackupAt ? fmtThaiDateTime(settings.lastBackupAt) : 'ยังไม่เคยสำรอง'}
              {' · '}ลบรูปหลักฐานล่าสุด: {settings.lastPhotoCleanupAt ? fmtThaiDateTime(settings.lastPhotoCleanupAt) : 'ยังไม่เคยลบ'}
            </div>
            <div className="muted" style={{ fontSize: 11.5, marginTop: 2 }}>
              แนะนำ: กด "สำรองข้อมูล (ZIP)" ด้านบนเพื่อดาวน์โหลดรูปหลักฐาน+ประวัติทั้งหมดเก็บไว้ก่อน แล้วค่อยลบรูปที่ไม่ต้องการเก็บในระบบต่อจากส่วนนี้
            </div>
          </div>
        </div>
        <div className="data-mgmt-block">
          <div>
            <div className="data-mgmt-title">รีเซ็ตประวัติประจำสัปดาห์อัตโนมัติ (ทุกวันศุกร์ 20:00)</div>
            <div className="muted" style={{ fontSize: 12 }}>
              ทุกวันศุกร์ 20:00 ระบบจะสำรองข้อมูลเป็นไฟล์ให้อัตโนมัติ (ถ้ายังไม่ได้กดสำรองเองวันนั้น) แล้วล้างประวัติยืม-คืนที่คืนแล้วและประวัติกิจกรรมออกจากหน้าจอ — เครื่องมือที่ยังค้างยืมอยู่จะไม่ถูกแตะต้อง
            </div>
            <div className="muted" style={{ fontSize: 11.5, marginTop: 4 }}>
              รีเซ็ตล่าสุด: {settings.lastFridayResetAt ? fmtThaiDate(settings.lastFridayResetAt) : 'ยังไม่เคยรีเซ็ต'}
              {' · '}<span style={{ color: 'var(--danger)' }}>ทำงานเฉพาะตอนมีแอดมินหลักเปิดหน้าจอค้างไว้ช่วงเวลานั้น — ถ้าไม่มีใครเปิดแอปเลยคืนวันศุกร์ สัปดาห์นั้นจะไม่ถูกรีเซ็ต</span>
            </div>
          </div>
          <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, cursor: 'pointer' }}>
            <input type="checkbox" checked={settings.fridayAutoResetEnabled !== false}
              onChange={e => setSettings({ ...settings, fridayAutoResetEnabled: e.target.checked })} />
            เปิดใช้งาน
          </label>
        </div>

        <div className="data-mgmt-block">
          <div>
            <div className="data-mgmt-title">ลบรูปหลักฐานที่เก่ากว่า...</div>
            <div className="muted" style={{ fontSize: 12 }}>ลบเฉพาะไฟล์รูป (ประวัติยืม-คืนยังอยู่ครบ) — เว้นว่างจำนวนวันไว้เพื่อลบรูปทั้งหมดที่มีอยู่ตอนนี้</div>
          </div>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
            <input type="number" min="0" placeholder="ทั้งหมด" style={{ width: 90 }} value={purgeDays} onChange={e => setPurgeDays(e.target.value)} />
            <span className="muted" style={{ fontSize: 12.5 }}>วัน</span>
            <button className="btn btn-secondary" disabled={purgeBusy} onClick={() => setPurgeConfirmOpen(true)}>
              {purgeBusy ? <Loader2 className="spin" size={14} /> : <Trash2 size={14} />} ลบรูปหลักฐาน
            </button>
          </div>
        </div>

        {isMainAdmin && (
          <div className="data-mgmt-block">
            <div>
              <div className="data-mgmt-title">ลบประวัติการยืม-คืน</div>
              <div className="muted" style={{ fontSize: 12 }}>
                ลบรายการประวัติยืม-คืนที่เก่ากว่าจำนวนวันที่กำหนดออกจากระบบถาวร (เฉพาะรายการที่คืนแล้วเท่านั้น) — เฉพาะแอดมินหลักเท่านั้นที่ทำรายการนี้ได้ และย้อนกลับไม่ได้
              </div>
            </div>
            <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
              <input type="number" min="1" style={{ width: 80 }} value={historyDeleteDays} onChange={e => setHistoryDeleteDays(e.target.value)} />
              <span className="muted" style={{ fontSize: 12.5 }}>วัน</span>
              <button className="btn btn-secondary" style={{ borderColor: 'var(--danger)', color: 'var(--danger)' }}
                disabled={historyDeleteBusy} onClick={() => setHistoryConfirmOpen(true)}>
                {historyDeleteBusy ? <Loader2 className="spin" size={14} /> : <Trash2 size={14} />} ลบประวัติเก่า
              </button>
            </div>
          </div>
        )}
      </section>

      {purgeConfirmOpen && (
        <Modal title="ยืนยันการลบรูปหลักฐาน" onClose={() => setPurgeConfirmOpen(false)}>
          <p className="scanner-hint" style={{ background: 'var(--danger-tint)', color: 'var(--danger)', padding: '10px 12px', borderRadius: 10 }}>
            {purgeDays
              ? `จะลบเฉพาะรูปหลักฐานที่ถ่ายไว้ก่อน ${purgeDays} วันที่แล้ว — รูปที่ใหม่กว่านั้นจะยังอยู่ครบ`
              : 'จะลบรูปหลักฐาน "ทั้งหมด" ที่มีอยู่ในระบบตอนนี้ (ทุกวัน ไม่มีการเว้น)'}
            {' '}การลบนี้ถาวรและย้อนกลับไม่ได้ — ตรวจสอบให้แน่ใจว่าดาวน์โหลดสำรองข้อมูล (ZIP) เก็บไว้แล้วก่อนกดยืนยัน ประวัติยืม-คืนจะยังอยู่ในระบบเสมอ มีแค่ตัวรูปที่จะถูกลบ
          </p>
          <div className="form-actions" style={{ marginTop: 10 }}>
            <button type="button" className="btn btn-secondary" onClick={() => setPurgeConfirmOpen(false)}>ยกเลิก</button>
            <button type="button" className="btn btn-primary" style={{ background: 'var(--danger)' }} onClick={confirmPurgePhotos}>ยืนยันลบรูป</button>
          </div>
        </Modal>
      )}

      {historyConfirmOpen && (
        <Modal title="ยืนยันการลบประวัติเก่า" onClose={() => setHistoryConfirmOpen(false)}>
          <p className="scanner-hint" style={{ background: 'var(--danger-tint)', color: 'var(--danger)', padding: '10px 12px', borderRadius: 10 }}>
            การลบนี้ถาวรและย้อนกลับไม่ได้ — จะลบเฉพาะรายการที่ "คืนแล้ว" และเก่ากว่า {historyDeleteDays || 0} วันเท่านั้น (รายการที่ยังค้างยืมอยู่จะไม่ถูกลบ)
          </p>
          <div className="form-actions" style={{ marginTop: 10 }}>
            <button type="button" className="btn btn-secondary" onClick={() => setHistoryConfirmOpen(false)}>ยกเลิก</button>
            <button type="button" className="btn btn-primary" style={{ background: 'var(--danger)' }} onClick={deleteOldHistory}>ยืนยันลบถาวร</button>
          </div>
        </Modal>
      )}

      {importPreview && (
        <Modal title="ตรวจสอบก่อนนำเข้าข้อมูลเครื่องมือ" onClose={() => setImportPreview(null)}>
          <div className="confirm-summary">
            <div className="confirm-row"><span className="confirm-label">รายการใหม่ที่จะเพิ่ม</span><span className="confirm-value">{importPreview.toAdd.length}</span></div>
            <div className="confirm-row"><span className="confirm-label">รายการเดิมที่จะอัปเดต</span><span className="confirm-value">{importPreview.toUpdate.length}</span></div>
            <div className="confirm-row"><span className="confirm-label">แถวที่ข้าม (มีปัญหา)</span><span className="confirm-value">{importPreview.errors.length}</span></div>
          </div>
          {importPreview.errors.length > 0 && (
            <div className="import-error-list">
              {importPreview.errors.slice(0, 10).map((e, i) => (
                <div key={i} className="import-error-row">แถวที่ {e.row}: {e.reason}</div>
              ))}
              {importPreview.errors.length > 10 && <div className="muted" style={{ fontSize: 11 }}>และอีก {importPreview.errors.length - 10} แถว…</div>}
            </div>
          )}
          <div className="form-actions" style={{ marginTop: 10 }}>
            <button type="button" className="btn btn-secondary" onClick={() => setImportPreview(null)}>ยกเลิก</button>
            <button type="button" className="btn btn-primary" disabled={!importPreview.toAdd.length && !importPreview.toUpdate.length} onClick={confirmImport}>
              ยืนยันนำเข้า ({importPreview.toAdd.length + importPreview.toUpdate.length} รายการ)
            </button>
          </div>
        </Modal>
      )}

      {staffImportPreview && (
        <Modal title="ตรวจสอบก่อนนำเข้าข้อมูลพนักงาน" onClose={() => setStaffImportPreview(null)}>
          <div className="confirm-summary">
            <div className="confirm-row"><span className="confirm-label">พนักงานใหม่ (จะสร้างบัญชีให้)</span><span className="confirm-value">{staffImportPreview.toAdd.length}</span></div>
            <div className="confirm-row"><span className="confirm-label">พนักงานเดิมที่จะอัปเดต</span><span className="confirm-value">{staffImportPreview.toUpdate.length}</span></div>
            <div className="confirm-row"><span className="confirm-label">แถวที่ข้าม (มีปัญหา)</span><span className="confirm-value">{staffImportPreview.errors.length}</span></div>
          </div>
          {staffImportPreview.toAdd.length > 0 && (
            <p className="scanner-hint" style={{ marginBottom: 0 }}>พนักงานใหม่แต่ละคนจะได้รหัสผ่านชั่วคราวแบบสุ่ม ระบบจะแสดงให้ครั้งเดียวหลังยืนยัน (ดูซ้ำภายหลังไม่ได้) กรุณาแจ้งพนักงานให้เปลี่ยนรหัสผ่านเองทันทีที่ล็อกอินครั้งแรก</p>
          )}
          {staffImportPreview.errors.length > 0 && (
            <div className="import-error-list">
              {staffImportPreview.errors.slice(0, 10).map((e, i) => (
                <div key={i} className="import-error-row">แถวที่ {e.row}: {e.reason}</div>
              ))}
              {staffImportPreview.errors.length > 10 && <div className="muted" style={{ fontSize: 11 }}>และอีก {staffImportPreview.errors.length - 10} แถว…</div>}
            </div>
          )}
          <div className="form-actions" style={{ marginTop: 10 }}>
            <button type="button" className="btn btn-secondary" onClick={() => setStaffImportPreview(null)}>ยกเลิก</button>
            <button type="button" className="btn btn-primary" disabled={!staffImportPreview.toAdd.length && !staffImportPreview.toUpdate.length} onClick={confirmStaffImport}>
              ยืนยันนำเข้า ({staffImportPreview.toAdd.length + staffImportPreview.toUpdate.length} รายการ)
            </button>
          </div>
        </Modal>
      )}

      {newAccounts && (
        <Modal title="บัญชีใหม่ที่สร้างจากการนำเข้า" onClose={() => setNewAccounts(null)}>
          <p className="scanner-hint" style={{ marginTop: 0 }}>รหัสผ่านชั่วคราวเหล่านี้จะแสดง<b>เพียงครั้งเดียว</b> กรุณาดาวน์โหลดหรือคัดลอกไปแจกให้พนักงานก่อนปิดหน้าต่างนี้</p>
          <div className="import-error-list" style={{ background: 'var(--card-soft)' }}>
            {newAccounts.map((a, i) => (
              <div key={i} className="import-error-row" style={{ color: 'var(--ink)' }}>
                <span className="mono">{a.code}</span> — {a.name} : <span className="mono" style={{ fontWeight: 700 }}>{a.tempPassword}</span>
              </div>
            ))}
          </div>
          <div className="form-actions" style={{ marginTop: 10 }}>
            <button type="button" className="btn btn-secondary" onClick={downloadTempPasswordList}><Download size={14} /> ดาวน์โหลด Excel</button>
            <button type="button" className="btn btn-primary" onClick={() => setNewAccounts(null)}>ปิด</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ---------------------------- Dashboard ---------------------------- */
const ACTIVE_STATUS_SET = new Set(['borrowed', 'overdue', 'damaged', 'calibration']);

// Same full action set as a shelf's tool list (damage report, calibration,
// QR, photo, PDF, edit, delete), but scoped globally across every warehouse
// and filtered to only tools currently doing something — borrowed, overdue,
// damaged, or off at calibration. A tool just sitting available/idle has
// nothing to review here, so it's deliberately left out to keep this list
// short and relevant for quick lookup instead of duplicating the full
// inventory. Self-contained (own copies of save/delete/print) so it can be
// embedded in multiple pages without depending on any one page's state.
function Dashboard({ kpis, tools, staff, tx, toolStatus, overdueList, isAdmin, onViewPhoto, onEditTx, settings, onGoSettings, warehouses, setTools, showToast, addAudit, onSetCondition, onSetCalibration }) {
  const recent = [...tx].sort((a, b) => (b.borrowDate + (b.returnDate || '9')).localeCompare(a.borrowDate + (a.returnDate || '9'))).slice(0, 6);

  const [snoozed, setSnoozed] = useState(() => {
    try { return localStorage.getItem('tai_lbc_backup_snooze_date') === todayISO(); } catch (e) { return false; }
  });
  const backupDue = useMemo(() => {
    if (!isAdmin || !settings) return false;
    const reminderDays = Number(settings.backupReminderDays) || 7;
    if (!settings.lastBackupAt) return true; // never backed up yet
    const daysSince = (Date.now() - new Date(settings.lastBackupAt).getTime()) / 86400000;
    return daysSince >= reminderDays;
  }, [isAdmin, settings]);
  function snoozeBackupReminder() {
    try { localStorage.setItem('tai_lbc_backup_snooze_date', todayISO()); } catch (e) {}
    setSnoozed(true);
  }

  // Distinct from the general N-day reminder below: a weekly nudge, shown on
  // Fridays from 16:00 onward, to review/back up that week's evidence photos.
  // Purely informational — nothing gets deleted automatically; managing what
  // to keep or clear is entirely up to the admin, from the Settings page.
  const photoReviewDue = useMemo(() => {
    if (!isAdmin || !settings) return false;
    const now = new Date();
    if (now.getDay() !== 5) return false; // 5 = Friday (local/Thai time)
    if (now.getHours() < 8) return false; // 08:00 จนถึงสิ้นวันศุกร์ (เที่ยงคืนเปลี่ยนวันแล้วหายเอง)
    if (!settings.lastBackupAt) return true;
    return localISODate(parseDateValue(settings.lastBackupAt)) !== todayISO();
  }, [isAdmin, settings]);

  const deptDist = useMemo(() => {
    const counts = new Map();
    for (const t of tx) {
      const st = staff.find(s => s.id === t.staffId);
      const dept = st?.dept || 'ไม่ระบุ';
      counts.set(dept, (counts.get(dept) || 0) + 1);
    }
    return [...counts.entries()].map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
  }, [tx, staff]);

  const catDist = useMemo(() => {
    const counts = new Map();
    for (const t of tools) {
      const label = catMap[t.category]?.label || t.category || 'ไม่ระบุ';
      counts.set(label, (counts.get(label) || 0) + 1);
    }
    return [...counts.entries()].map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
  }, [tools]);

  // Per-warehouse status breakdown — the whole point being to compare each
  // warehouse's health at a glance rather than one combined total across
  // every warehouse, which hides which specific location has a problem.
  const STATUS_META = [
    { key: 'available', label: 'พร้อมใช้งาน', color: '#33B9A4', icon: CheckCircle2 },
    { key: 'borrowed', label: 'ถูกยืม', color: '#F5AB4C', icon: Clock },
    { key: 'overdue', label: 'เกินกำหนดคืน', color: '#E0523F', icon: AlertTriangle },
    { key: 'damaged', label: 'ชำรุด/ส่งซ่อม', color: '#8B7FF0', icon: ShieldAlert },
    { key: 'calibration', label: 'ส่ง Calibration', color: '#4FA7E0', icon: Gauge },
  ];
  const whStatusDist = useMemo(() => {
    const rows = (warehouses || []).map(w => {
      const row = { name: w.name };
      STATUS_META.forEach(s => { row[s.key] = 0; });
      tools.filter(t => t.warehouseId === w.id).forEach(t => {
        const s = toolStatus(t.id);
        if (row[s] !== undefined) row[s]++;
      });
      row.total = STATUS_META.reduce((sum, s) => sum + row[s.key], 0);
      return row;
    });
    // Short axis label: first whole word of the name (not just a blind
    // character cut), capped at 6 letters if that word alone is long. Two
    // warehouses often share their first word ("TOOL ROOM 1"/"TOOL ROOM 2"),
    // so any label that collides with another gets a running number appended
    // — the full name is still always what shows in the tooltip/legend below.
    const baseLabels = rows.map(r => {
      const firstWord = String(r.name || '').trim().split(/\s+/)[0] || '';
      return firstWord.length > 6 ? firstWord.slice(0, 6) : firstWord;
    });
    const totalPerLabel = {};
    baseLabels.forEach(b => { totalPerLabel[b] = (totalPerLabel[b] || 0) + 1; });
    const seenSoFar = {};
    rows.forEach((row, i) => {
      const b = baseLabels[i];
      if (totalPerLabel[b] <= 1) { row.shortName = b; return; }
      seenSoFar[b] = (seenSoFar[b] || 0) + 1;
      row.shortName = `${b}${seenSoFar[b]}`;
    });
    return rows;
  }, [tools, warehouses, toolStatus]);

  const PIE_COLORS = ['#33B9A4', '#8B7FF0', '#F2799F', '#F5AB4C', '#4FA7E0', '#6EE7B7'];

  return (
    <div className="page-stack">
      {photoReviewDue && (
        <section className="panel backup-reminder-panel backup-reminder-urgent">
          <div className="backup-reminder-text">
            <ImageIcon size={18} />
            <div>
              <div className="backup-reminder-title">ถึงเวลาตรวจสอบรูปหลักฐานยืม-คืนประจำสัปดาห์ (ทุกวันศุกร์)</div>
            </div>
          </div>
          <div className="backup-reminder-actions">
            <button className="btn btn-primary" onClick={onGoSettings}><Download size={14} /> ไปจัดการรูปหลักฐาน</button>
          </div>
        </section>
      )}

      {backupDue && !snoozed && (
        <section className="panel backup-reminder-panel">
          <div className="backup-reminder-text">
            <ShieldAlert size={18} />
            <div>
              <div className="backup-reminder-title">
                {settings?.lastBackupAt ? 'ถึงเวลาสำรองข้อมูลแล้ว' : 'ยังไม่เคยสำรองข้อมูลระบบนี้เลย'}
              </div>
              <div className="muted" style={{ fontSize: 12.5 }}>
                {settings?.lastBackupAt
                  ? `สำรองข้อมูลล่าสุด ${fmtThaiDateTime(settings.lastBackupAt)}`
                  : 'ยังไม่เคยสำรองข้อมูล'}
              </div>
            </div>
          </div>
          <div className="backup-reminder-actions">
            <button className="btn btn-secondary" onClick={snoozeBackupReminder}>เตือนพรุ่งนี้</button>
            <button className="btn btn-primary" onClick={onGoSettings}><Download size={14} /> ไปสำรองข้อมูล</button>
          </div>
        </section>
      )}

      <section className="kpi-grid">
        <KpiCard label="ครุภัณฑ์ทั้งหมด" value={kpis.total} icon={Package} tone="info" />
        <KpiCard label="พร้อมใช้งาน" value={kpis.available} icon={CheckCircle2} tone="teal" />
        <KpiCard label="อยู่ระหว่างการยืม" value={kpis.borrowed} icon={Clock} tone="amber" />
        <KpiCard label="เกินกำหนดคืน" value={kpis.overdue} icon={AlertTriangle} tone="danger" />
        <KpiCard label="ชำรุด/ส่งซ่อม" value={kpis.damaged} icon={ShieldAlert} tone="purple" />
        <KpiCard label="ส่ง Calibration" value={kpis.calibration} icon={Gauge} tone="calib" />
      </section>

      {overdueList && overdueList.length > 0 && (
        <section className="panel overdue-panel">
          <div className="panel-head">
            <h2><Bell size={16} /> รายการเกินกำหนดคืน ({overdueList.length})</h2>
          </div>
          <div className="overdue-chip-list">
            {overdueList.slice(0, 8).map(o => (
              <div key={o.tx.id} className="overdue-chip">
                <span className="mono">{o.tool?.code}</span>
                <span className="overdue-chip-name">{o.tool?.name}</span>
                <span className="muted">{o.staff?.name}</span>
                <span className="badge danger">ช้า {o.daysLate} วัน</span>
              </div>
            ))}
          </div>
        </section>
      )}

      {/* The chip board takes the slot the "most-borrowed tools" chart used to
          hold. That chart ranked history; this shows what is out of the crib
          right now, which is the question the overview is actually asked. */}
      <section className="chart-row">
        <div className="panel chart-panel">
          <ToolChipBoard warehouses={warehouses} tools={tools} tx={tx} staff={staff} toolStatus={toolStatus}
            searchable showOutstanding />
        </div>

        <div className="panel chart-panel">
            <div className="panel-head"><h2><Users size={16} /> สัดส่วนการยืมตามแผนก</h2></div>
            {deptDist.length ? (
              <ResponsiveContainer width="100%" height={220}>
                <PieChart>
                  <Pie data={deptDist} dataKey="value" nameKey="name" innerRadius={48} outerRadius={78} paddingAngle={2}>
                    {deptDist.map((entry, i) => <Cell key={entry.name} fill={PIE_COLORS[i % PIE_COLORS.length]} />)}
                  </Pie>
                  <Tooltip formatter={(value) => [`${value} ครั้ง`, '']} contentStyle={{ borderRadius: 10, border: '1px solid var(--line)', fontSize: 12 }} />
                  <Legend wrapperStyle={{ fontSize: 11 }} />
                </PieChart>
              </ResponsiveContainer>
            ) : <div className="empty-state">ยังไม่มีข้อมูล</div>}
          </div>
      </section>

      {(catDist.length > 0 || whStatusDist.length > 0) && (
        <section className="chart-row">
          <div className="panel chart-panel">
            <div className="panel-head"><h2><Layers size={16} /> สัดส่วนเครื่องมือแยกตามหมวดหมู่</h2></div>
            {catDist.length ? (
              <ResponsiveContainer width="100%" height={220}>
                <PieChart>
                  <Pie data={catDist} dataKey="value" nameKey="name" innerRadius={48} outerRadius={78} paddingAngle={2}>
                    {catDist.map((entry, i) => <Cell key={entry.name} fill={PIE_COLORS[i % PIE_COLORS.length]} />)}
                  </Pie>
                  <Tooltip formatter={(value) => [`${value} ชิ้น`, '']} contentStyle={{ borderRadius: 10, border: '1px solid var(--line)', fontSize: 12 }} />
                  <Legend wrapperStyle={{ fontSize: 11 }} />
                </PieChart>
              </ResponsiveContainer>
            ) : <div className="empty-state">ยังไม่มีข้อมูล</div>}
          </div>

          <div className="panel chart-panel">
            <div className="panel-head"><h2><Building2 size={16} /> สถานะเครื่องมือแยกตามคลัง</h2></div>
            {whStatusDist.length ? (
              <ResponsiveContainer width="100%" height={260}>
                <BarChart data={whStatusDist} margin={{ top: 24, right: 8, left: -20, bottom: 0 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="var(--line)" vertical={false} />
                  <XAxis dataKey="shortName" tick={{ fontSize: 11, fill: 'var(--ink-soft)' }} axisLine={{ stroke: 'var(--line)' }} tickLine={false} interval={0} textAnchor="middle" height={24} />
                  <YAxis allowDecimals={false} tick={{ fontSize: 11, fill: 'var(--ink-soft)' }} axisLine={false} tickLine={false} />
                  <Tooltip content={<WhStatusTooltip statusMeta={STATUS_META} />} />
                  <Legend wrapperStyle={{ fontSize: 10.5 }} content={<WhStatusLegend statusMeta={STATUS_META} />} />
                  {STATUS_META.map((s, i) => (
                    <Bar key={s.key} dataKey={s.key} stackId="status" fill={s.color} name={s.key} radius={s.key === 'calibration' ? [6, 6, 0, 0] : 0} maxBarSize={44}>
                      {i === STATUS_META.length - 1 && (
                        <LabelList content={(props) => <WhStatusTotalLabel {...props} rows={whStatusDist} />} />
                      )}
                    </Bar>
                  ))}
                </BarChart>
              </ResponsiveContainer>
            ) : <div className="empty-state">ยังไม่มีคลังเครื่องมือในระบบ</div>}
          </div>
        </section>
      )}

      {/* "อุปกรณ์ที่มีการใช้งานอยู่" used to live here. The chip board above says
          the same thing — who holds what, from which warehouse — in a form you
          can read at a glance, so keeping both meant scrolling past the answer
          to reach it again as a table. The panel still exists on the Tools page
          for the admin actions it carries (report damage, send for
          calibration), which the board deliberately does not duplicate. */}
      <section className="panel">
        <div className="panel-head"><h2>รายการล่าสุด</h2></div>
        <TxTable rows={recent} tools={tools} staff={staff} isAdmin={isAdmin} onViewPhoto={onViewPhoto} onEditTx={onEditTx} showPhotos={true} />
      </section>
    </div>
  );
}

/* ------------------------- Shadow Board (per-warehouse shelves) ------------------------- */
// Redesigned from a single flat board covering every tool in the whole system
// into one board PER warehouse, structured as shelves (like the real steel
// cabinets in each tool room). Regular staff get a read-only view of layout +
// status; admins can add/remove shelves, move tools onto/off a shelf, and
// import/export that warehouse's tool list independently of every other
// warehouse. Each shelf is capped at 100 tools, matching the physical cap on
// a real shadow-board panel.
const SHELF_CAPACITY = 100;

function WarehouseShadowBoard({ tools, warehouses, scopedWarehouseIds, shelves, setShelves, setTools, toolStatus, isAdmin, showToast, addAudit, onAddTool, onSetCondition, onSetCalibration, tx, staff, canManageWarehouse = () => isAdmin }) {
  // Same pattern as ToolsPage/WarehousePage: `tools`/`warehouses` stay whole
  // (safe for shelf-assign/unassign saves, which rebuild from the full array),
  // only the tab list and the initially-selected warehouse are narrowed for a
  // restricted secondary admin.
  const visibleWarehouses = scopedWarehouseIds ? warehouses.filter(w => scopedWarehouseIds.includes(w.id)) : warehouses;
  const [activeWh, setActiveWh] = useState(visibleWarehouses[0]?.id || null);
  useEffect(() => {
    if ((!activeWh || !visibleWarehouses.some(w => w.id === activeWh)) && visibleWarehouses.length) setActiveWh(visibleWarehouses[0].id);
  }, [visibleWarehouses, activeWh]);
  // Whether the admin can actually add/edit/delete inside the warehouse
  // they're currently looking at — a warehouse head can browse every warehouse
  // here but this only ever comes back true for their own.
  const canManageActive = canManageWarehouse(activeWh);

  const [pickerShelf, setPickerShelf] = useState(null);
  // Which shelf's tool list is currently expanded into the detail view (the
  // "click the photo to drill in" step) — all per-shelf management (assign,
  // remove, rename, delete) now lives inside that detail view instead of
  // cluttering the card face, which is just a photo + name + count.
  const [detailShelf, setDetailShelf] = useState(null);
  // Which shelf's photo-edit modal is open, and the pending capture/upload
  // waiting to be saved from it.
  const [photoEditShelf, setPhotoEditShelf] = useState(null);
  const [pendingShelfPhoto, setPendingShelfPhoto] = useState(null);
  const [showShelfCamera, setShowShelfCamera] = useState(false);
  const shelfFileInputRef = React.useRef(null);
  const [renamingId, setRenamingId] = useState(null);
  const [renameValue, setRenameValue] = useState('');
  const [busy, setBusy] = useState(false);
  const fileInputRef = React.useRef(null);
  // Rows the last import refused to overwrite — shown in a modal rather than a
  // toast, because the person needs to read the list and act on it.
  const [lockedImportRows, setLockedImportRows] = useState(null);
  // Full tool-management actions, reachable from a shelf's detail list so
  // admins don't have to leave warehouse management and go find the same
  // tool again on the Tools page just to report damage, send it for
  // calibration, edit it, or delete it.
  const [damageModal, setDamageModal] = useState(null);
  const [calibSendModal, setCalibSendModal] = useState(null);
  const [calibReceiveModal, setCalibReceiveModal] = useState(null);
  const [editTool, setEditTool] = useState(null);
  // Remembers which shelf's detail view was open when "edit" was clicked, so
  // save/cancel/close on the edit form all land back on that same shelf list
  // instead of dropping out to the warehouse card grid.
  const [returnToShelf, setReturnToShelf] = useState(null);
  // QR view modal specifically for the "unassigned" tools section below
  // (tools not on any shelf) — the shelved-tools list has its own via
  // ShelfDetailModal.
  const [unassignedQrTool, setUnassignedQrTool] = useState(null);
  const [unassignedPhotoTool, setUnassignedPhotoTool] = useState(null);

  const activeWarehouse = warehouses.find(w => w.id === activeWh);
  const whShelves = useMemo(() =>
    shelves.filter(s => s.warehouseId === activeWh).sort((a, b) => a.order - b.order),
    [shelves, activeWh]);
  const whTools = useMemo(() => tools.filter(t => t.warehouseId === activeWh), [tools, activeWh]);
  const whShelfIds = new Set(whShelves.map(s => s.id));
  const unassigned = whTools.filter(t => !t.shelfId || !whShelfIds.has(t.shelfId)).sort((a, b) => naturalCompareCode(a.code, b.code));

  async function addShelf() {
    if (!activeWarehouse) return;
    const name = `ชั้นที่ ${whShelves.length + 1}`;
    const shelf = { id: uid('SH'), warehouseId: activeWh, name, order: whShelves.length };
    try {
      await setShelves([...shelves, shelf]);
      addAudit?.('shelf_add', `${activeWarehouse.name}: เพิ่ม ${name}`);
      showToast(`เพิ่ม ${name} แล้ว`, 'success');
    } catch (err) {
      console.error('failed to add shelf', err);
      showToast('เพิ่มชั้นวางไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
  }

  async function removeShelf(shelf) {
    const occupied = tools.filter(t => t.shelfId === shelf.id).length;
    if (occupied > 0) return showToast(`ชั้นนี้ยังมีเครื่องมืออยู่ ${occupied} รายการ ย้ายออกก่อนจึงลบชั้นได้`, 'error');
    try {
      await setShelves(shelves.filter(s => s.id !== shelf.id));
    } catch (err) {
      console.error('failed to remove shelf', err);
      return showToast('ลบชั้นวางไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    // Best-effort only past this point — the shelf itself is already gone, so
    // a hiccup cleaning up its leftover photo shouldn't read as "delete failed".
    if (shelf.hasPhoto) {
      try { await storageDelete(`toolcrib-photo:shelf:${shelf.id}`, true); }
      catch (err) { console.error('failed to clean up deleted shelf\'s photo', err); }
    }
    addAudit?.('shelf_remove', `${activeWarehouse?.name || ''}: ลบ ${shelf.name}`);
    showToast(`ลบ ${shelf.name} แล้ว`, 'success');
  }

  async function saveRename(shelf) {
    const name = renameValue.trim();
    setRenamingId(null);
    if (!name || name === shelf.name) return;
    try {
      await setShelves(shelves.map(s => s.id === shelf.id ? { ...s, name } : s));
    } catch (err) {
      console.error('failed to rename shelf', err);
      showToast('บันทึกชื่อชั้นไม่สำเร็จ', 'error');
    }
  }

  async function unassignTool(tool) {
    try {
      await setTools(tools.map(t => t.id === tool.id ? { ...t, code: normalizeCode(t.code), shelfId: null } : t));
    } catch (err) {
      console.error('failed to unassign tool from shelf', err);
      showToast('นำเครื่องมือออกจากชั้นไม่สำเร็จ', 'error');
    }
  }

  async function assignTools(shelf, toolIds) {
    const currentCount = tools.filter(t => t.shelfId === shelf.id).length;
    if (currentCount + toolIds.length > SHELF_CAPACITY) {
      return showToast(`ชั้นนี้รับได้อีก ${SHELF_CAPACITY - currentCount} รายการเท่านั้น (สูงสุด ${SHELF_CAPACITY} ชิ้น/ชั้น)`, 'error');
    }
    try {
      // Same idea as unassign — moving a tool onto a shelf is another
      // natural moment to catch and fix a stray accented character left
      // over in its code from before this cleanup existed.
      await setTools(tools.map(t => toolIds.includes(t.id) ? { ...t, code: normalizeCode(t.code), shelfId: shelf.id } : t));
      addAudit?.('shelf_assign', `${shelf.name}: จัดเข้าชั้น ${toolIds.length} รายการ`);
      showToast('จัดเครื่องมือเข้าชั้นแล้ว', 'success');
      setPickerShelf(null);
    } catch (err) {
      console.error('failed to assign tools to shelf', err);
      showToast('บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
  }

  // Mirrors ToolsPage's edit save exactly (uniqueness check, photo
  // set/remove + version stamp, shelf cleared if moved to a different
  // warehouse) — kept as its own copy so this shortcut can't accidentally
  // break tool editing on the Tools page if either one changes.
  async function saveEditedTool(data) {
    const { _newPhoto, _removePhoto, ...formData } = data;
    if (!formData.code.trim() || !formData.name.trim()) return showToast('กรุณากรอกรหัสและชื่อเครื่องมือ', 'error');
    if (!formData.warehouseId) return showToast('กรุณาเลือกคลังเครื่องมือ', 'error');
    // Normalized here directly (not just in the form) so this save is
    // guaranteed clean regardless of what called it.
    const cleanCode = normalizeCode(formData.code.trim());
    if (tools.some(t => t.id !== formData.id && t.code.trim().toLowerCase() === cleanCode.toLowerCase())) {
      return showToast('รหัสนี้มีอยู่แล้วในเครื่องมือชิ้นอื่น', 'error');
    }
    const hasPhoto = _newPhoto ? true : (_removePhoto ? false : !!formData.hasPhoto);
    try {
      if (_newPhoto) await storageSet(`toolcrib-photo:master:${formData.id}`, _newPhoto, true);
      if (_removePhoto) await storageDelete(`toolcrib-photo:master:${formData.id}`, true);
      await setTools(tools.map(t => t.id === formData.id ? {
        ...t, code: cleanCode, name: formData.name.trim(), category: formData.category, warehouseId: formData.warehouseId,
        partNo: formData.partNo || '', serialNo: formData.serialNo || '', calibDate: formData.calibDate || '', calibDue: formData.calibDue || '',
        requiresLoanForm: !!formData.requiresLoanForm, hasPhoto,
        photoUpdatedAt: (_newPhoto || _removePhoto) ? Date.now() : t.photoUpdatedAt,
        shelfId: formData.warehouseId !== t.warehouseId ? null : t.shelfId
      } : t));
    } catch (err) {
      console.error('failed to save tool', err);
      return showToast('บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    addAudit?.('tool_edit', `${cleanCode} — ${formData.name}`);
    showToast('บันทึกการแก้ไขเรียบร้อย (QR เดิมยังใช้งานได้)', 'success');
    setEditTool(null);
    setDetailShelf(returnToShelf);
    setReturnToShelf(null);
  }

  async function deleteTool(t) {
    const s = toolStatus(t.id);
    if (s === 'borrowed' || s === 'overdue') return showToast('ไม่สามารถลบเครื่องมือที่ถูกยืมอยู่ได้', 'error');
    try {
      await setTools(tools.filter(x => x.id !== t.id));
      if (t.hasPhoto) await storageDelete(`toolcrib-photo:master:${t.id}`, true);
    } catch (err) {
      console.error('failed to delete tool', err);
      return showToast('ลบไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    addAudit?.('tool_delete', `${t.code} — ${t.name}`);
    showToast('ลบเครื่องมือและยกเลิก QR ที่ผูกไว้เรียบร้อย', 'success');
    setDetailShelf(null);
  }

  // Restored from the old Tools page — lets an admin re-download the most
  // recent completed LBC-FM-034 slip for a tool directly from its row here,
  // without digging through transaction history.
  const [printingToolId, setPrintingToolId] = useState(null);
  function latestPrintableDoc(toolId) {
    return (tx || [])
      .filter(t => t.toolId === toolId && t.docForm && t.returnDate)
      .sort((a, b) => (b.returnDate || '').localeCompare(a.returnDate || ''))[0] || null;
  }
  async function printToolLoanDoc(t) {
    const record = latestPrintableDoc(t.id);
    if (!record) return;
    setPrintingToolId(t.id);
    try {
      const staffMember = staff?.find(s => s.id === record.staffId);
      const returnedByStaff = record.returnedBy ? staff?.find(s => s.id === record.returnedBy) : null;
      await generateLoanFormPdf(record, t, staffMember, returnedByStaff, record.docForm);
    } catch (err) {
      console.error('failed to generate loan form pdf', err);
      showToast('สร้าง PDF ไม่สำเร็จ กรุณาลองใหม่', 'error');
    } finally {
      setPrintingToolId(null);
    }
  }

  function downloadWarehouseExcel() {
    if (!activeWarehouse) return;
    const statusLabel = { available: 'พร้อมใช้งาน', borrowed: 'ถูกยืม', overdue: 'เกินกำหนดคืน', damaged: 'ชำรุด/ส่งซ่อม', calibration: 'ส่ง Calibration' };
    const shelfNameOf = (t) => whShelves.find(s => s.id === t.shelfId)?.name || 'ยังไม่จัดชั้น';
    const rows = whTools.map(t => ({
      รหัสเครื่องมือ: t.code, ชื่อเครื่องมือ: t.name, หมวดหมู่: catMap[t.category]?.label || t.category,
      ชั้นวาง: shelfNameOf(t), สถานะ: statusLabel[toolStatus(t.id)] || '-',
    }));
    const wb = XLSX.utils.book_new();
    wb.SheetNames.push('รายการเครื่องมือ');
    wb.Sheets['รายการเครื่องมือ'] = XLSX.utils.json_to_sheet(rows);
    XLSX.writeFile(wb, `รายการเครื่องมือ-${activeWarehouse.name}-${todayISO()}.xlsx`);
