  .shelfboard-toolbar{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .shelf-block{ padding:14px 0; border-top:1px dashed var(--line); }
  .shelf-block:first-of-type{ border-top:none; padding-top:0; }
  .shelf-block-unassigned{ border-top:1.5px solid var(--line); margin-top:6px; }
  .shelf-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .shelf-name{ display:flex; align-items:center; gap:7px; font-size:14px; font-weight:600; color:var(--ink); cursor:default; }
  .shelf-name:hover{ color:var(--teal-deep); }
  .shelf-head-actions{ display:flex; gap:6px; flex-shrink:0; }
  .shelf-rename-input{ font-size:14px; font-weight:600; padding:5px 9px; max-width:220px; }

  .shelf-card-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; margin-top:4px; }
  .shelf-card{ background:var(--card-soft); border:1px solid var(--line); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; }
  .shelf-card-photo{ position:relative; height:140px; background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; border-bottom:1px solid var(--line); }
  .shelf-card-photo-img{ width:100%; height:100%; object-fit:cover; display:block; }
  .shelf-card-photo-empty{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--ink-soft); width:100%; height:100%; font-size:11.5px; }
  .shelf-card-photo-edit-btn{
    position:absolute; top:8px; right:8px; width:28px; height:28px; border-radius:50%; border:1px solid var(--line);
    background:var(--card); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:var(--shadow-sm);
  }
  .shelf-card-photo-edit-btn:hover{ color:var(--teal-deep); border-color:var(--teal); }
  .shelf-card-body{ padding:10px 12px 12px; display:flex; flex-direction:column; gap:8px; }
  .shelf-card-body .shelf-name{ font-size:13px; }
  .shelf-card-body .shelf-head-actions{ justify-content:flex-end; }
  .shelf-card-actions{ display:flex; align-items:center; gap:6px; }
  .shelf-add-tool-btn{ flex:1; justify-content:center; font-size:12px; padding:7px 10px; }

  .shelf-photo-edit-preview{ border-radius:14px; overflow:hidden; background:#fff; border:1px solid var(--line); }
  .shelf-photo-edit-img{ width:100%; max-height:280px; object-fit:contain; display:block; }

  .shadow-slot-remove{
    position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; border:1px solid var(--line);
    background:var(--card); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:var(--shadow-sm);
  }
  .shadow-slot-remove:hover{ background:var(--danger-tint); color:var(--danger); border-color:var(--danger); }
  /* The icon itself is the tap target for "show QR" — kept separate from the
     small remove ("x") button sharing the same slot so the two never fight
     over the same click. Only "available" tools get the pointer/hover cue;
     everything else stays inert (borrowed/overdue/damaged/calibration items
     aren't meant to be scanned off the board right now). */
  .shadow-slot-icon{ display:flex; align-items:center; justify-content:center; border-radius:8px; padding:2px; }
  .shadow-slot-icon.clickable{ cursor:pointer; }
  .shadow-slot-icon.clickable:hover{ background:rgba(0,0,0,0.06); }

  /* Inline QR popover, anchored to the slot it belongs to (the slot itself is
     position:relative already) and floated above so it never gets clipped by
     the row below it. */
  .shelf-qr-pop{
    position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%); z-index:40;
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px;
    box-shadow:0 16px 40px rgba(31,42,55,0.2); display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .shelf-qr-pop-close{
    position:absolute; top:-8px; right:-8px; width:20px; height:20px; border-radius:50%; border:1px solid var(--line);
    background:var(--card); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:var(--shadow-sm);
  }
  .shelf-qr-pop-code{ font-size:11px; color:var(--ink-soft); }
  .shelf-qr-pop-warn{ font-size:10.5px; color:var(--danger); text-align:center; max-width:130px; margin:0; line-height:1.4; }

  /* Shelf tool picker modal */
  .shelf-pick-list{ max-height:280px; overflow-y:auto; border:1px solid var(--line); border-radius:12px; }
  .shelf-pick-row{ display:flex; align-items:center; gap:10px; padding:9px 12px; font-size:13px; border-bottom:1px solid var(--line); cursor:pointer; }
  .shelf-pick-selectall{ border:1px solid var(--line); border-radius:12px; margin-bottom:8px; background:var(--card-soft); }
  .shelf-pick-row:last-child{ border-bottom:none; }
  .shelf-pick-row:hover{ background:var(--card-soft); }
  .shelf-pick-row.checked{ background:var(--teal-tint); }
  .shelf-pick-row input[type="checkbox"]{ width:15px; height:15px; accent-color:var(--teal); flex-shrink:0; }

  /* Table
     Every cell is kept to a single line (white-space:nowrap) so row height
     never changes when the viewport rotates or resizes — columns that need
     more room simply scroll horizontally inside .table-wrap instead of the
     text/badges wrapping onto a second line and shifting everything below. */
  .table-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-weight:600; color:var(--ink-soft); padding:11px 10px; border-bottom:1.5px solid var(--line); font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em; white-space:nowrap; }
  td{ padding:12px 10px; border-bottom:1px solid var(--line); color:var(--ink); white-space:nowrap; }
  tr:hover td{ background:var(--card-soft); }
  .muted{ color:var(--ink-soft); font-size:12px; }
  .empty-state{ text-align:center; color:var(--ink-soft); padding:26px 0; font-size:13px; }
  /* Long free-text cells (tool/item names, descriptions) still get one line,
     but truncate with an ellipsis instead of forcing the whole table wider —
     hover/tap shows the full text via the title attribute. */
  .cell-ellipsis{ max-width:200px; overflow:hidden; text-overflow:ellipsis; }

  .badge{ padding:4px 11px; border-radius:20px; font-size:11px; font-weight:600; display:inline-block; white-space:nowrap; }
  .badge.success{ background:var(--teal-tint); color:var(--teal-deep); }
  .badge.warning{ background:var(--coral-tint); color:var(--coral); }
  .badge.danger{ background:var(--danger-tint); color:var(--danger); }
  .badge.purple{ background:var(--purple-tint); color:var(--purple); }
  .badge.calib{ background:var(--amber-tint); color:#9A6712; }
  .badge.steel-badge{ background:#F1F4F6; color:var(--ink-soft); }

  /* Forms & buttons */
  .form-group{ display:flex; flex-direction:column; gap:6px; }
  .form-group label{ font-size:12.5px; font-weight:600; color:var(--ink-soft); }
  input, select{
    padding:10px 13px; border-radius:11px; border:1px solid var(--line); background:var(--card-soft);
    font-size:13.5px; font-family:inherit; color:var(--ink); outline:none;
    box-sizing:border-box; max-width:100%; min-width:0;
  }
  input::placeholder{ color:var(--ink-dim); }
  input:focus, select:focus{ border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-tint); background:var(--card); }
  select option{ background:#fff; color:var(--ink); }
  .btn{
    padding:10px 18px; border-radius:12px; border:1px solid transparent; font-size:13.5px; font-weight:600; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; font-family:inherit; transition:transform .1s, opacity .15s, background .15s;
  }
  .btn:active{ transform:scale(0.97); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-primary{ background:var(--teal); color:#fff; box-shadow:0 8px 18px -8px rgba(51,185,164,0.55); }
  .btn-danger{ background:var(--danger); color:#fff; box-shadow:0 8px 18px -8px rgba(242,99,74,0.55); }
  .btn-primary:hover:not(:disabled){ background:var(--teal-deep); }
  .btn-success{ background:var(--purple); color:#fff; box-shadow:0 8px 18px -8px rgba(139,127,240,0.5); }
  .btn-success:hover:not(:disabled){ background:#7367DE; }
  .btn-secondary{ background:var(--card); color:var(--ink); border-color:var(--line); }
  .btn-secondary:hover{ background:var(--card-soft); }

  .scan-panel .scan-form{ display:grid; grid-template-columns:1.4fr 1.4fr 1fr; gap:14px; align-items:start; }
  .form-actions{ display:flex; gap:10px; grid-column:1/-1; margin-top:2px; }
  .hint{ font-size:12px; margin-top:2px; }
  .hint.ok{ color:var(--teal-deep); } .hint.bad{ color:var(--danger); }
  .hint.locked-hint{ color:var(--ink-dim); }
  .scan-input-row{ display:flex; gap:6px; }
  .scan-input-row input{ flex:1; }
  .scan-input-row input:disabled{ opacity:0.5; cursor:not-allowed; }
  .scan-icon-btn{
    width:36px; height:36px; flex-shrink:0; border-radius:10px; border:1px solid rgba(51,185,164,0.3);
    background:var(--teal-tint); color:var(--teal-deep); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .scan-icon-btn:hover{ background:#D7F0EA; }
  .scan-icon-btn:disabled{ opacity:0.4; cursor:not-allowed; background:var(--card-soft); color:var(--ink-dim); }
  .scan-cta-row{ display:flex; gap:10px; grid-column:1/-1; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }

  .mode-tabs{ display:flex; gap:10px; margin-bottom:14px; }
  .mode-tab{ display:flex; align-items:center; justify-content:center; gap:7px; flex:1 1 0; max-width:260px;
    padding:13px 18px; border-radius:12px; border:2px solid var(--line); background:var(--card);
    font-family:inherit; font-size:14px; font-weight:700; color:var(--ink-soft); cursor:pointer;
    transition:border-color .12s, background .12s, color .12s; }
  .mode-tab:hover{ border-color:var(--teal-deep); color:var(--teal-deep); }
  .mode-tab.borrow.active{ background:var(--teal-deep); border-color:var(--teal-deep); color:#fff; box-shadow:var(--shadow-sm); }
  .mode-tab.return.active{ background:var(--success, #2e9e6b); border-color:var(--success, #2e9e6b); color:#fff; box-shadow:var(--shadow-sm); }
  /* Nothing chosen yet: pulse the pair so it is obvious the screen is waiting
     on a decision rather than simply empty. */
  .mode-tabs.unset .mode-tab{ border-style:dashed; }
  .mode-tabs.unset .mode-tab:first-child{ border-color:var(--teal-deep); color:var(--teal-deep); }

  .scan-steps{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .scan-panel-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .scan-panel-confirm-label{ font-size:16px; font-weight:700; color:var(--ink); white-space:nowrap; }
  .scan-count-hint{ text-align:right; font-size:12px; color:var(--ink-soft); margin-bottom:6px; }
  .scan-settings-panel{ padding:0; overflow:hidden; }
  .scan-settings-toggle{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:16px 22px; background:none; border:none; cursor:pointer; font-family:inherit;
    font-size:14px; font-weight:700; color:var(--ink); text-align:left;
  }
  .scan-settings-toggle:hover{ background:var(--card-soft); }
  .scan-settings-chev{ transition:transform .15s; color:var(--ink-soft); }
  .scan-settings-chev.open{ transform:rotate(90deg); }
  .scan-settings-form{ padding:0 22px 20px; max-width:420px; }
  .confirm-trigger-key{ opacity:0.75; font-weight:500; font-size:12px; margin-left:8px; }
  .scan-step{ display:flex; gap:9px; padding:9px 11px; border-radius:12px; border:1px solid var(--line); background:var(--card-soft); transition:opacity .15s; }
  .scan-step.locked{ opacity:0.55; }
  .scan-step.active{ border-color:rgba(51,185,164,0.35); background:var(--teal-tint); }
  .scan-step.done{ border-color:rgba(51,185,164,0.3); }
  .step-num{
    width:24px; height:24px; border-radius:50%; background:var(--card); border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; color:var(--ink-soft); flex-shrink:0;
  }
  .scan-step.done .step-num{ background:var(--teal); color:#fff; border-color:var(--teal); }
  .scan-step.active .step-num{ border-color:var(--teal); color:var(--teal-deep); }
  .step-body{ flex:1; display:flex; flex-direction:column; gap:5px; min-width:0; }
  .step-body label{ font-size:12px; font-weight:600; color:var(--ink-soft); }
  .confirm-trigger{ width:100%; justify-content:center; margin-bottom:10px; }

  .confirm-summary{ display:flex; flex-direction:column; gap:8px; background:var(--card-soft); border:1px solid var(--line); border-radius:14px; padding:13px 14px; }
  .confirm-row{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:13.5px; }
  .confirm-label{ color:var(--ink-soft); font-size:12px; flex-shrink:0; }
  .confirm-value{ font-weight:600; color:var(--ink); text-align:right; }

  .verify-block{ text-align:center; padding:14px 12px 16px; border:1px dashed var(--line); border-radius:14px; background:var(--teal-tint); margin-bottom:14px; }
  .tool-master-photo{ border-radius:14px; object-fit:cover; margin:0 auto 8px; display:block; border:1px solid var(--line); background:#fff; }
  .tool-master-photo-placeholder{ border-radius:14px; margin:0 auto 8px; display:flex; align-items:center; justify-content:center; background:#fff; border:1px dashed var(--line); color:var(--ink-soft); }
  .verify-tool-name{ font-size:15px; font-weight:700; color:var(--ink); }
  .verify-tool-code{ font-size:12.5px; color:var(--teal-deep); margin-top:2px; }
  .verify-msg{ font-size:12.5px; color:var(--ink-soft); margin:8px 0 12px; }
  .photo-btn{ width:100%; justify-content:center; }
  .photo-captured-row{ display:flex; align-items:center; justify-content:center; gap:10px; font-size:12.5px; color:var(--teal-deep); font-weight:600; flex-wrap:wrap; }
  .photo-captured-row span{ display:inline-flex; align-items:center; gap:6px; }
  .link-btn{ background:none; border:none; color:var(--ink-soft); text-decoration:underline; font-size:12px; cursor:pointer; font-family:inherit; }

  .tool-photo-row{ display:flex; align-items:flex-start; gap:12px; }
  .tool-photo-preview{ width:64px; height:64px; border-radius:12px; object-fit:cover; border:1px solid var(--line); flex-shrink:0; background:var(--card-soft); }
  .tool-photo-preview-empty{ width:64px; height:64px; border-radius:12px; border:1px dashed var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); background:var(--card-soft); }
  .tool-photo-actions{ display:flex; flex-direction:column; gap:6px; flex:1; }
  .tool-photo-btn-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .tool-photo-btn-row .btn{ flex:1; justify-content:center; font-size:12.5px; padding:8px 10px; }

  .scanner-card{ max-width:380px; }
  .scanner-viewport{
    position:relative; width:100%; aspect-ratio:1; border-radius:16px; overflow:hidden;
    background:#0B1220; margin-bottom:12px;
  }
  .scanner-video{ width:100%; height:100%; object-fit:cover; }
  .scanner-frame{ position:absolute; inset:14%; pointer-events:none; }
  .scanner-frame .corner{ position:absolute; width:26px; height:26px; border:3px solid var(--teal); }
  .scanner-frame .tl{ top:0; left:0; border-right:none; border-bottom:none; border-top-left-radius:8px; }
  .scanner-frame .tr{ top:0; right:0; border-left:none; border-bottom:none; border-top-right-radius:8px; }
  .scanner-frame .bl{ bottom:0; left:0; border-right:none; border-top:none; border-bottom-left-radius:8px; }
  .scanner-frame .br{ bottom:0; right:0; border-left:none; border-top:none; border-bottom-right-radius:8px; }
  .scanner-line{ position:absolute; left:2%; right:2%; top:0; height:2px; background:linear-gradient(90deg, transparent, var(--teal), transparent); box-shadow:0 0 10px var(--teal); animation:scanline 1.8s ease-in-out infinite; }
  @keyframes scanline{ 0%{ top:2%; } 50%{ top:96%; } 100%{ top:2%; } }
  .scanner-overlay-msg{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    color:#E7ECF7; background:rgba(11,18,32,0.55); text-align:center; padding:20px; font-size:13px;
  }
  .scanner-hint{ font-size:12px; color:var(--ink-soft); text-align:center; margin-bottom:14px; }
  .scanner-manual-block{ display:flex; flex-direction:column; align-items:center; gap:10px; padding:22px 16px; background:var(--danger-tint); border-radius:16px; margin-bottom:14px; }
  .scanner-manual-msg{ font-size:12.5px; color:var(--danger); text-align:center; margin:0; }

  .qr-display{ display:flex; align-items:center; justify-content:center; padding:18px; background:var(--card-soft); border:1px solid var(--line); border-radius:16px; margin-bottom:12px; min-height:220px; }
  .qr-export-card{ background:#fff; padding:4px; border-radius:16px; }
  .qr-canvas-holder img, .qr-canvas-holder canvas{ display:block; border-radius:8px; }
  .qr-loading{ display:flex; align-items:center; gap:8px; color:var(--ink-soft); font-size:12.5px; }
  .qr-code-value{ text-align:center; font-size:12px; color:var(--ink-soft); margin-bottom:6px; letter-spacing:0.02em; }

  /* Auth: sidebar user box */
  .user-box{ border:1px solid var(--line); border-radius:14px; padding:12px; background:var(--card-soft); display:flex; flex-direction:column; gap:10px; }
  .user-box-id{ display:flex; align-items:center; gap:8px; color:var(--ink); }
  .user-box-name{ font-size:13px; font-weight:700; line-height:1.3; }
  .user-box-role{ font-size:11px; color:var(--ink-soft); }
  .user-box-actions{ display:flex; flex-direction:column; gap:6px; }
  .user-box-btn{
    display:flex; align-items:center; gap:7px; padding:7px 10px; border-radius:9px; border:1px solid var(--line);
    background:var(--card); color:var(--ink-soft); font-size:12px; font-family:inherit; cursor:pointer; width:100%;
  }
  .user-box-btn:hover{ background:var(--card-soft); color:var(--ink); }
  .user-box-btn.danger{ color:var(--danger); }
  .user-box-btn.danger:hover{ background:var(--danger-tint); }

  /* Auth: login screen */
  .login-shell{ flex:1; width:100%; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card{ width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:22px; padding:32px 28px; box-shadow:var(--shadow-md); }
  .login-brand{ text-align:center; margin-bottom:22px; }
  .login-brand-mark{ width:56px; height:56px; margin:0 auto 12px; border-radius:16px; }
  .login-brand-title{ font-family:'Kanit','IBM Plex Sans Thai',sans-serif; font-weight:700; font-size:17px; letter-spacing:0.03em; color:var(--ink); }
  .login-brand-sub{ font-size:12px; color:var(--ink-soft); margin-top:3px; }
  .login-form{ display:flex; flex-direction:column; gap:14px; }
  .login-row-between{ display:flex; align-items:center; justify-content:space-between; margin-top:-4px; }
  .remember-check{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-soft); cursor:pointer; }
  .remember-check input{ width:15px; height:15px; accent-color:var(--teal); padding:0; }
  .login-error{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--danger); background:var(--danger-tint); border-radius:10px; padding:9px 12px; }
  .login-success{ display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color:var(--teal-deep); background:var(--teal-tint); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .login-submit{ width:100%; justify-content:center; margin-top:2px; }
  .login-footnote{ text-align:center; font-size:11.5px; color:var(--ink-dim); margin-top:18px; }
  .reset-pw-block{ border-top:1px dashed var(--line); padding-top:12px; margin-top:2px; display:flex; flex-direction:column; gap:10px; }
  .reset-pw-title{ font-size:12px; font-weight:600; color:var(--ink-soft); }
  .auth-loading-root{ align-items:center; justify-content:center; }

  /* Charts */
  .chart-row{ display:grid; grid-template-columns:1.2fr 1fr; gap:16px; }
  .chart-panel{ min-width:0; }
  @media (max-width: 860px){ .chart-row{ grid-template-columns:1fr; } }

  /* Overdue panel */
  .overdue-panel{ border-color:rgba(242,99,74,0.25); background:linear-gradient(180deg, var(--danger-tint), var(--card)); }
  .backup-reminder-panel{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; border-color:rgba(245,171,76,0.35); background:linear-gradient(180deg, var(--amber-tint), var(--card)); padding:16px 20px; }
  .backup-reminder-panel.backup-reminder-urgent{ border-color:rgba(242,99,74,0.4); background:linear-gradient(180deg, var(--danger-tint), var(--card)); }
  .backup-reminder-panel.backup-reminder-urgent .backup-reminder-text{ color:var(--danger); }
  .backup-reminder-text{ display:flex; align-items:flex-start; gap:10px; color:var(--amber); }
  .backup-reminder-text > div:last-child{ color:var(--ink); }
  .backup-reminder-title{ font-weight:700; font-size:14px; }
  .backup-reminder-actions{ display:flex; gap:8px; flex-shrink:0; }
  .overdue-chip-list{ display:flex; flex-wrap:wrap; gap:8px; }
  .overdue-chip{ display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 12px; font-size:12.5px; }
  .overdue-chip-name{ max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Notification bell */
  .topbar-right{ display:flex; align-items:center; gap:10px; }
  .bell-wrap{ position:relative; }
  .bell-btn{ position:relative; width:38px; height:38px; border-radius:12px; border:1px solid var(--line); background:var(--card); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); box-shadow:var(--shadow-sm); }
  .bell-btn.has-alert{ color:var(--danger); border-color:rgba(242,99,74,0.3); }
  .bell-badge{ position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff; font-size:10px; font-weight:700; border-radius:20px; min-width:16px; height:16px; padding:0 4px; display:flex; align-items:center; justify-content:center; }
  .bell-backdrop{ position:fixed; inset:0; z-index:40; }
  .bell-dropdown{ position:absolute; top:46px; right:0; width:280px; background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow-md); padding:14px; z-index:41; }
  .bell-dropdown-head{ font-size:13px; font-weight:700; color:var(--ink); margin-bottom:8px; }
  .bell-list{ display:flex; flex-direction:column; gap:8px; max-height:220px; overflow-y:auto; }
  .bell-item{ border-bottom:1px solid var(--line); padding-bottom:6px; }
  .bell-item-title{ font-size:12.5px; font-weight:600; color:var(--ink); }
  .bell-item-sub{ font-size:11.5px; margin-top:1px; }
  .bell-go-btn{ width:100%; justify-content:center; margin-top:10px; font-size:12px; padding:8px; }
  .bell-footnote{ font-size:10px; color:var(--ink-dim); margin-top:8px; text-align:center; line-height:1.4; }

  /* Textarea */
  .textarea{ padding:9px 12px; border-radius:11px; border:1px solid var(--line); background:var(--card-soft); font-size:13.5px; font-family:inherit; color:var(--ink); resize:vertical; outline:none; }
  .textarea:focus{ border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-tint); }

  /* Evidence photo viewer */
  .evidence-viewport{ background:#0B1220; border-radius:16px; overflow:hidden; display:flex; align-items:center; justify-content:center; min-height:220px; margin-bottom:12px; }
  .evidence-img{ width:100%; max-height:360px; object-fit:contain; display:block; }

  /* Warehouse page */
  .required-dot{ color:var(--danger); }
  .warehouse-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
  .warehouse-card{ background:var(--card-soft); border:1px solid var(--line); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:14px; }
  .warehouse-card-head{ display:flex; align-items:flex-start; gap:12px; }
  .warehouse-card-icon{ width:38px; height:38px; border-radius:10px; background:var(--teal-tint); color:var(--teal-deep); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .warehouse-card-name{ font-size:14px; font-weight:700; color:var(--ink); line-height:1.35; }
  .warehouse-card-toolbar{ display:flex; align-items:center; gap:6px; }
  .warehouse-card-reorder{ display:flex; gap:4px; }
  .warehouse-card-stats{ display:flex; gap:16px; font-size:12.5px; color:var(--ink-soft); }
  .warehouse-card-actions{ display:flex; gap:8px; margin-top:auto; padding-top:2px; }
  .warehouse-card-actions .btn{ flex:1; justify-content:center; font-size:12px; padding:8px; }
  /* Photo of the physical storage area. Fixed aspect ratio so a card with a
     photo and one without still line up in the grid. */
  .warehouse-card-photo{ position:relative; width:100%; aspect-ratio:16/10; border-radius:12px; overflow:hidden;
    border:1px solid var(--line); background:var(--card); padding:0; cursor:pointer; display:block; font-family:inherit; }
  .warehouse-card-photo:disabled{ cursor:default; }
  /* Warehouse cards on the left, chip board on the right — the board needs the
     wider column because a full row is 20 chips across. */
  .warehouse-split{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:16px; align-items:stretch; }
  /* Capped so the board never dictates the page height — past the cap the
     chips scroll inside the block instead of the block growing. */
  .chip-board{ background:var(--card-soft); border:1px solid var(--line); border-radius:16px; padding:16px;
    display:flex; flex-direction:column; gap:12px; max-height:460px; min-height:220px; }
  .chip-board-search{ font-size:12.5px; padding:7px 10px; }
  .chip-board-scroll{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-right:4px; }
  /* Sitting inside a dashboard chart panel it must not draw a second card —
     the panel already is the card. Height matches the charts beside it so the
     row lines up. */
  @media (max-width: 1100px){ .warehouse-split{ grid-template-columns:1fr; } }
  .chart-panel .chip-board{ background:none; border:none; padding:0; max-height:264px; min-height:0; }
  .chip-board-head{ display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; color:var(--ink); }
  .chip-board-empty{ color:var(--ink-soft); font-size:12.5px; padding:24px 0; text-align:center; }
  .chip-grid{ display:flex; flex-wrap:wrap; gap:10px; }
  /* Modelled on the physical TAI tool chip: green anodised face, brushed
     aluminium rim. The rim is two rings — a light outer and a darker inner —
     which is what reads as "metal" rather than "thick border". The printed
     company name that runs around the real chip's edge is dropped on purpose:
     that band is where the borrow data goes here. */
  .tool-chip{ width:74px; height:74px; border-radius:50%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:0; text-align:center; overflow:hidden;
    background:#a4ce4e; color:#1c2b12; padding:4px;
    border:2.5px solid #c9ced3;
    box-shadow:inset 0 0 0 1.5px #8fae4a, 0 1px 3px rgba(31,42,55,0.28); }
  .chip-mark{ width:28px; height:20px; object-fit:contain; display:block; margin-bottom:1px; flex-shrink:0; }
  .tool-chip-code{ font-size:9.5px; font-weight:800; line-height:1.15; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tool-chip-sub{ font-size:7.5px; line-height:1.15; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Green = borrowed and still within its due date. Red = anything else that
     isn't back on the shelf: overdue, away for repair, away for calibration.
     One glance answers "is anything wrong", which a rim-only difference does
     not do from across a workshop. */
  .tool-chip.overdue{ background:#dc4f43; color:#fff;
    box-shadow:inset 0 0 0 1.5px #a8352b, 0 1px 3px rgba(31,42,55,0.28); }
  .tool-chip.overdue .tool-chip-wh{ border-top-color:rgba(255,255,255,0.45); }
  /* Longer than a tool code, so it needs to step down a size to fit the disc. */
  .chip-label-sm{ font-size:7.5px !important; }
  /* Four lines of text need a wider disc than three, or the code line starts
     truncating on ordinary tool codes. Only the detail chips carry the
     warehouse line, so only they grow. */
  .tool-chip-lg{ width:92px; height:92px; }
  .tool-chip-lg .chip-mark{ width:36px; height:26px; }
  .tool-chip-lg .tool-chip-code{ font-size:11px; }
  .tool-chip-lg .tool-chip-sub{ font-size:8.5px; }
  .tool-chip-wh{ font-size:8px; line-height:1.15; font-weight:700; margin-top:2px;
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    border-top:1px solid rgba(28,43,18,0.35); padding-top:2px; }
  /* The person-level chip is tappable and carries a count badge, so it needs a
     little more room than the tool chips inside it. */
  .chip-person{ position:relative; width:78px; height:78px; cursor:pointer; font-family:inherit; overflow:visible; }
  .chip-person:hover{ filter:brightness(1.04); }
  .chip-tappable{ cursor:pointer; font-family:inherit; }
  .chip-tappable:hover{ filter:brightness(1.04); }
  .chip-person-count{ position:absolute; top:-2px; right:-2px; min-width:20px; height:20px; padding:0 5px;
    border-radius:10px; background:var(--teal-deep); color:#fff; font-size:10.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center; border:2px solid var(--card-soft); }
  .chip-person.overdue .chip-person-count{ background:var(--danger); }
  .warehouse-card-photo-edit{ position:absolute; right:8px; bottom:8px; width:30px; height:30px; border-radius:50%;
    background:rgba(255,255,255,0.94); color:var(--ink-soft); display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(31,42,55,0.18); }

  .qrtool-wh-card{ text-align:left; cursor:pointer; border:1px solid var(--line); font-family:inherit; }
  .qrtool-wh-card:hover{ border-color:var(--teal); background:var(--teal-tint); }
  .qrtool-list{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .qrtool-row{ display:flex; align-items:center; gap:12px; background:var(--card-soft); border:1px solid var(--line); border-radius:14px; padding:10px 14px; flex-wrap:wrap; }
  .qrtool-row-icon{ width:36px; height:36px; border-radius:10px; background:var(--teal-tint); color:var(--teal-deep); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .qrtool-row-photo{ width:36px; height:36px; flex-shrink:0; cursor:pointer; transition:opacity .15s; }
  .qrtool-row-photo:hover{ opacity:0.75; }
  .qrtool-row-photo .tool-master-photo, .qrtool-row-photo .tool-master-photo-placeholder{ margin:0; border-radius:10px; }
  .qrtool-row-info{ flex:1; min-width:120px; }
  .qrtool-row-name{ font-size:13.5px; font-weight:600; color:var(--ink); }
  .qrtool-row-code{ font-size:12px; color:var(--ink-soft); margin-top:1px; }

  .wh-switch{ display:flex; flex-wrap:wrap; gap:4px; background:var(--card-soft); padding:4px; border-radius:12px; }
  .wh-switch-item{ padding:7px 14px; border-radius:9px; border:none; background:transparent; font-family:inherit; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; white-space:nowrap; }
  .wh-switch-item.active{ background:var(--card); color:var(--teal-deep); box-shadow:var(--shadow-sm); }
  .export-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:-6px 0 16px; }

  .data-mgmt-block{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .data-mgmt-block:last-child{ border-bottom:none; padding-bottom:0; }
  .data-mgmt-title{ font-size:13.5px; font-weight:600; color:var(--ink); margin-bottom:3px; }
  .import-error-list{ display:flex; flex-direction:column; gap:4px; max-height:160px; overflow-y:auto; background:var(--danger-tint); border-radius:10px; padding:10px 12px; margin-top:10px; }
  .import-error-row{ font-size:11.5px; color:var(--danger); }

  .toolbar{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:18px; }
  .toolbar-btn-group{ display:flex; gap:10px; flex-wrap:wrap; }
  .search-box{ display:flex; align-items:center; gap:8px; background:var(--card-soft); border:1px solid var(--line); border-radius:12px; padding:9px 14px; flex:1; min-width:180px; color:var(--ink-soft); }
  .search-box input{ border:none; background:transparent; flex:1; padding:0; }
  .search-box input:focus{ box-shadow:none; background:transparent; }
  .chip-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{ padding:7px 14px; border-radius:20px; border:1px solid var(--line); background:var(--card); font-size:12px; cursor:pointer; font-family:inherit; color:var(--ink-soft); }
  .chip.active{ background:var(--teal-tint); border-color:rgba(51,185,164,0.35); color:var(--teal-deep); font-weight:600; }

  .row-actions{ display:flex; gap:6px; flex-wrap:nowrap; align-items:center; }
  .icon-btn{ width:31px; height:31px; border-radius:9px; border:1px solid var(--line); background:var(--card); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); }
  .icon-btn:hover{ background:var(--card-soft); color:var(--ink); }
  .icon-btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .icon-btn.danger{ color:var(--danger); }
  .icon-btn.danger:hover{ background:var(--danger-tint); border-color:rgba(242,99,74,0.3); }
  .icon-btn.success-tint{ color:var(--teal-deep); border-color:rgba(51,185,164,0.3); background:var(--teal-tint); }

  /* Modal */
  /* overflow-y + touch-scroll here matter specifically for mobile Safari: with
     only the card scrolling and the overlay centering via flex, a card taller
     than the visible viewport got its TOP clipped above the screen with no way
     to reach it — the overlay itself needs to be the thing that scrolls. */
  /* z-index:80 — must sit above the mobile bottom tab bar (.sidebar at the
     ≤640px breakpoint, z-index:60). It didn't before: on mobile the fixed
     bottom nav rendered ON TOP of any open modal, visually covering — and
     more importantly intercepting taps on — whatever sat in the last ~84px
     of the modal, which is exactly where a form's submit button lives (e.g.
     "ยืนยันการยืม" on the borrow-confirmation form). Scrolling the modal content
     never helped because the nav bar was still there overlapping the bottom
     of the screen regardless of scroll position. */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(31,42,55,0.35); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; z-index:80; padding:20px;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .modal-card{
    background:var(--card); border:1px solid var(--line); border-radius:20px; padding:22px 24px; width:100%; max-width:400px;
    box-shadow:0 24px 60px rgba(31,42,55,0.18); margin:auto; flex-shrink:0;
    /* Forms like "แก้ไขเครื่องมือ" can run taller than the viewport (especially
       on a phone in landscape); without this the bottom of the form — including
       the save button — was simply unreachable. max-height (minus the overlay's
       20px top+bottom padding) + overflow-y:auto lets the card itself scroll.
       100dvh (dynamic viewport height) is used where supported so mobile
       Safari's address bar showing/hiding doesn't miscalculate the available
       height; 100vh is kept first as a fallback for browsers without dvh. */
    max-height:calc(100vh - 40px);
    max-height:calc(100dvh - 40px);
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  /* The LBC-FM-034 editor is a two-column form with 17 fields; 400px squeezes
     every label onto two lines, so give this one modal more room on screens
     that have it. */
  .modal-card.modal-wide{ max-width:620px; }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .modal-head h3{ font-size:16px; font-weight:600; color:var(--ink); }
  .modal-form{ display:flex; flex-direction:column; gap:14px; }

  /* Toast */
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:90;
    display:flex; align-items:center; gap:9px; padding:12px 20px; border-radius:14px; font-size:13.5px; font-weight:600;
    box-shadow:0 16px 40px rgba(31,42,55,0.2); animation:toastIn .2s ease-out; border:1px solid transparent;
  }
  .toast.success{ background:var(--teal); color:#fff; }
  .toast.error{ background:var(--danger); color:#fff; }
  .toast.warning{ background:var(--amber); color:#fff; }
  @keyframes toastIn{ from{ opacity:0; transform:translate(-50%,10px); } to{ opacity:1; transform:translate(-50%,0); } }

  @media (max-width: 860px){
    .app-body{ flex-direction:column; }
    .sidebar{ width:100%; max-width:100%; height:auto; position:relative; flex-direction:row; align-items:center; flex-wrap:wrap; padding:14px; }
    .brand{ border:none; padding:0; }
    .nav-list{ flex-direction:row; flex-wrap:wrap; flex:none; }
    .sidebar-foot{ display:none; }
    .export-btn{ margin-top:0; }
    .scan-panel .scan-form{ grid-template-columns:1fr; }
    .scan-steps{ grid-template-columns:1fr; }
    .scan-panel-head{ flex-direction:column; gap:4px; }
    .main{ padding:16px; }
    .app-footer{ flex-direction:column; gap:4px; text-align:center; padding:12px 14px; }
  }

  /* Phones specifically: the wrapping top bar above eats too much vertical
     space before the person even sees the dashboard or scan screen — this
     is the #1 complaint from staff using phones day-to-day. Turn the whole
     sidebar into a slim, swipeable bottom tab bar instead, the way a native
     phone app would, and reclaim the top of the screen for content. */
  @media (max-width: 640px){
    .app-body{ padding-bottom:0; }
    .sidebar{
      position:fixed; left:0; right:0; bottom:0; top:auto; z-index:60; width:100%; max-width:100%;
      flex-direction:row; flex-wrap:nowrap; align-items:center; justify-content:flex-start;
      overflow-x:auto; -webkit-overflow-scrolling:touch;
      padding:6px 8px; gap:4px; border-top:1px solid var(--line);
      background:var(--card); box-shadow:0 -8px 24px rgba(31,42,55,0.10);
    }
    .sidebar .brand{ display:none; }
    .nav-list{ flex-direction:row; flex-wrap:nowrap; gap:2px; }
    .nav-item{ flex-direction:column; gap:2px; padding:7px 11px; font-size:10.5px; white-space:nowrap; border-radius:12px; }
    .nav-item span{ font-size:10.5px; }
    .nav-chev{ display:none; }
    .export-btn{ flex-direction:column; font-size:10.5px; padding:7px 11px; }
    .user-box{ flex-direction:row; align-items:center; flex:none; border:none; padding:0; margin:0; background:none; gap:6px; }
    .user-box-id{ display:none; }
    .user-box-actions{ flex-direction:row; gap:4px; }
    .user-box-btn{ flex-direction:column; gap:2px; font-size:9.5px; padding:7px 9px; white-space:nowrap; }
    .main{ padding:14px 14px 84px; }
    .topbar{ flex-wrap:wrap; gap:8px; }
    .topbar h1{ font-size:17px; }
    .admin-pill{ display:none; }
    /* Keep the avatar + code visible on small screens (that's the useful
       "who am I logged in as" signal) but drop the wordier bits. */
    .user-card{ padding:4px; gap:6px; }
    .user-card-line1{ font-size:12px; }
    .user-card-line2{ display:none; }
    .live-clock{ padding:5px 9px; gap:6px; }
    .live-clock-date{ display:none; }
    .kpi-grid{ grid-template-columns:repeat(2,1fr); gap:10px; }
    .kpi-value{ font-size:20px; }
    .modal-card{ max-width:100%; border-radius:16px; }

    /* Action rows used to wrap raggedly — two buttons on one line, the next
       alone, the one after that alone again — because each button sized to its
       own Thai label. Give every button in a toolbar the full width so the
       result is a predictable stack with consistent tap targets, instead of a
       layout that changes shape with the wording. */
    .mode-tab{ max-width:none; padding:14px 10px; font-size:13.5px; }
    .toolbar{ gap:8px; margin-bottom:14px; }
    .toolbar .btn{ flex:1 1 100%; width:100%; justify-content:center; padding:11px 12px; }
    .toolbar .panel-head{ flex:1 1 100%; }
    /* Search/filter inputs sitting in a toolbar get the same treatment. */
    .toolbar .input, .toolbar .search-box{ flex:1 1 100%; width:100%; }
    /* Modal footers: same problem, same fix — plus these are the buttons you
       least want to mis-tap, since one of them is usually "delete". */
    .form-actions{ flex-wrap:wrap; gap:8px; }
    .form-actions .btn{ flex:1 1 100%; width:100%; justify-content:center; padding:11px 12px; }
    .tool-photo-btn-row{ flex-wrap:wrap; gap:8px; }
    .tool-photo-btn-row .btn{ flex:1 1 calc(50% - 4px); justify-content:center; }
    /* One warehouse card per row: at phone width two columns left the name
       and the Excel/PDF/QR row squeezed to the point of wrapping mid-word. */
    .warehouse-grid{ grid-template-columns:1fr; gap:12px; }
    /* Shadow Board toolbar: icon-only buttons in a compact row instead of four
       full-width bars stacked down the screen. The upload hint goes with them —
       whoever is uploading a spreadsheet is not doing it from a phone. */
    .shelfboard-toolbar{ display:flex; flex-wrap:wrap; gap:8px; }
    .shelfboard-toolbar .btn{ flex:0 0 auto; width:auto; padding:9px 11px; }
    .shelfboard-toolbar .btn-label{ display:none; }
    .shelfboard-toolbar .btn-label.keep-label{ display:inline; font-size:12.5px; }
    .import-hint{ display:none; }
    /* Status key: short codes on one tidy row rather than five wrapping labels. */
    .legend{ gap:10px 14px; justify-content:center; font-size:11px; margin-top:10px; }
    .legend-long{ display:none; }
    .legend-short{ display:inline; font-weight:700; letter-spacing:0.3px; }
    .chip-board{ padding:12px; max-height:300px; min-height:0; }
    .tool-chip{ width:66px; height:66px; }
    .tool-chip-lg{ width:82px; height:82px; }
    .chip-person{ width:70px; height:70px; }
    .warehouse-card{ padding:14px; gap:12px; }
    .panel{ padding:14px; }
    .panel-head p{ font-size:12px; }
    /* Tables on phones scroll sideways rather than crushing every column. */
    .table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .table-wrap table{ min-width:520px; }
  }
`;

const rootEl = document.getElementById('root');
createRoot(rootEl).render(<App />);

  </script>
</body>
