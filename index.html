}

/* ---------------------------- Settings Page ---------------------------- */
function SettingsPage({ settings, setSettings, showToast, addAudit, tools, setTools, warehouses, staff, setStaff, users, setUsers, tx, setTx, toolStatus, onPurgePhotos, isMainAdmin, shelves }) {
  const [form, setForm] = useState(settings);
  const [importPreview, setImportPreview] = useState(null); // { toAdd, toUpdate, errors }
  const [importBusy, setImportBusy] = useState(false);
  const [codeCleanupBusy, setCodeCleanupBusy] = useState(false);
  const fileInputRef = React.useRef(null);
  const [staffImportPreview, setStaffImportPreview] = useState(null);
  const [staffImportBusy, setStaffImportBusy] = useState(false);
  const [purgeBusy, setPurgeBusy] = useState(false);
  const [purgeDays, setPurgeDays] = useState('');
  const [purgeConfirmOpen, setPurgeConfirmOpen] = useState(false);
  const [historyDeleteDays, setHistoryDeleteDays] = useState(90);
  const [historyDeleteBusy, setHistoryDeleteBusy] = useState(false);
  const [historyConfirmOpen, setHistoryConfirmOpen] = useState(false);
  const staffFileInputRef = React.useRef(null);
  const [newAccounts, setNewAccounts] = useState(null); // temp-password results shown once after staff import
  const [backupBusy, setBackupBusy] = useState(false);
  useEffect(() => { setForm(settings); }, [settings]);

  async function save(e) {
    e.preventDefault();
    const maxBorrow = Number(form.maxBorrowPerStaff);
    const dueDays = Number(form.defaultDueDays);
    const reminderDays = Number(form.backupReminderDays) || 7;
    if (!maxBorrow || maxBorrow < 1) return showToast('จำนวนเครื่องมือสูงสุดต้องอย่างน้อย 1 ชิ้น', 'error');
    if (!dueDays || dueDays < 1) return showToast('จำนวนวันกำหนดคืนต้องอย่างน้อย 1 วัน', 'error');
    const next = { ...settings, maxBorrowPerStaff: maxBorrow, defaultDueDays: dueDays, backupReminderDays: reminderDays };
    try {
      await setSettings(next);
    } catch (err) {
      console.error('failed to save settings', err);
      return showToast('บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    addAudit?.('settings_update', `จำนวนยืมสูงสุดต่อคน: ${maxBorrow}, กำหนดคืนเริ่มต้น: ${dueDays} วัน, เตือนสำรองข้อมูลทุก: ${reminderDays} วัน`);
    showToast('บันทึกการตั้งค่าเรียบร้อย', 'success');
  }

  // Irreversible and scoped to the main admin only (enforced here too, not
  // just by hiding the control in the UI) — only touches RETURNED items older
  // than the cutoff, so nothing currently borrowed can ever be deleted out
  // from under an active loan.
  async function confirmPurgePhotos() {
    setPurgeConfirmOpen(false);
    setPurgeBusy(true);
    const n = await onPurgePhotos?.(purgeDays ? Number(purgeDays) : undefined);
    setPurgeBusy(false);
    showToast(n > 0 ? `ลบรูปหลักฐาน ${n} รูปเรียบร้อย` : 'ไม่มีรูปหลักฐานให้ลบตามเงื่อนไขนี้', 'success');
  }

  async function deleteOldHistory() {
    if (!isMainAdmin) return showToast('มีแต่แอดมินหลักเท่านั้นที่ลบประวัติได้', 'error');
    const days = Number(historyDeleteDays);
    if (!days || days < 1) return showToast('กรุณาระบุจำนวนวันให้ถูกต้อง', 'error');
    const cutoff = addDays(todayISO(), -days);
    const toDelete = tx.filter(t => t.returnDate && localISODate(parseDateValue(t.returnDate)) < cutoff);
    setHistoryConfirmOpen(false);
    if (!toDelete.length) return showToast('ไม่มีประวัติที่เก่ากว่าที่กำหนดให้ลบ', 'success');
    setHistoryDeleteBusy(true);
    const deleteIds = new Set(toDelete.map(t => t.id));
    try {
      await setTx(tx.filter(t => !deleteIds.has(t.id)));
      // Evidence photos for the deleted transactions (if any survived an
      // earlier purge) are cleaned up alongside the history rows themselves.
      for (const t of toDelete) {
        if (t.hasBorrowPhoto) await storageDelete(`toolcrib-photo:${t.id}:borrow`, true);
        if (t.hasReturnPhoto) await storageDelete(`toolcrib-photo:${t.id}:return`, true);
      }
    } catch (err) {
      console.error('failed to delete old history', err);
      setHistoryDeleteBusy(false);
      return showToast('ลบประวัติไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    setHistoryDeleteBusy(false);
    addAudit?.('history_delete', `ลบประวัติยืม-คืนที่เก่ากว่า ${days} วัน (${toDelete.length} รายการ)`);
    showToast(`ลบประวัติเก่าเรียบร้อย (${toDelete.length} รายการ)`, 'success');
  }

  async function doFullBackup() {
    setBackupBusy(true);
    try {
      const wb = XLSX.utils.book_new();
      wb.SheetNames.push('รายการเครื่องมือ');
      wb.Sheets['รายการเครื่องมือ'] = XLSX.utils.json_to_sheet(buildToolReportRows(tools, warehouses, toolStatus));
      wb.SheetNames.push('คลังเครื่องมือ');
      wb.Sheets['คลังเครื่องมือ'] = XLSX.utils.json_to_sheet(warehouses.map(w => ({ ชื่อคลัง: w.name, หมายเหตุ: w.note || '' })));
      wb.SheetNames.push('พนักงาน');
      wb.Sheets['พนักงาน'] = XLSX.utils.json_to_sheet(staff.map(s => ({ รหัสพนักงาน: s.code, 'ชื่อ-สกุล': s.name, สังกัด: s.dept })));
      wb.SheetNames.push('ประวัติยืม-คืน');
      wb.Sheets['ประวัติยืม-คืน'] = XLSX.utils.json_to_sheet(tx.map(t => {
        const tool = tools.find(x => x.id === t.toolId); const st = staff.find(x => x.id === t.staffId);
        // Matches the exact filename each photo gets inside the "รูปหลักฐาน/"
        // folder below (built from the same key), so a row here always points
        // straight at its photo file(s) in this same ZIP — no separate lookup.
        return {
          รหัสเครื่องมือ: tool?.code || '-', ชื่อเครื่องมือ: tool?.name || '-',
          ผู้ยืม: st?.name || '-', สังกัด: st?.dept || '-',
          'วันเวลาที่ยืม': fmtThaiDateTime(t.borrowDate), กำหนดคืน: fmtThaiDate(t.dueDate),
          'วันเวลาที่คืน': t.returnDate ? fmtThaiDateTime(t.returnDate) : 'ยังไม่คืน',
          'ไฟล์รูปก่อนยืม': t.hasBorrowPhoto && !t.photosPurged ? `รูปหลักฐาน/${t.id}_borrow.jpg` : (t.photosPurged ? 'ลบแล้ว' : '-'),
          'ไฟล์รูปหลังยืม': t.hasReturnPhoto && !t.photosPurged ? `รูปหลักฐาน/${t.id}_return.jpg` : (t.photosPurged ? 'ลบแล้ว' : '-'),
        };
      }));
      const xlsxArrayBuffer = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });

      await ensureJsZip();
      const zip = new window.JSZip();
      zip.file(`ข้อมูลระบบ-${todayISO()}.xlsx`, xlsxArrayBuffer);

      // Bundle evidence photos into the same archive so "สำรองข้อมูล" really
      // covers everything (staff, tools, history, and photos) in one file.
      let photoCount = 0;
      try {
        const list = await window.storage.list('toolcrib-photo:', true);
        for (const key of (list?.keys || [])) {
          const raw = await storageGet(key, true);
          if (!raw) continue;
          const match = /^data:image\/(\w+);base64,(.*)$/.exec(raw);
          if (!match) continue;
          const ext = match[1] === 'jpeg' ? 'jpg' : match[1];
          const safeName = key.replace(/^toolcrib-photo:/, '').replace(/:/g, '_');
          zip.file(`รูปหลักฐาน/${safeName}.${ext}`, match[2], { base64: true });
          photoCount++;
        }
      } catch (err) { console.error('failed to bundle photos into backup', err); }

      const blob = await zip.generateAsync({ type: 'blob' });
      const filename = `สำรองข้อมูลระบบ-${todayISO()}.zip`;

      // Where the file goes: prefer letting the person pick a folder/drive
      // themselves, and fall back gracefully on browsers that can't do that.
      //   1) Chrome/Edge desktop — native "Save As" dialog (any folder/drive)
      //   2) iOS/Android — share sheet's "Save to Files" lets them pick a folder
      //   3) everything else — normal download to the browser's Downloads folder
      let saved = true;
      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{ description: 'ไฟล์ ZIP', accept: { 'application/zip': ['.zip'] } }],
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
        } catch (err) {
          if (err?.name === 'AbortError') { saved = false; } else { throw err; }
        }
      } else if (navigator.canShare && navigator.canShare({ files: [new File([blob], filename)] })) {
        try {
          await navigator.share({ files: [new File([blob], filename, { type: 'application/zip' })], title: filename });
        } catch (err) {
          if (err?.name === 'AbortError') { saved = false; } else { throw err; }
        }
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      }

      if (!saved) { setBackupBusy(false); return; }

      const now = new Date().toISOString();
      try { await setSettings({ ...settings, lastBackupAt: now }); } catch (err) { /* the backup file already downloaded either way */ }

      addAudit?.('data_backup', `สำรองข้อมูลทั้งหมด (${tools.length} เครื่องมือ, ${staff.length} พนักงาน, ${tx.length} ประวัติ, ${photoCount} รูปภาพ)`);
      showToast(`สำรองข้อมูลเรียบร้อย (รวมรูปหลักฐาน ${photoCount} รูป)`, 'success');
    } catch (err) {
      console.error('backup failed', err);
      showToast('สำรองข้อมูลไม่สำเร็จ กรุณาลองใหม่', 'error');
    } finally {
      setBackupBusy(false);
    }
  }

  async function handleFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setImportBusy(true);
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const sheetName = wb.SheetNames.includes('รายการเครื่องมือ') ? 'รายการเครื่องมือ' : wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '' });
      const toAdd = [], toUpdate = [], errors = [];
      // Codes already claimed by an earlier row of THIS file — otherwise a file
      // listing the same code twice would create two tools sharing a code, and
      // scanning that code would become ambiguous.
      const seenInFile = new Set();
      rows.forEach((r, i) => {
        const code = normalizeCode(String(r['รหัสเครื่องมือ'] || '').trim());
        const name = String(r['ชื่อเครื่องมือ'] || '').trim();
        const catLabel = String(r['หมวดหมู่'] || '').trim();
        const whName = String(r['คลังเครื่องมือ'] || '').trim();
        if (!code || !name) { errors.push({ row: i + 2, reason: 'ไม่มีรหัสหรือชื่อเครื่องมือ' }); return; }
        const key = code.toLowerCase();
        if (seenInFile.has(key)) { errors.push({ row: i + 2, reason: `รหัสเครื่องมือ "${code}" ซ้ำกับแถวก่อนหน้าในไฟล์นี้` }); return; }
        seenInFile.add(key);
        const matchedWh = warehouses.find(w => w.name.trim().toLowerCase() === whName.toLowerCase());
        if (!matchedWh) { errors.push({ row: i + 2, reason: `ไม่พบคลัง "${whName || '(ว่าง)'}" ในระบบ` }); return; }
        const matchedCat = CATEGORIES.find(c => c.label === catLabel);
        const existing = tools.find(t => t.code.toLowerCase() === key);
        const entry = { code, name, category: matchedCat?.id || 'other', warehouseId: matchedWh.id };
        if (existing) toUpdate.push({ ...entry, id: existing.id });
        else toAdd.push(entry);
      });
      setImportPreview({ toAdd, toUpdate, errors });
    } catch (err) {
      showToast('อ่านไฟล์ไม่สำเร็จ กรุณาตรวจสอบว่าเป็นไฟล์ Excel ที่ถูกต้อง', 'error');
    }
    setImportBusy(false);
    if (fileInputRef.current) fileInputRef.current.value = '';
  }

  async function confirmImport() {
    if (!importPreview) return;
    const additions = importPreview.toAdd.map(e => ({ ...e, id: uid('T'), condition: 'normal' }));
    const updateMap = new Map(importPreview.toUpdate.map(e => [e.id, e]));
    const nextTools = [
      ...tools.map(t => updateMap.has(t.id) ? { ...t, name: updateMap.get(t.id).name, category: updateMap.get(t.id).category, warehouseId: updateMap.get(t.id).warehouseId } : t),
      ...additions
    ];
    try {
      await setTools(nextTools);
    } catch (err) {
      console.error('failed to import tools', err);
      return showToast('นำเข้าไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    addAudit?.('data_import', `นำเข้าเครื่องมือ: เพิ่ม ${additions.length}, อัปเดต ${importPreview.toUpdate.length}, ข้าม ${importPreview.errors.length}`);
    showToast(`นำเข้าข้อมูลเรียบร้อย (เพิ่ม ${additions.length}, อัปเดต ${importPreview.toUpdate.length})`, 'success');
    setImportPreview(null);
  }

  // The normalizeCode fix in the tool form only cleans a code the next time
  // someone saves THAT tool — it does nothing to codes already sitting in
  // storage from before the fix existed. This scans every existing tool at
  // once and fixes any whose code still has an accent mark or similar
  // lookalike character, without needing to open and re-save each one by hand.
  async function cleanupToolCodes() {
    const fixes = tools
      .map(t => ({ tool: t, clean: normalizeCode(t.code) }))
      .filter(({ tool, clean }) => clean !== tool.code);
    if (!fixes.length) return showToast('รหัสเครื่องมือทั้งหมดปกติดีอยู่แล้ว ไม่พบตัวที่ต้องแก้', 'success');
    // A cleaned code could collide with one that already exists (rare, but
    // possible) — those are skipped and reported rather than silently
    // creating a duplicate code.
    const existingCodes = new Set(tools.map(t => t.code.toLowerCase()));
    const toFix = [], skipped = [];
    fixes.forEach(({ tool, clean }) => {
      if (existingCodes.has(clean.toLowerCase()) && clean.toLowerCase() !== tool.code.toLowerCase()) {
        skipped.push(tool.code);
      } else {
        toFix.push({ id: tool.id, from: tool.code, clean });
      }
    });
    if (!toFix.length) return showToast(`พบรหัสผิดปกติ ${fixes.length} รายการ แต่แก้ไม่ได้เพราะจะซ้ำกับรหัสที่มีอยู่แล้ว — กรุณาแก้เองทีละตัว`, 'error');
    setCodeCleanupBusy(true);
    const fixMap = new Map(toFix.map(f => [f.id, f.clean]));
    try {
      await setTools(tools.map(t => fixMap.has(t.id) ? { ...t, code: fixMap.get(t.id) } : t));
    } catch (err) {
      console.error('failed to clean up tool codes', err);
      setCodeCleanupBusy(false);
      return showToast('แก้ไขรหัสไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    setCodeCleanupBusy(false);
    addAudit?.('data_import', `ล้างอักขระผิดปกติในรหัสเครื่องมือ ${toFix.length} รายการ: ${toFix.map(f => `${f.from}→${f.clean}`).join(', ')}`);
    showToast(`แก้รหัสเครื่องมือเรียบร้อย ${toFix.length} รายการ${skipped.length ? ` (ข้าม ${skipped.length} รายการเพราะซ้ำกับรหัสเดิม)` : ''}`, 'success');
  }

  function genTempPassword() {
    const chars = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789'; // no 0/O/1/l/I to avoid confusion when printed
    let out = '';
    for (let i = 0; i < 8; i++) out += chars[Math.floor(Math.random() * chars.length)];
    return out;
  }

  async function handleStaffFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setStaffImportBusy(true);
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const sheetName = wb.SheetNames.includes('พนักงาน') ? 'พนักงาน' : wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '' });
      const toAdd = [], toUpdate = [], errors = [];
      // Codes already claimed by an earlier row of THIS file. Without this, a
      // file listing the same code twice would create two staff records and two
      // login accounts sharing one username.
      const seenInFile = new Set();
      rows.forEach((r, i) => {
        const code = String(r['รหัสพนักงาน'] || '').trim();
        const name = String(r['ชื่อ-สกุล'] || r['ชื่อ'] || '').trim();
        const dept = String(r['สังกัด'] || '').trim();
        if (!code || !name) { errors.push({ row: i + 2, reason: 'ไม่มีรหัสพนักงานหรือชื่อ' }); return; }
        const key = code.toLowerCase();
        if (seenInFile.has(key)) { errors.push({ row: i + 2, reason: `รหัสพนักงาน "${code}" ซ้ำกับแถวก่อนหน้าในไฟล์นี้` }); return; }
        seenInFile.add(key);
        const existing = staff.find(s => s.code.toLowerCase() === key);
        if (existing) toUpdate.push({ id: existing.id, code, name, dept });
        else toAdd.push({ code, name, dept });
      });
      setStaffImportPreview({ toAdd, toUpdate, errors });
    } catch (err) {
      showToast('อ่านไฟล์ไม่สำเร็จ กรุณาตรวจสอบว่าเป็นไฟล์ Excel ที่ถูกต้อง', 'error');
    }
    setStaffImportBusy(false);
    if (staffFileInputRef.current) staffFileInputRef.current.value = '';
  }

  async function confirmStaffImport() {
    if (!staffImportPreview) return;
    const tempList = []; // { code, name, tempPassword } — shown once, never retrievable again
    const newStaffRecords = [];
    const newUserRecords = [];
    for (const entry of staffImportPreview.toAdd) {
      const newStaffRec = { id: uid('S'), code: entry.code, name: entry.name, dept: entry.dept };
      const tempPassword = genTempPassword();
      const passwordHash = await hashPassword(tempPassword);
      newStaffRecords.push(newStaffRec);
      newUserRecords.push({ id: uid('U'), username: newStaffRec.code, passwordHash, role: 'staff', staffId: newStaffRec.id });
      tempList.push({ code: newStaffRec.code, name: newStaffRec.name, tempPassword });
    }
    const updateMap = new Map(staffImportPreview.toUpdate.map(e => [e.id, e]));
    const nextStaff = [
      ...staff.map(s => updateMap.has(s.id) ? { ...s, name: updateMap.get(s.id).name, dept: updateMap.get(s.id).dept } : s),
      ...newStaffRecords
    ];
    try {
      await setStaff(nextStaff);
      if (newUserRecords.length) await setUsers([...newUserRecords, ...users]);
    } catch (err) {
      console.error('failed to import staff', err);
      return showToast('นำเข้าไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่ (บัญชีบางส่วนอาจยังไม่ถูกสร้าง)', 'error');
    }
    addAudit?.('data_import', `นำเข้าพนักงาน: เพิ่ม ${newStaffRecords.length}, อัปเดต ${staffImportPreview.toUpdate.length}, ข้าม ${staffImportPreview.errors.length}`);
    showToast(`นำเข้าข้อมูลพนักงานเรียบร้อย (เพิ่ม ${newStaffRecords.length}, อัปเดต ${staffImportPreview.toUpdate.length})`, 'success');
    setStaffImportPreview(null);
    if (tempList.length) setNewAccounts(tempList);
  }

  function downloadTempPasswordList() {
    if (!newAccounts) return;
    const wb = XLSX.utils.book_new();
    wb.SheetNames.push('รหัสผ่านชั่วคราว');
    wb.Sheets['รหัสผ่านชั่วคราว'] = XLSX.utils.json_to_sheet(
      newAccounts.map(a => ({ 'ชื่อผู้ใช้งาน (รหัสพนักงาน)': a.code, 'ชื่อ-สกุล': a.name, 'รหัสผ่านชั่วคราว': a.tempPassword }))
    );
    XLSX.writeFile(wb, `รหัสผ่านชั่วคราว-${todayISO()}.xlsx`);
  }

  return (
    <div className="page-stack">
      <section className="panel" style={{ maxWidth: 460 }}>
        <div className="panel-head">
          <h2><SettingsIcon size={16} /> ตั้งค่าระบบ</h2>
          <p>ปรับกติกาการยืม-คืนที่ใช้ทั้งระบบ</p>
        </div>
        <form onSubmit={save} className="modal-form">
          <div className="form-group">

/* ---------------------------- Dashboard ---------------------------- */
const ACTIVE_STATUS_SET = new Set(['borrowed', 'overdue', 'damaged', 'calibration']);

// Same full action set as a shelf's tool list (damage report, calibration,
// QR, photo, PDF, edit, delete), but scoped globally across every warehouse
// and filtered to only tools currently doing something — borrowed, overdue,
// damaged, or off at calibration. A tool just sitting available/idle has
// nothing to review here, so it's deliberately left out to keep this list
// short and relevant for quick lookup instead of duplicating the full
// inventory. Self-contained (own copies of save/delete/print) so it can be
// embedded in multiple pages without depending on any one page's state.
function ActiveToolsPanel({ tools, staff, tx, toolStatus, warehouses, setTools, showToast, addAudit, onSetCondition, onSetCalibration, isAdmin }) {
  const [query, setQuery] = useState('');
  const [damageModal, setDamageModal] = useState(null);
  const [calibSendModal, setCalibSendModal] = useState(null);
  const [calibReceiveModal, setCalibReceiveModal] = useState(null);
  const [editTool, setEditTool] = useState(null);
  const [qrTool, setQrTool] = useState(null);
  const [photoTool, setPhotoTool] = useState(null);
  const [printingToolId, setPrintingToolId] = useState(null);

  const activeTools = useMemo(() => {
    const q = query.trim().toLowerCase();
    return tools
      .filter(t => ACTIVE_STATUS_SET.has(toolStatus(t.id)))
      .filter(t => !q || t.name.toLowerCase().includes(q) || t.code.toLowerCase().includes(q))
      .sort((a, b) => naturalCompareCode(a.code, b.code));
  }, [tools, toolStatus, query]);

  function latestPrintableDoc(toolId) {
    return (tx || [])
      .filter(t => t.toolId === toolId && t.docForm && t.returnDate)
      .sort((a, b) => (b.returnDate || '').localeCompare(a.returnDate || ''))[0] || null;
  }
  async function printToolLoanDoc(t) {
    const record = latestPrintableDoc(t.id);
    if (!record) return;
    setPrintingToolId(t.id);
    try {
      const staffMember = staff?.find(s => s.id === record.staffId);
      const returnedByStaff = record.returnedBy ? staff?.find(s => s.id === record.returnedBy) : null;
      await generateLoanFormPdf(record, t, staffMember, returnedByStaff, record.docForm);
    } catch (err) {
      console.error('failed to generate loan form pdf', err);
      showToast('สร้าง PDF ไม่สำเร็จ กรุณาลองใหม่', 'error');
    } finally {
      setPrintingToolId(null);
    }
  }

  async function saveEditedTool(data) {
    const { _newPhoto, _removePhoto, ...formData } = data;
    if (!formData.code.trim() || !formData.name.trim()) return showToast('กรุณากรอกรหัสและชื่อเครื่องมือ', 'error');
    if (!formData.warehouseId) return showToast('กรุณาเลือกคลังเครื่องมือ', 'error');
    const cleanCode = normalizeCode(formData.code.trim());
    if (tools.some(t => t.id !== formData.id && t.code.trim().toLowerCase() === cleanCode.toLowerCase())) {
      return showToast('รหัสนี้มีอยู่แล้วในเครื่องมือชิ้นอื่น', 'error');
    }
    const hasPhoto = _newPhoto ? true : (_removePhoto ? false : !!formData.hasPhoto);
    try {
      if (_newPhoto) await storageSet(`toolcrib-photo:master:${formData.id}`, _newPhoto, true);
      if (_removePhoto) await storageDelete(`toolcrib-photo:master:${formData.id}`, true);
      await setTools(tools.map(t => t.id === formData.id ? {
        ...t, code: cleanCode, name: formData.name.trim(), category: formData.category, warehouseId: formData.warehouseId,
        partNo: formData.partNo || '', serialNo: formData.serialNo || '', calibDate: formData.calibDate || '', calibDue: formData.calibDue || '',
        requiresLoanForm: !!formData.requiresLoanForm, hasPhoto,
        photoUpdatedAt: (_newPhoto || _removePhoto) ? Date.now() : t.photoUpdatedAt,
        shelfId: formData.warehouseId !== t.warehouseId ? null : t.shelfId,
      } : t));
    } catch (err) {
      console.error('failed to save tool', err);
      return showToast('บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    addAudit?.('tool_edit', `${cleanCode} — ${formData.name}`);
    showToast('บันทึกการแก้ไขเรียบร้อย', 'success');
    setEditTool(null);
  }

  async function deleteToolHere(t) {
    const status = toolStatus(t.id);
    if (status === 'borrowed' || status === 'overdue') return showToast('ไม่สามารถลบเครื่องมือที่ถูกยืมอยู่ได้', 'error');
    try {
      await setTools(tools.filter(x => x.id !== t.id));
      if (t.hasPhoto) await storageDelete(`toolcrib-photo:master:${t.id}`, true);
    } catch (err) {
      console.error('failed to delete tool', err);
      return showToast('ลบไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    addAudit?.('tool_delete', `${t.code} — ${t.name}`);
    showToast('ลบเครื่องมือเรียบร้อย', 'success');
  }

  return (
    <section className="panel">
      <div className="panel-head">
        <h2><Clock size={16} /> อุปกรณ์ที่มีการใช้งานอยู่</h2>
        <p>เฉพาะเครื่องมือที่ถูกยืมอยู่ เกินกำหนดคืน ชำรุด/ส่งซ่อม หรือส่ง Calibration — ไม่รวมเครื่องมือที่ยังไม่ถูกยืมและพร้อมใช้งานปกติ</p>
      </div>
      <div className="form-group">
        <input placeholder="ค้นหาชื่อหรือรหัสเครื่องมือ..." value={query} onChange={e => setQuery(e.target.value)} />
      </div>
      <div className="qrtool-list">
        {activeTools.map(t => {
          const status = toolStatus(t.id);
          const meta = QRTOOL_STATUS_META[status];
          const CatIcon = catMap[t.category]?.icon || Package;
          return (
            <div key={t.id} className="qrtool-row">
              <div className="qrtool-row-icon"><CatIcon size={17} /></div>
              <div className="qrtool-row-info">
                <div className="qrtool-row-name">{t.name}</div>
                <div className="qrtool-row-code mono">{t.code}</div>
              </div>
              {meta && <span className={`badge ${meta.tone}`}>{meta.label}</span>}
              <div className="row-actions">
                {isAdmin && (status === 'damaged' ? (
                  <button className="icon-btn success-tint" title="แจ้งซ่อมเสร็จแล้ว" onClick={() => onSetCondition?.(t.id, 'normal', '')}><WrenchIcon2 size={15} /></button>
                ) : (
                  <button className="icon-btn" title="แจ้งชำรุด/ส่งซ่อม" disabled={status !== 'available'} onClick={() => setDamageModal(t)}><ShieldAlert size={15} /></button>
                ))}
                {isAdmin && (status === 'calibration' ? (
                  <button className="icon-btn success-tint" title="รับเข้าจาก Calibration" onClick={() => setCalibReceiveModal(t)}><CheckCircle2 size={15} /></button>
                ) : (
                  <button className="icon-btn" title="ส่ง Calibration" disabled={status !== 'available'} onClick={() => setCalibSendModal(t)}><Gauge size={15} /></button>
                ))}
                {t.hasPhoto && (
                  <button type="button" className="icon-btn" title="ดูรูปเครื่องมือ" onClick={() => setPhotoTool(t)}><ImageIcon size={15} /></button>
                )}
                {t.requiresLoanForm && (
                  latestPrintableDoc(t.id) ? (
                    <button className="icon-btn success-tint" title="ดู/พิมพ์ใบยืม-คืนล่าสุด (PDF)"
                      disabled={printingToolId === t.id} onClick={() => printToolLoanDoc(t)}>
                      {printingToolId === t.id ? <Loader2 size={15} className="spin" /> : <Download size={15} />}
                    </button>
                  ) : (
                    <button className="icon-btn" style={{ opacity: 0.4 }} title="ยังไม่มีรายการยืม-คืนที่เสร็จสมบูรณ์สำหรับเครื่องมือชิ้นนี้" disabled>
                      <Download size={15} />
                    </button>
                  )
                )}
                <button type="button" className="icon-btn" title="ดู/พิมพ์ QR" onClick={() => setQrTool(t)}><QrCode size={15} /></button>
                {isAdmin && (
                  <>
                    <button type="button" className="icon-btn" title="แก้ไขเครื่องมือ" onClick={() => setEditTool(t)}><Pencil size={15} /></button>
                    <button type="button" className="icon-btn danger" title="ลบเครื่องมือ" onClick={() => deleteToolHere(t)}><Trash2 size={15} /></button>
                  </>
                )}
              </div>
            </div>
          );
        })}
        {!activeTools.length && <div className="empty-state">{query ? 'ไม่พบเครื่องมือที่ค้นหา' : 'ไม่มีเครื่องมือที่กำลังใช้งานอยู่ตอนนี้'}</div>}
      </div>

      {damageModal && (
        <Modal title="แจ้งเครื่องมือชำรุด/ส่งซ่อม" onClose={() => setDamageModal(null)}>
          <DamageForm tool={damageModal}
            onSave={(note) => { onSetCondition?.(damageModal.id, 'damaged', note); setDamageModal(null); }}
            onCancel={() => setDamageModal(null)} />
        </Modal>
      )}
      {calibSendModal && (
        <Modal title="ส่งเครื่องมือไป Calibration" onClose={() => setCalibSendModal(null)}>
          <CalibrationSendForm tool={calibSendModal}
            onSave={(payload) => { onSetCalibration?.(calibSendModal.id, 'send', payload); setCalibSendModal(null); }}
            onCancel={() => setCalibSendModal(null)} />
        </Modal>
      )}
      {calibReceiveModal && (
        <Modal title="รับเครื่องมือกลับจาก Calibration" onClose={() => setCalibReceiveModal(null)}>
          <CalibrationReceiveForm tool={calibReceiveModal}
            onSave={(payload) => { onSetCalibration?.(calibReceiveModal.id, 'receive', payload); setCalibReceiveModal(null); }}
            onCancel={() => setCalibReceiveModal(null)} />
        </Modal>
      )}
      {editTool && (
        <Modal title="แก้ไขเครื่องมือ" onClose={() => setEditTool(null)}>
          <ToolForm data={editTool} onSave={saveEditedTool} onCancel={() => setEditTool(null)} warehouses={warehouses} />
        </Modal>
      )}
      {qrTool && (
        <QrCodeModal value={qrTool.id} title={`QR เครื่องมือ: ${qrTool.code}`} subtitle={qrTool.name} fileName={`QR-${qrTool.code}`} onClose={() => setQrTool(null)} />
      )}
      {photoTool && (
        <ToolPhotoViewModal tool={photoTool} onClose={() => setPhotoTool(null)} />
      )}
    </section>
  );
}

function Dashboard({ kpis, tools, staff, tx, toolStatus, overdueList, isAdmin, onViewPhoto, onEditTx, settings, onGoSettings, warehouses, setTools, showToast, addAudit, onSetCondition, onSetCalibration }) {
  const recent = [...tx].sort((a, b) => (b.borrowDate + (b.returnDate || '9')).localeCompare(a.borrowDate + (a.returnDate || '9'))).slice(0, 6);

  const [snoozed, setSnoozed] = useState(() => {
    try { return localStorage.getItem('tai_lbc_backup_snooze_date') === todayISO(); } catch (e) { return false; }
  });
  const backupDue = useMemo(() => {
    if (!isAdmin || !settings) return false;
    const reminderDays = Number(settings.backupReminderDays) || 7;
    if (!settings.lastBackupAt) return true; // never backed up yet
    const daysSince = (Date.now() - new Date(settings.lastBackupAt).getTime()) / 86400000;
    return daysSince >= reminderDays;
  }, [isAdmin, settings]);
  function snoozeBackupReminder() {
    try { localStorage.setItem('tai_lbc_backup_snooze_date', todayISO()); } catch (e) {}
    setSnoozed(true);
  }

  // Distinct from the general N-day reminder below: a same-day nudge from
  // 16:00 onward to review/back up today's evidence photos. Purely
  // informational now — nothing gets deleted automatically; managing what to
  // keep or clear is entirely up to the admin, from the Settings page.
  const photoReviewDue = useMemo(() => {
    if (!isAdmin || !settings) return false;
    if (new Date().getHours() < 16) return false;
    if (!settings.lastBackupAt) return true;
    return localISODate(parseDateValue(settings.lastBackupAt)) !== todayISO();
  }, [isAdmin, settings]);

  const topTools = useMemo(() => {
    const counts = new Map();
    for (const t of tx) counts.set(t.toolId, (counts.get(t.toolId) || 0) + 1);
    return [...counts.entries()]
      .map(([toolId, count]) => ({ toolId, count, tool: tools.find(t => t.id === toolId) }))
      .filter(x => x.tool)
      .sort((a, b) => b.count - a.count)
      .slice(0, 5)
      .map(x => ({ name: x.tool.code, fullName: x.tool.name, count: x.count }));
  }, [tx, tools]);

  const deptDist = useMemo(() => {
    const counts = new Map();
    for (const t of tx) {
      const st = staff.find(s => s.id === t.staffId);
      const dept = st?.dept || 'ไม่ระบุ';
      counts.set(dept, (counts.get(dept) || 0) + 1);
    }
    return [...counts.entries()].map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
  }, [tx, staff]);

  const catDist = useMemo(() => {
    const counts = new Map();
    for (const t of tools) {
      const label = catMap[t.category]?.label || t.category || 'ไม่ระบุ';
      counts.set(label, (counts.get(label) || 0) + 1);
    }
    return [...counts.entries()].map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
  }, [tools]);

  // Per-warehouse status breakdown — the whole point being to compare each
  // warehouse's health at a glance rather than one combined total across
  // every warehouse, which hides which specific location has a problem.
  const STATUS_META = [
    { key: 'available', label: 'พร้อมใช้งาน', color: '#33B9A4' },
    { key: 'borrowed', label: 'ถูกยืม', color: '#F5AB4C' },
    { key: 'overdue', label: 'เกินกำหนดคืน', color: '#E0523F' },
    { key: 'damaged', label: 'ชำรุด/ส่งซ่อม', color: '#8B7FF0' },
    { key: 'calibration', label: 'ส่ง Calibration', color: '#4FA7E0' },
  ];
  const whStatusDist = useMemo(() => {
    return (warehouses || []).map(w => {
      const row = { name: w.name };
      STATUS_META.forEach(s => { row[s.key] = 0; });
      tools.filter(t => t.warehouseId === w.id).forEach(t => {
        const s = toolStatus(t.id);
        if (row[s] !== undefined) row[s]++;
      });
      return row;
    });
  }, [tools, warehouses, toolStatus]);

  const PIE_COLORS = ['#33B9A4', '#8B7FF0', '#F2799F', '#F5AB4C', '#4FA7E0', '#6EE7B7'];

  return (
    <div className="page-stack">
      {photoReviewDue && (
        <section className="panel backup-reminder-panel backup-reminder-urgent">
          <div className="backup-reminder-text">
            <ImageIcon size={18} />
            <div>
              <div className="backup-reminder-title">ถึงเวลาตรวจสอบรูปหลักฐานยืม-คืนของวันนี้แล้ว</div>
              <div className="muted" style={{ fontSize: 12.5 }}>
                รูปก่อนยืม/หลังยืมของวันนี้ยังเก็บอยู่ในระบบทั้งหมด ไม่มีการลบอัตโนมัติ — ไปที่หน้าตั้งค่าเพื่อดาวน์โหลดสำรองไว้ และเลือกลบรูปเก่าที่ไม่ต้องการเก็บแล้วได้ด้วยตัวเอง
              </div>
            </div>
          </div>
          <div className="backup-reminder-actions">
            <button className="btn btn-primary" onClick={onGoSettings}><Download size={14} /> ไปจัดการรูปหลักฐาน</button>
          </div>
        </section>
      )}

      {backupDue && !snoozed && (
        <section className="panel backup-reminder-panel">
          <div className="backup-reminder-text">
            <ShieldAlert size={18} />
            <div>
              <div className="backup-reminder-title">
                {settings?.lastBackupAt ? 'ถึงเวลาสำรองข้อมูลแล้ว' : 'ยังไม่เคยสำรองข้อมูลระบบนี้เลย'}
              </div>
              <div className="muted" style={{ fontSize: 12.5 }}>
                {settings?.lastBackupAt
                  ? `สำรองข้อมูลล่าสุดเมื่อ ${fmtThaiDateTime(settings.lastBackupAt)} — แนะนำให้สำรองเป็นระยะเพื่อกันข้อมูลสูญหาย`
                  : 'แนะนำให้สำรองข้อมูล (เครื่องมือ, พนักงาน, ประวัติยืม-คืน, รูปหลักฐาน) เก็บไว้ในเครื่องส่วนตัวสักครั้ง'}
              </div>
            </div>
          </div>
          <div className="backup-reminder-actions">
            <button className="btn btn-secondary" onClick={snoozeBackupReminder}>เตือนพรุ่งนี้</button>
            <button className="btn btn-primary" onClick={onGoSettings}><Download size={14} /> ไปสำรองข้อมูล</button>
          </div>
        </section>
      )}

      <section className="kpi-grid">
        <KpiCard label="ครุภัณฑ์ทั้งหมด" value={kpis.total} icon={Package} tone="steel" />
        <KpiCard label="พร้อมใช้งาน" value={kpis.available} icon={CheckCircle2} tone="teal" />
        <KpiCard label="อยู่ระหว่างการยืม" value={kpis.borrowed} icon={Clock} tone="amber" />
        <KpiCard label="เกินกำหนดคืน" value={kpis.overdue} icon={AlertTriangle} tone="danger" />
        <KpiCard label="ชำรุด/ส่งซ่อม" value={kpis.damaged} icon={ShieldAlert} tone="purple" />
        <KpiCard label="ส่ง Calibration" value={kpis.calibration} icon={Gauge} tone="calib" />
      </section>

      {overdueList && overdueList.length > 0 && (
        <section className="panel overdue-panel">
          <div className="panel-head">
            <h2><Bell size={16} /> รายการเกินกำหนดคืน ({overdueList.length})</h2>
            <p>ควรติดตามทวงคืนโดยเร็ว — ระบบแจ้งเตือนแบบ LINE/อีเมลอัตโนมัติต้องเชื่อมต่อ backend เพิ่มเติมในอนาคต</p>
          </div>
          <div className="overdue-chip-list">
            {overdueList.slice(0, 8).map(o => (
              <div key={o.tx.id} className="overdue-chip">
                <span className="mono">{o.tool?.code}</span>
                <span className="overdue-chip-name">{o.tool?.name}</span>
                <span className="muted">{o.staff?.name}</span>
                <span className="badge danger">ช้า {o.daysLate} วัน</span>
              </div>
            ))}
          </div>
        </section>
      )}

      {(topTools.length > 0 || deptDist.length > 0) && (
        <section className="chart-row">
          <div className="panel chart-panel">
            <div className="panel-head"><h2>เครื่องมือยืมบ่อยสุด (Top 5)</h2></div>
            {topTools.length ? (
              <ResponsiveContainer width="100%" height={220}>
                <BarChart data={topTools} margin={{ top: 4, right: 8, left: -20, bottom: 0 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="var(--line)" vertical={false} />
                  <XAxis dataKey="name" tick={{ fontSize: 11, fill: 'var(--ink-soft)' }} axisLine={{ stroke: 'var(--line)' }} tickLine={false} />
                  <YAxis allowDecimals={false} tick={{ fontSize: 11, fill: 'var(--ink-soft)' }} axisLine={false} tickLine={false} />
                  <Tooltip
                    formatter={(value, key, item) => [`${value} ครั้ง`, item?.payload?.fullName || '']}
                    contentStyle={{ borderRadius: 10, border: '1px solid var(--line)', fontSize: 12 }} />
                  <Bar dataKey="count" fill="#33B9A4" radius={[8, 8, 0, 0]} maxBarSize={40} />
                </BarChart>
              </ResponsiveContainer>
            ) : <div className="empty-state">ยังไม่มีข้อมูล</div>}
          </div>

          <div className="panel chart-panel">
            <div className="panel-head"><h2>สัดส่วนการยืมตามแผนก</h2></div>
            {deptDist.length ? (
              <ResponsiveContainer width="100%" height={220}>
                <PieChart>
                  <Pie data={deptDist} dataKey="value" nameKey="name" innerRadius={48} outerRadius={78} paddingAngle={2}>
                    {deptDist.map((entry, i) => <Cell key={entry.name} fill={PIE_COLORS[i % PIE_COLORS.length]} />)}
                  </Pie>
                  <Tooltip formatter={(value) => [`${value} ครั้ง`, '']} contentStyle={{ borderRadius: 10, border: '1px solid var(--line)', fontSize: 12 }} />
                  <Legend wrapperStyle={{ fontSize: 11 }} />
                </PieChart>
              </ResponsiveContainer>
            ) : <div className="empty-state">ยังไม่มีข้อมูล</div>}
          </div>
        </section>
      )}

      {(catDist.length > 0 || whStatusDist.length > 0) && (
        <section className="chart-row">
          <div className="panel chart-panel">
            <div className="panel-head"><h2>สัดส่วนเครื่องมือแยกตามหมวดหมู่</h2></div>
            {catDist.length ? (
              <ResponsiveContainer width="100%" height={220}>
                <PieChart>
                  <Pie data={catDist} dataKey="value" nameKey="name" innerRadius={48} outerRadius={78} paddingAngle={2}>
                    {catDist.map((entry, i) => <Cell key={entry.name} fill={PIE_COLORS[i % PIE_COLORS.length]} />)}
                  </Pie>
                  <Tooltip formatter={(value) => [`${value} ชิ้น`, '']} contentStyle={{ borderRadius: 10, border: '1px solid var(--line)', fontSize: 12 }} />
                  <Legend wrapperStyle={{ fontSize: 11 }} />
                </PieChart>
              </ResponsiveContainer>
            ) : <div className="empty-state">ยังไม่มีข้อมูล</div>}
          </div>

          <div className="panel chart-panel">
            <div className="panel-head"><h2>สถานะเครื่องมือแยกตามคลัง</h2></div>
            {whStatusDist.length ? (
              <ResponsiveContainer width="100%" height={240}>
                <BarChart data={whStatusDist} margin={{ top: 4, right: 8, left: -20, bottom: 0 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="var(--line)" vertical={false} />
                  <XAxis dataKey="name" tick={{ fontSize: 10.5, fill: 'var(--ink-soft)' }} axisLine={{ stroke: 'var(--line)' }} tickLine={false} interval={0} angle={-15} textAnchor="end" height={40} />
                  <YAxis allowDecimals={false} tick={{ fontSize: 11, fill: 'var(--ink-soft)' }} axisLine={false} tickLine={false} />
                  <Tooltip contentStyle={{ borderRadius: 10, border: '1px solid var(--line)', fontSize: 12 }} />
                  <Legend wrapperStyle={{ fontSize: 10.5 }} formatter={(key) => STATUS_META.find(s => s.key === key)?.label || key} />
                  {STATUS_META.map(s => (
                    <Bar key={s.key} dataKey={s.key} stackId="status" fill={s.color} name={s.key} radius={s.key === 'calibration' ? [6, 6, 0, 0] : 0} maxBarSize={44} />
                  ))}
                </BarChart>
              </ResponsiveContainer>
            ) : <div className="empty-state">ยังไม่มีคลังเครื่องมือในระบบ</div>}
          </div>
        </section>
      )}

      <ActiveToolsPanel tools={tools} staff={staff} tx={tx} toolStatus={toolStatus} warehouses={warehouses}
        setTools={setTools} showToast={showToast} addAudit={addAudit}
        onSetCondition={onSetCondition} onSetCalibration={onSetCalibration} isAdmin={isAdmin} />

      <section className="panel">
        <div className="panel-head"><h2>รายการล่าสุด</h2></div>
        <TxTable rows={recent} tools={tools} staff={staff} isAdmin={isAdmin} onViewPhoto={onViewPhoto} onEditTx={onEditTx} showPhotos={true} />
      </section>
    </div>
  );
}

/* ------------------------- Shadow Board (per-warehouse shelves) ------------------------- */
// Redesigned from a single flat board covering every tool in the whole system
// into one board PER warehouse, structured as shelves (like the real steel
// cabinets in each tool room). Regular staff get a read-only view of layout +
// status; admins can add/remove shelves, move tools onto/off a shelf, and
// import/export that warehouse's tool list independently of every other
// warehouse. Each shelf is capped at 100 tools, matching the physical cap on
// a real shadow-board panel.
const SHELF_CAPACITY = 100;

function WarehouseShadowBoard({ tools, warehouses, scopedWarehouseIds, shelves, setShelves, setTools, toolStatus, isAdmin, showToast, addAudit, onAddTool, onSetCondition, onSetCalibration, tx, staff }) {
  // Same pattern as ToolsPage/WarehousePage: `tools`/`warehouses` stay whole
  // (safe for shelf-assign/unassign saves, which rebuild from the full array),
  // only the tab list and the initially-selected warehouse are narrowed for a
  // restricted secondary admin.
  const visibleWarehouses = scopedWarehouseIds ? warehouses.filter(w => scopedWarehouseIds.includes(w.id)) : warehouses;
  const [activeWh, setActiveWh] = useState(visibleWarehouses[0]?.id || null);
  useEffect(() => {
    if ((!activeWh || !visibleWarehouses.some(w => w.id === activeWh)) && visibleWarehouses.length) setActiveWh(visibleWarehouses[0].id);
  }, [visibleWarehouses, activeWh]);

  const [pickerShelf, setPickerShelf] = useState(null);
  // Which shelf's tool list is currently expanded into the detail view (the
  // "click the photo to drill in" step) — all per-shelf management (assign,
  // remove, rename, delete) now lives inside that detail view instead of
  // cluttering the card face, which is just a photo + name + count.
  const [detailShelf, setDetailShelf] = useState(null);
  // Which shelf's photo-edit modal is open, and the pending capture/upload
  // waiting to be saved from it.
  const [photoEditShelf, setPhotoEditShelf] = useState(null);
  const [pendingShelfPhoto, setPendingShelfPhoto] = useState(null);
  const [showShelfCamera, setShowShelfCamera] = useState(false);
  const shelfFileInputRef = React.useRef(null);
  const [renamingId, setRenamingId] = useState(null);
  const [renameValue, setRenameValue] = useState('');
  const [busy, setBusy] = useState(false);
  const fileInputRef = React.useRef(null);
  // Full tool-management actions, reachable from a shelf's detail list so
  // admins don't have to leave warehouse management and go find the same
  // tool again on the Tools page just to report damage, send it for
  // calibration, edit it, or delete it.
  const [damageModal, setDamageModal] = useState(null);
  const [calibSendModal, setCalibSendModal] = useState(null);
  const [calibReceiveModal, setCalibReceiveModal] = useState(null);
  const [editTool, setEditTool] = useState(null);
  // QR/photo view modals specifically for the "unassigned" tools section
  // below (tools not on any shelf) — the shelved-tools list has its own via
  // ShelfDetailModal.
  const [unassignedQrTool, setUnassignedQrTool] = useState(null);
  const [unassignedPhotoTool, setUnassignedPhotoTool] = useState(null);

  const activeWarehouse = warehouses.find(w => w.id === activeWh);
  const whShelves = useMemo(() =>
    shelves.filter(s => s.warehouseId === activeWh).sort((a, b) => a.order - b.order),
    [shelves, activeWh]);
  const whTools = useMemo(() => tools.filter(t => t.warehouseId === activeWh), [tools, activeWh]);
  const whShelfIds = new Set(whShelves.map(s => s.id));
  const unassigned = whTools.filter(t => !t.shelfId || !whShelfIds.has(t.shelfId)).sort((a, b) => naturalCompareCode(a.code, b.code));

  async function addShelf() {
    if (!activeWarehouse) return;
    const name = `ชั้นที่ ${whShelves.length + 1}`;
    const shelf = { id: uid('SH'), warehouseId: activeWh, name, order: whShelves.length };
    try {
      await setShelves([...shelves, shelf]);
      addAudit?.('shelf_add', `${activeWarehouse.name}: เพิ่ม ${name}`);
      showToast(`เพิ่ม ${name} แล้ว`, 'success');
    } catch (err) {
      console.error('failed to add shelf', err);
      showToast('เพิ่มชั้นวางไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
  }

  async function removeShelf(shelf) {
    const occupied = tools.filter(t => t.shelfId === shelf.id).length;
    if (occupied > 0) return showToast(`ชั้นนี้ยังมีเครื่องมืออยู่ ${occupied} รายการ ย้ายออกก่อนจึงลบชั้นได้`, 'error');
    try {
      await setShelves(shelves.filter(s => s.id !== shelf.id));
    } catch (err) {
      console.error('failed to remove shelf', err);
      return showToast('ลบชั้นวางไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    // Best-effort only past this point — the shelf itself is already gone, so
    // a hiccup cleaning up its leftover photo shouldn't read as "delete failed".
    if (shelf.hasPhoto) {
      try { await storageDelete(`toolcrib-photo:shelf:${shelf.id}`, true); }
      catch (err) { console.error('failed to clean up deleted shelf\'s photo', err); }
    }
    addAudit?.('shelf_remove', `${activeWarehouse?.name || ''}: ลบ ${shelf.name}`);
    showToast(`ลบ ${shelf.name} แล้ว`, 'success');
  }

  async function saveRename(shelf) {
    const name = renameValue.trim();
    setRenamingId(null);
    if (!name || name === shelf.name) return;
    try {
      await setShelves(shelves.map(s => s.id === shelf.id ? { ...s, name } : s));
    } catch (err) {
      console.error('failed to rename shelf', err);
      showToast('บันทึกชื่อชั้นไม่สำเร็จ', 'error');
    }
  }

  async function unassignTool(tool) {
    try {
      await setTools(tools.map(t => t.id === tool.id ? { ...t, code: normalizeCode(t.code), shelfId: null } : t));
    } catch (err) {
      console.error('failed to unassign tool from shelf', err);
      showToast('นำเครื่องมือออกจากชั้นไม่สำเร็จ', 'error');
    }
  }

  async function assignTools(shelf, toolIds) {
    const currentCount = tools.filter(t => t.shelfId === shelf.id).length;
    if (currentCount + toolIds.length > SHELF_CAPACITY) {
      return showToast(`ชั้นนี้รับได้อีก ${SHELF_CAPACITY - currentCount} รายการเท่านั้น (สูงสุด ${SHELF_CAPACITY} ชิ้น/ชั้น)`, 'error');
    }
    try {
      // Same idea as unassign — moving a tool onto a shelf is another
      // natural moment to catch and fix a stray accented character left
      // over in its code from before this cleanup existed.
      await setTools(tools.map(t => toolIds.includes(t.id) ? { ...t, code: normalizeCode(t.code), shelfId: shelf.id } : t));
      addAudit?.('shelf_assign', `${shelf.name}: จัดเข้าชั้น ${toolIds.length} รายการ`);
      showToast('จัดเครื่องมือเข้าชั้นแล้ว', 'success');
      setPickerShelf(null);
    } catch (err) {
      console.error('failed to assign tools to shelf', err);
      showToast('บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
  }

  // Mirrors ToolsPage's edit save exactly (uniqueness check, photo
  // set/remove + version stamp, shelf cleared if moved to a different
  // warehouse) — kept as its own copy so this shortcut can't accidentally
  // break tool editing on the Tools page if either one changes.
  async function saveEditedTool(data) {
    const { _newPhoto, _removePhoto, ...formData } = data;
    if (!formData.code.trim() || !formData.name.trim()) return showToast('กรุณากรอกรหัสและชื่อเครื่องมือ', 'error');
    if (!formData.warehouseId) return showToast('กรุณาเลือกคลังเครื่องมือ', 'error');
    // Normalized here directly (not just in the form) so this save is
    // guaranteed clean regardless of what called it.
    const cleanCode = normalizeCode(formData.code.trim());
    if (tools.some(t => t.id !== formData.id && t.code.trim().toLowerCase() === cleanCode.toLowerCase())) {
      return showToast('รหัสนี้มีอยู่แล้วในเครื่องมือชิ้นอื่น', 'error');
    }
    const hasPhoto = _newPhoto ? true : (_removePhoto ? false : !!formData.hasPhoto);
    try {
      if (_newPhoto) await storageSet(`toolcrib-photo:master:${formData.id}`, _newPhoto, true);
      if (_removePhoto) await storageDelete(`toolcrib-photo:master:${formData.id}`, true);
      await setTools(tools.map(t => t.id === formData.id ? {
        ...t, code: cleanCode, name: formData.name.trim(), category: formData.category, warehouseId: formData.warehouseId,
        partNo: formData.partNo || '', serialNo: formData.serialNo || '', calibDate: formData.calibDate || '', calibDue: formData.calibDue || '',
        requiresLoanForm: !!formData.requiresLoanForm, hasPhoto,
        photoUpdatedAt: (_newPhoto || _removePhoto) ? Date.now() : t.photoUpdatedAt,
        shelfId: formData.warehouseId !== t.warehouseId ? null : t.shelfId
      } : t));
    } catch (err) {
      console.error('failed to save tool', err);
      return showToast('บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    addAudit?.('tool_edit', `${cleanCode} — ${formData.name}`);
    showToast('บันทึกการแก้ไขเรียบร้อย (QR เดิมยังใช้งานได้)', 'success');
    setEditTool(null);
  }

  async function deleteTool(t) {
    const s = toolStatus(t.id);
    if (s === 'borrowed' || s === 'overdue') return showToast('ไม่สามารถลบเครื่องมือที่ถูกยืมอยู่ได้', 'error');
    try {
      await setTools(tools.filter(x => x.id !== t.id));
      if (t.hasPhoto) await storageDelete(`toolcrib-photo:master:${t.id}`, true);
    } catch (err) {
      console.error('failed to delete tool', err);
      return showToast('ลบไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    addAudit?.('tool_delete', `${t.code} — ${t.name}`);
    showToast('ลบเครื่องมือและยกเลิก QR ที่ผูกไว้เรียบร้อย', 'success');
    setDetailShelf(null);
  }

  // Restored from the old Tools page — lets an admin re-download the most
  // recent completed LBC-FM-034 slip for a tool directly from its row here,
  // without digging through transaction history.
  const [printingToolId, setPrintingToolId] = useState(null);
  function latestPrintableDoc(toolId) {
    return (tx || [])
      .filter(t => t.toolId === toolId && t.docForm && t.returnDate)
      .sort((a, b) => (b.returnDate || '').localeCompare(a.returnDate || ''))[0] || null;
  }
  async function printToolLoanDoc(t) {
    const record = latestPrintableDoc(t.id);
    if (!record) return;
    setPrintingToolId(t.id);
    try {
      const staffMember = staff?.find(s => s.id === record.staffId);
      const returnedByStaff = record.returnedBy ? staff?.find(s => s.id === record.returnedBy) : null;
      await generateLoanFormPdf(record, t, staffMember, returnedByStaff, record.docForm);
    } catch (err) {
      console.error('failed to generate loan form pdf', err);
      showToast('สร้าง PDF ไม่สำเร็จ กรุณาลองใหม่', 'error');
    } finally {
      setPrintingToolId(null);
    }
  }

  function downloadWarehouseExcel() {
    if (!activeWarehouse) return;
    const statusLabel = { available: 'พร้อมใช้งาน', borrowed: 'ถูกยืม', overdue: 'เกินกำหนดคืน', damaged: 'ชำรุด/ส่งซ่อม', calibration: 'ส่ง Calibration' };
    const shelfNameOf = (t) => whShelves.find(s => s.id === t.shelfId)?.name || 'ยังไม่จัดชั้น';
    const rows = whTools.map(t => ({
      รหัสเครื่องมือ: t.code, ชื่อเครื่องมือ: t.name, หมวดหมู่: catMap[t.category]?.label || t.category,
      ชั้นวาง: shelfNameOf(t), สถานะ: statusLabel[toolStatus(t.id)] || '-',
    }));
    const wb = XLSX.utils.book_new();
    wb.SheetNames.push('รายการเครื่องมือ');
    wb.Sheets['รายการเครื่องมือ'] = XLSX.utils.json_to_sheet(rows);
    XLSX.writeFile(wb, `รายการเครื่องมือ-${activeWarehouse.name}-${todayISO()}.xlsx`);
  }

  async function handleUpload(e) {
    const file = e.target.files?.[0];
    if (!file || !activeWarehouse) return;
    setBusy(true);
    try {
      const buf = await file.arrayBuffer();
      const wbFile = XLSX.read(buf, { type: 'array' });
      const sheetName = wbFile.SheetNames.includes('รายการเครื่องมือ') ? 'รายการเครื่องมือ' : wbFile.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wbFile.Sheets[sheetName], { defval: '' });
      const toAdd = [], toUpdate = [];
      let skipped = 0, shelfNotFound = 0, shelfFull = 0;
      // Codes already claimed by an earlier row of THIS file — otherwise a file
      // listing the same code twice would create two tools sharing a code.
      const seenInFile = new Set();
      // "ชั้นวาง" is optional — matched by name (trim + case-insensitive) against
      // this warehouse's existing shelves only; it never creates a new shelf,
      // since a typo would otherwise silently spawn a stray shelf. Running
      // counts start from each shelf's CURRENT occupancy and accumulate across
      // the whole file, so a big batch aimed at one shelf can't blow past its
      // 100-item cap even though nothing has been saved yet to check against.
      const shelfCounts = new Map(whShelves.map(s => [s.id, tools.filter(t => t.shelfId === s.id).length]));
      const shelfByName = new Map(whShelves.map(s => [s.name.trim().toLowerCase(), s]));
      rows.forEach(r => {
        const code = normalizeCode(String(r['รหัสเครื่องมือ'] || '').trim());
        const name = String(r['ชื่อเครื่องมือ'] || '').trim();
        if (!code || !name) { skipped++; return; }
        const key = code.toLowerCase();
        if (seenInFile.has(key)) { skipped++; return; }
        seenInFile.add(key);
        const catLabel = String(r['หมวดหมู่'] || '').trim();
        const matchedCat = CATEGORIES.find(c => c.label === catLabel);
        const existing = tools.find(t => t.code.toLowerCase() === key);
        // A code that already belongs to a tool in a DIFFERENT warehouse is left
        // alone rather than silently relocated here — this importer is scoped to
        // one warehouse, and moving a tool across warehouses needs to be a
        // deliberate action (edit the tool directly), not a side-effect of
        // uploading this warehouse's list.
        if (existing && existing.warehouseId !== activeWh) { skipped++; return; }

        const shelfNameCell = String(r['ชั้นวาง'] || '').trim();
        let shelfId = existing ? existing.shelfId : null;
        if (shelfNameCell && shelfNameCell !== 'ยังไม่จัดชั้น') {
          const shelf = shelfByName.get(shelfNameCell.toLowerCase());
          if (!shelf) { shelfNotFound++; }
          else if ((shelfCounts.get(shelf.id) || 0) >= SHELF_CAPACITY) { shelfFull++; }
          else { shelfId = shelf.id; shelfCounts.set(shelf.id, (shelfCounts.get(shelf.id) || 0) + 1); }
        }

        if (existing) toUpdate.push({ id: existing.id, code, name, category: matchedCat?.id || existing.category, shelfId });
        else toAdd.push({ code, name, category: matchedCat?.id || 'other', shelfId });
      });
      const updateMap = new Map(toUpdate.map(e => [e.id, e]));
      const nextTools = [
        ...tools.map(t => updateMap.has(t.id) ? { ...t, code: updateMap.get(t.id).code, name: updateMap.get(t.id).name, category: updateMap.get(t.id).category, shelfId: updateMap.get(t.id).shelfId } : t),
        ...toAdd.map(a => ({ id: uid('T'), code: a.code, name: a.name, category: a.category, warehouseId: activeWh, shelfId: a.shelfId })),
      ];
      await setTools(nextTools);
      const shelfWarnings = shelfNotFound || shelfFull
        ? ` (ไม่พบชั้น ${shelfNotFound} รายการ, ชั้นเต็ม ${shelfFull} รายการ — เข้าเป็นยังไม่จัดชั้นแทน)` : '';
      addAudit?.('warehouse_import', `${activeWarehouse.name}: นำเข้าเพิ่ม ${toAdd.length}, อัปเดต ${toUpdate.length}, ข้าม ${skipped}${shelfWarnings}`);
      showToast(`นำเข้าเรียบร้อย (เพิ่ม ${toAdd.length}, อัปเดต ${toUpdate.length}${skipped ? `, ข้าม ${skipped}` : ''})${shelfWarnings}`, 'success');
    } catch (err) {
      console.error('failed to import warehouse tool list', err);
      showToast('อ่านไฟล์ไม่สำเร็จ กรุณาตรวจสอบว่าเป็นไฟล์ Excel ที่ถูกต้อง', 'error');
    }
    setBusy(false);
    if (fileInputRef.current) fileInputRef.current.value = '';
  }

  function resizeShelfPhoto(file, cb, onError) {
    // Same reasoning as the tool-photo picker: a blob URL uses the browser's
    // normal image decoder (better real-world format support, including some
    // HEIC files that fail via a hand-built data URL) instead of failing
    // silently or falling back to a raw file that likely wouldn't render either.
    const objectUrl = URL.createObjectURL(file);
    const img = new Image();
    img.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      console.error('failed to decode shelf photo — likely an unsupported format for this browser');
      if (onError) onError();
    };
    img.onload = () => {
      try {
        const maxW = 640;
        const scale = Math.min(1, maxW / (img.width || maxW));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round((img.width || maxW) * scale);
        canvas.height = Math.round((img.height || maxW) * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        cb(canvas.toDataURL('image/jpeg', 0.72));
      } catch (err) {
        console.error('failed to resize shelf photo', err);
        if (onError) onError();
      } finally {
        URL.revokeObjectURL(objectUrl);
      }
    };
    img.src = objectUrl;
  }

  function handleShelfFilePick(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    resizeShelfPhoto(file, (dataUrl) => setPendingShelfPhoto(dataUrl), () => showToast('เบราว์เซอร์นี้แสดงตัวอย่างไฟล์รูปนี้ไม่ได้ (มักเกิดกับไฟล์ HEIC บางไฟล์) ลองกด "ถ่ายรูป" แทน หรือเลือกรูปที่เป็น JPG/PNG', 'error'));
  }

  async function saveShelfPhoto() {
    if (!photoEditShelf || !pendingShelfPhoto) return;
    try {
      await storageSet(`toolcrib-photo:shelf:${photoEditShelf.id}`, pendingShelfPhoto, true);
      await setShelves(shelves.map(s => s.id === photoEditShelf.id ? { ...s, hasPhoto: true, photoUpdatedAt: Date.now() } : s));
      showToast('บันทึกรูปชั้นวางแล้ว', 'success');
    } catch (err) {
      console.error('failed to save shelf photo', err);
      showToast('บันทึกรูปไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    setPendingShelfPhoto(null);
    setPhotoEditShelf(null);
  }

  async function removeShelfPhoto() {
    if (!photoEditShelf) return;
    try {
      await storageDelete(`toolcrib-photo:shelf:${photoEditShelf.id}`, true);
      await setShelves(shelves.map(s => s.id === photoEditShelf.id ? { ...s, hasPhoto: false, photoUpdatedAt: Date.now() } : s));
      showToast('ลบรูปชั้นวางแล้ว', 'success');
    } catch (err) {
      console.error('failed to remove shelf photo', err);
      showToast('ลบรูปไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    setPendingShelfPhoto(null);
    setPhotoEditShelf(null);
  }

  return (
    <section className="panel">
      <div className="toolbar" style={{ marginBottom: 12 }}>
        <div className="panel-head" style={{ margin: 0, flex: 1 }}>
          <h2>Shadow Board — ผังเครื่องมือ</h2>
          <p>เหมือนบอร์ดแขวนเครื่องมือจริงในแต่ละคลัง: ช่องว่างที่เห็นได้ทันทีคือเครื่องมือที่ไม่อยู่บนชั้น — เลือกคลังเพื่อดูผังของคลังนั้น</p>
        </div>
        {isAdmin && onAddTool && (
          <button className="btn btn-secondary" onClick={onAddTool} disabled={!visibleWarehouses.length}
            title={visibleWarehouses.length ? '' : 'คุณยังไม่ได้รับสิทธิ์ดูแลคลังใด กรุณาติดต่อแอดมินหลัก'}>
            <Wrench size={16} /> เพิ่มเครื่องมือใหม่
          </button>
        )}
      </div>

      {visibleWarehouses.length > 1 && (
        <div className="wh-switch" style={{ marginBottom: 14 }}>
          {visibleWarehouses.map(w => (
            <button key={w.id} type="button" className={`wh-switch-item ${activeWh === w.id ? 'active' : ''}`} onClick={() => setActiveWh(w.id)}>
              {w.name}
            </button>
          ))}
        </div>
      )}

      {!activeWarehouse ? (
        <div className="empty-state">
          {visibleWarehouses.length ? 'ยังไม่มีคลังเครื่องมือในระบบ' : 'คุณยังไม่ได้รับสิทธิ์ดูแลคลังใด กรุณาติดต่อแอดมินหลัก'}
        </div>
      ) : (
        <>
          {isAdmin && (
            <div className="shelfboard-toolbar">
              <button className="btn btn-secondary" type="button" onClick={addShelf}><Plus size={15} /> เพิ่มชั้นวาง</button>
              <button className="btn btn-secondary" type="button" onClick={downloadWarehouseExcel}><Download size={15} /> ดาวน์โหลดรายการ (คลังนี้)</button>
              <button className="btn btn-secondary" type="button" disabled={busy} onClick={() => fileInputRef.current?.click()}>

// Full-size view of a tool's registered photo (set at registration, distinct
// from per-transaction borrow/return evidence photos) — opened from the
// shelf detail list's "ดูรูป" button.
function ToolPhotoViewModal({ tool, onClose }) {
  const [src, setSrc] = useState(null);
  const [state, setState] = useState('loading'); // loading | ok | empty
  useEffect(() => {
    let cancelled = false;
    (async () => {
      const value = await storageGet(`toolcrib-photo:master:${tool.id}`, true);
      if (cancelled) return;
      if (value) { setSrc(value); setState('ok'); } else setState('empty');
    })();
    return () => { cancelled = true; };
  }, [tool.id]);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card scanner-card" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h3><ImageIcon size={17} /> รูปเครื่องมือ: {tool.code}</h3>
          <button className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="evidence-viewport">
          {state === 'loading' && <div className="scanner-overlay-msg" style={{ position: 'static', color: 'var(--ink-soft)' }}><Loader2 className="spin" size={20} /><span>กำลังโหลดรูป…</span></div>}
          {state === 'empty' && <div className="scanner-overlay-msg" style={{ position: 'static', color: 'var(--ink-soft)' }}><VideoOff size={20} /><span>ไม่พบรูปที่บันทึกไว้</span></div>}
          {state === 'ok' && <img src={src} alt={tool.name} className="evidence-img" />}
        </div>
        <p className="scanner-hint">{tool.name}</p>
      </div>
    </div>
  );
}


// editor above) — same fetch-on-demand pattern as ToolPhotoThumb, just a
// different storage key namespace so shelf photos and tool photos never collide.
function ShelfPhotoThumb({ shelfId, hasPhoto, size, version }) {
  const [src, setSrc] = useState(null);
  const [state, setState] = useState(hasPhoto ? 'loading' : 'empty');
  useEffect(() => {
    let cancelled = false;
    if (!hasPhoto) { setSrc(null); setState('empty'); return; }
    setState('loading');
    (async () => {
      const value = await storageGet(`toolcrib-photo:shelf:${shelfId}`, true);
      if (cancelled) return;
      if (value) { setSrc(value); setState('ok'); } else setState('empty');
    })();
    return () => { cancelled = true; };
  }, [shelfId, hasPhoto, version]);

  if (state === 'ok') return <img src={src} alt="" className={size === 'full' ? 'shelf-photo-edit-img' : 'shelf-card-photo-img'} />;
  if (state === 'loading') return <div className="shelf-card-photo-empty"><Loader2 className="spin" size={22} /></div>;
  return <div className="shelf-card-photo-empty"><ImageIcon size={26} /><span>ยังไม่มีรูป</span></div>;
}

// Small inline QR popover anchored to a single shelf slot — opened/closed by
// clicking the same icon again (toggle), and dismissed on an outside click/tap.
function ShelfAssignModal({ shelf, tools, onSave, onClose }) {
  const [query, setQuery] = useState('');
  const [selected, setSelected] = useState([]);
  const currentCount = tools.filter(t => t.shelfId === shelf.id).length;
  const capLeft = SHELF_CAPACITY - currentCount;
  // Only tools not yet on ANY shelf are selectable here — a tool already
  // sitting on a shelf (this one or another) must be removed from its current
  // shelf first before it can be added elsewhere, so there's exactly one
  // place to look for it at any time and no silent cross-shelf move.
  const options = tools.filter(t => !t.shelfId &&
    (t.name.toLowerCase().includes(query.toLowerCase()) || t.code.toLowerCase().includes(query.toLowerCase())))
    .sort((a, b) => naturalCompareCode(a.code, b.code));

  function toggle(id) {
    setSelected(sel => sel.includes(id) ? sel.filter(x => x !== id) : (sel.length >= capLeft ? sel : [...sel, id]));
  }

  // Selects every tool currently shown (respecting the search filter), capped
  // at however many more this shelf can actually hold — if there are more
  // matches than room left, only the first N (in the same order shown) get
  // checked, so the count never silently exceeds capacity.
  const visibleIds = options.map(t => t.id);
  const allVisibleSelected = visibleIds.length > 0 && visibleIds.every(id => selected.includes(id));
  function toggleSelectAll() {
    if (allVisibleSelected) {
      setSelected(sel => sel.filter(id => !visibleIds.includes(id)));
    } else {
      setSelected(sel => {
        const others = sel.filter(id => !visibleIds.includes(id));
        const roomLeft = capLeft - others.length;
        return [...others, ...visibleIds.slice(0, Math.max(0, roomLeft))];
      });
    }
  }

  return (
    <Modal title={`เพิ่มเครื่องมือเข้า ${shelf.name}`} onClose={onClose}>
      <p className="muted" style={{ fontSize: 12.5, marginBottom: 8 }}>
        ชั้นนี้มีอยู่ {currentCount}/{SHELF_CAPACITY} รายการ — เลือกได้อีกสูงสุด {capLeft} รายการ
      </p>
      <div className="form-group">
        <input placeholder="ค้นหาชื่อหรือรหัสเครื่องมือ..." value={query} onChange={e => setQuery(e.target.value)} />
      </div>
      {options.length > 0 && (
        <label className="shelf-pick-row shelf-pick-selectall">
          <input type="checkbox" checked={allVisibleSelected} onChange={toggleSelectAll} />
          <span style={{ fontWeight: 600 }}>{allVisibleSelected ? 'ยกเลิกทั้งหมด' : `เลือกทั้งหมด (${options.length} รายการ)`}</span>
        </label>
      )}
      <div className="shelf-pick-list">
        {options.length === 0 ? (
          <div className="empty-state" style={{ padding: '18px 0' }}>ไม่มีเครื่องมือว่าง (ที่ยังไม่ถูกจัดชั้น) ให้เลือกในคลังนี้แล้ว</div>
        ) : options.map(t => (
          <label key={t.id} className={`shelf-pick-row ${selected.includes(t.id) ? 'checked' : ''}`}>
            <input type="checkbox" checked={selected.includes(t.id)} onChange={() => toggle(t.id)} />
            <span className="mono">{t.code}</span>
            <span>{t.name}</span>
          </label>
        ))}
      </div>
      <div className="form-actions" style={{ marginTop: 10 }}>
        <button type="button" className="btn btn-secondary" onClick={onClose}>ยกเลิก</button>
        <button type="button" className="btn btn-primary" disabled={!selected.length} onClick={() => onSave(selected)}>
          เพิ่ม {selected.length ? `(${selected.length})` : ''}
        </button>
      </div>
    </Modal>
  );
}

function EditTxModal({ record, tool, staffMember, onSave, onClose }) {
  const isReturned = !!record.returnDate;
  const [returned, setReturned] = useState(isReturned);
  const [dueDate, setDueDate] = useState(record.dueDate);
  const toLocalInputValue = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const [returnAt, setReturnAt] = useState(toLocalInputValue(record.returnDate) || toLocalInputValue(new Date().toISOString()));
  const [saving, setSaving] = useState(false);
  const [photoDataUrl, setPhotoDataUrl] = useState(null);
  const [showCamera, setShowCamera] = useState(false);

  async function save(e) {
    e.preventDefault();
    if (!photoDataUrl) return;
    setSaving(true);
    const updates = { dueDate };
    if (returned) {
      updates.returnDate = new Date(returnAt).toISOString();
    } else {
      updates.returnDate = null;
      updates.returnedBy = null;
      updates.hasReturnPhoto = false;
    }
    try {
      // The photo taken to confirm this admin correction is stored as the
      // record's return-evidence photo, so it shows up in the same "หลังยืม" viewer.
      // Only mark hasReturnPhoto true when the record is actually being set to
      // "returned" — otherwise reopening a transaction (returned=false) would
      // wrongly keep showing a "หลังยืม" photo chip on an item that's still out.
      await storageSet(`toolcrib-photo:${record.id}:return`, photoDataUrl);
      if (returned) updates.hasReturnPhoto = true;
    } catch (err) {
      console.error('failed to save admin-edit confirmation photo', err);
    }
    await onSave(record.id, updates);
    setSaving(false);
    onClose();
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h3><Pencil size={17} /> แก้ไขสถานะรายการยืม-คืน</h3>
          <button className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="verify-block" style={{ background: 'var(--card-soft)' }}>
          <div className="verify-tool-name">{tool?.name}</div>
          <div className="verify-tool-code mono">{tool?.code}</div>
          <div className="muted" style={{ fontSize: 12, marginTop: 4 }}>ผู้ยืม: {staffMember?.name} ({staffMember?.dept})</div>
        </div>
        <form onSubmit={save} className="modal-form">
          <div className="form-group">
            <label>กำหนดคืน</label>
            <input type="date" value={dueDate} onChange={e => setDueDate(e.target.value)} />
          </div>
          <div className="mode-tabs" style={{ width: '100%' }}>
            <button type="button" className={`mode-tab ${!returned ? 'active' : ''}`} style={{ flex: 1 }} onClick={() => setReturned(false)}>อยู่ระหว่างยืม</button>
            <button type="button" className={`mode-tab ${returned ? 'active' : ''}`} style={{ flex: 1 }} onClick={() => setReturned(true)}>คืนแล้ว</button>
          </div>
          {returned && (
            <div className="form-group">
              <label>วันเวลาที่คืน</label>
              <input type="datetime-local" value={returnAt} onChange={e => setReturnAt(e.target.value)} />
            </div>
          )}
          <div className="verify-block" style={{ marginTop: 4 }}>
            <p className="verify-msg" style={{ marginTop: 0 }}>ต้องถ่ายรูปยืนยันสภาพเครื่องมือก่อน จึงจะบันทึกการแก้ไขนี้ได้</p>
            {!photoDataUrl ? (
              <button type="button" className="btn btn-secondary photo-btn" onClick={() => setShowCamera(true)}>
                <Camera size={16} /> ถ่ายรูปเครื่องมือ
              </button>
            ) : (
              <div className="photo-captured-row">
                <span><CheckCircle2 size={16} /> ถ่ายรูปเรียบร้อย</span>
                <button type="button" className="link-btn" onClick={() => setShowCamera(true)}>ถ่ายใหม่</button>
              </div>
            )}
          </div>
          <p className="scanner-hint" style={{ marginBottom: 0 }}>
            การแก้ไขนี้เป็นการแก้ไขโดยตรงจากแอดมิน (ไม่ผ่านการสแกน) จะถูกบันทึกลงประวัติกิจกรรมของระบบ
          </p>
          <div className="form-actions">
            <button type="button" className="btn btn-secondary" onClick={onClose}>ยกเลิก</button>
            <button type="submit" className="btn btn-primary" disabled={saving || !photoDataUrl}>{saving ? <Loader2 className="spin" size={15} /> : 'บันทึกการแก้ไข'}</button>
          </div>
        </form>
      </div>
      {showCamera && (
        <PhotoCaptureModal
          onCapture={(dataUrl) => { setPhotoDataUrl(dataUrl); setShowCamera(false); }}
          onClose={() => setShowCamera(false)}
        />
      )}
    </div>
  );
}

function LoanDocModal({ record, tool, staffMember, returnedByStaff, onSave, onClose }) {
  const d = record.docForm || {};
  const [form, setForm] = useState({
    date: d.date || '', fromAM: d.fromAM || '', aircraftType: d.aircraftType || '', aircraftNum: d.aircraftNum || '', workCardId: d.workCardId || '',
    chipNo: d.chipNo || '', toolNo: d.toolNo || '', toolLocation: d.toolLocation || '',
    itemDesc: d.itemDesc || '', pn: d.pn || '', sn: d.sn || '', calibDate: d.calibDate || '', calibDue: d.calibDue || '',
    loanToName: d.loanToName || '', loanToSign: d.loanToSign || '', issueBySign: d.issueBySign || '', returnBySign: d.returnBySign || '', receiveBySign: d.receiveBySign || ''
  });
  const [saving, setSaving] = useState(false);
  const [printing, setPrinting] = useState(false);
  const canPrint = !!record.returnDate; // per policy: printable only once the tool has actually been returned

  async function save() {
    setSaving(true);
    try {
      await onSave(record.id, { docForm: { ...d, ...form } });
      onClose();
    } finally {
      setSaving(false);
    }
  }

  async function doPrint() {
    if (!canPrint) return;
    setPrinting(true);
    try {
      await generateLoanFormPdf(record, tool, staffMember, returnedByStaff, { ...d, ...form });
    } catch (err) {
      console.error('failed to generate loan form pdf', err);
    } finally {
      setPrinting(false);
    }
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card modal-wide" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h3><FileSpreadsheet size={17} /> ใบยืม-คืนเครื่องมือ (LBC-FM-034)</h3>
          <button className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="verify-block" style={{ background: 'var(--card-soft)' }}>
          <div className="verify-tool-name">{tool?.name}</div>
          <div className="verify-tool-code mono">{tool?.code}</div>
          <div className="muted" style={{ fontSize: 12, marginTop: 4 }}>ผู้ยืม: {staffMember?.name} ({staffMember?.dept}) · {fmtThaiDateTime(record.borrowDate)}</div>
        </div>

        {!canPrint && (
          <p className="scanner-hint" style={{ background: 'var(--amber-tint)', color: '#8A5A15', padding: '8px 12px', borderRadius: 10 }}>
            ยังพิมพ์ไม่ได้ — ต้องรอให้คืนเครื่องมือชิ้นนี้เรียบร้อยก่อน
          </p>
        )}

        {/* Grouped to mirror the paper LBC-FM-034: header block, then the item
            row, then the four signature blocks. Each group holds an even number
            of fields so no lone input is left stranded in the 2-column grid. */}
        <div className="loan-doc-section-title">ส่วนหัวเอกสาร</div>
        <div className="loan-doc-grid">
          <div className="form-group"><label>Date</label><input type="date" value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} /></div>
          <div className="form-group">
            <label>Aircraft Type.</label>
            <select value={form.aircraftType} onChange={e => setForm({ ...form, aircraftType: e.target.value })}>
              <option value="">เลือก Aircraft Type</option>

              {form.aircraftType && !AIRCRAFT_OPTIONS.includes(form.aircraftType) && <option value={form.aircraftType}>{form.aircraftType}</option>}
            </select>
          </div>
          <div className="form-group">
            <label>Aircraft No.</label>
            <input value={form.aircraftNum} onChange={e => setForm({ ...form, aircraftNum: e.target.value })} placeholder="เช่น 1112" />

              {DEPT_OPTIONS.map(d => <option key={d} value={d}>{d}</option>)}

          <div className="form-group"><label>Employee ID</label><input value={form.chipNo} onChange={e => setForm({ ...form, chipNo: e.target.value })} placeholder={staffMember?.code} /></div>
          <div className="form-group"><label>Tool No.</label><input value={form.toolNo} onChange={e => setForm({ ...form, toolNo: e.target.value })} placeholder={tool?.code} /></div>
          <div className="form-group"><label>Tool Location</label><input value={form.toolLocation} onChange={e => setForm({ ...form, toolLocation: e.target.value })} /></div>

          <div className="form-group"><label>Calibration Due</label><input type="date" value={form.calibDue} onChange={e => setForm({ ...form, calibDue: e.target.value })} /></div>

        <div className="loan-doc-section-title">ลงชื่อ</div>

          <div className="form-group"><label>Loan to (Mechanic)</label><input value={form.loanToSign} onChange={e => setForm({ ...form, loanToSign: e.target.value })} /></div>

          <div className="form-group"><label>Return by (Mechanic)</label><input value={form.returnBySign} onChange={e => setForm({ ...form, returnBySign: e.target.value })} /></div>
          <div className="form-group"><label>Receive by (Tool Room)</label><input value={form.receiveBySign} onChange={e => setForm({ ...form, receiveBySign: e.target.value })} /></div>
        </div>

        <div className="form-actions">
          <button type="button" className="btn btn-secondary" onClick={onClose}>ปิด</button>
          <button type="button" className="btn btn-secondary" onClick={save} disabled={saving}>{saving ? <Loader2 size={14} className="spin" /> : 'บันทึกการแก้ไข'}</button>
          <button type="button" className="btn btn-primary" onClick={doPrint} disabled={!canPrint || printing}>
            {printing ? <Loader2 size={14} className="spin" /> : <Download size={14} />} พิมพ์ PDF
          </button>
        </div>
      </div>
    </div>
  );
