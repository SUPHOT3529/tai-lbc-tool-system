// The paper form has one "Aircraft No." line, but we now capture the model
// (Aircraft Type, e.g. "AS350 B2") and the tail number (Aircraft No., e.g.
// "1112") as two separate fields — so join them back into the single printed
// line the form expects: "AS350 B2 No.1112".
function combineAircraftLabel(type, num) {
  const t = (type || '').trim(), n = (num || '').trim();
  if (t && n) return `${t} No.${n}`;
  if (t) return t;
  if (n) return `No.${n}`;
  return '';
}

async function generateLoanFormPdf(record, tool, staffMember, returnedByStaff, d) {

    </div>`;
  // Matches the paper form exactly: "Loan to : ____ (Mechanic)" on one line,
  // then the signed name in parentheses, then the date, both centered below.
  const signBlock = (label, role, name, dateStr) => `
    <div style="width:47%;">

  const container = document.createElement('div');
  container.style.cssText = 'position:fixed; left:-99999px; top:0; width:760px; background:#ffffff; padding:26px; font-family:"Sarabun","Noto Sans Thai",sans-serif; color:#1F2A37; border:2px solid #1F2A37; font-size:13px;';

      <img src="${LOAN_FORM_LOGO_SRC}" style="width:52px; height:52px; object-fit:contain; position:absolute; left:0; top:50%; transform:translateY(-50%);" />
      <h1 style="font-size:20px; margin:0; letter-spacing:0.5px; width:100%; text-align:center;">LOAN AND RETURN OF SPECIAL TOOL</h1>
    </div>
    <div style="display:flex; justify-content:space-between; gap:24px; margin-bottom:16px;">
      <div style="width:48%;">
        ${field('Date', fmtEnDate(d.date || record.borrowDate))}
        ${field('From (Ex. AM)', d.fromAM)}
        ${field('Aircraft No.', combineAircraftLabel(d.aircraftType, d.aircraftNum))}
        ${field('Work Card ID.', d.workCardId)}
      </div>
      <div style="width:48%;">
        ${field('Loan to (Name)', d.loanToName)}
        ${field('Employee ID', d.chipNo)}
        ${field('Tool No.', d.toolNo)}
        ${field('Tool Location', d.toolLocation)}
      </div>
    </div>
    <table style="width:100%; border-collapse:separate; border-spacing:0; border:1px solid #1F2A37; margin-bottom:18px; text-align:center;">
      <thead>
        <tr>
          <th style="border-right:1px solid #1F2A37; border-bottom:1px solid #1F2A37; padding:6px; font-size:12px; text-align:center;">Item</th>

          <th style="border-right:1px solid #1F2A37; border-bottom:1px solid #1F2A37; padding:4px; font-size:11px; text-align:center;"></th>
          <th style="border-right:1px solid #1F2A37; border-bottom:1px solid #1F2A37; padding:4px; font-size:11px; text-align:center;"></th>
          <th style="border-right:1px solid #1F2A37; border-bottom:1px solid #1F2A37; padding:4px; font-size:11px; text-align:center;"></th>
          <th style="border-right:1px solid #1F2A37; border-bottom:1px solid #1F2A37; padding:4px; font-size:11px; text-align:center;"></th>
          <th style="border-right:1px solid #1F2A37; border-bottom:1px solid #1F2A37; padding:4px; font-size:11px; text-align:center;">Date</th>

          <td style="border-right:1px solid #1F2A37; padding:6px; text-align:center;">${escapeHtml(d.pn)}</td>
          <td style="border-right:1px solid #1F2A37; padding:6px; text-align:center;">${escapeHtml(d.sn)}</td>
          <td style="border-right:1px solid #1F2A37; padding:6px; text-align:center;">${d.calibDate ? fmtEnDate(d.calibDate) : ''}</td>
          <td style="padding:6px; text-align:center;">${d.calibDue ? fmtEnDate(d.calibDue) : ''}</td>
        </tr>
      </tbody>
    </table>
    <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
      ${signBlock('Loan to :', 'Mechanic', d.loanToSign, record.borrowDate)}
      ${signBlock('Issue by:', 'Tool Room', d.issueBySign, record.borrowDate)}
    </div>
    <div style="display:flex; justify-content:space-between;">
      ${signBlock('Return by:', 'Mechanic', d.returnBySign, record.returnDate)}
      ${signBlock('Receive by:', 'Tool Room', d.receiveBySign, record.returnDate)}
    </div>
    <div style="margin-top:20px; font-size:10.5px; color:#6B7280; font-style:italic;">LBC-FM-034, Rev.2, Effective Date: 22/11/2021</div>
  `;
  document.body.appendChild(container);

  try {
    const canvas = await window.html2canvas(container, { scale: 2, backgroundColor: '#ffffff' });
    document.body.removeChild(container);
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'pt', 'a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const imgWidth = pageWidth - 40;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;
    pdf.addImage(imgData, 'PNG', 20, 20, imgWidth, imgHeight);
    pdf.save(`ใบยืม-คืน-${tool?.code || record.id}-${todayISO()}.pdf`);
  } catch (e) {
    if (container.parentNode) document.body.removeChild(container);
    throw e;
  }
}

function EvidencePhotoModal({ txId, kind, label, onFetch, onClose }) {
  const [src, setSrc] = useState(null);
  const [state, setState] = useState('loading'); // loading | ok | empty
  useEffect(() => {
    let cancelled = false;
    (async () => {
      const value = await onFetch?.(txId, kind, label);
      if (cancelled) return;
      if (value) { setSrc(value); setState('ok'); } else { setState('empty'); }
    })();
    return () => { cancelled = true; };
  }, [txId, kind]);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card scanner-card" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h3><ImageIcon size={17} /> รูปหลักฐาน — {label}</h3>
          <button className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="evidence-viewport">
          {state === 'loading' && <div className="scanner-overlay-msg" style={{ position: 'static', color: 'var(--ink-soft)' }}><Loader2 className="spin" size={20} /><span>กำลังโหลดรูป…</span></div>}
          {state === 'empty' && <div className="scanner-overlay-msg" style={{ position: 'static', color: 'var(--ink-soft)' }}><VideoOff size={20} /><span>ไม่พบรูปที่บันทึกไว้</span></div>}
          {state === 'ok' && <img src={src} alt="หลักฐาน" className="evidence-img" />}
        </div>
        <p className="scanner-hint">การเปิดดูรูปนี้ถูกบันทึกลงประวัติกิจกรรมของระบบ (เฉพาะแอดมินเข้าถึงได้)</p>
      </div>
    </div>
  );
}

/* ---------------------------- Scan Page ---------------------------- */
function ScanPage({ tools, staff, tx, toolStatus, onBorrow, onReturn, activeByTool, showToast, settings, isAdmin, onEditTx, warehouses, issuerSignature }) {
  const [mode, setMode] = useState('borrow'); // 'borrow' | 'return'
  const [staffCode, setStaffCode] = useState('');
  const [toolCode, setToolCode] = useState('');
  const [dueDate, setDueDate] = useState(addDays(todayISO(), (settings?.defaultDueDays ?? 7)));
  const [scannerFor, setScannerFor] = useState(null); // null | 'staff' | 'tool'
  const [confirming, setConfirming] = useState(false);
  const [photoDataUrl, setPhotoDataUrl] = useState(null);
  const [showCamera, setShowCamera] = useState(false);
  // Mirrors the paper "LOAN AND RETURN OF SPECIAL TOOL" slip — fields we
  // already know (date, names, tool code, location) get auto-filled;
  // everything the system has no way of knowing (aircraft no., work card id,
  // P/N, S/N, calibration) stays a manual field the mechanic fills in here.
  const emptyDocManual = { fromAM: '', aircraftType: '', aircraftNum: '', workCardId: '', loanToSign: '', issueBySign: '' };
  const [docManual, setDocManual] = useState(emptyDocManual);
  const [returnSign, setReturnSign] = useState({ returnBySign: '', receiveBySign: '' });
  const [confirmStep, setConfirmStep] = useState('verify'); // 'verify' | 'doc' — split so the LBC-FM-034 fields are a separate, shorter step
  useEffect(() => { if (confirming) setConfirmStep('verify'); }, [confirming]);

  function resolveStaff(input) {
    const v = input.trim().toLowerCase();
    return staff.find(s => s.code.toLowerCase() === v || s.id.toLowerCase() === v);
  }
  function resolveTool(input) {
    const v = input.trim().toLowerCase();
    return tools.find(t => t.code.toLowerCase() === v || t.id.toLowerCase() === v);
  }

  const matchedStaff = staffCode ? resolveStaff(staffCode) : null;
  const matchedTool = toolCode ? resolveTool(toolCode) : null;

  // Both signature fields are pre-filled the moment a staff badge is matched —
  // "Loan to (Mechanic)" from that person's own saved signature (set when
  // their account was created/edited), "Issue by (Tool Room)" from whichever
  // admin is currently logged in and running this scan station. Either can
  // still be edited/overridden by hand before confirming; the fill only ever
  // applies to an EMPTY field so it never clobbers a manual edit.
  useEffect(() => {
    if (!matchedStaff) return;
    setDocManual(dm => ({
      ...dm,
      loanToSign: dm.loanToSign || matchedStaff.signature || '',
      issueBySign: dm.issueBySign || issuerSignature || '',
    }));
  }, [matchedStaff?.id, issuerSignature]);

  // Enforce order: clear the tool code (and any in-progress photo/confirm state)
  // whenever the staff match is lost, so a tool can never be paired until a
  // valid staff card is scanned first.
  useEffect(() => {
    if (!matchedStaff && (toolCode || confirming || photoDataUrl)) {
      setToolCode(''); setConfirming(false); setPhotoDataUrl(null); setShowCamera(false);
    }
  }, [matchedStaff]); // eslint-disable-line

  const maxBorrow = settings?.maxBorrowPerStaff ?? 3;
  const staffOpenCount = matchedStaff ? tx.filter(t => t.staffId === matchedStaff.id && !t.returnDate).length : 0;

  let blockReason = '';
  if (mode === 'borrow' && matchedStaff && staffOpenCount >= maxBorrow) {
    blockReason = `${matchedStaff.name} ยืมเครื่องมือค้างอยู่ครบจำนวนสูงสุดแล้ว (${maxBorrow} ชิ้น)`;
  }
  if (matchedTool && !blockReason) {
    const isOpen = activeByTool.has(matchedTool.id);
    if (mode === 'borrow' && matchedTool.condition === 'damaged') blockReason = `"${matchedTool.name}" อยู่ระหว่างชำรุด/ส่งซ่อม ยืมไม่ได้`;
    else if (mode === 'borrow' && matchedTool.condition === 'calibration') blockReason = `"${matchedTool.name}" อยู่ระหว่างส่ง Calibration ยืมไม่ได้`;
    else if (mode === 'borrow' && isOpen) blockReason = `"${matchedTool.name}" ถูกยืมอยู่แล้ว ไม่สามารถยืมซ้ำได้`;
    else if (mode === 'return' && !isOpen) blockReason = `"${matchedTool.name}" ไม่มีรายการค้างคืนอยู่`;
  }
  const readyToConfirm = !!(matchedStaff && matchedTool && !blockReason);

  function resetFields() {
    setStaffCode(''); setToolCode(''); setConfirming(false); setPhotoDataUrl(null); setShowCamera(false);
    setDueDate(addDays(todayISO(), (settings?.defaultDueDays ?? 7)));
    setDocManual(emptyDocManual); setReturnSign({ returnBySign: '', receiveBySign: '' }); setConfirmStep('verify');
  }

  function handleScanResult(text) {
    const value = (text || '').trim();
    if (!value) return;
    if (scannerFor === 'staff') {
      setToolCode(''); setConfirming(false); setPhotoDataUrl(null);
      setStaffCode(value);
      const s = staff.find(x => x.code.toLowerCase() === value.toLowerCase() || x.id.toLowerCase() === value.toLowerCase());
      showToast?.(s ? `สแกนบัตรพนักงานสำเร็จ: ${s.name}` : `สแกนได้รหัส "${value}" แต่ไม่พบในระบบ`, s ? 'success' : 'error');
    } else if (scannerFor === 'tool') {
      setToolCode(value);
      setPhotoDataUrl(null);
      const t = tools.find(x => x.code.toLowerCase() === value.toLowerCase() || x.id.toLowerCase() === value.toLowerCase());
      showToast?.(t ? `สแกน QR เครื่องมือสำเร็จ: ${t.name}` : `สแกนได้รหัส "${value}" แต่ไม่พบในระบบ`, t ? 'success' : 'error');
      if (t) setConfirming(true); // scanning the tool successfully opens the verify + photo step automatically
    }
    setScannerFor(null);
  }

  const needsLoanForm = !!matchedTool?.requiresLoanForm;
  const signatureMissing = needsLoanForm && (mode === 'borrow' ? !docManual.loanToSign.trim() : !returnSign.returnBySign.trim());

  async function confirmAction() {
    if (!readyToConfirm || !photoDataUrl || signatureMissing) return;
    if (mode === 'borrow') {
      let docForm = null;
      if (needsLoanForm) {
        const wh = warehouses?.find(w => w.id === matchedTool.warehouseId);
        docForm = {
          date: todayISO(), fromAM: docManual.fromAM, aircraftType: docManual.aircraftType, aircraftNum: docManual.aircraftNum, workCardId: docManual.workCardId,
          loanToName: docManual.loanToSign || matchedStaff.name, chipNo: matchedStaff.code,
          toolNo: matchedTool.code, toolLocation: wh?.name || '-', itemDesc: matchedTool.name,
          pn: matchedTool.partNo || '', sn: matchedTool.serialNo || '', calibDate: matchedTool.calibDate || '', calibDue: matchedTool.calibDue || '',
          loanToSign: docManual.loanToSign, issueBySign: docManual.issueBySign, returnBySign: '', receiveBySign: '', returnDate: null
        };
      }
      await onBorrow(matchedStaff.id, matchedTool.id, dueDate, photoDataUrl, docForm);
    } else {
      await onReturn(matchedTool.id, matchedStaff.id, photoDataUrl, needsLoanForm ? {
        returnBySign: returnSign.returnBySign, receiveBySign: returnSign.receiveBySign, returnDate: new Date().toISOString()
      } : null);
    }
    resetFields();
  }

  function switchMode(next) { setMode(next); resetFields(); }

  const openList = tx.filter(t => !t.returnDate).sort((a, b) => a.dueDate.localeCompare(b.dueDate));

  return (
    <div className="page-stack">
      <section className="panel scan-panel">
        <div className="panel-head">
          <h2><ScanLine size={18} /> สแกนยืม-คืน</h2>
          <p>ขั้นตอนบังคับ: สแกนบัตรพนักงานก่อนเสมอ จากนั้นสแกน QR เครื่องมือ ระบบจะให้ตรวจสอบสภาพเครื่องมือ ถ่ายรูป และยืนยันก่อนบันทึกทุกครั้ง</p>
        </div>

        <div className="mode-tabs">
          <button type="button" className={`mode-tab ${mode === 'borrow' ? 'active' : ''}`} onClick={() => switchMode('borrow')}>ยืมเครื่องมือ</button>
          <button type="button" className={`mode-tab ${mode === 'return' ? 'active' : ''}`} onClick={() => switchMode('return')}>คืนเครื่องมือ</button>
        </div>

        <div className="scan-steps">
          <div className={`scan-step ${matchedStaff ? 'done' : 'active'}`}>
            <div className="step-num">{matchedStaff ? <CheckCircle2 size={16} /> : '1'}</div>
            <div className="step-body">
              <label>ขั้นที่ 1 — สแกนบัตรพนักงาน</label>
              <div className="scan-input-row">
                <input autoFocus value={staffCode} onChange={e => setStaffCode(e.target.value)} placeholder="เช่น EMP-1001" className="mono" />
                <button type="button" className="scan-icon-btn" onClick={() => setScannerFor('staff')} title="สแกนบัตรพนักงาน">
                  <CreditCard size={16} />
                </button>
              </div>
              {staffCode && <div className={`hint ${matchedStaff ? 'ok' : 'bad'}`}>{matchedStaff ? `✓ ${matchedStaff.name} (${matchedStaff.dept})` : 'ไม่พบรหัสนี้'}</div>}
            </div>
          </div>

          <div className={`scan-step ${!matchedStaff ? 'locked' : matchedTool ? 'done' : 'active'}`}>
            <div className="step-num">{matchedTool ? <CheckCircle2 size={16} /> : '2'}</div>
            <div className="step-body">
              <label>ขั้นที่ 2 — สแกน QR เครื่องมือ</label>
              <div className="scan-input-row">
                <input value={toolCode} onChange={e => { setToolCode(e.target.value); setPhotoDataUrl(null); }} placeholder={matchedStaff ? 'เช่น PWR-001' : 'สแกนบัตรพนักงานก่อน'} className="mono" disabled={!matchedStaff} />
                <button type="button" className="scan-icon-btn" onClick={() => setScannerFor('tool')} title="สแกน QR เครื่องมือ" disabled={!matchedStaff}>
                  <QrCode size={16} />
                </button>
              </div>
              {!matchedStaff && <div className="hint locked-hint">กรุณาสแกนบัตรพนักงานให้สำเร็จก่อน จึงจะสแกนเครื่องมือได้</div>}
              {matchedStaff && toolCode && <div className={`hint ${matchedTool && !blockReason ? 'ok' : 'bad'}`}>
                {!matchedTool ? 'ไม่พบรหัสนี้' : blockReason || `✓ ${matchedTool.name}`}
              </div>}
            </div>
          </div>

          {mode === 'borrow' && (
            <div className="form-group">
              <label>กำหนดวันส่งคืน</label>
              <input type="date" value={dueDate} onChange={e => setDueDate(e.target.value)} disabled={!matchedStaff} />
            </div>
          )}
        </div>

        {readyToConfirm && !confirming && (
          <button type="button" className={`btn ${mode === 'borrow' ? 'btn-primary' : 'btn-success'} confirm-trigger`} onClick={() => setConfirming(true)}>
            {mode === 'borrow' ? 'ตรวจสอบเครื่องมือและยืม' : 'ตรวจสอบเครื่องมือและคืน'}
          </button>
        )}
      </section>

      <section className="panel">
        <div className="panel-head"><h2>รายการที่ถูกยืมอยู่ ({openList.length})</h2></div>
        <TxTable rows={openList} tools={tools} staff={staff} isAdmin={isAdmin} onEditTx={onEditTx} />
      </section>

      {scannerFor && (
        <QrScanModal
          title={scannerFor === 'staff' ? 'สแกน QR บัตรพนักงาน' : 'สแกน QR เครื่องมือ'}
          onDetect={handleScanResult}
          onClose={() => setScannerFor(null)}
        />
      )}

      {confirming && readyToConfirm && (
        <Modal title={mode === 'borrow' ? 'ยืนยันการยืมเครื่องมือ' : 'ยืนยันการคืนเครื่องมือ'} onClose={() => setConfirming(false)}>
          {confirmStep === 'verify' && (
            <>
              <div className="verify-block">
                <ToolPhotoThumb toolId={matchedTool.id} hasPhoto={matchedTool.hasPhoto} size={104} placeholder={false} version={matchedTool.photoUpdatedAt} />
                <div className="verify-tool-name">{matchedTool.name}</div>
                <div className="verify-tool-code mono">{matchedTool.code}</div>
                <p className="verify-msg">โปรดตรวจสอบความถูกต้องและสภาพเครื่องมือช่าง</p>
                {!photoDataUrl ? (
                  <button type="button" className="btn btn-secondary photo-btn" onClick={() => setShowCamera(true)}>
                    <Camera size={16} /> ถ่ายรูปเครื่องมือ
                  </button>
                ) : (
                  <div className="photo-captured-row">
                    <span><CheckCircle2 size={16} /> ถ่ายรูปเรียบร้อย — บันทึกเป็นหลักฐานในระบบ</span>
                    <button type="button" className="link-btn" onClick={() => setShowCamera(true)}>ถ่ายใหม่</button>
                  </div>
                )}
              </div>

              <div className="confirm-summary">
                <div className="confirm-row">
                  <span className="confirm-label">พนักงาน</span>
                  <span className="confirm-value">{matchedStaff.name} <span className="muted">({matchedStaff.dept})</span></span>
                </div>
                <div className="confirm-row">
                  <span className="confirm-label">เครื่องมือ</span>
                  <span className="confirm-value mono">{matchedTool.code} — {matchedTool.name}</span>
                </div>
                {mode === 'borrow' && (
                  <>
                    <div className="confirm-row">
                      <span className="confirm-label">เวลาที่บันทึกการยืม</span>
                      <span className="confirm-value">{fmtThaiDateTime(new Date().toISOString())}</span>
                    </div>
                    <div className="confirm-row">
                      <span className="confirm-label">กำหนดคืน</span>
                      <span className="confirm-value">{fmtThaiDate(dueDate)}</span>
                    </div>
                  </>
                )}
                {mode === 'return' && (
                  <div className="confirm-row">
                    <span className="confirm-label">เวลาที่บันทึกการคืน</span>
                    <span className="confirm-value">{fmtThaiDateTime(new Date().toISOString())}</span>
                  </div>
                )}
              </div>

              <div className="form-actions" style={{ marginTop: 6 }}>
                <button type="button" className="btn btn-secondary" onClick={() => setConfirming(false)}>ยกเลิก</button>
                <button type="button" className={`btn ${mode === 'borrow' ? 'btn-primary' : 'btn-success'}`}
                  onClick={() => needsLoanForm ? setConfirmStep('doc') : confirmAction()} disabled={!photoDataUrl}>
                  {needsLoanForm ? 'ถัดไป — กรอกใบยืม-คืนเครื่องมือ' : (mode === 'borrow' ? 'ยืนยันการยืม' : 'ยืนยันการคืน')}
                </button>
              </div>
            </>
          )}

          {confirmStep === 'doc' && mode === 'borrow' && (
            <>
              <div className="loan-doc-block" style={{ marginTop: 0, paddingTop: 0, borderTop: 'none' }}>
                <div className="loan-doc-title"><FileSpreadsheet size={14} /> ใบยืม-คืนเครื่องมือ (LBC-FM-034)</div>
                <p className="scanner-hint" style={{ margin: '2px 0 8px' }}>P/N, S/N และ Calibration ดึงจากข้อมูลเครื่องมือที่แอดมินบันทึกไว้แล้วอัตโนมัติ ช่องด้านล่างนี้กรอกเฉพาะที่ทราบได้เลย เว้นว่างช่องที่ยังไม่ทราบไว้ก่อนได้</p>
                <div className="loan-doc-grid">
                  <div className="form-group">
                    <label>Aircraft Type.</label>
                    <select value={docManual.aircraftType} onChange={e => setDocManual({ ...docManual, aircraftType: e.target.value })}>
                      <option value="">เลือก Aircraft Type</option>
                      {AIRCRAFT_OPTIONS.map(a => <option key={a} value={a}>{a}</option>)}
                    </select>
                  </div>
                  <div className="form-group">
                    <label>Aircraft No.</label>
                    <input value={docManual.aircraftNum} onChange={e => setDocManual({ ...docManual, aircraftNum: e.target.value })} placeholder="เช่น 1112" />
                  </div>
                  <div className="form-group"><label>Work Card ID.</label><input value={docManual.workCardId} onChange={e => setDocManual({ ...docManual, workCardId: e.target.value })} /></div>
                  <div className="form-group">
                    <label>From (Ex. AM)</label>
                    <select value={docManual.fromAM} onChange={e => setDocManual({ ...docManual, fromAM: e.target.value })}>
                      <option value="">เลือกหน่วยงาน</option>
                      {DEPT_OPTIONS.map(d => <option key={d} value={d}>{d}</option>)}
                    </select>
                  </div>
                </div>
                <div className="loan-doc-grid">
                  <div className="form-group">
                    <label>Loan to (Mechanic) <span className="req-star">*</span></label>
                    <input value={docManual.loanToSign} onChange={e => setDocManual({ ...docManual, loanToSign: e.target.value })} placeholder="เช่น SUPHOT.B" />
                  </div>
                  <div className="form-group">
                    <label>Issue by (Tool Room)</label>
                    <input value={docManual.issueBySign} onChange={e => setDocManual({ ...docManual, issueBySign: e.target.value })} placeholder="เช่น SAWITEE.K" />
                  </div>
                </div>

/* ---------------------------- QR Scan Modal (camera) ---------------------------- */
function QrScanModal({ title, onDetect, onClose }) {
  const videoRef = React.useRef(null);
  const canvasRef = React.useRef(null);
  const streamRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const detectedRef = React.useRef(false);
  const [status, setStatus] = useState('requesting'); // requesting | scanning | error
  const [errorMsg, setErrorMsg] = useState('');
  const [manualCode, setManualCode] = useState('');

  useEffect(() => {
    let cancelled = false;

    async function start() {
      setStatus('requesting');
      let stream;
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('unsupported');
        }
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } }, audio: false
        });
      } catch (err) {
        if (cancelled) return;
        setStatus('error');
        if (err && err.name === 'NotAllowedError') setErrorMsg('ไม่ได้รับอนุญาตให้ใช้กล้อง กรุณาอนุญาตการเข้าถึงกล้องแล้วลองใหม่');
        else if (err && err.name === 'NotFoundError') setErrorMsg('ไม่พบกล้องบนอุปกรณ์นี้');
        else if (err && err.message === 'unsupported') setErrorMsg('อุปกรณ์หรือเบราว์เซอร์นี้ไม่รองรับการเปิดกล้อง');
        else setErrorMsg('ไม่สามารถเปิดกล้องได้');
        return;
      }
      if (cancelled) { stream.getTracks().forEach(t => t.stop()); return; }
      streamRef.current = stream;
      if (videoRef.current) {
        videoRef.current.srcObject = stream;
        await videoRef.current.play();
      }
      // Camera is on at this point — anything past here is the QR-reading
      // library, not the camera, so it gets its own error message.
      try {
        try {
          await ensureJsQR();
        } catch (e) {
          await ensureJsQR(); // one retry — this step loads a script from a CDN, which can fail transiently
        }
        if (cancelled) return;
        setStatus('scanning');
        tick();
      } catch (err) {
        if (cancelled) return;
        if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
        setStatus('error');
        setErrorMsg('โหลดตัวอ่าน QR ไม่สำเร็จ (ปัญหาการเชื่อมต่ออินเทอร์เน็ต หรือมีตัวบล็อกสคริปต์อยู่) กรุณาลองใหม่ หรือพิมพ์รหัสเอง');
      }
    }

    function tick() {
      const video = videoRef.current, canvas = canvasRef.current;
      if (detectedRef.current) return;
      if (video && canvas && video.readyState === video.HAVE_ENOUGH_DATA && window.jsQR) {
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        try {
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = window.jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
          if (code && code.data) {
            detectedRef.current = true;
            onDetect(code.data);
            return;
          }
        } catch (e) { /* frame not ready, ignore */ }
      }
      rafRef.current = requestAnimationFrame(tick);
    }

    start();
    return () => {
      cancelled = true;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    };
  }, []);

  function submitManual(e) {
    e.preventDefault();
    if (!manualCode.trim()) return;
    onDetect(manualCode.trim());
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card scanner-card" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h3><Camera size={17} /> {title}</h3>
          <button className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>

        {status !== 'error' && (
          <div className="scanner-viewport">
            <video ref={videoRef} className="scanner-video" muted playsInline />
            <canvas ref={canvasRef} style={{ display: 'none' }} />
            {status === 'scanning' && (
              <div className="scanner-frame">
                <span className="corner tl" /><span className="corner tr" />
                <span className="corner bl" /><span className="corner br" />
                <div className="scanner-line" />
              </div>
            )}
            {status === 'requesting' && (
              <div className="scanner-overlay-msg">
                <Loader2 className="spin" size={22} /><span>กำลังเปิดกล้อง…</span>
              </div>
            )}
          </div>
        )}

        {status === 'error' && (
          <div className="scanner-manual-block">
            <VideoOff size={26} color="var(--danger)" />
            <p className="scanner-manual-msg">{errorMsg}</p>
            <form onSubmit={submitManual} className="scan-input-row" style={{ width: '100%' }}>
              <input autoFocus className="mono" value={manualCode} onChange={e => setManualCode(e.target.value)} placeholder="พิมพ์รหัสที่นี่" />
              <button type="submit" className="scan-icon-btn" title="ยืนยันรหัส" disabled={!manualCode.trim()}><CheckCircle2 size={16} /></button>
            </form>
          </div>
        )}

        {status !== 'error' && <p className="scanner-hint">เล็งกล้องไปที่ QR โค้ด ระบบจะกรอกรหัสให้อัตโนมัติเมื่อสแกนสำเร็จ</p>}
        <button type="button" className="btn btn-secondary" style={{ width: '100%', justifyContent: 'center' }} onClick={onClose}>ยกเลิก</button>
      </div>
    </div>
  );
}

/* ---------------------------- Photo Capture Modal (camera) ---------------------------- */
function PhotoCaptureModal({ onCapture, onClose, title, hint }) {
  const videoRef = React.useRef(null);
  const canvasRef = React.useRef(null);
  const streamRef = React.useRef(null);
  const [status, setStatus] = useState('requesting'); // requesting | ready | error
  const [errorMsg, setErrorMsg] = useState('');

  useEffect(() => {
    let cancelled = false;
    async function start() {
      setStatus('requesting');
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('unsupported');
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } }, audio: false
        });
        if (cancelled) { stream.getTracks().forEach(t => t.stop()); return; }
        streamRef.current = stream;
        if (videoRef.current) { videoRef.current.srcObject = stream; await videoRef.current.play(); }
        if (cancelled) return;
        setStatus('ready');
      } catch (err) {
        if (cancelled) return;
        setStatus('error');
        if (err && err.name === 'NotAllowedError') setErrorMsg('ไม่ได้รับอนุญาตให้ใช้กล้อง กรุณาอนุญาตการเข้าถึงกล้องแล้วลองใหม่');
        else if (err && err.name === 'NotFoundError') setErrorMsg('ไม่พบกล้องบนอุปกรณ์นี้');
        else if (err && err.message === 'unsupported') setErrorMsg('อุปกรณ์หรือเบราว์เซอร์นี้ไม่รองรับการเปิดกล้อง');
        else setErrorMsg('ไม่สามารถเปิดกล้องได้ กรุณาลองใหม่');
      }
    }
    start();
    return () => {
      cancelled = true;
      if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    };
  }, []);

  function capture() {
    const video = videoRef.current, canvas = canvasRef.current;
    if (!video || !canvas || status !== 'ready') return;
    const maxW = 480;
    const scale = Math.min(1, maxW / (video.videoWidth || maxW));
    canvas.width = Math.round((video.videoWidth || maxW) * scale);
    canvas.height = Math.round((video.videoHeight || maxW) * scale);
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.62);
    onCapture(dataUrl);
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card scanner-card" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h3><Camera size={17} /> {title || 'ถ่ายรูปสภาพเครื่องมือ'}</h3>
          <button className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>

        <div className="scanner-viewport">
          <video ref={videoRef} className="scanner-video" muted playsInline />
          <canvas ref={canvasRef} style={{ display: 'none' }} />
          {status !== 'ready' && (
            <div className="scanner-overlay-msg">
              {status === 'requesting' && <><Loader2 className="spin" size={22} /><span>กำลังเปิดกล้อง…</span></>}
              {status === 'error' && <><VideoOff size={22} /><span>{errorMsg}</span></>}
            </div>
          )}
        </div>

        <p className="scanner-hint">{hint || 'จัดกรอบให้เห็นสภาพเครื่องมือชัดเจน แล้วกดถ่ายรูป ภาพจะถูกเก็บไว้ในระบบเป็นหลักฐานเท่านั้น ไม่แสดงผลที่ใดในโปรแกรม'}</p>
        <div className="form-actions" style={{ marginTop: 4 }}>
          <button type="button" className="btn btn-secondary" onClick={onClose}>ยกเลิก</button>
          <button type="button" className="btn btn-primary" onClick={capture} disabled={status !== 'ready'}><Camera size={15} /> ถ่ายรูป</button>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------- Tools Page ---------------------------- */
function ToolsPage({ tools, setTools, toolStatus, showToast, onSetCondition, onSetCalibration, addAudit, warehouses, scopedWarehouseIds, tx, staff }) {
  const [q, setQ] = useState('');
  const [cat, setCat] = useState('all');
  const [wh, setWh] = useState('all');
  const [modal, setModal] = useState(null); // {mode:'add'|'edit', data}
  const [qrTool, setQrTool] = useState(null);
  const [damageModal, setDamageModal] = useState(null); // tool being flagged damaged
  const [calibSendModal, setCalibSendModal] = useState(null);    // tool being sent out for calibration
  const [calibReceiveModal, setCalibReceiveModal] = useState(null); // tool coming back from calibration
  const [pdfBusy, setPdfBusy] = useState(false);

  // A restricted secondary admin only sees/manages the warehouse(s) the main
  // admin assigned them — the underlying `tools`/`warehouses` collections stay
  // whole (any save still rebuilds from the FULL array), only what's shown
  // and selectable here is narrowed.
  const visibleWarehouses = scopedWarehouseIds ? warehouses.filter(w => scopedWarehouseIds.includes(w.id)) : warehouses;
  const inScope = (warehouseId) => !scopedWarehouseIds || scopedWarehouseIds.includes(warehouseId);

  const filtered = tools.filter(t =>
    (cat === 'all' || t.category === cat) &&
    (wh === 'all' || t.warehouseId === wh) &&
    inScope(t.warehouseId) &&
    (t.name.toLowerCase().includes(q.toLowerCase()) || t.code.toLowerCase().includes(q.toLowerCase()))
  );

  const whLabel = wh === 'all' ? 'ทุกคลัง' : (warehouses.find(w => w.id === wh)?.name || 'ทุกคลัง');

  function doExportExcel() {
    if (!filtered.length) return showToast('ไม่มีรายการให้ส่งออก', 'error');
    exportToolsExcel(filtered, warehouses, toolStatus, whLabel);
    addAudit?.('tools_export', `ส่งออก Excel (${whLabel}, ${filtered.length} รายการ)`);
    showToast('ส่งออก Excel เรียบร้อย', 'success');
  }

  async function doExportPDF() {
    if (!filtered.length) return showToast('ไม่มีรายการให้ส่งออก', 'error');
    setPdfBusy(true);
    try {
      await exportToolsPDF(filtered, warehouses, toolStatus, whLabel, whLabel);
      addAudit?.('tools_export', `ส่งออก PDF (${whLabel}, ${filtered.length} รายการ)`);
      showToast('ส่งออก PDF เรียบร้อย', 'success');
    } catch (e) {
      showToast('ส่งออก PDF ไม่สำเร็จ กรุณาลองใหม่', 'error');
    }
    setPdfBusy(false);
  }

  function openAdd() { setModal({ mode: 'add', data: { code: '', name: '', category: 'hand', warehouseId: warehouses[0]?.id || '' } }); }
  function openEdit(t) { setModal({ mode: 'edit', data: { ...t } }); }

  async function save(data) {
    const { _newPhoto, _removePhoto, ...formData } = data;
    if (!formData.code.trim() || !formData.name.trim()) return showToast('กรุณากรอกรหัสและชื่อเครื่องมือ', 'error');
    if (!formData.warehouseId) return showToast('กรุณาเลือกคลังเครื่องมือ', 'error');
    if (modal.mode === 'add') {
      if (tools.some(t => t.code.trim().toLowerCase() === formData.code.trim().toLowerCase())) return showToast('รหัสนี้มีอยู่แล้ว', 'error');
      // QR is generated once here from a stable internal id — editing the tool later
      // (code, name, category, warehouse) never changes this id, so the printed QR keeps working.
      const newTool = { ...formData, code: formData.code.trim(), name: formData.name.trim(), id: uid('T'), condition: 'normal', requiresLoanForm: !!formData.requiresLoanForm, hasPhoto: !!_newPhoto, photoUpdatedAt: _newPhoto ? Date.now() : undefined };
      try {
        if (_newPhoto) await storageSet(`toolcrib-photo:master:${newTool.id}`, _newPhoto, true);
        await setTools([newTool, ...tools]);
      } catch (err) {
        console.error('failed to save tool', err);
        return showToast('บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
      }
      const whName = warehouses.find(w => w.id === newTool.warehouseId)?.name || '-';
      addAudit?.('tool_add', `${newTool.code} — ${newTool.name} (คลัง: ${whName})`);
      showToast('เพิ่มเครื่องมือและสร้าง QR เรียบร้อย', 'success');
      setModal(null);
      setQrTool(newTool);
      return;
    } else {
      // Same uniqueness rule as adding — otherwise an edit could silently create
      // two tools sharing a code, and scanning that code becomes ambiguous.
      if (tools.some(t => t.id !== formData.id && t.code.trim().toLowerCase() === formData.code.trim().toLowerCase())) {
        return showToast('รหัสนี้มีอยู่แล้วในเครื่องมือชิ้นอื่น', 'error');
      }
      const hasPhoto = _newPhoto ? true : (_removePhoto ? false : !!formData.hasPhoto);
      try {
        if (_newPhoto) await storageSet(`toolcrib-photo:master:${formData.id}`, _newPhoto, true);
        if (_removePhoto) await storageDelete(`toolcrib-photo:master:${formData.id}`, true);
        // A shelf only makes sense within the warehouse it belongs to — if this
        // edit moves the tool to a different warehouse, its old shelf
        // assignment no longer applies and must be cleared, not carried over.
        await setTools(tools.map(t => t.id === formData.id ? {
          ...t, code: formData.code.trim(), name: formData.name.trim(), category: formData.category, warehouseId: formData.warehouseId,
          partNo: formData.partNo || '', serialNo: formData.serialNo || '', calibDate: formData.calibDate || '', calibDue: formData.calibDue || '',
          requiresLoanForm: !!formData.requiresLoanForm, hasPhoto,
          // Stamped on every photo change (set or remove) — without this,
          // replacing an existing photo keeps hasPhoto at true the whole
          // time, so components showing it would never know to refetch and
          // would keep displaying the old cached image after saving.
          photoUpdatedAt: (_newPhoto || _removePhoto) ? Date.now() : t.photoUpdatedAt,
          shelfId: formData.warehouseId !== t.warehouseId ? null : t.shelfId
        } : t));
      } catch (err) {
        console.error('failed to save tool', err);
        return showToast('บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
      }
      addAudit?.('tool_edit', `${formData.code} — ${formData.name}`);
      showToast('บันทึกการแก้ไขเรียบร้อย (QR เดิมยังใช้งานได้)', 'success');
    }
    setModal(null);
  }

  // The most recent transaction for this tool that has a completed (printable) LBC-FM-034 slip.
  function latestPrintableDoc(toolId) {
    return (tx || [])
      .filter(t => t.toolId === toolId && t.docForm && t.returnDate)
      .sort((a, b) => (b.returnDate || '').localeCompare(a.returnDate || ''))[0] || null;
  }

  const [printingToolId, setPrintingToolId] = useState(null);
  async function printToolLoanDoc(t) {
    const record = latestPrintableDoc(t.id);
    if (!record) return;
    setPrintingToolId(t.id);
    try {
      const staffMember = staff?.find(s => s.id === record.staffId);
      const returnedByStaff = record.returnedBy ? staff?.find(s => s.id === record.returnedBy) : null;
      await generateLoanFormPdf(record, t, staffMember, returnedByStaff, record.docForm);
    } catch (err) {
      console.error('failed to generate loan form pdf', err);
      showToast('สร้าง PDF ไม่สำเร็จ กรุณาลองใหม่', 'error');
    } finally {
      setPrintingToolId(null);
    }
  }

  async function remove(t) {
    const s = toolStatus(t.id);
    if (s === 'borrowed' || s === 'overdue') return showToast('ไม่สามารถลบเครื่องมือที่ถูกยืมอยู่ได้', 'error');
    try {
      await setTools(tools.filter(x => x.id !== t.id));
      if (t.hasPhoto) await storageDelete(`toolcrib-photo:master:${t.id}`, true);
    } catch (err) {
      console.error('failed to delete tool', err);
      return showToast('ลบไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    addAudit?.('tool_delete', `${t.code} — ${t.name}`);
    showToast('ลบเครื่องมือและยกเลิก QR ที่ผูกไว้เรียบร้อย', 'success');
  }

  return (
    <div className="page-stack">
      <section className="panel">
        <div className="toolbar">
          <div className="search-box">
            <Search size={16} />
            <input placeholder="ค้นหาชื่อหรือรหัสเครื่องมือ…" value={q} onChange={e => setQ(e.target.value)} />
          </div>
          <div className="chip-row">
            <button className={`chip ${cat === 'all' ? 'active' : ''}`} onClick={() => setCat('all')}>ทุกหมวดหมู่</button>
            {CATEGORIES.map(c => (
              <button key={c.id} className={`chip ${cat === c.id ? 'active' : ''}`} onClick={() => setCat(c.id)}>{c.label}</button>
            ))}
          </div>
          <div className="wh-switch">
            <button className={`wh-switch-item ${wh === 'all' ? 'active' : ''}`} onClick={() => setWh('all')}>ทุกคลัง</button>
            {visibleWarehouses.map(w => (
              <button key={w.id} className={`wh-switch-item ${wh === w.id ? 'active' : ''}`} onClick={() => setWh(w.id)}>{w.name}</button>
            ))}
          </div>
          <button className="btn btn-primary" onClick={openAdd}><Plus size={16} /> เพิ่มเครื่องมือ</button>
        </div>

        <div className="export-row">
          <span className="muted" style={{ fontSize: 12 }}>ส่งออกรายการที่กรองอยู่ ({filtered.length} รายการ, {whLabel}):</span>
          <button className="btn btn-secondary" onClick={doExportExcel}><FileSpreadsheet size={14} /> Excel</button>
          <button className="btn btn-secondary" disabled={pdfBusy} onClick={doExportPDF}>
            {pdfBusy ? <Loader2 className="spin" size={14} /> : <Download size={14} />} PDF
          </button>
        </div>

        <div className="table-wrap">
          <table>
            <thead><tr><th>รหัส</th><th>ชื่อเครื่องมือ</th><th>หมวดหมู่</th><th>คลัง</th><th>สถานะ</th><th>ใบยืม-คืน</th><th></th></tr></thead>
            <tbody>
              {filtered.map(t => {
                const s = toolStatus(t.id);
                const statusLabel = { available: 'พร้อมใช้งาน', borrowed: 'ถูกยืม', overdue: 'เกินกำหนดคืน', damaged: 'ชำรุด/ส่งซ่อม', calibration: 'ส่ง Calibration' }[s];
                const cls = { available: 'success', borrowed: 'warning', overdue: 'danger', damaged: 'purple', calibration: 'calib' }[s];
                const whName = warehouses.find(w => w.id === t.warehouseId)?.name || '-';
                return (
                  <tr key={t.id}>
                    <td className="mono">{t.code}</td>
                    <td className="cell-ellipsis" title={t.name}>{t.name}</td>
                    <td>{catMap[t.category]?.label}</td>
                    <td>{whName}</td>
                    <td><span className={`badge ${cls}`}>{statusLabel}</span></td>
                    <td>
                      <div className="loanform-cell">
                        <span className={`photo-chip ${t.requiresLoanForm ? 'chip-doc' : 'chip-off'}`} title="แก้ไขได้จากปุ่มแก้ไขเครื่องมือ (ดินสอ)">
                          <FileSpreadsheet size={12} /> {t.requiresLoanForm ? 'ต้องออกใบยืม' : 'ไม่ต้องออกใบ'}
                        </span>
                        {t.requiresLoanForm && (
                          latestPrintableDoc(t.id) ? (
                            <button className="icon-btn success-tint" title="ดู/พิมพ์ใบยืม-คืนล่าสุด (PDF)"
                              disabled={printingToolId === t.id} onClick={() => printToolLoanDoc(t)}>
                              {printingToolId === t.id ? <Loader2 size={15} className="spin" /> : <Download size={15} />}
                            </button>

                            <button className="icon-btn" style={{ opacity: 0.4 }} title="ยังไม่มีรายการยืม-คืนที่เสร็จสมบูรณ์สำหรับเครื่องมือชิ้นนี้" disabled>
                              <Download size={15} />
                            </button>
                          )

                      </div>
                    </td>
                    <td className="row-actions">
                      {s === 'damaged' ? (
                        <button className="icon-btn success-tint" title="แจ้งซ่อมเสร็จแล้ว" onClick={() => onSetCondition(t.id, 'normal', '')}><WrenchIcon2 size={15} /></button>
                      ) : (
                        <button className="icon-btn" title="แจ้งชำรุด/ส่งซ่อม" disabled={s !== 'available'} onClick={() => setDamageModal(t)}><ShieldAlert size={15} /></button>

                      {s === 'calibration' ? (
                        <button className="icon-btn success-tint" title="รับเข้าจาก Calibration (ต้องระบุวัน Calibration ใหม่)" onClick={() => setCalibReceiveModal(t)}><CheckCircle2 size={15} /></button>
                      ) : (
                        <button className="icon-btn" title="ส่ง Calibration" disabled={s !== 'available'} onClick={() => setCalibSendModal(t)}><Gauge size={15} /></button>

                      <button className="icon-btn" title="ดู/พิมพ์ QR" onClick={() => setQrTool(t)}><QrCode size={15} /></button>
                      <button className="icon-btn" onClick={() => openEdit(t)}><Pencil size={15} /></button>
                      <button className="icon-btn danger" onClick={() => remove(t)}><Trash2 size={15} /></button>

              {!filtered.length && <tr><td colSpan={7} className="empty-state">ไม่พบเครื่องมือที่ค้นหา</td></tr>}
            </tbody>

      </section>

      {modal && (

      )}

      {damageModal && (
        <Modal title="แจ้งเครื่องมือชำรุด/ส่งซ่อม" onClose={() => setDamageModal(null)}>
          <DamageForm tool={damageModal}
            onSave={(note) => { onSetCondition(damageModal.id, 'damaged', note); setDamageModal(null); }}

        </Modal>
      )}

      {calibSendModal && (
        <Modal title="ส่งเครื่องมือไป Calibration" onClose={() => setCalibSendModal(null)}>
          <CalibrationSendForm tool={calibSendModal}
            onSave={(payload) => { onSetCalibration(calibSendModal.id, 'send', payload); setCalibSendModal(null); }}
            onCancel={() => setCalibSendModal(null)} />
        </Modal>
      )}

      {calibReceiveModal && (
        <Modal title="รับเครื่องมือกลับจาก Calibration" onClose={() => setCalibReceiveModal(null)}>
          <CalibrationReceiveForm tool={calibReceiveModal}
            onSave={(payload) => { onSetCalibration(calibReceiveModal.id, 'receive', payload); setCalibReceiveModal(null); }}
            onCancel={() => setCalibReceiveModal(null)} />
        </Modal>
      )}

      {qrTool && (
        <QrCodeModal
          value={qrTool.id}
          title={`QR เครื่องมือ: ${qrTool.code}`}
          subtitle={qrTool.name}
          fileName={`QR-${qrTool.code}`}
          onClose={() => setQrTool(null)}
        />
      )}
    </div>
  );
}

// Fetches and shows a tool's registered master photo (set once at
// registration, distinct from the per-transaction "before/after" evidence
// photos). Renders nothing if the tool has none — callers decide whether
// that's worth a placeholder.
function ToolPhotoThumb({ toolId, hasPhoto, size, placeholder, version }) {
  const [src, setSrc] = useState(null);
  const [state, setState] = useState(hasPhoto ? 'loading' : 'empty');
  useEffect(() => {
    let cancelled = false;
    if (!hasPhoto) { setSrc(null); setState('empty'); return; }
    setState('loading');
    (async () => {
      const value = await storageGet(`toolcrib-photo:master:${toolId}`, true);
      if (cancelled) return;
      if (value) { setSrc(value); setState('ok'); } else setState('empty');
    })();
    return () => { cancelled = true; };
  }, [toolId, hasPhoto, version]);

  const px = size || 96;
  if (state === 'ok') return <img src={src} alt="" className="tool-master-photo" style={{ width: px, height: px }} />;
  if (state === 'loading') return <div className="tool-master-photo-placeholder" style={{ width: px, height: px }}><Loader2 className="spin" size={18} /></div>;
  if (placeholder === false) return null;
  return <div className="tool-master-photo-placeholder" style={{ width: px, height: px }}><ImageIcon size={18} /></div>;
}

function ToolForm({ data, onSave, onCancel, warehouses, shelves, tools }) {
  const [form, setForm] = useState(data);
  // Transient, form-local photo state — not part of the saved tool record itself.
  // `newPhoto` holds a freshly captured/uploaded image pending save; `removePhoto`
  // marks the existing photo for deletion. ToolsPage.save() reads these off the
  // submitted object and turns them into the actual storage write + hasPhoto flag.
  const [newPhoto, setNewPhoto] = useState(null);
  const [removePhoto, setRemovePhoto] = useState(false);
  const [showCamera, setShowCamera] = useState(false);
  const fileInputRef = React.useRef(null);

  const [photoError, setPhotoError] = useState('');

  function resizeToDataUrl(file, cb) {
    setPhotoError('');
    // A blob URL (rather than a data: URL built by hand via FileReader) lets
    // the browser use its normal, full-featured image decoder — including
    // formats like HEIC straight off an iPhone/iPad camera roll, which often
    // fail to decode from a data URL even though the file itself is fine.
    const objectUrl = URL.createObjectURL(file);
    const img = new Image();
    img.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      console.error('failed to decode photo file — likely an unsupported format for this browser');
      setPhotoError('เบราว์เซอร์นี้แสดงตัวอย่างไฟล์รูปนี้ไม่ได้ (มักเกิดกับไฟล์ HEIC บางไฟล์) ลองกด "ถ่ายรูป" แทน หรือเลือกรูปที่เป็น JPG/PNG');
    };
    img.onload = () => {
      try {
        const maxW = 480;
        const scale = Math.min(1, maxW / (img.width || maxW));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round((img.width || maxW) * scale);
        canvas.height = Math.round((img.height || maxW) * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        cb(canvas.toDataURL('image/jpeg', 0.7));
      } catch (err) {
        console.error('failed to resize photo', err);
        setPhotoError('ประมวลผลรูปนี้ไม่สำเร็จ ลองเลือกรูปอื่น หรือถ่ายรูปใหม่แทน');
      } finally {
        URL.revokeObjectURL(objectUrl);
      }
    };
    img.src = objectUrl;
  }

  function handleFilePick(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = ''; // allow picking the same file again later
    if (!file) return;
    resizeToDataUrl(file, (dataUrl) => { setNewPhoto(dataUrl); setRemovePhoto(false); });
  }

  const showingExisting = !newPhoto && !removePhoto && form.hasPhoto;

  function submit(e) {
    e.preventDefault();
    onSave({ ...form, code: normalizeCode(form.code), _newPhoto: newPhoto, _removePhoto: removePhoto });
  }

  return (
    <>
    <form onSubmit={submit} className="modal-form">
      <div className="form-group">
        <label>รูปเครื่องมือ</label>
        <div className="tool-photo-row">
          {newPhoto ? (
            <img src={newPhoto} alt="" className="tool-photo-preview" />
          ) : showingExisting ? (
            <ToolPhotoThumb toolId={form.id} hasPhoto={true} size={64} version={form.photoUpdatedAt} />
          ) : (
            <div className="tool-photo-preview-empty"><ImageIcon size={20} /></div>
          )}
          <div className="tool-photo-actions">
            <div className="tool-photo-btn-row">
              <button type="button" className="btn btn-secondary" onClick={() => setShowCamera(true)}><Camera size={14} /> ถ่ายรูป</button>
              <button type="button" className="btn btn-secondary" onClick={() => fileInputRef.current?.click()}><ImageIcon size={14} /> เลือกรูป</button>
            </div>
            {newPhoto ? (
              <button type="button" className="link-btn" onClick={() => setNewPhoto(null)}>ล้างรูปที่เพิ่งเลือก</button>
            ) : showingExisting && (
              <button type="button" className="link-btn" onClick={() => setRemovePhoto(true)}>ลบรูปนี้</button>
            )}
            <input ref={fileInputRef} type="file" accept="image/*" style={{ display: 'none' }} onChange={handleFilePick} />
            {photoError && <p className="hint bad" style={{ margin: '2px 0 0' }}>{photoError}</p>}
          </div>
        </div>
        <p className="scanner-hint" style={{ margin: '6px 0 0' }}>รูปนี้จะแสดงให้เห็นตอนสแกนยืม-คืนเครื่องมือชิ้นนี้ เพื่อช่วยให้ผู้ยืมตรวจสอบว่าหยิบเครื่องมือถูกชิ้น</p>
      </div>
      <div className="form-group">
        <label>รหัสเครื่องมือ</label>
        <input className="mono" value={form.code} onChange={e => setForm({ ...form, code: normalizeCode(e.target.value) })} placeholder="เช่น PWR-005" />
      </div>
      <div className="form-group">
        <label>ชื่อเครื่องมือ</label>
        <input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="เช่น สว่านไฟฟ้า Bosch" />
      </div>
      <div className="form-group">
        <label>หมวดหมู่</label>
        <select value={form.category} onChange={e => setForm({ ...form, category: e.target.value })}>
          {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
        </select>
      </div>
      <div className="form-group">
        <label>คลังเครื่องมือ <span className="required-dot">*</span></label>
        {warehouses && warehouses.length ? (
          <select value={form.warehouseId || ''} onChange={e => setForm({ ...form, warehouseId: e.target.value, shelfId: '' })}>
            <option value="" disabled>เลือกคลังเครื่องมือ</option>
            {warehouses.map(w => <option key={w.id} value={w.id}>{w.name}</option>)}
          </select>
        ) : (
          <div className="hint bad">ยังไม่มีคลังเครื่องมือในระบบ กรุณาไปเพิ่มที่เมนู "คลังเครื่องมือ" ก่อน</div>
        )}
      </div>

      {shelves && (
        <div className="form-group">
          <label>วางที่ชั้น</label>
          {(() => {
            const shelfOptions = shelves.filter(s => s.warehouseId === form.warehouseId);
            if (!form.warehouseId) {
              return <div className="hint">เลือกคลังเครื่องมือก่อนจึงจะเลือกชั้นวางได้</div>;
            }
            if (!shelfOptions.length) {
              return <div className="hint">คลังนี้ยังไม่มีชั้นวาง — จะเพิ่มเครื่องมือแบบยังไม่จัดชั้น (ไปจัดเข้าชั้นทีหลังได้)</div>;
            }
            return (
              <select value={form.shelfId || ''} onChange={e => setForm({ ...form, shelfId: e.target.value })}>
                <option value="">ยังไม่จัดชั้น</option>
                {shelfOptions.map(s => {
                  const count = tools ? tools.filter(t => t.shelfId === s.id).length : null;
                  const full = count !== null && count >= SHELF_CAPACITY;
                  return (
                    <option key={s.id} value={s.id} disabled={full}>
                      {s.name}{count !== null ? ` (${count}/${SHELF_CAPACITY}${full ? ' — เต็ม' : ''})` : ''}
                    </option>
                  );
                })}
              </select>
            );
          })()}
        </div>
      )}

      <div className="loan-doc-block" style={{ marginTop: 4 }}>
        <div className="loan-doc-title"><FileSpreadsheet size={14} /> ข้อมูลสำหรับใบยืม-คืน (LBC-FM-034)</div>
        <div className="form-group">
          <label>เครื่องมือชิ้นนี้ต้องออกใบยืม-คืนเครื่องมือ (LBC-FM-034) หรือไม่?</label>
          <div className="wh-switch">
            <button type="button" className={`wh-switch-item ${!form.requiresLoanForm ? 'active' : ''}`} onClick={() => setForm({ ...form, requiresLoanForm: false })}>ไม่ต้องออกใบ</button>
            <button type="button" className={`wh-switch-item ${form.requiresLoanForm ? 'active' : ''}`} onClick={() => setForm({ ...form, requiresLoanForm: true })}>ต้องออกใบ</button>
          </div>
          <p className="scanner-hint" style={{ margin: '6px 0 0' }}>ถ้าไม่ต้องออกใบ ระบบจะข้ามขั้นตอนกรอกใบยืม-คืนไปเลยตอนสแกนยืม-คืนเครื่องมือชิ้นนี้</p>
        </div>
        {form.requiresLoanForm && (
          <>
            <p className="scanner-hint" style={{ margin: '2px 0 8px' }}>กรอกไว้ครั้งเดียวที่นี่ ระบบจะดึงไปกรอกในใบยืม-คืนให้อัตโนมัติทุกครั้งที่มีการยืมเครื่องมือชิ้นนี้ ไม่ต้องพิมพ์ซ้ำ</p>
            <div className="loan-doc-grid">
              <div className="form-group"><label>P/N</label><input value={form.partNo || ''} onChange={e => setForm({ ...form, partNo: e.target.value })} /></div>
              <div className="form-group"><label>S/N</label><input value={form.serialNo || ''} onChange={e => setForm({ ...form, serialNo: e.target.value })} /></div>
              <div className="form-group"><label>Calibration Date</label><input type="date" value={form.calibDate || ''} onChange={e => setForm({ ...form, calibDate: e.target.value })} /></div>
              <div className="form-group"><label>Calibration Due</label><input type="date" value={form.calibDue || ''} onChange={e => setForm({ ...form, calibDue: e.target.value })} /></div>
            </div>
          </>
        )}
      </div>

      <div className="form-actions">
        <button type="button" className="btn btn-secondary" onClick={onCancel}>ยกเลิก</button>
        <button type="submit" className="btn btn-primary" disabled={!warehouses || !warehouses.length}>บันทึก</button>
      </div>
    </form>
    {showCamera && (
      <PhotoCaptureModal
        title="ถ่ายรูปเครื่องมือ"
        hint="ถ่ายให้เห็นตัวเครื่องมือชัดเจน รูปนี้จะใช้เป็นรูปอ้างอิงตอนสแกนยืม-คืนเครื่องมือชิ้นนี้"
        onCapture={(dataUrl) => { setNewPhoto(dataUrl); setRemovePhoto(false); setPhotoError(''); setShowCamera(false); }}
        onClose={() => setShowCamera(false)}
      />
    )}
    </>
  );
}

/* ------------------- Calibration send / receive forms ------------------- */
function CalibrationSendForm({ tool, onSave, onCancel }) {
  const [sentAt, setSentAt] = useState(todayISO());
  const [note, setNote] = useState('');
  return (
    <form onSubmit={e => { e.preventDefault(); onSave({ sentAt, note }); }} className="modal-form">
      <div className="verify-block" style={{ background: 'var(--amber-tint)' }}>
        <div className="verify-tool-name">{tool.name}</div>
        <div className="verify-tool-code mono">{tool.code}</div>
      </div>
      <div className="form-group">
        <label>วันที่ส่ง Calibration <span className="req-star">*</span></label>
        <input type="date" required value={sentAt} onChange={e => setSentAt(e.target.value)} />
      </div>
      <div className="form-group">
        <label>หมายเหตุ / หน่วยงานที่ส่ง (ถ้ามี)</label>
        <textarea className="textarea" rows={2} value={note} onChange={e => setNote(e.target.value)} placeholder="เช่น ส่งศูนย์สอบเทียบ ABC" />
      </div>
      {(tool.calibDate || tool.calibDue) && (
