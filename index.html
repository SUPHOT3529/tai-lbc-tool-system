/* ---------------------------- Warehouse Page ---------------------------- */
function WarehousePage({ warehouses, setWarehouses, tools, toolStatus, showToast, addAudit, isMainAdmin, scopedWarehouseIds, isAdmin, shelves, setShelves, setTools, onSetCondition, onSetCalibration, tx, staff }) {
  const [modal, setModal] = useState(null); // {mode:'add'|'edit', data}
  const [exportingId, setExportingId] = useState(null);
  // Quick "register a new tool" shortcut, mirroring the Tools page's add flow,
  // so admins don't have to leave warehouse management just to register a
  // tool while they're already here setting up a shelf.
  const [addToolModal, setAddToolModal] = useState(false);
  const [newToolQr, setNewToolQr] = useState(null);
  // "เพิ่มเครื่องมือใหม่" now offers two tabs: fill in one tool by hand (the
  // existing ToolForm), or upload an Excel file of many at once. Bulk-added
  // tools always land unassigned in the chosen warehouse — shelf placement is
  // a deliberate follow-up step via each shelf's own "+ เพิ่มเครื่องมือ" picker,
  // not something this quick-add path decides on its own.
  const [addToolTab, setAddToolTab] = useState('form'); // 'form' | 'excel'
  const [bulkAddWarehouseId, setBulkAddWarehouseId] = useState('');
  const [bulkAddBusy, setBulkAddBusy] = useState(false);
  const [bulkSyncPreview, setBulkSyncPreview] = useState(null);
  const bulkAddFileRef = React.useRef(null);

  // Creating/deleting warehouses is a main-admin-only action (it's the thing
  // that defines what a secondary admin's scope even refers to) — a secondary
  // admin can still rename/annotate the warehouse(s) they were granted, but
  // never see or touch ones outside their scope.
  const visibleWarehouses = scopedWarehouseIds ? warehouses.filter(w => scopedWarehouseIds.includes(w.id)) : warehouses;

  function openAdd() { setModal({ mode: 'add', data: { name: '', note: '' } }); }
  function openEdit(w) { setModal({ mode: 'edit', data: { ...w } }); }

  // Same validation/uniqueness/photo rules as the Tools page's add flow —
  // kept as its own copy here (rather than sharing code across pages) so
  // this shortcut can't accidentally break tool editing if either one changes.
  async function saveNewTool(data) {
    const { _newPhoto, ...formData } = data;
    const code = normalizeCode(formData.code.trim());
    const name = formData.name.trim();
    if (!code || !name) return showToast('กรุณากรอกรหัสและชื่อเครื่องมือ', 'error');
    if (!formData.warehouseId) return showToast('กรุณาเลือกคลังเครื่องมือ', 'error');
    if (tools.some(t => t.code.trim().toLowerCase() === code.toLowerCase())) return showToast('รหัสนี้มีอยู่แล้ว', 'error');
    // Re-check shelf capacity against the current data (not just what the
    // dropdown showed when it was opened) — someone else could have filled,
    // or even deleted, the shelf in the meantime since this is shared,
    // real-time data. A shelfId pointing at a shelf that no longer exists
    // falls back to unassigned rather than being saved as a dangling
    // reference nothing could ever pick up again.
    let shelfId = formData.shelfId || null;
    let chosenShelf = shelfId ? shelves.find(s => s.id === shelfId) : null;
    if (shelfId && !chosenShelf) {
      shelfId = null;
      showToast('ชั้นที่เลือกไว้ถูกลบไปแล้ว — บันทึกเป็นเครื่องมือที่ยังไม่จัดชั้นแทน', 'error');
    } else if (chosenShelf) {
      const currentCount = tools.filter(t => t.shelfId === shelfId).length;
      if (currentCount >= SHELF_CAPACITY) {
        return showToast(`ชั้น "${chosenShelf.name}" เต็มแล้ว (${SHELF_CAPACITY}/${SHELF_CAPACITY}) กรุณาเลือกชั้นอื่น`, 'error');
      }
    }
    const newTool = { ...formData, code, name, shelfId, id: uid('T'), condition: 'normal', requiresLoanForm: !!formData.requiresLoanForm, hasPhoto: !!_newPhoto, photoUpdatedAt: _newPhoto ? Date.now() : undefined };
    try {
      if (_newPhoto) await storageSet(`toolcrib-photo:master:${newTool.id}`, _newPhoto, true);
      await setTools([newTool, ...tools]);
    } catch (err) {
      console.error('failed to save tool', err);
      return showToast('บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    const whName = warehouses.find(w => w.id === newTool.warehouseId)?.name || '-';
    const shelfNote = chosenShelf ? ` / ชั้น: ${chosenShelf.name}` : '';
    addAudit?.('tool_add', `${newTool.code} — ${newTool.name} (คลัง: ${whName}${shelfNote})`);
    showToast('เพิ่มเครื่องมือและสร้าง QR เรียบร้อย', 'success');
    setAddToolModal(false);
    setNewToolQr(newTool);
  }

  // Bulk sibling of saveNewTool for the "อัปโหลดไฟล์ Excel" tab — same
  // code-normalization and global-uniqueness rules, but every row always
  // lands unassigned (shelfId: null) in whichever warehouse was picked above
  // the upload button; placing them onto a shelf is a separate, deliberate
  // step afterward via that shelf's own picker, never decided by this file.
  // Parses the file and builds a preview (add/update/delete) — nothing is
  // saved yet. The uploaded file is treated as the full, authoritative list
  // for the chosen warehouse: any existing tool in that warehouse whose code
  // does NOT appear in the file is slated for deletion, unless it's currently
  // borrowed or overdue (deleting a tool mid-loan would corrupt that loan's
  // history, so those are protected and reported instead of silently gone).
  async function handleBulkAddExcel(e) {
    const file = e.target.files && e.target.files[0];
    if (bulkAddFileRef.current) bulkAddFileRef.current.value = '';
    if (!file) return;
    if (!bulkAddWarehouseId) { showToast('กรุณาเลือกคลังเครื่องมือก่อน', 'error'); return; }
    setBulkAddBusy(true);
    try {
      const buf = await file.arrayBuffer();
      const wbFile = XLSX.read(buf, { type: 'array' });
      const sheetName = wbFile.SheetNames.includes('รายการเครื่องมือ') ? 'รายการเครื่องมือ' : wbFile.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wbFile.Sheets[sheetName], { defval: '' });
      const seenInFile = new Set();
      const toAdd = [], toUpdate = [];
      const matchedExistingIds = new Set();
      let skipped = 0;
      rows.forEach(r => {
        const code = normalizeCode(String(r['รหัสเครื่องมือ'] || '').trim());
        const name = String(r['ชื่อเครื่องมือ'] || '').trim();
        if (!code || !name) { skipped++; return; }
        const key = code.toLowerCase();
        if (seenInFile.has(key)) { skipped++; return; }
        seenInFile.add(key);
        const catLabel = String(r['หมวดหมู่'] || '').trim();
        const matchedCat = CATEGORIES.find(c => c.label === catLabel);
        const existing = tools.find(t => t.code.toLowerCase() === key);
        // A code already used by a tool in a DIFFERENT warehouse is skipped
        // rather than silently relocated — moving warehouses needs to be a
        // deliberate edit, not a side-effect of this file.
        if (existing && existing.warehouseId !== bulkAddWarehouseId) { skipped++; return; }
        if (existing) {
          matchedExistingIds.add(existing.id);
          toUpdate.push({ id: existing.id, code, name, category: matchedCat?.id || existing.category });
        } else {
          toAdd.push({ code, name, category: matchedCat?.id || 'other' });
        }
      });
      const currentInWarehouse = tools.filter(t => t.warehouseId === bulkAddWarehouseId);
      const notInFile = currentInWarehouse.filter(t => !matchedExistingIds.has(t.id));
      const toDelete = [], protectedTools = [];
      notInFile.forEach(t => {
        const status = toolStatus(t.id);
        if (status === 'borrowed' || status === 'overdue') protectedTools.push(t);
        else toDelete.push(t);
      });
      if (!toAdd.length && !toUpdate.length && !toDelete.length) {
        setBulkAddBusy(false);
        return showToast('ไม่พบข้อมูลที่ใช้ได้ในไฟล์ — ตรวจสอบว่ามีคอลัมน์ "รหัสเครื่องมือ" และ "ชื่อเครื่องมือ"', 'error');
      }
      setBulkSyncPreview({ warehouseId: bulkAddWarehouseId, toAdd, toUpdate, toDelete, protectedTools, skipped });
    } catch (err) {
      console.error('failed to read excel for warehouse sync', err);
      showToast('อ่านไฟล์ไม่สำเร็จ กรุณาตรวจสอบว่าเป็นไฟล์ Excel ที่ถูกต้อง', 'error');
    }
    setBulkAddBusy(false);
  }

  // Commits the previewed sync — the one place tools actually get deleted by
  // this feature, and only after the admin has seen exactly what will happen
  // and pressed confirm.
  async function confirmBulkSync() {
    if (!bulkSyncPreview) return;
    const { warehouseId, toAdd, toUpdate, toDelete } = bulkSyncPreview;
    const updateMap = new Map(toUpdate.map(u => [u.id, u]));
    const deleteIds = new Set(toDelete.map(t => t.id));
    const nextTools = [
      ...tools.filter(t => !deleteIds.has(t.id)).map(t => updateMap.has(t.id)
        ? { ...t, code: updateMap.get(t.id).code, name: updateMap.get(t.id).name, category: updateMap.get(t.id).category }
        : t),
      ...toAdd.map(a => ({ id: uid('T'), code: a.code, name: a.name, category: a.category, warehouseId, shelfId: null, condition: 'normal', requiresLoanForm: false })),
    ];
    setBulkAddBusy(true);
    try {
      await setTools(nextTools);
      for (const t of toDelete) {
        if (t.hasPhoto) { try { await storageDelete(`toolcrib-photo:master:${t.id}`, true); } catch (err) { console.error('failed to clean up deleted tool photo', err); } }
      }
    } catch (err) {
      console.error('failed to sync warehouse tools from excel', err);
      setBulkAddBusy(false);
      return showToast('บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    setBulkAddBusy(false);
    const whName = warehouses.find(w => w.id === warehouseId)?.name || '-';
    const protectedNote = bulkSyncPreview.protectedTools.length ? `, ป้องกันไว้ ${bulkSyncPreview.protectedTools.length} (กำลังถูกยืมอยู่ ไม่ลบ)` : '';
    addAudit?.('warehouse_import', `${whName}: แทนที่ข้อมูลด้วยไฟล์ Excel — เพิ่ม ${toAdd.length}, อัปเดต ${toUpdate.length}, ลบ ${toDelete.length}${protectedNote}`);
    showToast(`แทนที่ข้อมูลคลัง "${whName}" เรียบร้อย (เพิ่ม ${toAdd.length}, อัปเดต ${toUpdate.length}, ลบ ${toDelete.length})`, 'success');
    setBulkSyncPreview(null);
    setAddToolModal(false);
  }

  async function save(data) {
    if (!data.name.trim()) return showToast('กรุณากรอกชื่อคลังเครื่องมือ', 'error');
    if (modal.mode === 'add' && !isMainAdmin) return showToast('มีแต่แอดมินหลักเท่านั้นที่เพิ่มคลังใหม่ได้', 'error');
    try {
      if (modal.mode === 'add') {
        const cleanName = data.name.trim();
        if (warehouses.some(w => w.name.trim().toLowerCase() === cleanName.toLowerCase())) return showToast('มีชื่อคลังนี้อยู่แล้ว', 'error');
        const newWh = { id: uid('WH'), name: cleanName, note: (data.note || '').trim() };
        await setWarehouses([newWh, ...warehouses]);
        addAudit?.('warehouse_add', newWh.name);
        showToast('เพิ่มคลังเครื่องมือเรียบร้อย', 'success');
      } else {
        const cleanName = data.name.trim();
        if (warehouses.some(w => w.id !== data.id && w.name.trim().toLowerCase() === cleanName.toLowerCase())) {
          return showToast('มีชื่อคลังนี้อยู่แล้ว', 'error');
        }
        await setWarehouses(warehouses.map(w => w.id === data.id ? { ...w, name: cleanName, note: (data.note || '').trim() } : w));
        addAudit?.('warehouse_edit', cleanName);
        showToast('บันทึกการแก้ไขเรียบร้อย', 'success');
      }
    } catch (err) {
      console.error('failed to save warehouse', err);
      return showToast('บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    setModal(null);
  }

  async function remove(w) {
    if (!isMainAdmin) return showToast('มีแต่แอดมินหลักเท่านั้นที่ลบคลังได้', 'error');
    if (tools.some(t => t.warehouseId === w.id)) return showToast('ยังมีเครื่องมืออยู่ในคลังนี้ ย้ายออกก่อนจึงจะลบได้', 'error');
    // A warehouse can have zero tools but still have shelves left in it (e.g.
    // empty shelves someone set up, possibly with a photo already attached) —
    // without cleaning those up too, they'd become permanently orphaned:
    // still in storage, but unreachable from the UI since their warehouse tab
    // is gone, so nothing could ever surface them for cleanup again.
    const orphanedShelves = shelves.filter(s => s.warehouseId === w.id);
    try {
      await setWarehouses(warehouses.filter(x => x.id !== w.id));
    } catch (err) {
      console.error('failed to delete warehouse', err);
      return showToast('ลบไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    if (orphanedShelves.length) {
      try {
        await setShelves(shelves.filter(s => s.warehouseId !== w.id));
        for (const s of orphanedShelves) {
          if (s.hasPhoto) await storageDelete(`toolcrib-photo:shelf:${s.id}`, true);
        }
      } catch (err) {
        console.error('failed to clean up deleted warehouse\'s shelves', err);
      }
    }
    addAudit?.('warehouse_delete', w.name);
    showToast('ลบคลังเครื่องมือเรียบร้อย', 'success');
  }

  async function doExportPDF(w, list) {
    setExportingId(w.id + ':pdf');
    try {
      await exportToolsPDF(list, warehouses, toolStatus, w.name, w.name, shelves);
      addAudit?.('warehouse_export', `ส่งออก PDF คลัง ${w.name} (${list.length} รายการ)`);
      showToast(`ส่งออก PDF คลัง "${w.name}" เรียบร้อย`, 'success');
    } catch (e) {
      showToast('ส่งออก PDF ไม่สำเร็จ กรุณาลองใหม่', 'error');
    }
    setExportingId(null);
  }

  function doExportExcel(w, list) {
    exportToolsExcel(list, warehouses, toolStatus, w.name, shelves);
    addAudit?.('warehouse_export', `ส่งออก Excel คลัง ${w.name} (${list.length} รายการ)`);
    showToast(`ส่งออก Excel คลัง "${w.name}" เรียบร้อย`, 'success');
  }

  return (
    <div className="page-stack">
      <section className="panel">
        <div className="toolbar">
          <div className="panel-head" style={{ margin: 0, flex: 1 }}>
            <h2><Building2 size={16} /> คลังเครื่องมือ</h2>
            <p>กำหนดคลัง/ห้องเก็บเครื่องมือ เพื่อแยกการจัดการและส่งออกข้อมูลเป็นรายคลัง</p>
          </div>
          <button className="btn btn-primary" onClick={openAdd} disabled={!isMainAdmin} title={isMainAdmin ? '' : 'มีแต่แอดมินหลักเท่านั้นที่เพิ่ม/ลบคลังได้'}><Plus size={16} /> เพิ่มคลัง</button>
        </div>

        <div className="warehouse-grid">
          {visibleWarehouses.map(w => {
            const list = tools.filter(t => t.warehouseId === w.id);
            const available = list.filter(t => toolStatus(t.id) === 'available').length;
            return (
              <div key={w.id} className="warehouse-card">
                <div className="warehouse-card-head">
                  <div className="warehouse-card-icon"><Building2 size={18} /></div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div className="warehouse-card-name">{w.name}</div>
                    {w.note && <div className="muted" style={{ fontSize: 12 }}>{w.note}</div>}
                  </div>
                  <div className="row-actions">
                    <button className="icon-btn" onClick={() => openEdit(w)}><Pencil size={15} /></button>
                    {isMainAdmin && <button className="icon-btn danger" onClick={() => remove(w)}><Trash2 size={15} /></button>}
                  </div>
                </div>
                <div className="warehouse-card-stats">
                  <span><b>{list.length}</b> รายการทั้งหมด</span>
                  <span><b>{available}</b> พร้อมใช้งาน</span>
                </div>
                <div className="warehouse-card-actions">
                  <button className="btn btn-secondary" onClick={() => doExportExcel(w, list)}>
                    <FileSpreadsheet size={14} /> Excel
                  </button>
                  <button className="btn btn-secondary" disabled={exportingId === w.id + ':pdf'} onClick={() => doExportPDF(w, list)}>
                    {exportingId === w.id + ':pdf' ? <Loader2 className="spin" size={14} /> : <Download size={14} />} PDF
                  </button>
                </div>
              </div>
            );
          })}
          {!visibleWarehouses.length && (
            <div className="empty-state">
              {isMainAdmin ? 'ยังไม่มีคลังเครื่องมือ กด "เพิ่มคลัง" เพื่อเริ่มต้น' : 'คุณยังไม่ได้รับสิทธิ์ดูแลคลังใด กรุณาติดต่อแอดมินหลัก'}
            </div>
          )}
        </div>
      </section>

      <WarehouseShadowBoard tools={tools} warehouses={visibleWarehouses} scopedWarehouseIds={scopedWarehouseIds} shelves={shelves} setShelves={setShelves}
        setTools={setTools} toolStatus={toolStatus} isAdmin={isAdmin} showToast={showToast} addAudit={addAudit}
        onAddTool={() => { setAddToolTab('form'); setBulkAddWarehouseId(''); setBulkSyncPreview(null); setAddToolModal(true); }}
        onSetCondition={onSetCondition} onSetCalibration={onSetCalibration} tx={tx} staff={staff} />

      {modal && (
        <Modal title={modal.mode === 'add' ? 'เพิ่มคลังเครื่องมือใหม่' : 'แก้ไขคลังเครื่องมือ'} onClose={() => setModal(null)}>
          <WarehouseForm data={modal.data} onSave={save} onCancel={() => setModal(null)} />
        </Modal>
      )}

      {addToolModal && !bulkSyncPreview && (
        <Modal title="เพิ่มเครื่องมือใหม่" onClose={() => setAddToolModal(false)}>
          <div className="wh-switch" style={{ marginBottom: 14 }}>
            <button type="button" className={`wh-switch-item ${addToolTab === 'form' ? 'active' : ''}`} onClick={() => setAddToolTab('form')}>กรอกทีละชิ้น</button>
            <button type="button" className={`wh-switch-item ${addToolTab === 'excel' ? 'active' : ''}`} onClick={() => setAddToolTab('excel')}>อัปโหลดไฟล์ Excel (หลายชิ้น)</button>
          </div>

          {addToolTab === 'form' ? (
            <ToolForm
              data={{ code: '', name: '', category: 'hand', warehouseId: visibleWarehouses[0]?.id || '', shelfId: '' }}
              onSave={saveNewTool}
              onCancel={() => setAddToolModal(false)}
              warehouses={visibleWarehouses}
              shelves={shelves}
              tools={tools}
            />
          ) : (
            <div className="modal-form">
              <div className="form-group">
                <label>คลังเครื่องมือ <span className="required-dot">*</span></label>
                {visibleWarehouses.length ? (
                  <select value={bulkAddWarehouseId || visibleWarehouses[0]?.id || ''} onChange={e => setBulkAddWarehouseId(e.target.value)}>
                    {visibleWarehouses.map(w => <option key={w.id} value={w.id}>{w.name}</option>)}
                  </select>
                ) : (
                  <div className="hint bad">ยังไม่มีคลังเครื่องมือในระบบ กรุณาไปเพิ่มที่เมนู "คลังเครื่องมือ" ก่อน</div>
                )}
              </div>
              <p className="scanner-hint" style={{ margin: '0 0 4px', fontWeight: 600, color: 'var(--danger)' }}>
                ⚠️ ไฟล์นี้จะกลายเป็นรายการที่ถูกต้องของคลังที่เลือกทั้งหมด — เครื่องมือเดิมในคลังนี้ที่ "ไม่มี" อยู่ในไฟล์จะถูกลบออกจากระบบ (ยกเว้นตัวที่กำลังถูกยืมอยู่ จะไม่ถูกลบ) ระบบจะให้ตรวจสอบก่อนยืนยันอีกครั้ง
              </p>
              <p className="scanner-hint" style={{ margin: '0 0 4px' }}>
                ไฟล์ต้องมีคอลัมน์ "รหัสเครื่องมือ" และ "ชื่อเครื่องมือ" — ใส่คอลัมน์ "หมวดหมู่" เพิ่มได้ (ไม่ใส่ก็ได้ จะเข้าเป็น "อื่นๆ") เครื่องมือใหม่ที่เพิ่มจะเข้าไปอยู่ที่ "ยังไม่จัดชั้น" ก่อน แล้วค่อยไปเลือกจัดเข้าชั้นทีหลังได้จากปุ่ม "เพิ่มเครื่องมือ" ที่การ์ดแต่ละชั้น
              </p>
              <div className="form-actions">
                <button type="button" className="btn btn-secondary" onClick={() => setAddToolModal(false)}>ยกเลิก</button>
                <button type="button" className="btn btn-primary" style={{ flex: 1, justifyContent: 'center' }}
                  disabled={bulkAddBusy || !visibleWarehouses.length} onClick={() => bulkAddFileRef.current?.click()}>
                  {bulkAddBusy ? <Loader2 size={15} className="spin" /> : <Upload size={15} />} {bulkAddBusy ? 'กำลังอ่านไฟล์…' : 'เลือกไฟล์ Excel'}
                </button>
                <input ref={bulkAddFileRef} type="file" accept=".xlsx,.xls" style={{ display: 'none' }} onChange={handleBulkAddExcel} />
              </div>
            </div>
          )}
        </Modal>
      )}

      {bulkSyncPreview && (
        <Modal title="ตรวจสอบก่อนแทนที่ข้อมูลคลัง" onClose={() => setBulkSyncPreview(null)}>
          <div className="confirm-summary">
            <div className="confirm-row"><span className="confirm-label">คลัง</span><span className="confirm-value">{warehouses.find(w => w.id === bulkSyncPreview.warehouseId)?.name || '-'}</span></div>
            <div className="confirm-row"><span className="confirm-label">รายการใหม่ที่จะเพิ่ม</span><span className="confirm-value">{bulkSyncPreview.toAdd.length}</span></div>
            <div className="confirm-row"><span className="confirm-label">รายการเดิมที่จะอัปเดต</span><span className="confirm-value">{bulkSyncPreview.toUpdate.length}</span></div>
            <div className="confirm-row"><span className="confirm-label" style={{ color: 'var(--danger)' }}>รายการที่จะถูกลบ</span><span className="confirm-value" style={{ color: 'var(--danger)' }}>{bulkSyncPreview.toDelete.length}</span></div>
            {bulkSyncPreview.protectedTools.length > 0 && (
              <div className="confirm-row"><span className="confirm-label">ป้องกันไว้ (กำลังถูกยืมอยู่ ไม่ลบ)</span><span className="confirm-value">{bulkSyncPreview.protectedTools.length}</span></div>
            )}
            {bulkSyncPreview.skipped > 0 && (
              <div className="confirm-row"><span className="confirm-label">แถวที่ข้าม (มีปัญหา)</span><span className="confirm-value">{bulkSyncPreview.skipped}</span></div>
            )}
          </div>
          {bulkSyncPreview.toDelete.length > 0 && (
            <div className="import-error-list">
              <p className="muted" style={{ fontSize: 11.5, margin: '0 0 4px', fontWeight: 600 }}>รายการที่จะถูกลบ:</p>
              {bulkSyncPreview.toDelete.slice(0, 15).map(t => (
                <div key={t.id} className="import-error-row">{t.code} — {t.name}</div>
              ))}
              {bulkSyncPreview.toDelete.length > 15 && <div className="muted" style={{ fontSize: 11 }}>และอีก {bulkSyncPreview.toDelete.length - 15} รายการ…</div>}
            </div>
          )}
          {bulkSyncPreview.protectedTools.length > 0 && (
            <p className="scanner-hint" style={{ marginTop: 8 }}>
              {bulkSyncPreview.protectedTools.length} รายการที่ไม่มีในไฟล์แต่กำลังถูกยืมอยู่ — ระบบจะไม่ลบให้อัตโนมัติ ต้องรอให้คืนก่อนแล้วค่อยลบเองทีหลังถ้ายังต้องการ
            </p>
          )}
          <div className="form-actions" style={{ marginTop: 10 }}>
            <button type="button" className="btn btn-secondary" disabled={bulkAddBusy} onClick={() => setBulkSyncPreview(null)}>ย้อนกลับ</button>
            <button type="button" className="btn btn-danger" style={{ flex: 1, justifyContent: 'center' }} disabled={bulkAddBusy} onClick={confirmBulkSync}>
              {bulkAddBusy ? <Loader2 size={15} className="spin" /> : null} ยืนยันแทนที่ข้อมูล
            </button>
          </div>
        </Modal>
      )}

      {newToolQr && (
        <QrCodeModal value={newToolQr.id} title={`QR เครื่องมือ: ${newToolQr.code}`} subtitle={newToolQr.name} fileName={`QR-${newToolQr.code}`} onClose={() => setNewToolQr(null)} />
      )}
    </div>
  );
}

function WarehouseForm({ data, onSave, onCancel }) {
  const [form, setForm] = useState(data);
  return (
    <form onSubmit={e => { e.preventDefault(); onSave(form); }} className="modal-form">
      <div className="form-group">
        <label>ชื่อคลังเครื่องมือ</label>
        <input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="เช่น TOOL ROOM 4" />
      </div>
      <div className="form-group">
        <label>หมายเหตุ / ตำแหน่งที่ตั้ง (ถ้ามี)</label>
        <input value={form.note} onChange={e => setForm({ ...form, note: e.target.value })} placeholder="เช่น อาคาร A ชั้น 2" />
      </div>
      <div className="form-actions">
        <button type="button" className="btn btn-secondary" onClick={onCancel}>ยกเลิก</button>
        <button type="submit" className="btn btn-primary">บันทึก</button>
      </div>
    </form>
  );
}

/* ---------------------------- Staff Page ---------------------------- */
function StaffPage({ staff, setStaff, tx, showToast, users, setUsers, addAudit, warehouses, isMainAdmin }) {
  const [q, setQ] = useState('');
  const [modal, setModal] = useState(null);
  const [qrStaff, setQrStaff] = useState(null);
  const filtered = staff.filter(s => s.name.toLowerCase().includes(q.toLowerCase()) || s.code.toLowerCase().includes(q.toLowerCase()));

  function openAdd() {
    setModal({ mode: 'add', data: { code: '', name: '', dept: DEPT_OPTIONS[0], password: '', confirmPassword: '', signature: '', role: 'staff', warehouseScope: [] } });
  }
  function openEdit(s) {
    const linkedUser = users.find(u => u.staffId === s.id);
    setModal({
      mode: 'edit',
      data: {
        ...s, newPassword: '', confirmNewPassword: '', hasAccount: !!linkedUser,
        signature: s.signature || '',
        role: linkedUser?.role || 'staff',
        warehouseScope: linkedUser?.warehouseScope || [],
      }
    });
  }

  async function save(data) {
    const { _newPhoto, _removePhoto, ...rest } = data;
    const codeTrimmed = rest.code.trim();
    const nameTrimmed = rest.name.trim();
    if (!codeTrimmed || !nameTrimmed) return showToast('กรุณากรอกรหัสและชื่อ', 'error');
    // Defense in depth: only the main "Admin" account may ever grant the admin
    // role or a warehouse scope, no matter what the submitted form data says —
    // StaffForm already hides these controls from everyone else, but a
    // non-main-admin's submission is forced back to a plain staff account here too.
    const requestedRole = (isMainAdmin && rest.role === 'admin') ? 'admin' : 'staff';
    const requestedScope = requestedRole === 'admin' ? (rest.warehouseScope || []) : undefined;
    const signatureTrimmed = (rest.signature || '').trim();
    if (modal.mode === 'add') {
      if (staff.some(s => s.code.trim().toLowerCase() === codeTrimmed.toLowerCase())) return showToast('รหัสพนักงานนี้มีอยู่แล้ว', 'error');
      if (!rest.password || rest.password.length < 4) return showToast('กรุณาตั้งรหัสผ่านเข้าใช้งานอย่างน้อย 4 ตัวอักษร', 'error');
      if (rest.password !== rest.confirmPassword) return showToast('รหัสผ่านยืนยันไม่ตรงกัน', 'error');
      // Same principle as tools: QR is tied to the stable internal id, generated once here.
      const newStaff = {
        id: uid('S'), code: codeTrimmed, name: nameTrimmed, dept: rest.dept, signature: signatureTrimmed,
        hasPhoto: !!_newPhoto, ...( _newPhoto ? { photoUpdatedAt: Date.now() } : {}),
      };
      const newUser = {
        id: uid('U'), username: newStaff.code, passwordHash: await hashPassword(rest.password),
        role: requestedRole, staffId: newStaff.id, signature: signatureTrimmed,
        ...(requestedScope !== undefined ? { warehouseScope: requestedScope } : {}),
      };
      try {
        if (_newPhoto) await storageSet(`toolcrib-photo:staff:${newStaff.id}`, _newPhoto, true);
        await setStaff([newStaff, ...staff]);
        await setUsers([newUser, ...users]);
      } catch (err) {
        console.error('failed to save new staff/account', err);
        return showToast('บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่ (บัญชีเข้าระบบอาจยังไม่ถูกสร้าง)', 'error');
      }
      addAudit?.('staff_add', `${newStaff.code} — ${newStaff.name}${requestedRole === 'admin' ? ` (แอดมินเสริม — ดูแล ${requestedScope.length} คลัง)` : ''}`);
      showToast(`เพิ่มผู้ใช้งาน สร้างบัญชีเข้าระบบ และสร้าง QR บัตรเรียบร้อย${requestedRole === 'admin' ? ' (ตั้งเป็นแอดมินเสริมแล้ว)' : ''}`, 'success');
      setModal(null);
      setQrStaff(newStaff);
      return;
    } else {
      // The staff code doubles as the login username, so a duplicate here would
      // make logins ambiguous (login picks the first matching account).
      if (staff.some(s => s.id !== rest.id && s.code.trim().toLowerCase() === codeTrimmed.toLowerCase())) {
        return showToast('รหัสพนักงานนี้มีอยู่แล้วในบัญชีอื่น', 'error');
      }
      if (users.some(u => u.staffId !== rest.id && u.username.trim().toLowerCase() === codeTrimmed.toLowerCase())) {
        return showToast('รหัสนี้ถูกใช้เป็นชื่อผู้ใช้งานของบัญชีอื่นแล้ว', 'error');
      }
      const prevStaff = staff.find(s => s.id === rest.id);
      const nextHasPhoto = _newPhoto ? true : (_removePhoto ? false : !!prevStaff?.hasPhoto);
      const cleanStaff = {
        id: rest.id, code: codeTrimmed, name: nameTrimmed, dept: rest.dept, signature: signatureTrimmed,
        hasPhoto: nextHasPhoto,
        photoUpdatedAt: (_newPhoto || _removePhoto) ? Date.now() : prevStaff?.photoUpdatedAt,
      };
      const existingUser = users.find(u => u.staffId === rest.id);
      let nextUsers;
      let passwordChanged = false;
      if (existingUser) {
        // username tracks the employee code, so keep it in sync on the linked account.
        // Only the main admin's edit can change role/warehouseScope — for anyone
        // else's edit these two fields are left exactly as they already were on
        // the account, regardless of what the (hidden, for them) form fields say.
        const roleUpdate = isMainAdmin ? { role: requestedRole, ...(requestedScope !== undefined ? { warehouseScope: requestedScope } : { warehouseScope: undefined }) } : {};
        nextUsers = users.map(u => u.staffId === rest.id ? { ...u, username: cleanStaff.code, signature: signatureTrimmed, ...roleUpdate } : u);
        if (rest.newPassword) {
          if (rest.newPassword.length < 4) return showToast('รหัสผ่านใหม่ต้องมีอย่างน้อย 4 ตัวอักษร', 'error');
          if (rest.newPassword !== rest.confirmNewPassword) return showToast('รหัสผ่านยืนยันไม่ตรงกัน', 'error');
          const newHash = await hashPassword(rest.newPassword);
          nextUsers = nextUsers.map(u => u.staffId === rest.id ? { ...u, passwordHash: newHash, failedAttempts: 0, lockedUntil: null } : u);
          passwordChanged = true;
        }
      } else {
        // This staff record has no linked login account (e.g. left over from an
        // earlier data issue) — create one now instead of silently doing nothing.
        if (!rest.newPassword || rest.newPassword.length < 4) {
          return showToast('บัญชีนี้ยังไม่มีรหัสผ่านเข้าระบบ กรุณาตั้งรหัสผ่านอย่างน้อย 4 ตัวอักษรเพื่อสร้างบัญชีให้', 'error');
        }
        if (rest.newPassword !== rest.confirmNewPassword) return showToast('รหัสผ่านยืนยันไม่ตรงกัน', 'error');
        const newHash = await hashPassword(rest.newPassword);
        nextUsers = [...users, {
          id: uid('U'), username: cleanStaff.code, passwordHash: newHash, role: requestedRole, staffId: cleanStaff.id,
          signature: signatureTrimmed, ...(requestedScope !== undefined ? { warehouseScope: requestedScope } : {}),
        }];
        passwordChanged = true;
      }
      try {
        if (_newPhoto) await storageSet(`toolcrib-photo:staff:${rest.id}`, _newPhoto, true);
        if (_removePhoto) await storageDelete(`toolcrib-photo:staff:${rest.id}`, true);
        await setStaff(staff.map(s => s.id === rest.id ? cleanStaff : s));
        await setUsers(nextUsers);
      } catch (err) {
        console.error('failed to save staff edit', err);
        return showToast('บันทึกไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
      }
      addAudit?.('staff_edit', `${cleanStaff.code} — ${cleanStaff.name}${passwordChanged ? (existingUser ? ' (แอดมินตั้งรหัสผ่านใหม่ให้)' : ' (สร้างบัญชีเข้าระบบใหม่)') : ''}`);
      showToast(passwordChanged && !existingUser ? 'บันทึกการแก้ไขและสร้างบัญชีเข้าระบบเรียบร้อยแล้ว' : 'บันทึกการแก้ไขเรียบร้อย (QR เดิมยังใช้งานได้)', 'success');
    }
    setModal(null);
  }

  async function remove(s) {
    const linkedUser = users.find(u => u.staffId === s.id);
    if (linkedUser?.role === 'admin' && !isMainAdmin) {
      return showToast('มีแต่แอดมินหลักเท่านั้นที่ลบบัญชีแอดมินได้', 'error');
    }
    if (tx.some(t => t.staffId === s.id && !t.returnDate)) return showToast('ไม่สามารถลบผู้ใช้งานที่มีเครื่องมือค้างคืนได้', 'error');
    try {
      await setStaff(staff.filter(x => x.id !== s.id));
      await setUsers(users.filter(u => u.staffId !== s.id));
    } catch (err) {
      console.error('failed to delete staff', err);
      return showToast('ลบไม่สำเร็จ เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาลองใหม่', 'error');
    }
    // Best-effort cleanup — the staff record is already gone, so a hiccup here
    // shouldn't read as "delete failed".
    if (s.hasPhoto) {
      try { await storageDelete(`toolcrib-photo:staff:${s.id}`, true); }
      catch (err) { console.error('failed to clean up deleted staff photo', err); }
    }
    addAudit?.('staff_delete', `${s.code} — ${s.name}`);
    showToast('ลบผู้ใช้งาน ยกเลิกบัญชีเข้าระบบ และ QR บัตรที่ผูกไว้เรียบร้อย', 'success');
  }

  return (
    <div className="page-stack">
      <section className="panel">
        <div className="toolbar">
          <div className="search-box">
            <Search size={16} />
            <input placeholder="ค้นหาชื่อหรือรหัสพนักงาน…" value={q} onChange={e => setQ(e.target.value)} />
          </div>
          <button className="btn btn-primary" onClick={openAdd}><Plus size={16} /> เพิ่มผู้ใช้งาน</button>
        </div>
        <div className="table-wrap">
          <table>
            <thead><tr><th>รหัสพนักงาน</th><th>ชื่อ-สกุล</th><th>สังกัด</th><th>บทบาท</th><th>เครื่องมือค้างคืน</th><th>บัญชีเข้าระบบ</th><th></th></tr></thead>
            <tbody>
              {filtered.map(s => {
                const open = tx.filter(t => t.staffId === s.id && !t.returnDate).length;
                const linkedUser = users.find(u => u.staffId === s.id);
                const hasAccount = !!linkedUser;
                return (
                  <tr key={s.id}>
                    <td className="mono">{s.code}</td>
                    <td>{s.name}</td>
                    <td>{s.dept}</td>
                    <td>
                      {linkedUser?.role === 'admin' ? (
                        <span className="badge purple" title={linkedUser.warehouseScope?.length ? `ดูแล: ${linkedUser.warehouseScope.map(id => warehouses.find(w => w.id === id)?.name).filter(Boolean).join(', ')}` : 'ยังไม่ได้กำหนดคลังที่ดูแล'}>
                          แอดมินเสริม{linkedUser.warehouseScope ? ` (${linkedUser.warehouseScope.length} คลัง)` : ''}
                        </span>
                      ) : <span className="badge steel-badge">พนักงาน</span>}
                    </td>
                    <td>{open > 0 ? <span className="badge warning">{open} รายการ</span> : <span className="badge success">ไม่มี</span>}</td>
                    <td>{hasAccount ? <span className="badge success">ใช้งานได้</span> : <span className="badge danger">ยังล็อกอินไม่ได้</span>}</td>
                    <td className="row-actions">
                      <button className="icon-btn" title="ดู/พิมพ์ QR บัตร" onClick={() => setQrStaff(s)}><QrCode size={15} /></button>
                      <button className="icon-btn" onClick={() => openEdit(s)}><Pencil size={15} /></button>
                      <button className="icon-btn danger" onClick={() => remove(s)}><Trash2 size={15} /></button>
                    </td>
                  </tr>
                );
              })}
              {!filtered.length && <tr><td colSpan={7} className="empty-state">ไม่พบผู้ใช้งานที่ค้นหา</td></tr>}
            </tbody>
          </table>
        </div>
      </section>

      {modal && (
        <Modal title={modal.mode === 'add' ? 'เพิ่มผู้ใช้งานใหม่' : 'แก้ไขผู้ใช้งาน'} onClose={() => setModal(null)}>
          <StaffForm mode={modal.mode} data={modal.data} onSave={save} onCancel={() => setModal(null)} warehouses={warehouses} isMainAdmin={isMainAdmin} />
        </Modal>
      )}

      {qrStaff && (
        <QrCodeModal
          value={qrStaff.id}
          title={`QR บัตรพนักงาน: ${qrStaff.code}`}
          subtitle={`${qrStaff.name} · ${qrStaff.dept}`}
          fileName={`QR-${qrStaff.code}`}
          onClose={() => setQrStaff(null)}
        />
      )}
    </div>
  );
}

function StaffForm({ mode, data, onSave, onCancel, warehouses, isMainAdmin }) {

  const isAdminRole = form.role === 'admin';
  // Transient photo state (same pattern as ToolForm) — StaffPage.save() reads
  // these off the submitted object and turns them into the actual storage
  // write plus the hasPhoto flag.
  const [newPhoto, setNewPhoto] = useState(null);
  const [removePhoto, setRemovePhoto] = useState(false);
  const [showCamera, setShowCamera] = useState(false);
  const [photoError, setPhotoError] = useState('');
  const photoFileRef = React.useRef(null);
  const showingExistingPhoto = !newPhoto && !removePhoto && form.hasPhoto;

  function pickStaffPhoto(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setPhotoError('');
    const objectUrl = URL.createObjectURL(file);
    const img = new Image();
    img.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      setPhotoError('เบราว์เซอร์นี้แสดงตัวอย่างไฟล์รูปนี้ไม่ได้ (มักเกิดกับไฟล์ HEIC บางไฟล์) ลองกด "ถ่ายรูป" แทน หรือเลือกรูปที่เป็น JPG/PNG');
    };
    img.onload = () => {
      try {
        // Square crop from the center — this is shown as a small circular
        // avatar, so a square source keeps faces centered instead of squashed.
        const size = 320;
        const side = Math.min(img.width, img.height);
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        canvas.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
        setNewPhoto(canvas.toDataURL('image/jpeg', 0.75));
        setRemovePhoto(false);
      } catch (err) {
        console.error('failed to process staff photo', err);
        setPhotoError('ประมวลผลรูปนี้ไม่สำเร็จ ลองเลือกรูปอื่น หรือถ่ายรูปใหม่แทน');
      } finally {
        URL.revokeObjectURL(objectUrl);
      }
    };
    img.src = objectUrl;
  }

  function toggleWarehouse(id) {
    setForm(f => ({
      ...f,
      warehouseScope: (f.warehouseScope || []).includes(id)
        ? f.warehouseScope.filter(x => x !== id)
        : [...(f.warehouseScope || []), id],
    }));

    <>
    <form onSubmit={e => { e.preventDefault(); onSave({ ...form, _newPhoto: newPhoto, _removePhoto: removePhoto }); }} className="modal-form">

          <div className="tool-photo-actions">

            </div>
            {(newPhoto || showingExistingPhoto) && (
              newPhoto
                ? <button type="button" className="link-btn" onClick={() => setNewPhoto(null)}>ล้างรูปที่เพิ่งเลือก</button>

            )}
            <input ref={photoFileRef} type="file" accept="image/*" style={{ display: 'none' }} onChange={pickStaffPhoto} />
            {photoError && <p className="hint bad" style={{ margin: '2px 0 0' }}>{photoError}</p>}
          </div>
        </div>
        <p className="muted" style={{ fontSize: 11.5, margin: '6px 0 0' }}>
          รูปนี้จะแสดงที่มุมขวาบนของหน้าจอเมื่อผู้ใช้คนนี้เข้าสู่ระบบ
        </p>
      </div>
      <div className="form-group">
        <label>รหัสพนักงาน (ใช้เป็นชื่อผู้ใช้งานเข้าระบบด้วย)</label>
        <input className="mono" value={form.code} onChange={e => setForm({ ...form, code: e.target.value })} placeholder="เช่น EMP-1005" />
      </div>
      <div className="form-group">
        <label>ชื่อ-สกุล</label>
        <input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="เช่น สมหญิง รักงาน" />
      </div>
      <div className="form-group">
        <label>สังกัด</label>
        <select value={form.dept || ''} onChange={e => setForm({ ...form, dept: e.target.value })}>
          <option value="">เลือกสังกัด</option>
          {DEPT_OPTIONS.map(d => <option key={d} value={d}>{d}</option>)}

          {form.dept && !DEPT_OPTIONS.includes(form.dept) && <option value={form.dept}>{form.dept} (ค่าเดิม)</option>}
        </select>

      <div className="form-group">
        <label>ลายเซ็น (สำหรับใบยืม-คืน LBC-FM-034)</label>

            </p>
          </div>
          {isAdminRole && (
            <div className="form-group">
              <label>ขอบเขตคลังที่ดูแล</label>
              {warehouses && warehouses.length ? (
                <div className="shelf-pick-list">
                  {warehouses.map(w => (
                    <label key={w.id} className={`shelf-pick-row ${(form.warehouseScope || []).includes(w.id) ? 'checked' : ''}`}>
                      <input type="checkbox" checked={(form.warehouseScope || []).includes(w.id)} onChange={() => toggleWarehouse(w.id)} />
                      <span>{w.name}</span>
                    </label>
                  ))}
                </div>
              ) : (
                <div className="hint bad">ยังไม่มีคลังเครื่องมือในระบบ</div>
              )}
              <p className="muted" style={{ fontSize: 11.5, margin: '4px 0 0' }}>
                {(form.warehouseScope || []).length === 0

// Fetches and shows a staff member's registered photo — same fetch-on-demand
// pattern as ToolPhotoThumb/ShelfPhotoThumb, with its own storage-key
// namespace so staff photos never collide with tool or shelf photos.
function StaffPhotoThumb({ staffId, hasPhoto, size, version }) {
  const [src, setSrc] = useState(null);
  const [state, setState] = useState(hasPhoto ? 'loading' : 'empty');
  useEffect(() => {
    let cancelled = false;
    if (!hasPhoto) { setSrc(null); setState('empty'); return; }
    setState('loading');
    (async () => {
      const value = await storageGet(`toolcrib-photo:staff:${staffId}`, true);
      if (cancelled) return;
      if (value) { setSrc(value); setState('ok'); } else setState('empty');
    })();
    return () => { cancelled = true; };
  }, [staffId, hasPhoto, version]);

  const px = size || 40;
  const style = { width: px, height: px };
  if (state === 'ok') return <img src={src} alt="" className="staff-photo-avatar" style={style} />;
  if (state === 'loading') return <div className="staff-photo-avatar-empty" style={style}><Loader2 className="spin" size={Math.round(px * 0.45)} /></div>;
  return <div className="staff-photo-avatar-empty" style={style}><UserCircle2 size={Math.round(px * 0.6)} /></div>;
}

/* ---------------------------- QR Code display / download ---------------------------- */
function QrCodeModal({ value, title, subtitle, fileName, onClose }) {
  const holderRef = React.useRef(null);
  const [ready, setReady] = useState(false);
  const [failed, setFailed] = useState(false);

  useEffect(() => {
    let cancelled = false;
    ensureQRCodeLib().then(() => {
      if (cancelled || !holderRef.current || !window.QRCode) return;
      holderRef.current.innerHTML = '';
      try {
        new window.QRCode(holderRef.current, {
          text: value, width: 220, height: 220,
          colorDark: '#1F2A37', colorLight: '#FFFFFF',
          correctLevel: window.QRCode.CorrectLevel.M
        });
        setReady(true);
      } catch (e) { setFailed(true); }
    }).catch(() => { if (!cancelled) setFailed(true); });
    return () => { cancelled = true; };
  }, [value]);

  function download() {
    const node = holderRef.current;
    if (!node) return;
    const canvas = node.querySelector('canvas');
    const img = node.querySelector('img');
    const dataUrl = canvas ? canvas.toDataURL('image/png') : (img ? img.src : null);
    if (!dataUrl) return;
    const a = document.createElement('a');
    a.href = dataUrl; a.download = `${fileName || 'qrcode'}.png`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card scanner-card" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h3><QrCode size={17} /> {title}</h3>
          <button className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>

        <div className="qr-display">
          <div ref={holderRef} className="qr-canvas-holder" />
          {!ready && !failed && <div className="qr-loading"><Loader2 className="spin" size={20} /></div>}
          {failed && <div className="qr-loading">ไม่สามารถโหลดตัวสร้าง QR ได้ ลองใหม่อีกครั้ง</div>}
        </div>
        {subtitle && <p className="scanner-hint" style={{ marginBottom: 4 }}>{subtitle}</p>}
        <p className="qr-code-value mono">{value}</p>
        <p className="scanner-hint">QR นี้ผูกกับรายการนี้ถาวร แก้ไขข้อมูลภายหลังจะไม่เปลี่ยน QR — จะเปลี่ยนก็ต่อเมื่อมีการลบรายการเท่านั้น</p>
        <div className="form-actions" style={{ marginTop: 4 }}>
          <button type="button" className="btn btn-secondary" onClick={onClose}>ปิด</button>
          <button type="button" className="btn btn-primary" onClick={download} disabled={!ready}><Download size={15} /> ดาวน์โหลด PNG</button>
        </div>
      </div>
    </div>
  );
}

  .conn-pill.conn-ok{ background:var(--teal-tint); color:var(--teal-deep); }
  .conn-pill.conn-offline{ background:var(--amber-tint); color:#8A5A15; }

  .photo-chip{ display:inline-flex; align-items:center; gap:4px; padding:4px 9px; border-radius:20px; font-size:11px; font-weight:700; border:1px solid transparent; cursor:pointer; white-space:nowrap; }
  .photo-chip.chip-borrow{ background:var(--teal-tint); color:var(--teal-deep); }
  .photo-chip.chip-return{ background:var(--purple-tint); color:var(--purple); }
  .photo-chip.chip-doc{ background:var(--amber-tint); color:#8A5A15; }
  .photo-chip.chip-off{ background:var(--line); color:var(--ink-soft); }
  .photo-chip.chip-purged{ background:transparent; border:1px dashed var(--line); color:var(--ink-dim); cursor:default; }
  .photo-chip:hover{ opacity:0.8; }
  /* Loan-form column on the tools table: badge + optional download icon
     always sit on one tidy row, never stacking into a second line that
     would throw the row's height (and the border under it) out of step
     with its neighbours. */
  .loanform-cell{ display:flex; align-items:center; gap:6px; flex-wrap:nowrap; }
  .loan-doc-block{ margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); }
  .loan-doc-title{ display:flex; align-items:center; gap:6px; font-weight:700; font-size:13px; color:var(--ink); margin-bottom:4px; }
  .loan-doc-grid{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px 12px; margin-bottom:10px; min-width:0; }
  .loan-doc-grid .form-group.span-2{ grid-column:1 / -1; }
  /* Section heading inside the LBC-FM-034 editor — groups the fields the same
     way the paper form does, so the two-column grid reads in tidy blocks
     instead of one long unbroken run of inputs. */
  .loan-doc-section-title{
    font-size:11.5px; font-weight:700; letter-spacing:0.03em; color:var(--ink-soft);
    text-transform:uppercase; margin:2px 0 6px; padding-bottom:4px; border-bottom:1px solid var(--line);
  }
  .loan-doc-grid .form-group{ min-width:0; }
  .loan-doc-grid input{ min-width:0; width:100%; box-sizing:border-box; }
  /* iOS Safari gives input[type="date"] an intrinsic width wide enough for its
     native picker text and ignores the flex/grid cell, so the field spills past
     the modal edge. Resetting the native appearance and pinning the box to the
     cell width keeps it inside. */
  input[type="date"]{
    min-width:0; width:100%; max-width:100%; box-sizing:border-box;
    -webkit-appearance:none; appearance:none; text-align:center;
  }
  input[type="date"]::-webkit-date-and-time-value{ text-align:center; margin:0; }
  input[type="date"]::-webkit-calendar-picker-indicator{ margin-left:2px; padding:0; }
  .req-star{ color:var(--danger); }
  @media (max-width:600px){ .loan-doc-grid{ grid-template-columns:1fr; } }
  .loading-state{ display:flex; align-items:center; gap:10px; color:var(--ink-soft); padding:60px 0; justify-content:center; }
  .spin{ animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .page-stack{ display:flex; flex-direction:column; gap:20px; }

  /* KPI */
  .kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px; }
  .kpi-card{
    display:flex; align-items:center; gap:12px; padding:18px 20px; border-radius:var(--radius);
    background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow-sm);
  }
  .kpi-icon{ width:42px; height:42px; border-radius:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .tone-steel .kpi-icon{ background:#F1F4F6; color:var(--ink-soft); }
  .tone-teal .kpi-icon{ background:var(--teal-tint); color:var(--teal-deep); }
  .tone-amber .kpi-icon{ background:var(--coral-tint); color:var(--coral); }
  .tone-danger .kpi-icon{ background:var(--danger-tint); color:var(--danger); }
  .tone-purple{ }
  .tone-purple .kpi-icon{ background:var(--purple-tint); color:var(--purple); }
  /* Calibration uses the amber palette entry, which is otherwise unused —
     tone-amber is already the "borrowed" colour (coral), so reusing it would

  .tone-calib .kpi-icon{ background:var(--amber-tint); color:var(--amber); }
  .kpi-label{ font-size:12px; color:var(--ink-soft); margin-bottom:3px; }
  .kpi-value{ font-size:25px; font-weight:600; color:var(--ink); }

  /* Panel */
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow-sm); }
  .panel-head h2{ font-size:15.5px; font-weight:600; display:flex; align-items:center; gap:8px; color:var(--ink); }
  .panel-head p{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; }
  .panel-head{ margin-bottom:12px; }

  /* Shadow board */
  .shadow-board{ display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:10px; }
  .shadow-slot{
    aspect-ratio:1; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    border:1.5px dashed var(--line); color:var(--ink-dim); position:relative; background:var(--card-soft);
  }
  .shadow-slot.available{ background:var(--teal-tint); border-style:solid; border-color:rgba(51,185,164,0.35); color:var(--teal-deep); }
  .shadow-slot.borrowed{ background:var(--coral-tint); border-color:rgba(242,121,159,0.4); color:var(--coral); }
  .shadow-slot.overdue{ background:var(--danger-tint); border-color:var(--danger); color:var(--danger); animation:pulse 1.8s ease-in-out infinite; }
  .shadow-slot.damaged{ background:var(--purple-tint); border-style:solid; border-color:rgba(139,127,240,0.4); color:var(--purple); }
  .shadow-slot.calibration{ background:var(--amber-tint); border-style:solid; border-color:rgba(245,171,76,0.45); color:var(--amber); }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(242,99,74,0.28);} 50%{ box-shadow:0 0 0 6px rgba(242,99,74,0);} }
  .slot-code{ font-size:9.5px; letter-spacing:0.02em; }
  .legend{ display:flex; gap:16px; margin-top:14px; font-size:12px; color:var(--ink-soft); }
  .legend .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:5px; }
  .dot.teal{ background:var(--teal); } .dot.amber{ background:var(--coral); } .dot.danger{ background:var(--danger); } .dot.purple{ background:var(--purple); }
  .dot.coral{ background:var(--amber); }

  /* Per-warehouse shelf board (admin toolbar, shelf sections, unassign "x") */
  .shelfboard-toolbar{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .shelf-block{ padding:14px 0; border-top:1px dashed var(--line); }

  .shelf-block-unassigned{ border-top:1.5px solid var(--line); margin-top:6px; }
  .shelf-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }

  .shelf-card-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; margin-top:4px; }

  .shelf-card-photo{ position:relative; height:140px; background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; border-bottom:1px solid var(--line); }

  .shelf-card-photo-edit-btn{
    position:absolute; top:8px; right:8px; width:28px; height:28px; border-radius:50%; border:1px solid var(--line);
    background:var(--card); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:var(--shadow-sm);
  }

  .shelf-card-body{ padding:10px 12px 12px; display:flex; flex-direction:column; gap:8px; }

  .shelf-card-body .shelf-head-actions{ justify-content:flex-end; }
  .shelf-card-actions{ display:flex; align-items:center; gap:6px; }

  .shelf-photo-edit-img{ width:100%; max-height:280px; object-fit:contain; display:block; }

  .shadow-slot-remove{
    position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; border:1px solid var(--line);
    background:var(--card); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:var(--shadow-sm);
  }
  .shadow-slot-remove:hover{ background:var(--danger-tint); color:var(--danger); border-color:var(--danger); }
  /* The icon itself is the tap target for "show QR" — kept separate from the
     small remove ("x") button sharing the same slot so the two never fight
     over the same click. Only "available" tools get the pointer/hover cue;
     everything else stays inert (borrowed/overdue/damaged/calibration items
     aren't meant to be scanned off the board right now). */
  .shadow-slot-icon{ display:flex; align-items:center; justify-content:center; border-radius:8px; padding:2px; }
  .shadow-slot-icon.clickable{ cursor:pointer; }
  .shadow-slot-icon.clickable:hover{ background:rgba(0,0,0,0.06); }

  /* Inline QR popover, anchored to the slot it belongs to (the slot itself is
     position:relative already) and floated above so it never gets clipped by
     the row below it. */
  .shelf-qr-pop{
    position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%); z-index:40;
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px;
    box-shadow:0 16px 40px rgba(31,42,55,0.2); display:flex; flex-direction:column; align-items:center; gap:6px;
  }

    background:var(--card); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:var(--shadow-sm);
  }
  .shelf-qr-pop-code{ font-size:11px; color:var(--ink-soft); }
  .shelf-qr-pop-warn{ font-size:10.5px; color:var(--danger); text-align:center; max-width:130px; margin:0; line-height:1.4; }

  /* Shelf tool picker modal */
  .shelf-pick-list{ max-height:280px; overflow-y:auto; border:1px solid var(--line); border-radius:12px; }
  .shelf-pick-row{ display:flex; align-items:center; gap:10px; padding:9px 12px; font-size:13px; border-bottom:1px solid var(--line); cursor:pointer; }
  .shelf-pick-selectall{ border:1px solid var(--line); border-radius:12px; margin-bottom:8px; background:var(--card-soft); }
  .shelf-pick-row:last-child{ border-bottom:none; }
  .shelf-pick-row:hover{ background:var(--card-soft); }
  .shelf-pick-row.checked{ background:var(--teal-tint); }
  .shelf-pick-row input[type="checkbox"]{ width:15px; height:15px; accent-color:var(--teal); flex-shrink:0; }

  /* Table
     Every cell is kept to a single line (white-space:nowrap) so row height
     never changes when the viewport rotates or resizes — columns that need
     more room simply scroll horizontally inside .table-wrap instead of the
     text/badges wrapping onto a second line and shifting everything below. */
  .table-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-weight:600; color:var(--ink-soft); padding:11px 10px; border-bottom:1.5px solid var(--line); font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em; white-space:nowrap; }
  td{ padding:12px 10px; border-bottom:1px solid var(--line); color:var(--ink); white-space:nowrap; }
  tr:hover td{ background:var(--card-soft); }
  .muted{ color:var(--ink-soft); font-size:12px; }
  .empty-state{ text-align:center; color:var(--ink-soft); padding:26px 0; font-size:13px; }
  /* Long free-text cells (tool/item names, descriptions) still get one line,
     but truncate with an ellipsis instead of forcing the whole table wider —
     hover/tap shows the full text via the title attribute. */
  .cell-ellipsis{ max-width:200px; overflow:hidden; text-overflow:ellipsis; }

  .badge{ padding:4px 11px; border-radius:20px; font-size:11px; font-weight:600; display:inline-block; white-space:nowrap; }
  .badge.success{ background:var(--teal-tint); color:var(--teal-deep); }
  .badge.warning{ background:var(--coral-tint); color:var(--coral); }
  .badge.danger{ background:var(--danger-tint); color:var(--danger); }
  .badge.purple{ background:var(--purple-tint); color:var(--purple); }
  .badge.calib{ background:var(--amber-tint); color:#9A6712; }
  .badge.steel-badge{ background:#F1F4F6; color:var(--ink-soft); }

  /* Forms & buttons */
  .form-group{ display:flex; flex-direction:column; gap:6px; }
  .form-group label{ font-size:12.5px; font-weight:600; color:var(--ink-soft); }
  input, select{
    padding:10px 13px; border-radius:11px; border:1px solid var(--line); background:var(--card-soft);
    font-size:13.5px; font-family:inherit; color:var(--ink); outline:none;
    box-sizing:border-box; max-width:100%; min-width:0;
  }
  input::placeholder{ color:var(--ink-dim); }
  input:focus, select:focus{ border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-tint); background:var(--card); }
  select option{ background:#fff; color:var(--ink); }
  .btn{
    padding:10px 18px; border-radius:12px; border:1px solid transparent; font-size:13.5px; font-weight:600; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; font-family:inherit; transition:transform .1s, opacity .15s, background .15s;
  }
  .btn:active{ transform:scale(0.97); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-primary{ background:var(--teal); color:#fff; box-shadow:0 8px 18px -8px rgba(51,185,164,0.55); }
  .btn-danger{ background:var(--danger); color:#fff; box-shadow:0 8px 18px -8px rgba(242,99,74,0.55); }

  .btn-success:hover:not(:disabled){ background:#7367DE; }
  .btn-secondary{ background:var(--card); color:var(--ink); border-color:var(--line); }
  .btn-secondary:hover{ background:var(--card-soft); }

  .scan-panel .scan-form{ display:grid; grid-template-columns:1.4fr 1.4fr 1fr; gap:14px; align-items:start; }
  .form-actions{ display:flex; gap:10px; grid-column:1/-1; margin-top:2px; }

  .hint.ok{ color:var(--teal-deep); } .hint.bad{ color:var(--danger); }
  .hint.locked-hint{ color:var(--ink-dim); }
  .scan-input-row{ display:flex; gap:6px; }
  .scan-input-row input{ flex:1; }
  .scan-input-row input:disabled{ opacity:0.5; cursor:not-allowed; }
  .scan-icon-btn{
    width:36px; height:36px; flex-shrink:0; border-radius:10px; border:1px solid rgba(51,185,164,0.3);
    background:var(--teal-tint); color:var(--teal-deep); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .scan-icon-btn:hover{ background:#D7F0EA; }
  .scan-icon-btn:disabled{ opacity:0.4; cursor:not-allowed; background:var(--card-soft); color:var(--ink-dim); }
  .scan-cta-row{ display:flex; gap:10px; grid-column:1/-1; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }

  .mode-tabs{ display:flex; gap:6px; margin-bottom:12px; background:var(--card-soft); padding:4px; border-radius:12px; width:fit-content; }
  .mode-tab{ padding:7px 16px; border-radius:9px; border:none; background:transparent; font-family:inherit; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer; }
  .mode-tab.active{ background:var(--card); color:var(--teal-deep); box-shadow:var(--shadow-sm); }

  .scan-steps{ display:flex; flex-direction:column; gap:8px; margin-bottom:0; }
  .scan-step{ display:flex; gap:9px; padding:9px 11px; border-radius:12px; border:1px solid var(--line); background:var(--card-soft); transition:opacity .15s; }
  .scan-step.locked{ opacity:0.55; }
  .scan-step.active{ border-color:rgba(51,185,164,0.35); background:var(--teal-tint); }
  .scan-step.done{ border-color:rgba(51,185,164,0.3); }
  .step-num{
    width:24px; height:24px; border-radius:50%; background:var(--card); border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; color:var(--ink-soft); flex-shrink:0;
  }
  .scan-step.done .step-num{ background:var(--teal); color:#fff; border-color:var(--teal); }
  .scan-step.active .step-num{ border-color:var(--teal); color:var(--teal-deep); }
  .step-body{ flex:1; display:flex; flex-direction:column; gap:5px; min-width:0; }
  .step-body label{ font-size:12px; font-weight:600; color:var(--ink-soft); }
  .confirm-trigger{ width:100%; justify-content:center; margin-bottom:10px; }

  .confirm-summary{ display:flex; flex-direction:column; gap:8px; background:var(--card-soft); border:1px solid var(--line); border-radius:14px; padding:13px 14px; }
  .confirm-row{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:13.5px; }
  .confirm-label{ color:var(--ink-soft); font-size:12px; flex-shrink:0; }
  .confirm-value{ font-weight:600; color:var(--ink); text-align:right; }

  .verify-block{ text-align:center; padding:14px 12px 16px; border:1px dashed var(--line); border-radius:14px; background:var(--teal-tint); margin-bottom:14px; }
  .tool-master-photo{ border-radius:14px; object-fit:cover; margin:0 auto 8px; display:block; border:1px solid var(--line); background:#fff; }
  .tool-master-photo-placeholder{ border-radius:14px; margin:0 auto 8px; display:flex; align-items:center; justify-content:center; background:#fff; border:1px dashed var(--line); color:var(--ink-soft); }
  .verify-tool-name{ font-size:15px; font-weight:700; color:var(--ink); }
  .verify-tool-code{ font-size:12.5px; color:var(--teal-deep); margin-top:2px; }
  .verify-msg{ font-size:12.5px; color:var(--ink-soft); margin:8px 0 12px; }
  .photo-btn{ width:100%; justify-content:center; }
